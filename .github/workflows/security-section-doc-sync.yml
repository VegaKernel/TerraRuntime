name: Security Section Doc Sync

on:
  push:
    paths:
      - .github/workflows/security-section-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update EN and RU security docs
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('docs/en/security.md'): [
                  (
                      """T_{\\mathrm{handshake}}=10\\,\\mathrm{s},\n\\qquad\nT_{\\mathrm{join}}=2\\,\\mathrm{min}.\n$$\n\nA valid `Hello` ends the handshake deadline but does not grant an unlimited player-slot lease. Until runtime readiness reaches `Playing`, the join-abuse deadline remains active. After `Playing`, the current normal idle timeout is infinite unless configured otherwise.\n""",
                      """T_{\\mathrm{handshake}}=10\\,\\mathrm{s},\n\\qquad\nT_{\\mathrm{join}}=2\\,\\mathrm{min},\n\\qquad\nT_{\\mathrm{idle}}=10\\,\\mathrm{min}.\n$$\n\nA valid `Hello` ends the handshake deadline but does not grant an unlimited player-slot lease. Until runtime readiness reaches `Playing`, the join-abuse deadline remains active. After `Playing`, accepted inbound traffic refreshes the normal `$10\\,\\mathrm{min}$` inactivity deadline.\n"""
                  ),
                  (
                      """Security budgets are global when work competes for one shared tick/resource; multiplying a full expensive-work allowance by player count merely scales the DoS surface.\n""",
                      """Security budgets are global when work competes for one shared tick/resource; multiplying a full expensive-work allowance by player count merely scales the DoS surface.\n\nClient-triggered packet-10 section compression is bounded at both connection and server scope. Packet 8 has a per-connection hard-abuse ceiling of `$120\\,\\mathrm{frames/s}$`. Cache misses then cross a server-global fixed-window admission budget\n\n$$\nR_{\\mathrm{section}}=255\\ \\text{unique rebuild generations}/\\mathrm{s},\n$$\n\nindependent of configured player count. Concurrent waiters for the same single-flight section generation consume one global admission, not one per connection. The rebuild pipeline additionally bounds distinct pending on-demand generations to `$255$`; production uses one compression worker with one queued work item and one queued completion. Global-budget exhaustion is propagated as structured `RateLimited` rejection rather than being mislabeled as an encoding failure.\n"""
                  )
              ],
              Path('docs/ru/security.md'): [
                  (
                      """T_{\\mathrm{handshake}}=10\\,\\mathrm{s},\n\\qquad\nT_{\\mathrm{join}}=2\\,\\mathrm{min}.\n$$\n\nValid `Hello` завершает handshake deadline, но не выдаёт unlimited player-slot lease. До readiness `Playing` active join-abuse deadline. После `Playing` current normal idle timeout infinite, если deployment не configured иначе.\n""",
                      """T_{\\mathrm{handshake}}=10\\,\\mathrm{s},\n\\qquad\nT_{\\mathrm{join}}=2\\,\\mathrm{min},\n\\qquad\nT_{\\mathrm{idle}}=10\\,\\mathrm{min}.\n$$\n\nValid `Hello` завершает handshake deadline, но не выдаёт unlimited player-slot lease. До readiness `Playing` active join-abuse deadline. После `Playing` accepted inbound traffic обновляет normal inactivity deadline `$10\\,\\mathrm{min}$`.\n"""
                  ),
                  (
                      """Security budgets global, когда work конкурирует за shared tick/resource; умножение full allowance на player count лишь увеличивает DoS surface.\n""",
                      """Security budgets global, когда work конкурирует за shared tick/resource; умножение full allowance на player count лишь увеличивает DoS surface.\n\nClient-triggered packet-10 section compression bounded одновременно на connection и server scope. Для packet 8 действует per-connection hard-abuse ceiling `$120\\,\\mathrm{frames/s}$`. Cache miss затем проходит server-global fixed-window admission budget\n\n$$\nR_{\\mathrm{section}}=255\\ \\text{unique rebuild generations}/\\mathrm{s},\n$$\n\nкоторый не умножается на configured player count. Concurrent waiters одной single-flight section generation потребляют один global admission, а не по одному на connection. Rebuild pipeline дополнительно ограничивает число distinct pending on-demand generations значением `$255$`; production использует один compression worker, один queued work item и один queued completion. Exhaustion global budget публикуется как structured `RateLimited`, а не маскируется под encoding failure.\n"""
                  )
              ]
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'anchor changed unexpectedly: {path}')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('updated:', ', '.join(changed) if changed else 'already current')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git rm .github/workflows/security-section-doc-sync.yml
          git add docs/en/security.md docs/ru/security.md
          git commit -m "docs: document bounded section compression"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          git push origin HEAD:main
