name: Gameplay AI Verify

# Permanent non-cancelling gameplay acceptance slice for authoritative behavior/decomposition work.
on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/**'
      - 'src/TerraRuntime.Core/**'
      - 'src/TerraRuntime.Contracts/Gameplay/**'
      - 'tests/TerraRuntime.Tests/*Projectile*.cs'
      - 'tests/TerraRuntime.Tests/*Npc*.cs'
      - 'tests/TerraRuntime.Tests/*ItemUse*.cs'
      - 'tests/TerraRuntime.Tests/*ItemDefinition*.cs'
      - 'tests/TerraRuntime.Tests/*NpcLoot*.cs'
      - 'tools/ci/audit_gameplay_domain_literals.py'
      - 'docs/en/gameplay-domain-literal-gate.md'
      - 'docs/ru/gameplay-domain-literal-gate.md'
      - 'docs/roadmap/gameplay-decomposition-and-catalogs.md'
      - '.github/workflows/gameplay-ai-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-gameplay-ai-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gameplay raw-domain audit
        run: python3 tools/ci/audit_gameplay_domain_literals.py

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Gameplay decomposition tests
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~Projectile|FullyQualifiedName~Npc|FullyQualifiedName~ItemUse|FullyQualifiedName~VanillaItemDefinition|FullyQualifiedName~NpcLoot"

      - name: Authoritative loop smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --loop-smoke
