name: Gameplay AI Verify

# Static gameplay ownership gates and loop smoke; executable test tiers run in CI.
on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/**'
      - 'src/TerraRuntime.Application/**'
      - 'tests/TerraRuntime.Tests/*Boss*.cs'
      - 'tests/TerraRuntime.Tests/MoonLordDeathSequenceTests.cs'
      - 'src/TerraRuntime.Core/**'
      - 'src/TerraRuntime.Gameplay/**'
      - 'src/TerraRuntime.World/**'
      - 'src/TerraRuntime.Contracts/Gameplay/**'
      - 'tests/TerraRuntime.Tests/*Projectile*.cs'
      - 'tests/TerraRuntime.Tests/*Npc*.cs'
      - 'tests/TerraRuntime.Tests/*ItemUse*.cs'
      - 'tests/TerraRuntime.Tests/*ItemDefinition*.cs'
      - 'tests/TerraRuntime.Tests/*ItemSlot*.cs'
      - 'tests/TerraRuntime.Tests/*NpcLoot*.cs'
      - 'tools/ci/audit_gameplay_domain_literals.py'
      - 'tools/ci/check_project_references.py'
      - 'src/**/*.csproj'
      - 'Directory.Build.*'
      - 'docs/en/gameplay-domain-literal-gate.md'
      - 'docs/ru/gameplay-domain-literal-gate.md'
      - 'docs/en/projectile-behavior-profiles.md'
      - 'docs/ru/projectile-behavior-profiles.md'
      - 'docs/en/npc-runtime-ownership.md'
      - 'docs/ru/npc-runtime-ownership.md'
      - 'docs/en/host-interfaces.md'
      - 'docs/ru/host-interfaces.md'
      - 'docs/roadmap/gameplay-decomposition-and-catalogs.md'
      - '.github/workflows/gameplay-ai-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-gameplay-ai-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gameplay raw-domain audit
        run: python3 tools/ci/audit_gameplay_domain_literals.py

      - name: Production project reference guard
        run: python3 tools/ci/check_project_references.py

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore build/TerraRuntime.slnx

      - name: Build
        run: dotnet build build/TerraRuntime.slnx -c Release --no-restore

      - name: Authoritative loop smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --loop-smoke
