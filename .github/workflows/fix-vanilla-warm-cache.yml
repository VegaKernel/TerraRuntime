name: Fix Vanilla Warm Cache Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vanilla-warm-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch warm-cache cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/vanilla-world-load.yml')
          text = path.read_text()
          old = '''          cleanup_chest() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
'''
          new = '''          cleanup_chest() {
            # This probe intentionally leaves the just-built disposable runtime caches intact for the
            # following warm-cache proof. SIGTERM is a production graceful-shutdown signal and now
            # commits the canonical .wld then invalidates those caches, so test cleanup must be abrupt.
            kill -KILL "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one chest cleanup block, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit tested workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-vanilla-warm-cache.yml
          git add .github/workflows/vanilla-world-load.yml
          git commit -m 'ci: preserve caches for warm startup proof'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'failed to fast-forward tested workflow fix after retries' >&2
          exit 1
