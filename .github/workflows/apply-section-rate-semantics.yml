name: Apply Section Rate Semantics

on:
  push:
    paths:
      - .github/workflows/apply-section-rate-semantics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch bootstrap section rejection semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/TerraRuntime/PlayerBootstrapFrameSink.cs")
          text = path.read_text(encoding="utf-8")

          old_enum = """    DynamicEntityBootstrapFailure = 13,\n    MalformedChat = 14\n}"""
          new_enum = """    DynamicEntityBootstrapFailure = 13,\n    MalformedChat = 14,\n    SectionWorkRateLimited = 15\n}"""
          if old_enum not in text:
              raise SystemExit("bootstrap stop-reason anchor changed")
          text = text.replace(old_enum, new_enum, 1)

          old_handler = """        if (!_packets.TryCreateSectionResponse(request.TileX, request.TileY, request.Team, out PlayerBootstrapSectionResponse sectionResponse))\n            return Stop(PlayerBootstrapStopReason.SectionEncodingFailure);\n"""
          new_handler = """        PlayerBootstrapSectionResponseResult sectionResult = _packets.CreateSectionResponseDetailed(\n            request.TileX,\n            request.TileY,\n            request.Team,\n            out PlayerBootstrapSectionResponse sectionResponse);\n        if (sectionResult == PlayerBootstrapSectionResponseResult.RateLimited)\n            return Stop(PlayerBootstrapStopReason.SectionWorkRateLimited);\n        if (sectionResult != PlayerBootstrapSectionResponseResult.Created)\n            return Stop(PlayerBootstrapStopReason.SectionEncodingFailure);\n"""
          if old_handler not in text:
              raise SystemExit("bootstrap section-handler anchor changed")
          path.write_text(text.replace(old_handler, new_handler, 1), encoding="utf-8")

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git rm .github/workflows/apply-section-rate-semantics.yml
          git add src/TerraRuntime/PlayerBootstrapFrameSink.cs
          git commit -m "security: classify global section budget exhaustion"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          git push origin HEAD:main
