name: One-shot N4 powder and Mystic Frog integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-n4-powder-mystic-frog
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply production integration
        run: python3 tools/ci/apply_n4_powder_mystic_frog.py

      - name: Build Release
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run complete tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit integrated block and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git rm tools/ci/apply_n4_powder_mystic_frog.py .github/workflows/one-shot-n4-powder-mystic-frog.yml
          git add -A
          git commit -m "Complete N4 powder and Mystic Frog interactions"
          git push origin HEAD:work/n4-powder-mystic-frog-1458
