name: NPC Reference Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npc-reference-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Collect NPC reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reference-1458-npc

          find_ref() {
            local filename="$1"
            local class_pattern="$2"
            local src
            src="$(find decompiled/1458 -type f -name "$filename" -print -quit)"
            if [[ -z "$src" ]]; then
              src="$(grep -RIl --include='*.cs' "$class_pattern" decompiled/1458 | head -n 1 || true)"
            fi
            test -n "$src"
            echo "$src"
          }

          npc_file="$(find_ref 'NPC.cs' 'class NPC')"
          npc_id="$(find_ref 'NPCID.cs' 'class NPCID')"
          player_file="$(find_ref 'Player.cs' 'class Player')"
          collision_file="$(find_ref 'Collision.cs' 'class Collision')"
          main_file="$(find_ref 'Main.cs' 'class Main')"
          tile_file="$(find_ref 'Tile.cs' 'class Tile')"
          world_gen="$(find_ref 'WorldGen.cs' 'class WorldGen')"
          tile_id="$(find_ref 'TileID.cs' 'class TileID')"
          net_message="$(find_ref 'NetMessage.cs' 'class NetMessage')"
          message_buffer="$(find_ref 'MessageBuffer.cs' 'class MessageBuffer')"
          creative_powers="$(find_ref 'CreativePowers.cs' 'class ModifyTimeRate')"

          cp "$npc_file" artifacts/reference-1458-npc/NPC.cs
          cp "$npc_id" artifacts/reference-1458-npc/NPCID.cs
          cp "$player_file" artifacts/reference-1458-npc/Player.cs
          cp "$collision_file" artifacts/reference-1458-npc/Collision.cs
          cp "$main_file" artifacts/reference-1458-npc/Main.cs
          cp "$tile_file" artifacts/reference-1458-npc/Tile.cs
          cp "$world_gen" artifacts/reference-1458-npc/WorldGen.cs
          cp "$tile_id" artifacts/reference-1458-npc/TileID.cs
          cp "$net_message" artifacts/reference-1458-npc/NetMessage.cs
          cp "$message_buffer" artifacts/reference-1458-npc/MessageBuffer.cs
          cp "$creative_powers" artifacts/reference-1458-npc/CreativePowers.cs
          cp decompiled/1458/REFERENCE_SOURCE.txt artifacts/reference-1458-npc/REFERENCE_SOURCE.txt

          python3 - "$npc_file" "$player_file" "$collision_file" "$main_file" "$net_message" "$message_buffer" "$creative_powers" "$tile_file" "$world_gen" <<'PY'
          import json
          import pathlib
          import re
          import sys

          npc_path = pathlib.Path(sys.argv[1])
          player_path = pathlib.Path(sys.argv[2])
          collision_path = pathlib.Path(sys.argv[3])
          main_path = pathlib.Path(sys.argv[4])
          net_message_path = pathlib.Path(sys.argv[5])
          message_buffer_path = pathlib.Path(sys.argv[6])
          creative_powers_path = pathlib.Path(sys.argv[7])
          tile_path = pathlib.Path(sys.argv[8])
          world_gen_path = pathlib.Path(sys.argv[9])
          text = npc_path.read_text(errors="ignore")
          player_text = player_path.read_text(errors="ignore")
          collision_text = collision_path.read_text(errors="ignore")
          main_text = main_path.read_text(errors="ignore")
          net_message_text = net_message_path.read_text(errors="ignore")
          message_buffer_text = message_buffer_path.read_text(errors="ignore")
          creative_powers_text = creative_powers_path.read_text(errors="ignore")
          tile_text = tile_path.read_text(errors="ignore")
          world_gen_text = world_gen_path.read_text(errors="ignore")

          def method_summary(name):
              pattern = re.compile(rf"\b{name}\s*\([^;{{}}]*\)\s*\{{")
              match = pattern.search(text)
              if not match:
                  return {"found": False}
              opening = match.end() - 1
              depth = 0
              end = None
              for index in range(opening, len(text)):
                  char = text[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  return {"found": False}
              body = text[opening:end]
              return {
                  "found": True,
                  "characters": len(body),
                  "line": text.count("\n", 0, match.start()) + 1,
                  "aiReads": len(re.findall(r"\bai\[[0-3]\]", body)),
                  "localAiReads": len(re.findall(r"\blocalAI\[[0-3]\]", body)),
                  "projectileCalls": body.count("Projectile.NewProjectile"),
                  "npcSpawnCalls": body.count("NewNPC"),
              }

          methods = [
              "SetDefaults",
              "AI_001_Slimes",
              "AI_002_FloatingEye",
              "AI_003_Fighters",
              "AI_004_EyeOfCthulhu",
              "AI_005_Flyer",
          ]
          player_markers = {}
          for marker in ("width", "height", "aggro", "ghost", "dead", "active", "Center"):
              player_markers[marker] = len(re.findall(rf"\b{re.escape(marker)}\b", player_text))

          collision_methods = {}
          for marker in ("TileCollision", "WetCollision", "SolidCollision", "SlopeCollision"):
              collision_methods[marker] = len(re.findall(rf"\b{re.escape(marker)}\s*\(", collision_text))

          summary = {
              "source": str(npc_path),
              "characters": len(text),
              "methods": {name: method_summary(name) for name in methods},
              "playerSource": str(player_path),
              "playerCharacters": len(player_text),
              "playerMarkers": player_markers,
              "collisionSource": str(collision_path),
              "collisionCharacters": len(collision_text),
              "collisionMethods": collision_methods,
              "mainTileSolidMarkers": len(re.findall(r"\btileSolid\b", main_text)),
              "mainTileSolidTopMarkers": len(re.findall(r"\btileSolidTop\b", main_text)),
              "netMessagePacket23Cases": len(re.findall(r"case\s+23\s*:", net_message_text)),
              "messageBufferPacket23Cases": len(re.findall(r"case\s+23\s*:", message_buffer_text)),
              "creativeTargetTimeRateMarkers": len(re.findall(r"\bTargetTimeRate\b", creative_powers_text)),
              "tileTopSlopeMarkers": len(re.findall(r"\btopSlope\s*\(", tile_text)),
              "worldGenSolidNoPlatformMarkers": len(re.findall(r"\bSolidTileNoPlatforms\s*\(", world_gen_text)),
              "worldGenSolidAllowBottomSlopeMarkers": len(re.findall(r"\bSolidTileAllowBottomSlope\s*\(", world_gen_text)),
          }
          print("NPC_REFERENCE_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY

          python3 - "$npc_file" "$npc_id" <<'PY'
          import json
          import pathlib
          import re
          import sys

          npc_text = pathlib.Path(sys.argv[1]).read_text(errors="ignore")
          id_text = pathlib.Path(sys.argv[2]).read_text(errors="ignore")

          method = re.search(r"\bSetDefaults\s*\([^;{}]*\)\s*\{", npc_text)
          if not method:
              raise SystemExit("SetDefaults was not found")
          opening = method.end() - 1
          depth = 0
          closing = None
          for index in range(opening, len(npc_text)):
              if npc_text[index] == "{":
                  depth += 1
              elif npc_text[index] == "}":
                  depth -= 1
                  if depth == 0:
                      closing = index + 1
                      break
          if closing is None:
              raise SystemExit("SetDefaults body was truncated")
          body = npc_text[opening:closing]

          names = {}
          for match in re.finditer(
              r"\b(?:public|internal)\s+const\s+(?:short|int)\s+(\w+)\s*=\s*(-?\d+)\s*;",
              id_text):
              names.setdefault(int(match.group(2)), match.group(1))

          case_matches = list(re.finditer(r"\bcase\s+(-?\d+)\s*:", body))
          pending_ids = []
          candidates = []
          fields = (
              "width", "height", "damage", "defense", "lifeMax", "knockBackResist",
              "scale", "noGravity", "noTileCollide", "lavaImmune", "value"
          )
          for index, case_match in enumerate(case_matches):
              raw_id = int(case_match.group(1))
              pending_ids.append(raw_id)
              start = case_match.end()
              end = case_matches[index + 1].start() if index + 1 < len(case_matches) else len(body)
              segment = body[start:end]
              substantive = re.sub(r"[\s{}]", "", segment)
              if not substantive:
                  continue

              if re.search(r"\baiStyle\s*=\s*5\s*;", segment):
                  facts = {}
                  for field in fields:
                      assignment = re.search(
                          rf"\b{re.escape(field)}\s*=\s*([^;]+);",
                          segment)
                      if assignment:
                          facts[field] = assignment.group(1).strip()
                  for candidate_id in pending_ids:
                      candidates.append({
                          "id": candidate_id,
                          "name": names.get(candidate_id),
                          "facts": facts,
                      })
              pending_ids = []

          unique = []
          seen = set()
          for candidate in candidates:
              if candidate["id"] in seen:
                  continue
              seen.add(candidate["id"])
              unique.append(candidate)

          print("NPC_AISTYLE5_DEFAULTS=" + json.dumps(unique, sort_keys=True))
          if not unique:
              raise SystemExit("No aiStyle 5 SetDefaults candidates were found")
          PY

      - name: Upload local-only NPC reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraria-1458-npc-reference
          path: artifacts/reference-1458-npc
          retention-days: 1
