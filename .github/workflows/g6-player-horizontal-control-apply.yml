name: G6 Player Horizontal Control Apply

on:
  push:
    branches:
      - gameplay/g6-player-horizontal-control
    paths:
      - .github/scripts/apply_g6_player_horizontal_control.py
      - .github/workflows/g6-player-horizontal-control-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded ServerRuntimeState patch
        run: python3 .github/scripts/apply_g6_player_horizontal_control.py
      - name: Commit state wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/TerraRuntime/ServerRuntimeState.cs; then
            echo "No ServerRuntimeState changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TerraRuntime/ServerRuntimeState.cs
          git commit -m "gameplay: apply server-player horizontal intent in physics tick"
          git push origin "HEAD:${GITHUB_REF_NAME}"
