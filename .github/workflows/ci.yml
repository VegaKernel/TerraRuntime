name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terra-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Authoritative loop smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --loop-smoke

      - name: Protocol smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --protocol-smoke

      - name: Network smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --network-smoke

      - name: World smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --world-smoke

      - name: Terminal UI smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --tui-smoke

  coreclr-extensible-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Publish extensible CoreCLR linux-x64
        run: >-
          dotnet publish src/TerraRuntime.ExtensibleHost/TerraRuntime.ExtensibleHost.csproj
          -c Release
          -r linux-x64
          -p:PublishAot=false
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:PublishReadyToRun=true
          -o artifacts/coreclr/linux-x64

      - name: Verify runnable extensible artifact layout
        shell: bash
        run: |
          root="artifacts/coreclr/linux-x64"
          test -x "$root/TerraRuntime.Extensible.Server"
          for dir in runtime HostModules ServerPlugins Worlds config data logs; do
            test -d "$root/$dir"
          done
          if find "$root" -type f \( -name '*.pdb' -o -name '*.dbg' \) -print -quit | grep -q .; then
            echo "Debug symbols leaked into extensible artifact:"
            find "$root" -type f \( -name '*.pdb' -o -name '*.dbg' \) -print
            exit 1
          fi
          unexpected="$(find "$root" -mindepth 1 -maxdepth 1 \
            ! -name TerraRuntime.Extensible.Server \
            ! -name runtime \
            ! -name HostModules \
            ! -name ServerPlugins \
            ! -name Worlds \
            ! -name config \
            ! -name data \
            ! -name logs -print)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected extensible deployment entries:"
            echo "$unexpected"
            exit 1
          fi

      - name: Build drop-in host module fixture
        run: >-
          dotnet build tests/TerraRuntime.HostModuleFixture/TerraRuntime.HostModuleFixture.csproj
          -c Release
          -p:PublishAot=false

      - name: Install drop-in Vega fixture
        shell: bash
        run: >-
          cp tests/TerraRuntime.HostModuleFixture/bin/Release/net11.0/TerraRuntime.HostModuleFixture.dll
          artifacts/coreclr/linux-x64/HostModules/Vega.dll

      - name: CoreCLR drop-in host module smoke
        run: ./artifacts/coreclr/linux-x64/TerraRuntime.Extensible.Server --host-module-smoke

  coreclr-extensible-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Publish extensible CoreCLR win-x64
        run: >-
          dotnet publish src/TerraRuntime.ExtensibleHost/TerraRuntime.ExtensibleHost.csproj
          -c Release
          -r win-x64
          -p:PublishAot=false
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:PublishReadyToRun=true
          -o artifacts/coreclr/win-x64

      - name: Verify runnable extensible artifact layout
        shell: pwsh
        run: |
          $root = "artifacts/coreclr/win-x64"
          $allowed = @("TerraRuntime.Extensible.Server.exe", "runtime", "HostModules", "ServerPlugins", "Worlds", "config", "data", "logs")
          if (-not (Test-Path "$root/TerraRuntime.Extensible.Server.exe" -PathType Leaf)) { throw "Missing TerraRuntime.Extensible.Server.exe" }
          foreach ($dir in @("runtime", "HostModules", "ServerPlugins", "Worlds", "config", "data", "logs")) {
            if (-not (Test-Path "$root/$dir" -PathType Container)) { throw "Missing deployment directory: $dir" }
          }
          $symbols = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @(".pdb", ".dbg") })
          if ($symbols.Count -ne 0) {
            $names = $symbols.FullName -join ", "
            throw "Debug symbols leaked into extensible artifact: $names"
          }
          $unexpected = @(Get-ChildItem $root | Where-Object { $_.Name -notin $allowed })
          if ($unexpected.Count -ne 0) {
            $names = $unexpected.Name -join ", "
            throw "Unexpected extensible deployment entries: $names"
          }

      - name: Build drop-in host module fixture
        run: >-
          dotnet build tests/TerraRuntime.HostModuleFixture/TerraRuntime.HostModuleFixture.csproj
          -c Release
          -p:PublishAot=false

      - name: Install drop-in Vega fixture
        shell: pwsh
        run: Copy-Item tests/TerraRuntime.HostModuleFixture/bin/Release/net11.0/TerraRuntime.HostModuleFixture.dll artifacts/coreclr/win-x64/HostModules/Vega.dll

      - name: CoreCLR drop-in host module smoke
        shell: pwsh
        run: .\artifacts\coreclr\win-x64\TerraRuntime.Extensible.Server.exe --host-module-smoke

  native-aot-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Publish NativeAOT linux-x64
        run: >-
          dotnet publish src/TerraRuntime/TerraRuntime.csproj
          -c Release
          -r linux-x64
          -p:PublishAot=true
          -p:IlcTreatWarningsAsErrors=true
          -o artifacts/native-aot/linux-x64

      - name: Verify runnable NativeAOT artifact layout
        shell: bash
        run: |
          root="artifacts/native-aot/linux-x64"
          test -x "$root/TerraRuntime.Server"
          test -f "$root/libonigwrap.so"
          for dir in Worlds config data logs; do
            test -d "$root/$dir"
          done
          if find "$root" -type f \( -name '*.pdb' -o -name '*.dbg' \) -print -quit | grep -q .; then
            echo "Debug symbols leaked into NativeAOT artifact:"
            find "$root" -type f \( -name '*.pdb' -o -name '*.dbg' \) -print
            exit 1
          fi
          unexpected="$(find "$root" -mindepth 1 -maxdepth 1 \
            ! -name TerraRuntime.Server \
            ! -name libonigwrap.so \
            ! -name Worlds \
            ! -name config \
            ! -name data \
            ! -name logs -print)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected deployment entries:"
            echo "$unexpected"
            exit 1
          fi

      - name: NativeAOT loop smoke
        run: ./artifacts/native-aot/linux-x64/TerraRuntime.Server --loop-smoke

      - name: NativeAOT protocol smoke
        run: ./artifacts/native-aot/linux-x64/TerraRuntime.Server --protocol-smoke

      - name: NativeAOT network smoke
        run: ./artifacts/native-aot/linux-x64/TerraRuntime.Server --network-smoke

      - name: NativeAOT world smoke
        run: ./artifacts/native-aot/linux-x64/TerraRuntime.Server --world-smoke

      - name: NativeAOT Terminal UI smoke
        run: ./artifacts/native-aot/linux-x64/TerraRuntime.Server --tui-smoke

  native-aot-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Publish NativeAOT win-x64
        run: >-
          dotnet publish src/TerraRuntime/TerraRuntime.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:IlcTreatWarningsAsErrors=true
          -o artifacts/native-aot/win-x64

      - name: Verify runnable NativeAOT artifact layout
        shell: pwsh
        run: |
          $root = "artifacts/native-aot/win-x64"
          $allowed = @("TerraRuntime.Server.exe", "libonigwrap.dll", "Worlds", "config", "data", "logs")
          if (-not (Test-Path "$root/TerraRuntime.Server.exe" -PathType Leaf)) { throw "Missing TerraRuntime.Server.exe" }
          if (-not (Test-Path "$root/libonigwrap.dll" -PathType Leaf)) { throw "Missing required native dependency: libonigwrap.dll" }
          foreach ($dir in @("Worlds", "config", "data", "logs")) {
            if (-not (Test-Path "$root/$dir" -PathType Container)) { throw "Missing deployment directory: $dir" }
          }
          $symbols = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @(".pdb", ".dbg") })
          if ($symbols.Count -ne 0) {
            $names = $symbols.FullName -join ", "
            throw "Debug symbols leaked into NativeAOT artifact: $names"
          }
          $unexpected = @(Get-ChildItem $root | Where-Object { $_.Name -notin $allowed })
          if ($unexpected.Count -ne 0) {
            $names = $unexpected.Name -join ", "
            throw "Unexpected deployment entries: $names"
          }

      - name: NativeAOT loop smoke
        shell: pwsh
        run: .\artifacts\native-aot\win-x64\TerraRuntime.Server.exe --loop-smoke

      - name: NativeAOT protocol smoke
        shell: pwsh
        run: .\artifacts\native-aot\win-x64\TerraRuntime.Server.exe --protocol-smoke

      - name: NativeAOT network smoke
        shell: pwsh
        run: .\artifacts\native-aot\win-x64\TerraRuntime.Server.exe --network-smoke

      - name: NativeAOT world smoke
        shell: pwsh
        run: .\artifacts\native-aot\win-x64\TerraRuntime.Server.exe --world-smoke

      - name: NativeAOT Terminal UI smoke
        shell: pwsh
        run: .\artifacts\native-aot\win-x64\TerraRuntime.Server.exe --tui-smoke
