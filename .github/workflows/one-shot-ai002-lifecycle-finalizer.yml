name: One Shot AI002 Lifecycle Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai002-lifecycle-finalizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed AI_002 lifecycle block
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          env_contract = r'''namespace TerraRuntime.Core;

/// <summary>
/// World-facing facts consumed by the source-backed TerrariaServer 1.4.5.8 AI_002 lifecycle layer.
/// Core AI owns state transitions only; tile LOS, solid overlap and Graveyard scene metrics remain runtime/world facts.
/// </summary>
public interface IVanillaFlyingEyeEnvironment
{
    bool IsGraveyardAt(float centerX, float centerY);

    bool CanHit(
        float sourcePositionX,
        float sourcePositionY,
        int sourceWidth,
        int sourceHeight,
        float targetPositionX,
        float targetPositionY,
        int targetWidth,
        int targetHeight);

    bool SolidCollision(float positionX, float positionY, int width, int height);
}
'''
          Path('src/TerraRuntime.Core/Npcs/VanillaFlyingEyeEnvironment.cs').write_text(env_contract, encoding='utf-8')

          lifecycle = r'''using TerraRuntime.Contracts.Gameplay;
          using TerraRuntime.Contracts.Runtime;

          namespace TerraRuntime.Core;

          public readonly record struct VanillaFlyingEyeLifecycleInput(
              float PositionY,
              float VelocityY,
              NpcAiState Ai,
              int TimeLeft,
              bool NoTileCollide,
              bool DayTime,
              double WorldSurfacePixels,
              bool TargetInGraveyard,
              bool HasLineOfSight,
              bool SolidCollision);

          public readonly record struct VanillaFlyingEyeLifecycleResult(
              NpcAiState Ai,
              int TimeLeft,
              bool NoTileCollide,
              bool Discouraged);

          /// <summary>
          /// Source-backed non-cosmetic lifecycle/state slice from TerrariaServer 1.4.5.8 AI_002_FloatingEye.
          /// It owns daylight discouragement and Pigron ai[0]/ai[1] phasing. Collision response remains ordered
          /// before this transition by the motion primitive, matching the source method.
          /// </summary>
          public static class VanillaFlyingEyeLifecycle
          {
              public const float PigronPhaseDelayTicks = 300f;
              public const int DiscouragedTimeLeft = 10;

              public static bool TryStep(
                  NpcTypeId type,
                  in VanillaFlyingEyeLifecycleInput input,
                  out VanillaFlyingEyeLifecycleResult result)
              {
                  if (!float.IsFinite(input.PositionY) ||
                      !float.IsFinite(input.VelocityY) ||
                      !input.Ai.IsFinite ||
                      input.TimeLeft < -1 ||
                      double.IsNaN(input.WorldSurfacePixels) ||
                      input.WorldSurfacePixels <= 0d ||
                      (double.IsInfinity(input.WorldSurfacePixels) && !double.IsPositiveInfinity(input.WorldSurfacePixels)))
                  {
                      result = default;
                      return false;
                  }

                  bool discouraged =
                      VanillaFlyingEyeNpcCatalog.FleesDaylight(type) &&
                      input.DayTime &&
                      input.PositionY <= input.WorldSurfacePixels &&
                      !input.TargetInGraveyard;

                  float ai0 = input.Ai.Ai0;
                  float ai1 = input.Ai.Ai1;
                  bool noTileCollide = input.NoTileCollide;

                  if (VanillaFlyingEyeNpcCatalog.IsPigron(type))
                  {
                      if (input.HasLineOfSight)
                      {
                          if (ai1 > 0f && !input.SolidCollision)
                          {
                              ai1 = 0f;
                              ai0 = 0f;
                          }
                      }
                      else if (ai1 == 0f)
                      {
                          ai0++;
                      }

                      if (ai0 >= PigronPhaseDelayTicks)
                      {
                          ai1 = 1f;
                          ai0 = 0f;
                      }

                      noTileCollide = ai1 != 0f;
                  }

                  int timeLeft = input.TimeLeft;
                  if (discouraged && timeLeft >= 0 && timeLeft > DiscouragedTimeLeft)
                      timeLeft = DiscouragedTimeLeft;

                  result = new VanillaFlyingEyeLifecycleResult(
                      new NpcAiState(ai0, ai1, input.Ai.Ai2, input.Ai.Ai3),
                      timeLeft,
                      noTileCollide,
                      discouraged);
                  return true;
              }
          }
'''
          Path('src/TerraRuntime.Core/Npcs/VanillaFlyingEyeLifecycle.cs').write_text(lifecycle, encoding='utf-8')

          world_env = r'''using TerraRuntime.Core;
          using TerraRuntime.World;

          namespace TerraRuntime;

          /// <summary>Production world queries for source-backed AI_002 daylight and Pigron phasing state.</summary>
          internal sealed class VanillaFlyingEyeWorldEnvironment : IVanillaFlyingEyeEnvironment
          {
              private readonly WorldTileStore _tiles;

              public VanillaFlyingEyeWorldEnvironment(WorldTileStore tiles) =>
                  _tiles = tiles ?? throw new ArgumentNullException(nameof(tiles));

              public bool IsGraveyardAt(float centerX, float centerY) =>
                  VanillaWorldGraveyardScene.IsFunctionalAt(_tiles, centerX, centerY);

              public bool CanHit(
                  float sourcePositionX,
                  float sourcePositionY,
                  int sourceWidth,
                  int sourceHeight,
                  float targetPositionX,
                  float targetPositionY,
                  int targetWidth,
                  int targetHeight) =>
                  VanillaWorldCanHit.HasLineOfSight(
                      _tiles,
                      sourcePositionX,
                      sourcePositionY,
                      sourceWidth,
                      sourceHeight,
                      targetPositionX,
                      targetPositionY,
                      targetWidth,
                      targetHeight);

              public bool SolidCollision(float positionX, float positionY, int width, int height) =>
                  VanillaWorldSolidCollision.Intersects(_tiles, positionX, positionY, width, height);
          }
'''
          Path('src/TerraRuntime/VanillaFlyingEyeWorldEnvironment.cs').write_text(world_env, encoding='utf-8')

          strategies = Path('src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorStrategies.cs')
          text = strategies.read_text(encoding='utf-8')
          start = text.index('internal sealed class VanillaFlyingEyeNpcBehaviorStrategy')
          end = text.index('internal sealed class VanillaSlimeGroundNpcBehaviorStrategy', start)
          replacement = r'''internal sealed class VanillaFlyingEyeNpcBehaviorStrategy : IVanillaNpcBehaviorStrategy
          {
              private IVanillaFlyingEyeEnvironment? _environment;

              public void SetEnvironment(IVanillaFlyingEyeEnvironment environment) =>
                  _environment = environment ?? throw new ArgumentNullException(nameof(environment));

              public bool TryStep(
                  in NpcSnapshot npc,
                  in VanillaNpcDefinition definition,
                  VanillaNpcBehaviorContext context,
                  INpcAiStateStepper inner,
                  out NpcStateUpdate next)
              {
                  if (definition.AiStyle != VanillaNpcAiStyles.DemonEye)
                  {
                      next = default;
                      return false;
                  }

                  if (_environment is null ||
                      !NpcTypeId.TryCreate(npc.Type, out NpcTypeId type) ||
                      !definition.TryResolveHitbox(npc.Simulation.Scale, out VanillaNpcHitboxSize hitbox))
                  {
                      return TryLegacyTargetRefresh(in npc, in definition, context, inner, out next);
                  }

                  NpcSnapshot staged = npc;
                  VanillaNpcTargetCandidate target = default;
                  bool hasTarget = TryGetCurrentTarget(in npc, context, out target);
                  bool pigron = VanillaFlyingEyeNpcCatalog.IsPigron(type);

                  // Pigrons call TargetClosest before their LOS/phasing branch. Other style-2 eyes evaluate
                  // daylight discouragement against the current target and only call TargetClosest when not discouraged.
                  if ((pigron || !hasTarget) &&
                      TryRefreshClosest(in staged, in definition, context, out NpcSnapshot refreshed, out target))
                  {
                      staged = refreshed;
                      hasTarget = true;
                  }

                  bool targetInGraveyard = hasTarget && _environment.IsGraveyardAt(target.CenterX, target.CenterY);
                  bool hasLineOfSight = false;
                  bool solidCollision = false;
                  if (pigron)
                  {
                      if (hasTarget)
                      {
                          float targetX = target.CenterX - VanillaNpcBehaviorContext.BasePlayerWidth * 0.5f;
                          float targetY = target.CenterY - VanillaNpcBehaviorContext.BasePlayerHeight * 0.5f;
                          hasLineOfSight = _environment.CanHit(
                              staged.PositionX,
                              staged.PositionY,
                              hitbox.Width,
                              hitbox.Height,
                              targetX,
                              targetY,
                              (int)VanillaNpcBehaviorContext.BasePlayerWidth,
                              (int)VanillaNpcBehaviorContext.BasePlayerHeight);
                      }

                      solidCollision = _environment.SolidCollision(
                          staged.PositionX,
                          staged.PositionY,
                          hitbox.Width,
                          hitbox.Height);
                  }

                  var lifecycleInput = new VanillaFlyingEyeLifecycleInput(
                      PositionY: staged.PositionY,
                      VelocityY: staged.VelocityY,
                      Ai: staged.Ai,
                      TimeLeft: staged.Simulation.TimeLeft,
                      NoTileCollide: staged.Simulation.NoTileCollide,
                      DayTime: context.DayTime,
                      WorldSurfacePixels: context.WorldSurfacePixels,
                      TargetInGraveyard: targetInGraveyard,
                      HasLineOfSight: hasLineOfSight,
                      SolidCollision: solidCollision);
                  if (!VanillaFlyingEyeLifecycle.TryStep(type, in lifecycleInput, out VanillaFlyingEyeLifecycleResult lifecycle))
                  {
                      next = default;
                      return false;
                  }

                  if (!pigron && !lifecycle.Discouraged &&
                      TryRefreshClosest(in staged, in definition, context, out NpcSnapshot refreshed, out _))
                  {
                      staged = refreshed;
                  }
                  else if (lifecycle.Discouraged)
                  {
                      staged = staged with
                      {
                          Simulation = staged.Simulation with
                          {
                              DirectionX = staged.VelocityY > 0f ? 1 : staged.Simulation.DirectionX,
                              DirectionY = -1,
                              TimeLeft = lifecycle.TimeLeft
                          }
                      };
                  }

                  // Preserve the pre-transition NoTileCollide value through collision response. Vanilla performs
                  // the generic collideX/collideY rebound before the Pigron ai[1] transition, then publishes the
                  // phasing flag for subsequent movement/ticks.
                  staged = staged with { Ai = lifecycle.Ai };
                  if (!inner.TryStepState(in staged, out next))
                      return false;

                  next = next with
                  {
                      Ai = lifecycle.Ai,
                      Simulation = next.Simulation with
                      {
                          NoTileCollide = lifecycle.NoTileCollide,
                          TimeLeft = lifecycle.TimeLeft
                      }
                  };
                  return true;
              }

              private static bool TryLegacyTargetRefresh(
                  in NpcSnapshot npc,
                  in VanillaNpcDefinition definition,
                  VanillaNpcBehaviorContext context,
                  INpcAiStateStepper inner,
                  out NpcStateUpdate next)
              {
                  NpcSnapshot targeted = npc;
                  if (TryRefreshClosest(in npc, in definition, context, out NpcSnapshot refreshed, out _))
                      targeted = refreshed;
                  return inner.TryStepState(in targeted, out next);
              }

              private static bool TryGetCurrentTarget(
                  in NpcSnapshot npc,
                  VanillaNpcBehaviorContext context,
                  out VanillaNpcTargetCandidate candidate)
              {
                  if (npc.Target < byte.MaxValue &&
                      context.TryFindCandidate(checked((byte)npc.Target), out candidate) &&
                      candidate.Active && !candidate.Dead && !candidate.Ghost)
                  {
                      return true;
                  }

                  candidate = default;
                  return false;
              }

              private static bool TryRefreshClosest(
                  in NpcSnapshot npc,
                  in VanillaNpcDefinition definition,
                  VanillaNpcBehaviorContext context,
                  out NpcSnapshot refreshed,
                  out VanillaNpcTargetCandidate candidate)
              {
                  if (context.TrySelectClosestTarget(in npc, in definition, out VanillaBlueSlimeTargetRefresh closest) &&
                      context.TryFindCandidate(checked((byte)closest.Target), out candidate))
                  {
                      refreshed = npc with
                      {
                          Target = closest.Target,
                          Simulation = npc.Simulation with
                          {
                              DirectionX = closest.DirectionX,
                              DirectionY = closest.DirectionY
                          }
                      };
                      return true;
                  }

                  refreshed = npc;
                  candidate = default;
                  return false;
              }
          }

          '''
          strategies.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          targeting = Path('src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs')
          t = targeting.read_text(encoding='utf-8')
          old = 'private readonly IVanillaNpcBehaviorStrategy _flyingEye = new VanillaFlyingEyeNpcBehaviorStrategy();'
          new = 'private readonly VanillaFlyingEyeNpcBehaviorStrategy _flyingEye = new();'
          if old not in t: raise SystemExit('flying-eye field marker changed')
          t = t.replace(old, new)
          marker = '    public void SetWormEnvironment(IVanillaWormEnvironment environment) =>\n        _worm.SetEnvironment(environment);\n'
          insert = marker + '\n    public void SetFlyingEyeEnvironment(IVanillaFlyingEyeEnvironment environment) =>\n        _flyingEye.SetEnvironment(environment);\n'
          if marker not in t: raise SystemExit('environment setter marker changed')
          targeting.write_text(t.replace(marker, insert), encoding='utf-8')

          server = Path('src/TerraRuntime/ServerRuntimeState.cs')
          s = server.read_text(encoding='utf-8')
          marker = '                _vanillaNpcTargetingAiStepper.EnableZombieMotion(worldSurfaceTiles);\n'
          insert = marker + '                _vanillaNpcTargetingAiStepper.SetFlyingEyeEnvironment(new VanillaFlyingEyeWorldEnvironment(worldTiles));\n'
          if marker not in s: raise SystemExit('ServerRuntimeState AI wiring marker changed')
          server.write_text(s.replace(marker, insert, 1), encoding='utf-8')

          coverage = Path('src/TerraRuntime.Core/Npcs/VanillaNpcAiCoverageCatalog.cs')
          c = coverage.read_text(encoding='utf-8')
          enum_marker = '    BossExpertRapidDashSlice = 1u << 24\n'
          if enum_marker not in c: raise SystemExit('coverage enum marker changed')
          c = c.replace(enum_marker, '    BossExpertRapidDashSlice = 1u << 24,\n    FlyingEyeLifecycleStateSlice = 1u << 25\n')
          demon = '            VanillaNpcAiCapability.FlyingEyeSteeringProfileSlice |\n            VanillaNpcAiCapability.NegativeNetVariantDefaults);'
          if demon not in c: raise SystemExit('Demon Eye coverage marker changed')
          c = c.replace(demon, '            VanillaNpcAiCapability.FlyingEyeSteeringProfileSlice |\n            VanillaNpcAiCapability.FlyingEyeLifecycleStateSlice |\n            VanillaNpcAiCapability.NegativeNetVariantDefaults);', 1)
          generic = '                OrdinaryCore | VanillaNpcAiCapability.FlyingEyeSteeringProfileSlice;'
          if generic not in c: raise SystemExit('flying-eye catalog coverage marker changed')
          c = c.replace(generic, '                OrdinaryCore |\n                VanillaNpcAiCapability.FlyingEyeSteeringProfileSlice |\n                VanillaNpcAiCapability.FlyingEyeLifecycleStateSlice;')
          coverage.write_text(c, encoding='utf-8')

          tests = r'''using TerraRuntime.Contracts.Gameplay;
          using TerraRuntime.Contracts.Runtime;
          using TerraRuntime.Core;

          namespace TerraRuntime.Tests;

          public sealed class VanillaFlyingEyeLifecycleTests
          {
              [Fact]
              public void Daylight_surface_eye_is_discouraged_and_clamps_lifetime()
              {
                  var input = Input() with { DayTime = true, PositionY = 100f, WorldSurfacePixels = 1000d, TimeLeft = 750 };
                  Assert.True(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.DemonEye, in input, out var result));
                  Assert.True(result.Discouraged);
                  Assert.Equal(10, result.TimeLeft);
              }

              [Fact]
              public void Graveyard_target_suppresses_daylight_discouragement()
              {
                  var input = Input() with { DayTime = true, PositionY = 100f, WorldSurfacePixels = 1000d, TargetInGraveyard = true };
                  Assert.True(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.DemonEye, in input, out var result));
                  Assert.False(result.Discouraged);
                  Assert.Equal(750, result.TimeLeft);
              }

              [Fact]
              public void Below_world_surface_suppresses_daylight_discouragement()
              {
                  var input = Input() with { DayTime = true, PositionY = 1001f, WorldSurfacePixels = 1000d };
                  Assert.True(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.DemonEye, in input, out var result));
                  Assert.False(result.Discouraged);
              }

              [Fact]
              public void Non_daylight_family_never_uses_discouraged_branch()
              {
                  var input = Input() with { DayTime = true, PositionY = 100f, WorldSurfacePixels = 1000d };
                  Assert.True(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.PigronCorruption, in input, out var result));
                  Assert.False(result.Discouraged);
              }

              [Fact]
              public void Pigron_enters_phasing_after_exactly_three_hundred_blocked_ticks()
              {
                  var input = Input() with
                  {
                      Ai = new NpcAiState(299f, 0f, 0f, 0f),
                      HasLineOfSight = false,
                      NoTileCollide = false
                  };
                  Assert.True(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.PigronCorruption, in input, out var result));
                  Assert.Equal(0f, result.Ai.Ai0);
                  Assert.Equal(1f, result.Ai.Ai1);
                  Assert.True(result.NoTileCollide);
              }

              [Fact]
              public void Pigron_stays_phased_while_line_of_sight_returns_inside_solid_tiles()
              {
                  var input = Input() with
                  {
                      Ai = new NpcAiState(0f, 1f, 0f, 0f),
                      HasLineOfSight = true,
                      SolidCollision = true,
                      NoTileCollide = true
                  };
                  Assert.True(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.PigronHallow, in input, out var result));
                  Assert.Equal(1f, result.Ai.Ai1);
                  Assert.True(result.NoTileCollide);
              }

              [Fact]
              public void Pigron_leaves_phasing_only_after_los_returns_in_clear_space()
              {
                  var input = Input() with
                  {
                      Ai = new NpcAiState(88f, 1f, 0f, 0f),
                      HasLineOfSight = true,
                      SolidCollision = false,
                      NoTileCollide = true
                  };
                  Assert.True(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.PigronCrimson, in input, out var result));
                  Assert.Equal(0f, result.Ai.Ai0);
                  Assert.Equal(0f, result.Ai.Ai1);
                  Assert.False(result.NoTileCollide);
              }

              [Fact]
              public void Invalid_state_fails_closed()
              {
                  var input = Input() with { PositionY = float.NaN };
                  Assert.False(VanillaFlyingEyeLifecycle.TryStep(VanillaNpcIds.DemonEye, in input, out _));
              }

              [Fact]
              public void Integration_preserves_pre_phase_collision_flag_then_commits_no_clip()
              {
                  var inner = new CapturingStepper();
                  var stepper = new VanillaNpcTargetingAiStepper(inner);
                  stepper.SetFlyingEyeEnvironment(new FakeEnvironment(hasLineOfSight: false, solidCollision: false, graveyard: false));
                  stepper.SetCandidates([Candidate(0, 500f, 100f)]);
                  stepper.SetWorldConditions(dayTime: false, slimeRainActive: false);

                  NpcSnapshot npc = Snapshot(VanillaNpcIds.PigronCorruption, ai: new NpcAiState(299f, 0f, 0f, 0f)) with
                  {
                      Simulation = Snapshot(VanillaNpcIds.PigronCorruption).Simulation with { NoTileCollide = false }
                  };
                  Assert.True(stepper.TryStepState(in npc, out NpcStateUpdate next));
                  Assert.False(inner.Last.Simulation.NoTileCollide);
                  Assert.True(next.Simulation.NoTileCollide);
                  Assert.Equal(1f, next.Ai.Ai1);
              }

              [Fact]
              public void Integration_daylight_branch_keeps_current_target_and_forces_upward_direction()
              {
                  var inner = new CapturingStepper();
                  var stepper = new VanillaNpcTargetingAiStepper(inner);
                  stepper.EnableBlueSlimeMotion(100d);
                  stepper.SetFlyingEyeEnvironment(new FakeEnvironment(hasLineOfSight: true, solidCollision: false, graveyard: false));
                  stepper.SetCandidates([Candidate(0, 500f, 500f), Candidate(1, 101f, 101f)]);
                  stepper.SetWorldConditions(dayTime: true, slimeRainActive: false);

                  NpcSnapshot npc = Snapshot(VanillaNpcIds.DemonEye, target: 0, velocityY: 1f);
                  Assert.True(stepper.TryStepState(in npc, out NpcStateUpdate next));
                  Assert.Equal((ushort)0, inner.Last.Target);
                  Assert.Equal(1, inner.Last.Simulation.DirectionX);
                  Assert.Equal(-1, inner.Last.Simulation.DirectionY);
                  Assert.Equal(10, next.Simulation.TimeLeft);
              }

              private static VanillaFlyingEyeLifecycleInput Input() => new(
                  PositionY: 0f,
                  VelocityY: 0f,
                  Ai: default,
                  TimeLeft: 750,
                  NoTileCollide: false,
                  DayTime: false,
                  WorldSurfacePixels: double.PositiveInfinity,
                  TargetInGraveyard: false,
                  HasLineOfSight: true,
                  SolidCollision: false);

              private static VanillaNpcTargetCandidate Candidate(byte slot, float x, float y) =>
                  new(slot, x, y, 0, Active: true, Dead: false, Ghost: false, NoAggro: false);

              private static NpcSnapshot Snapshot(
                  NpcTypeId type,
                  ushort target = 0,
                  float velocityY = 0f,
                  NpcAiState ai = default)
              {
                  Assert.True(VanillaNpcDefinitionCatalog.TryGet(type, out VanillaNpcDefinition definition));
                  return new NpcSnapshot(
                      new NpcHandle(1, new NpcGeneration(1)),
                      new NpcRevision(1),
                      type.Value,
                      checked((short)type.Value),
                      PositionX: 100f,
                      PositionY: 100f,
                      VelocityX: 0f,
                      VelocityY: velocityY,
                      Target: target,
                      Ai: ai,
                      Simulation: NpcSimulationState.Initial with
                      {
                          DirectionX = -1,
                          DirectionY = 1,
                          Scale = definition.Scale,
                          Life = definition.LifeMax,
                          LifeMax = definition.LifeMax,
                          TimeLeft = 750
                      });
              }

              private sealed class FakeEnvironment(bool hasLineOfSight, bool solidCollision, bool graveyard) : IVanillaFlyingEyeEnvironment
              {
                  public bool IsGraveyardAt(float centerX, float centerY) => graveyard;
                  public bool CanHit(float sourcePositionX, float sourcePositionY, int sourceWidth, int sourceHeight, float targetPositionX, float targetPositionY, int targetWidth, int targetHeight) => hasLineOfSight;
                  public bool SolidCollision(float positionX, float positionY, int width, int height) => solidCollision;
              }

              private sealed class CapturingStepper : INpcAiStateStepper
              {
                  public NpcSnapshot Last { get; private set; }

                  public bool TryStepState(in NpcSnapshot npc, out NpcStateUpdate next)
                  {
                      Last = npc;
                      next = new NpcStateUpdate(
                          npc.Type,
                          npc.NetId,
                          npc.PositionX,
                          npc.PositionY,
                          npc.VelocityX,
                          npc.VelocityY,
                          npc.Target,
                          npc.Ai,
                          npc.Simulation);
                      return true;
                  }
              }
          }
'''
          Path('tests/TerraRuntime.Tests/VanillaFlyingEyeLifecycleTests.cs').write_text(tests, encoding='utf-8')

          roadmap = Path('docs/roadmap/npc-ai-parity.md')
          r = roadmap.read_text(encoding='utf-8')
          old = '- [ ] AI_002 daylight despawn, Pigron line-of-sight phasing state and cosmetic branches;'
          new = '- [x] AI_002 source-backed daylight discouragement/despawn and Pigron 300-tick line-of-sight phasing/re-entry state with live world collision/Graveyard queries;\n- [ ] AI_002 presentation-only alpha/rotation/dust/sound branches and remaining type-specific transforms/effects;'
          if old not in r: raise SystemExit('AI_002 roadmap marker changed')
          roadmap.write_text(r.replace(old, new), encoding='utf-8')

          for language, heading, body in [
              ('en', '## AI_002 lifecycle world state', 'AI_002 now keeps its non-cosmetic lifecycle rules outside packet/state guessing. Daylight discouragement is source-shaped: only the pinned fleeing identities, during daytime, at or above `worldSurface`, and only when the current target is not in a functional Graveyard. The branch clamps `timeLeft` to 10, forces upward intent, and deliberately skips `TargetClosest` for that tick.\n\nPigrons now preserve the source `ai[0]/ai[1]` phase machine. Missing line of sight increments `ai[0]`; tick 300 enters no-tile-collision mode. Restored LOS only exits phasing after `Collision.SolidCollision` is false. Production facts come from `VanillaWorldCanHit`, `VanillaWorldSolidCollision`, and `VanillaWorldGraveyardScene`. Cosmetic alpha, rotation, dust and sound remain outside the authoritative state claim.'),
              ('ru', '## Состояние мира для жизненного цикла AI_002', 'AI_002 теперь хранит не косметические правила жизненного цикла отдельно от догадок по пакетам и состоянию. Дневное бегство повторяет исходник: только закреплённые типы, только днём, на уровне или выше `worldSurface` и только если текущая цель не находится в функциональном Graveyard. Ветка ограничивает `timeLeft` значением 10, задаёт движение вверх и намеренно не вызывает `TargetClosest` на этом тике.\n\nPigron теперь использует исходный автомат `ai[0]/ai[1]`. Отсутствие прямой видимости увеличивает `ai[0]`; на 300-м тике включается проход сквозь тайлы. Возврат прямой видимости отключает фазирование только после того, как `Collision.SolidCollision` становится ложным. Production-факты берутся из `VanillaWorldCanHit`, `VanillaWorldSolidCollision` и `VanillaWorldGraveyardScene`. Косметические alpha, rotation, dust и sound не входят в authoritative claim.')
          ]:
              p = Path(f'docs/{language}/npc-behavior-families.md')
              d = p.read_text(encoding='utf-8')
              if heading not in d:
                  d = d.rstrip() + '\n\n' + heading + '\n\n' + body + '\n'
                  p.write_text(d, encoding='utf-8')
          PY

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Restore and build full solution
        run: |
          dotnet restore TerraRuntime.slnx
          dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Run AI_002 lifecycle tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.VanillaFlyingEyeLifecycleTests

      - name: Run existing AI_002 motion tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.VanillaDemonEyeMotionTests

      - name: Run full test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit large block to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/TerraRuntime.Core/Npcs/VanillaFlyingEyeEnvironment.cs \
            src/TerraRuntime.Core/Npcs/VanillaFlyingEyeLifecycle.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorStrategies.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcAiCoverageCatalog.cs \
            src/TerraRuntime/VanillaFlyingEyeWorldEnvironment.cs \
            src/TerraRuntime/ServerRuntimeState.cs \
            tests/TerraRuntime.Tests/VanillaFlyingEyeLifecycleTests.cs \
            docs/roadmap/npc-ai-parity.md \
            docs/en/npc-behavior-families.md \
            docs/ru/npc-behavior-families.md
          git diff --cached --check
          git commit -m "Complete source-backed AI_002 lifecycle and Pigron phasing"
          git stash push -u -m ai002-finalizer-residue >/dev/null || true
          git pull --rebase origin main
          git push origin HEAD:main
