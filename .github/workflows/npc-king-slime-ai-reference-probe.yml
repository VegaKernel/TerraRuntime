name: NPC King Slime AI Reference Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npc-king-slime-ai-reference-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  king-slime-ai-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Collect King Slime AI15 structural facts
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          test -n "$npc_file"

          python3 - "$npc_file" <<'PY'
          import json
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="ignore")

          def body_after(pattern):
              match = re.search(pattern, text)
              if not match:
                  return None
              opening = text.find("{", match.end())
              if opening < 0:
                  return None
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{": depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0: return text[opening:i + 1]
              return None

          ai = body_after(r"\bvoid\s+AI_015(?:_KingSlime)?\s*\(")
          helper = body_after(r"\bvoid\s+AI_015_KingSlime_FindTeleportSpot\s*\(")
          if not ai or not helper:
              raise SystemExit("King Slime AI15 method/helper was not found")

          def uniq(values): return sorted(set(values))
          def assignments(body, name):
              return uniq(re.findall(rf"\b{re.escape(name)}\s*(=|\+=|-=|\*=|/=)\s*([^;]+)", body))

          scalars = {f"num{i}": assignments(ai, f"num{i}") for i in range(3, 14)}
          facts = {
              "characters": len(ai),
              "helperCharacters": len(helper),
              "scalars": scalars,
              "aiReads": {str(i): len(re.findall(rf"\bai\[{i}\]", ai)) for i in range(4)},
              "localAiReads": {str(i): len(re.findall(rf"\blocalAI\[{i}\]", ai)) for i in range(4)},
              "targetClosestCalls": ai.count("TargetClosest"),
              "newNpcExpressions": uniq(re.findall(r"NewNPC\s*\(([^;]+)\);", ai)),
              "integerRandomRanges": uniq(re.findall(r"Next\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)", ai)),
              "helperRandomRanges": uniq(re.findall(r"Next\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)", helper)),
              "helperCollisionCalls": uniq(re.findall(r"Collision\.([A-Za-z0-9_]+)\s*\(", helper)),
              "helperWorldGenCalls": uniq(re.findall(r"WorldGen\.([A-Za-z0-9_]+)\s*\(", helper)),
              "helperMainRefs": uniq(re.findall(r"Main\.([A-Za-z0-9_]+)", helper)),
              "helperConstants": uniq(re.findall(r"(?<![A-Za-z0-9_])(-?\d+(?:\.\d+)?f?)(?![A-Za-z0-9_])", helper)),
          }

          interesting = []
          for raw_line in ai.splitlines():
              line = raw_line.strip()
              if any(token in line for token in (
                  "float num", "int num", "num10", "num11", "num12", "num13", "Main.expertMode",
                  "Main.getGoodWorld", "NewNPC", "life +", "ai[3]", "velocity.Y = -", "velocity.X +=")):
                  if line: interesting.append(line)

          helper_lines = []
          for raw_line in helper.splitlines():
              line = raw_line.strip()
              if line and any(token in line for token in (
                  "for (", "Main.rand", "Main.tile", "Main.player", "Collision", "WorldGen", "teleport",
                  "local", "num", "flag", "return", "continue", "break")):
                  helper_lines.append(line)

          print("NPC_KING_SLIME_AI15_EXACT_FACTS=" + json.dumps(facts, sort_keys=True))
          print("NPC_KING_SLIME_AI15_EXACT_STATEMENTS=" + json.dumps(interesting, ensure_ascii=True))
          print("NPC_KING_SLIME_TELEPORT_HELPER_STATEMENTS=" + json.dumps(helper_lines, ensure_ascii=True))
          PY
