name: One Shot Finish Worm Lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-finish-worm-lifecycle.yml'

permissions:
  contents: write

concurrency:
  group: terra-runtime-one-shot-finish-worm-lifecycle
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed worm patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 tools/ci/apply_npc_worm_lifecycle.py
          git diff --check

      - name: Validate official AI_006 source contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/decompile-reference.sh 1458
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          test -n "$npc_file"
          python3 tools/ci/check_npc_worm_reference.py "$npc_file" --json artifacts/reference/npc-worm-reference.json

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Restore and build
        run: |
          dotnet restore TerraRuntime.slnx
          dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Run worm lifecycle class only
        run: >-
          dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj
          -c Release --no-build --
          -class TerraRuntime.Tests.VanillaWormLifecycleParityTests

      - name: Commit large worm lifecycle block to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-finish-worm-lifecycle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Pin vanilla worm link lifecycle semantics'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
