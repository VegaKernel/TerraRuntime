name: Terraria Beaches Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/FinalPipeline1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonPipeline1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/OceanGenerationCatalog1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/OceanIntegrity1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/Validator1458.cs'
      - 'tests/TerraRuntime.Tests/VanillaOceanGeneration1458Tests.cs'
      - 'tools/ci/probe_worldgen_beaches.py'
      - '.github/workflows/terraria-worldgen-beaches.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-beaches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile pinned TerrariaServer 1.4.5.8 Beaches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375

          expected="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"

          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.WorldGen "$assembly" > artifacts/source-contract/world-gen.cs
          python3 tools/ci/probe_worldgen_beaches.py \
            --world-gen artifacts/source-contract/world-gen.cs \
            --runtime-catalog src/TerraRuntime.WorldGeneration/Generation/Vanilla/OceanGenerationCatalog1458.cs \
            --runtime-pass src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonPipeline1458.cs \
            --canonical-provider src/TerraRuntime.WorldGeneration/Generation/Vanilla/FinalPipeline1458.cs \
            --output artifacts/source-contract/beaches-contract.txt

      - name: Focused ocean tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release -- -noLogo -method "*VanillaOceanGeneration1458Tests*"

      - uses: actions/upload-artifact@v4
        with:
          name: terraria-beaches-${{ github.sha }}
          path: artifacts/source-contract/beaches-contract.txt
          if-no-files-found: error
          retention-days: 7
