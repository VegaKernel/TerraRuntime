name: NPC Boss Reference Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npc-boss-reference-probe.yml
  pull_request:
    paths:
      - .github/workflows/npc-boss-reference-probe.yml
      - src/TerraRuntime.Contracts/Runtime/NpcSnapshot.cs
      - src/TerraRuntime.Core/Npcs/VanillaEyeOfCthulhuExpertRapidDashNpcBehaviorStrategy.cs
      - src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorContext.cs
      - src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs
      - src/TerraRuntime.Core/Projectiles/RuntimeProjectileStore.cs
      - src/TerraRuntime.Core/Projectiles/VanillaProjectileReflection1458.cs
      - src/TerraRuntime/RuntimeNpcProjectileReflectionPass.cs
      - src/TerraRuntime/ServerRuntimeState.cs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-boss-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Collect boss NPC reference facts
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          npc_id="$(find decompiled/1458 -type f -name 'NPCID.cs' -print -quit)"
          projectile_file="$(find decompiled/1458 -type f -name 'Projectile.cs' -print -quit)"
          test -n "$npc_file"
          test -n "$npc_id"
          test -n "$projectile_file"

          python3 - "$npc_file" "$npc_id" "$projectile_file" <<'PY'
          import json
          import math
          import pathlib
          import re
          import sys

          npc_text = pathlib.Path(sys.argv[1]).read_text(errors="ignore")
          id_text = pathlib.Path(sys.argv[2]).read_text(errors="ignore")
          projectile_text = pathlib.Path(sys.argv[3]).read_text(errors="ignore")

          def braced_body_after_in(text, pattern):
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"pattern was not found: {pattern}")
              opening = text.find("{", match.end())
              if opening < 0:
                  raise SystemExit(f"opening brace was not found: {pattern}")
              depth = 0
              for index in range(opening, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[opening:index + 1]
              raise SystemExit(f"body was truncated: {pattern}")

          def braced_body_after(pattern):
              return braced_body_after_in(npc_text, pattern)

          def require(text, snippet, label):
              if snippet not in text:
                  raise SystemExit(f"source contract changed: {label}")

          names = {}
          ids_by_name = {}
          for match in re.finditer(
              r"\b(?:public|internal)\s+const\s+(?:short|int)\s+(\w+)\s*=\s*(-?\d+)\s*;",
              id_text):
              name = match.group(1)
              value = int(match.group(2))
              names.setdefault(value, name)
              ids_by_name.setdefault(name, value)

          fields = (
              "aiStyle", "width", "height", "damage", "defense", "lifeMax",
              "knockBackResist", "scale", "noGravity", "noTileCollide", "boss",
              "value", "npcSlots"
          )

          def defaults_for(type_id):
              segment = braced_body_after(rf"\b(?:else\s+)?if\s*\(type\s*==\s*{type_id}\s*\)")
              facts = {"id": type_id, "name": names.get(type_id)}
              for field in fields:
                  assignment = re.search(rf"\b{re.escape(field)}\s*=\s*([^;]+);", segment)
                  if assignment:
                      facts[field] = assignment.group(1).strip()
              return facts

          eye = defaults_for(4)
          servant = defaults_for(5)
          king_id = ids_by_name.get("KingSlime")
          if king_id is None:
              raise SystemExit("KingSlime NPCID was not found")
          king = defaults_for(king_id)

          ai = braced_body_after(r"\bif\s*\(aiStyle\s*==\s*4\s*\)")
          ai_summary = {
              "characters": len(ai),
              "aiReads": len(re.findall(r"\bai\[[0-3]\]", ai)),
              "localAiReads": len(re.findall(r"\blocalAI\[[0-3]\]", ai)),
              "npcSpawnCalls": ai.count("NewNPC"),
              "servantTypeSpawnMarkers": len(re.findall(r"\bNewNPC\s*\([^;]*,\s*5\s*(?:,|\))", ai)),
              "targetClosestCalls": ai.count("TargetClosest"),
              "dayChecks": ai.count("Main.IsItDay()"),
              "encourageDespawnCalls": ai.count("EncourageDespawn"),
          }

          for snippet, label in (
              ("defense = 0;", "Eye phase-two base defense"),
              ("int num37 = 23;", "Eye phase-two classic final damage"),
              ("int num38 = 18;", "Eye phase-two expert/master lerp endpoint"),
              ("defense = -15;", "Eye low-life Expert defense"),
              ("num38 = 20;", "Eye critical-life damage endpoint"),
              ("defense = -30;", "Eye critical-life Expert defense"),
              ("damage = GetAttackDamage_LerpBetweenFinalValues(num37, num38);", "Eye difficulty damage lerp"),
              ("damage = GetAttackDamage_CappedAtMaster(damage);", "Eye Master damage cap/scaling"),
          ):
              require(ai, snippet, label)

          reflect_projectiles = braced_body_after(r"\bpublic void ReflectProjectiles\(Rectangle myRect\)")
          require(
              reflect_projectiles,
              "Main.projectile[i].active && Main.projectile[i].CanBeReflected() && CanReflectProjectile(Main.projectile[i])",
              "NPC reflection eligibility order")
          require(reflect_projectiles, "ReflectProjectile(Main.projectile[i]);", "NPC reflection dispatch")

          reflect = braced_body_after(r"\bpublic void ReflectProjectile\(Projectile proj\)")
          for snippet, label in (
              ("proj.reflected = true;", "reflected flag"),
              ("proj.hostile = true;", "reflected hostile flag"),
              ("proj.friendly = false;", "reflected friendly flag"),
              ("Vector2 vector = Main.player[proj.owner].Center - proj.Center;", "owner-directed reflection vector"),
              ("vector *= proj.oldVelocity.Length();", "oldVelocity speed preservation"),
              ("proj.velocity = new Vector2(Main.rand.Next(-100, 101), Main.rand.Next(-100, 101));", "reflection RNG seed vector"),
              ("proj.velocity += vector * 20f;", "reflection owner bias"),
              ("proj.damage /= 2;", "reflection half-damage step"),
              ("proj.penetrate = 1;", "reflection penetration"),
          ):
              require(reflect, snippet, label)
          if reflect.count("proj.damage /= 2;") != 2:
              raise SystemExit("source contract changed: reflection no longer quarters damage in two integer half steps")

          can_be_reflected = braced_body_after_in(
              projectile_text,
              r"\bpublic bool CanBeReflected\(\)")
          for snippet, label in (
              ("active && friendly && !hostile && damage > 0", "base projectile reflectability gate"),
              ("type == 728 || type == 955", "special reflectable projectile identities"),
              ("aiStyle == 1 || aiStyle == 2 || aiStyle == 8 || aiStyle == 21 || aiStyle == 24 || aiStyle == 28 || aiStyle == 29 || aiStyle == 131", "reflectable projectile aiStyle set"),
          ):
              require(can_be_reflected, snippet, label)

          king_scale = float(king.get("scale", "1").rstrip("f"))
          king_effective = {
              "width": math.floor(int(king["width"]) * king_scale),
              "height": math.floor(int(king["height"]) * king_scale),
          }

          print("NPC_EYE_OF_CTHULHU_DEFAULTS=" + json.dumps(eye, sort_keys=True))
          print("NPC_SERVANT_OF_CTHULHU_DEFAULTS=" + json.dumps(servant, sort_keys=True))
          print("NPC_EYE_OF_CTHULHU_AI_SUMMARY=" + json.dumps(ai_summary, sort_keys=True))
          print("NPC_KING_SLIME_DEFAULTS=" + json.dumps(king, sort_keys=True))
          print("NPC_KING_SLIME_EFFECTIVE_HITBOX=" + json.dumps(king_effective, sort_keys=True))
          print("NPC_EYE_REFLECTION_SOURCE_CONTRACT=verified")

          expected_eye = {
              "name": "EyeofCthulhu", "aiStyle": "4", "width": "100", "height": "110",
              "damage": "15", "defense": "12", "lifeMax": "2800", "knockBackResist": "0f",
              "noGravity": "true", "noTileCollide": "true", "boss": "true",
              "value": "30000f", "npcSlots": "5f"
          }
          expected_servant = {
              "name": "ServantofCthulhu", "aiStyle": "5", "width": "20", "height": "20",
              "damage": "12", "defense": "0", "lifeMax": "8",
              "noGravity": "true", "noTileCollide": "true"
          }
          expected_king = {
              "name": "KingSlime", "aiStyle": "15", "width": "98", "height": "92",
              "damage": "40", "defense": "10", "lifeMax": "2000", "knockBackResist": "0f",
              "scale": "1.25f", "boss": "true", "value": "10000f", "npcSlots": "5f"
          }
          for key, expected in expected_eye.items():
              if eye.get(key) != expected:
                  raise SystemExit(f"Unexpected Eye of Cthulhu {key}: {eye.get(key)!r}")
          for key, expected in expected_servant.items():
              if servant.get(key) != expected:
                  raise SystemExit(f"Unexpected Servant of Cthulhu {key}: {servant.get(key)!r}")
          for key, expected in expected_king.items():
              if king.get(key) != expected:
                  raise SystemExit(f"Unexpected King Slime {key}: {king.get(key)!r}")
          if king_id != 50 or king_effective != {"width": 122, "height": 115}:
              raise SystemExit(f"Unexpected King Slime identity/effective hitbox: id={king_id}, hitbox={king_effective!r}")
          if ai_summary["npcSpawnCalls"] < 1 or ai_summary["targetClosestCalls"] < 1:
              raise SystemExit(f"Unexpected Eye of Cthulhu AI summary: {ai_summary!r}")
          PY
