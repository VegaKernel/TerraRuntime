name: NPC Boss Reference Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npc-boss-reference-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-boss-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Collect boss NPC reference facts
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          npc_id="$(find decompiled/1458 -type f -name 'NPCID.cs' -print -quit)"
          test -n "$npc_file"
          test -n "$npc_id"

          python3 - "$npc_file" "$npc_id" <<'PY'
          import json
          import math
          import pathlib
          import re
          import sys

          npc_text = pathlib.Path(sys.argv[1]).read_text(errors="ignore")
          id_text = pathlib.Path(sys.argv[2]).read_text(errors="ignore")

          def braced_body_after(pattern):
              match = re.search(pattern, npc_text)
              if not match:
                  raise SystemExit(f"pattern was not found: {pattern}")
              opening = npc_text.find("{", match.end())
              if opening < 0:
                  raise SystemExit(f"opening brace was not found: {pattern}")
              depth = 0
              for index in range(opening, len(npc_text)):
                  if npc_text[index] == "{":
                      depth += 1
                  elif npc_text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return npc_text[opening:index + 1]
              raise SystemExit(f"body was truncated: {pattern}")

          names = {}
          ids_by_name = {}
          for match in re.finditer(
              r"\b(?:public|internal)\s+const\s+(?:short|int)\s+(\w+)\s*=\s*(-?\d+)\s*;",
              id_text):
              name = match.group(1)
              value = int(match.group(2))
              names.setdefault(value, name)
              ids_by_name.setdefault(name, value)

          fields = (
              "aiStyle", "width", "height", "damage", "defense", "lifeMax",
              "knockBackResist", "scale", "noGravity", "noTileCollide", "boss",
              "value", "npcSlots"
          )

          def defaults_for(type_id):
              segment = braced_body_after(rf"\b(?:else\s+)?if\s*\(type\s*==\s*{type_id}\s*\)")
              facts = {"id": type_id, "name": names.get(type_id)}
              for field in fields:
                  assignment = re.search(rf"\b{re.escape(field)}\s*=\s*([^;]+);", segment)
                  if assignment:
                      facts[field] = assignment.group(1).strip()
              return facts

          eye = defaults_for(4)
          servant = defaults_for(5)
          king_id = ids_by_name.get("KingSlime")
          if king_id is None:
              raise SystemExit("KingSlime NPCID was not found")
          king = defaults_for(king_id)

          ai = braced_body_after(r"\bif\s*\(aiStyle\s*==\s*4\s*\)")
          ai_summary = {
              "characters": len(ai),
              "aiReads": len(re.findall(r"\bai\[[0-3]\]", ai)),
              "localAiReads": len(re.findall(r"\blocalAI\[[0-3]\]", ai)),
              "npcSpawnCalls": ai.count("NewNPC"),
              "servantTypeSpawnMarkers": len(re.findall(r"\bNewNPC\s*\([^;]*,\s*5\s*(?:,|\))", ai)),
              "targetClosestCalls": ai.count("TargetClosest"),
              "dayChecks": ai.count("Main.IsItDay()"),
              "encourageDespawnCalls": ai.count("EncourageDespawn"),
          }

          king_scale = float(king.get("scale", "1").rstrip("f"))
          king_effective = {
              "width": math.floor(int(king["width"]) * king_scale),
              "height": math.floor(int(king["height"]) * king_scale),
          }

          print("NPC_EYE_OF_CTHULHU_DEFAULTS=" + json.dumps(eye, sort_keys=True))
          print("NPC_SERVANT_OF_CTHULHU_DEFAULTS=" + json.dumps(servant, sort_keys=True))
          print("NPC_EYE_OF_CTHULHU_AI_SUMMARY=" + json.dumps(ai_summary, sort_keys=True))
          print("NPC_KING_SLIME_DEFAULTS=" + json.dumps(king, sort_keys=True))
          print("NPC_KING_SLIME_EFFECTIVE_HITBOX=" + json.dumps(king_effective, sort_keys=True))

          expected_eye = {
              "name": "EyeofCthulhu", "aiStyle": "4", "width": "100", "height": "110",
              "damage": "15", "defense": "12", "lifeMax": "2800", "knockBackResist": "0f",
              "noGravity": "true", "noTileCollide": "true", "boss": "true",
              "value": "30000f", "npcSlots": "5f"
          }
          expected_servant = {
              "name": "ServantofCthulhu", "aiStyle": "5", "width": "20", "height": "20",
              "damage": "12", "defense": "0", "lifeMax": "8",
              "noGravity": "true", "noTileCollide": "true"
          }
          expected_king = {
              "name": "KingSlime", "aiStyle": "15", "width": "98", "height": "92",
              "damage": "40", "defense": "10", "lifeMax": "2000", "knockBackResist": "0f",
              "scale": "1.25f", "boss": "true", "value": "10000f", "npcSlots": "5f"
          }
          for key, expected in expected_eye.items():
              if eye.get(key) != expected:
                  raise SystemExit(f"Unexpected Eye of Cthulhu {key}: {eye.get(key)!r}")
          for key, expected in expected_servant.items():
              if servant.get(key) != expected:
                  raise SystemExit(f"Unexpected Servant of Cthulhu {key}: {servant.get(key)!r}")
          for key, expected in expected_king.items():
              if king.get(key) != expected:
                  raise SystemExit(f"Unexpected King Slime {key}: {king.get(key)!r}")
          if king_id != 50 or king_effective != {"width": 122, "height": 115}:
              raise SystemExit(f"Unexpected King Slime identity/effective hitbox: id={king_id}, hitbox={king_effective!r}")
          if ai_summary["npcSpawnCalls"] < 1 or ai_summary["targetClosestCalls"] < 1:
              raise SystemExit(f"Unexpected Eye of Cthulhu AI summary: {ai_summary!r}")
          PY
