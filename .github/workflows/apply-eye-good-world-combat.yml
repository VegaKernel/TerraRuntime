name: Apply Eye Good World Combat

on:
  push:
    branches: [work/eye-good-world-combat-parity]
    paths:
      - .github/workflows/apply-eye-good-world-combat.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: work/eye-good-world-combat-parity
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Correct exact Russian staging anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/ci/apply_eye_good_world_combat.py')
          text = path.read_text(encoding='utf-8')
          stale = 'Это ограниченные возможности (`BossExpertPhaseOneSlice`, `BossExpertTransformationSlice`, `BossExpertPhaseTwoDeterministicSlice` и `BossExpertRapidDashSlice`), а не заявление о полной difficulty-parity. Master damage scaling и эффекты `getGoodWorld` reflection/re-entry остаются вне допущенного slice; Good World по-прежнему fail-closed и не наследует Expert-значения молча. Classic-поведение не изменено.'
          exact = 'Это ограниченные capabilities `BossExpertPhaseOneSlice`, `BossExpertTransformationSlice`, `BossExpertPhaseTwoDeterministicSlice` и `BossExpertRapidDashSlice`, а не заявление о полной поддержке сложности. Master-масштабирование damage и reflection/re-entry ветви `getGoodWorld` остаются вне admitted slice; Good World по-прежнему fail-closed и не наследует Expert-параметры молча. Classic-поведение не изменено.'
          if text.count(stale) != 1:
              raise SystemExit(f'expected one stale Russian anchor, got {text.count(stale)}')
          path.write_text(text.replace(stale, exact, 1), encoding='utf-8')
          PY

      - name: Apply production block
        run: python3 tools/ci/apply_eye_good_world_combat.py

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Remove staging helpers
        run: git rm tools/ci/apply_eye_good_world_combat.py .github/workflows/apply-eye-good-world-combat.yml

      - name: Commit coherent block
        run: |
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add -A
          git commit -m "Complete Eye of Cthulhu Good World combat parity"
          git push origin HEAD:work/eye-good-world-combat-parity
