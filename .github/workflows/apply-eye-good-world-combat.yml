name: Apply Eye Good World Combat

on:
  push:
    branches: [work/eye-good-world-combat-parity]
    paths:
      - .github/workflows/apply-eye-good-world-combat.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: work/eye-good-world-combat-parity
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply production block
        run: python3 tools/ci/apply_eye_good_world_combat.py

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Remove staging helpers
        run: git rm tools/ci/apply_eye_good_world_combat.py .github/workflows/apply-eye-good-world-combat.yml

      - name: Commit coherent block
        run: |
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add -A
          git commit -m "Complete Eye of Cthulhu Good World combat parity"
          git push origin HEAD:work/eye-good-world-combat-parity
