name: Runtime Crash Containment

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.ExtensibleHost/**'
      - 'src/TerraRuntime.HostContracts/**'
      - 'src/TerraRuntime.Contracts/**'
      - 'src/TerraRuntime/RuntimeWorld*.cs'
      - 'src/TerraRuntime.World/**'
      - 'tests/TerraRuntime.HostModuleFixture/**'
      - 'tests/TerraRuntime.Tests/TrustedHostModule*.cs'
      - 'tests/TerraRuntime.Tests/RuntimeWorldGenerationContainmentTests.cs'
      - '.github/workflows/runtime-crash-containment.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/TerraRuntime.ExtensibleHost/**'
      - 'src/TerraRuntime.HostContracts/**'
      - 'src/TerraRuntime.Contracts/**'
      - 'src/TerraRuntime/RuntimeWorld*.cs'
      - 'src/TerraRuntime.World/**'
      - 'tests/TerraRuntime.HostModuleFixture/**'
      - 'tests/TerraRuntime.Tests/TrustedHostModule*.cs'
      - 'tests/TerraRuntime.Tests/RuntimeWorldGenerationContainmentTests.cs'
      - '.github/workflows/runtime-crash-containment.yml'

permissions:
  contents: read

concurrency:
  group: runtime-crash-containment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Build extensible host and tests
        run: |
          dotnet build src/TerraRuntime.ExtensibleHost/TerraRuntime.ExtensibleHost.csproj -c Release
          dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Run trusted host-module containment matrix
        run: |
          dotnet tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll -class TerraRuntime.Tests.TrustedHostModuleFaultContainmentTests
          dotnet tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll -class TerraRuntime.Tests.TrustedHostModuleLoaderTests
          dotnet tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll -class TerraRuntime.Tests.TrustedHostWorldGenerationIntegrationTests

      - name: Run world-generation containment matrix
        run: |
          dotnet tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll -class TerraRuntime.Tests.RuntimeWorldGenerationContainmentTests
