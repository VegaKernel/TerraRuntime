name: One-shot Town Commerce Housing 1458

on:
  push:
    branches: [work/town-commerce-housing-1458]
    paths:
      - 'tools/ci/apply_town_commerce_housing_1458.py'
      - '.github/workflows/one-shot-town-commerce-housing-1458.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: town-commerce-housing-1458
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: work/town-commerce-housing-1458

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed town block
        run: python3 tools/ci/apply_town_commerce_housing_1458.py

      - name: Align commerce mirror with happiness API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/TerraRuntime/RuntimeTownCommerce1458.cs')
          text = p.read_text()
          text = text.replace(
              'return new VanillaTownHappinessResult1458(1f, false);',
              'return new VanillaTownHappinessResult1458(1f, false, 0, 0);')
          old = '''        var happinessContext = new VanillaTownHappinessContext1458(
            Forest: scene.ShoppingZoneForest,
            Ocean: scene.ZoneBeach,
            Snow: scene.ZoneSnow,
            Desert: scene.ZoneDesert,
            Jungle: scene.ZoneJungle,
            Underground: scene.ShoppingZoneBelowSurface,
            Hallow: scene.ZoneHallow,
            Mushroom: scene.ZoneGlowshroom,
            Corruption: scene.ZoneCorrupt,
            Crimson: scene.ZoneCrimson,
            Dungeon: scene.ZoneDungeon,
            RemixWorld: world.RemixWorld,
            LoveStruck: false,
            Homeless: town.Homeless,
            DistanceFromHomeTiles: distanceFromHome,
            NpcsWithinHouse: house,
            NpcsWithinVillage: village);
        return VanillaTownHappiness1458.Evaluate(npcType, in happinessContext, nearby.ToArray());'''
          new = '''        var happinessContext = new VanillaTownHappinessContext1458(
            RemixWorld: world.RemixWorld,
            LoveStruck: false,
            Homeless: town.Homeless,
            DistanceFromHomeTiles: distanceFromHome,
            NpcsWithinHouse: house,
            NpcsWithinVillage: village,
            Biomes: new VanillaTownHappinessBiomeState1458(
                Forest: scene.ShoppingZoneForest,
                Ocean: scene.ZoneBeach,
                Snow: scene.ZoneSnow,
                Desert: scene.ZoneDesert,
                Jungle: scene.ZoneJungle,
                Underground: scene.ShoppingZoneBelowSurface,
                Hallow: scene.ZoneHallow,
                Mushroom: scene.ZoneGlowshroom,
                Corruption: scene.ZoneCorrupt,
                Crimson: scene.ZoneCrimson,
                Dungeon: scene.ZoneDungeon));
        return VanillaTownHappiness1458.Resolve(npcType, in happinessContext, nearby.ToArray());'''
          if old not in text:
              raise SystemExit('happiness context anchor drifted')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Validate bilingual documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build TerraRuntime.slnx -c Release --no-restore 2>&1 | tee /tmp/town-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            tail -n 300 /tmp/town-build.log > town-commerce-ci-diagnostics.txt
            git config user.name Xekep
            git config user.email Xekep@users.noreply.github.com
            git add town-commerce-ci-diagnostics.txt src/TerraRuntime/RuntimeTownCommerce1458.cs
            git commit -m 'Capture town commerce build diagnostics'
            git push origin HEAD:work/town-commerce-housing-1458
            exit "$status"
          fi

      - name: Full test suite
        shell: bash
        run: |
          set +e
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --logger 'console;verbosity=normal' 2>&1 | tee /tmp/town-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            grep -n -C 20 -E 'Failed |Error Message:|Stack Trace:|Test Run Failed|Failed:' /tmp/town-tests.log > town-commerce-ci-diagnostics.txt || tail -n 350 /tmp/town-tests.log > town-commerce-ci-diagnostics.txt
            git config user.name Xekep
            git config user.email Xekep@users.noreply.github.com
            git add town-commerce-ci-diagnostics.txt
            git commit -m 'Capture town commerce test diagnostics'
            git push origin HEAD:work/town-commerce-housing-1458
            exit "$status"
          fi

      - name: Commit integrated block to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f town-commerce-ci-diagnostics.txt
          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate source-backed town commerce and Truffle housing'
          git push origin HEAD:work/town-commerce-housing-1458
