name: Sign Replication Contract Apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sign-replication-contract-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
      - name: Apply vanilla sign replication contract
        run: python3 .github/scripts/apply_sign_replication_contract.py
      - name: Restore
        run: dotnet restore build/TerraRuntime.slnx
      - name: Test current main plus sign contract
        run: dotnet test build/TerraRuntime.slnx -c Release --no-restore
      - name: Commit tested sign contract to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/TerraRuntime/RuntimeSignReplicationRegistry.cs src/TerraRuntime/RuntimeSignCommandProcessor.cs tests/TerraRuntime.Tests/RuntimeSignCommandProcessorTests.cs; then
            echo "No sign contract changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TerraRuntime/RuntimeSignReplicationRegistry.cs src/TerraRuntime/RuntimeSignCommandProcessor.cs tests/TerraRuntime.Tests/RuntimeSignCommandProcessorTests.cs
          git commit -m "test: lock sign replication to vanilla flags zero"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# Retry after concurrent world-generation API callers were updated.
