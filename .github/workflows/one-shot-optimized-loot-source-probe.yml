name: One-shot optimized loot source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-optimized-loot-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile pinned TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Print exact optimized chest families
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('decompiled/1458')
          wg_path = root / 'Terraria/WorldGen.cs'
          wg = wg_path.read_text(encoding='utf-8', errors='ignore').splitlines()
          item = (root / 'Terraria.ID/ItemID.cs').read_text(encoding='utf-8', errors='ignore').splitlines()

          def show_method(name, before=2, after=140):
              hits=[i for i,line in enumerate(wg) if name in line]
              print(f'===== METHOD {name} hits={len(hits)} =====')
              for i in hits[:4]:
                  print(f'@@ {i+1}')
                  for row in wg[max(0,i-before):min(len(wg),i+after)]: print(row)

          for name in ['GetNextJungleChestItem(', 'FloatingIslandHouse(', 'IslandHouse(', 'Skyware', 'AddBuriedChest(']:
              if name == 'AddBuriedChest(':
                  continue
              show_method(name)

          print('===== PRIMARY-ID CALL CONTEXTS =====')
          ids=[65,158,159,857,934,848,866,832,933,274,220,218,112,3019,211,212,213,964,2292,3017,863,186,277,187,4404]
          for value in ids:
              print(f'--- id {value} ---')
              patterns=[f', {value},', f'= {value};', f'{{ {value},', f', {value} }}', f'({value},']
              hits=[]
              for i,line in enumerate(wg):
                  if any(p in line for p in patterns): hits.append(i)
              for i in hits[:12]:
                  print(f'@{i+1}')
                  for row in wg[max(0,i-10):min(len(wg),i+18)]: print(row)
              if not hits: print('NO_CALL_CONTEXT')

          print('===== ITEM 4404 =====')
          for i,line in enumerate(item):
              if '= 4404;' in line:
                  print(i+1, line.strip())

          print('===== CHEST-PASS CONTEXTS =====')
          for needle in ['ChestsInJungleShrines', 'UnderwaterChests', 'BuriedChests', 'SurfaceChests', 'Hellforge', 'LivingTrees', 'FloatingIslands']:
              hits=[i for i,line in enumerate(wg) if needle in line]
              print(f'--- {needle} hits={len(hits)} ---')
              for i in hits[:6]:
                  print(f'@{i+1}')
                  for row in wg[max(0,i-20):min(len(wg),i+55)]: print(row)
          PY
