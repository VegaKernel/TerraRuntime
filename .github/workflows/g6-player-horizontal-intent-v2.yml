name: Validate G6 player horizontal intent v2

on:
  push:
    branches:
      - gameplay/g6-player-horizontal-intent-v2
    paths:
      - .github/workflows/g6-player-horizontal-intent-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gameplay/g6-player-horizontal-intent-v2

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply and test horizontal player intent
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_g6_player_horizontal_intent_v2.py
          python3 .github/scripts/apply_g6_player_horizontal_fixture_v2.py
          git diff --check
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Commit validated production wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_g6_player_horizontal_intent_v2.py .github/scripts/apply_g6_player_horizontal_fixture_v2.py .github/workflows/g6-player-horizontal-intent-v2.yml
          git add src/TerraRuntime.HostContracts/IServerPlayerOperations.cs src/TerraRuntime/RuntimeServerPlayerOperations.cs src/TerraRuntime/VanillaServerPlayerDryPhysicsStepper.cs src/TerraRuntime/ServerRuntimeState.cs tests/TerraRuntime.Tests/TrustedHostModuleLoaderTests.cs
          git diff --cached --check
          git commit -m "gameplay: add semantic horizontal control for runtime players"
          git push origin HEAD:gameplay/g6-player-horizontal-intent-v2
