name: One-shot optimized landmark phase ordering fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Patch landmark phase ordering and protected-content writes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/TerraRuntime.World/Generation/Optimized/OptimizedLandmarkWorldGenerationProvider.cs")
          text = path.read_text(encoding="utf-8")

          old = (
              '    private static readonly WorldGenerationPassId OrganicFeaturesId = new("terraruntime:optimized/organic-features");\n'
              '    private static readonly WorldGenerationPassId LifeCrystalsId = new("terraruntime:optimized/life-crystals");\n'
              '    private static readonly WorldGenerationPassId PlayabilityValidationId = new("terraruntime:optimized/playability-validation");'
          )
          new = (
              '    private static readonly WorldGenerationPassId TreasureId = new("terraruntime:optimized/treasure");\n'
              '    private static readonly WorldGenerationPassId MetadataId = new("terraruntime:optimized/metadata");\n'
              '    private static readonly WorldGenerationPassId PlayabilityValidationId = new("terraruntime:optimized/playability-validation");'
          )
          if text.count(old) != 1:
              raise SystemExit("expected landmark pass-id block not found")
          text = text.replace(old, new)

          old = (
              '            if (entry.Descriptor.Id == LifeCrystalsId)\n'
              '            {\n'
              '                Add(builder, LandmarksId, OrganicFeaturesId, new LandmarkPass(state));\n'
              '                builder.Add(CloneDescriptor(entry.Descriptor, [LandmarksId]), entry.Pass);\n'
              '                insertedLandmarks = true;\n'
              '                continue;\n'
              '            }\n\n'
              '            builder.Add(entry.Descriptor, entry.Pass);'
          )
          new = (
              '            if (entry.Descriptor.Id == MetadataId)\n'
              '            {\n'
              '                // Run landmarks after guaranteed Life Crystals and persistent treasure.\n'
              '                // Metadata and both validators therefore observe the final candidate.\n'
              '                Add(builder, LandmarksId, TreasureId, new LandmarkPass(state));\n'
              '                builder.Add(CloneDescriptor(entry.Descriptor, [LandmarksId]), entry.Pass);\n'
              '                insertedLandmarks = true;\n'
              '                continue;\n'
              '            }\n\n'
              '            builder.Add(entry.Descriptor, entry.Pass);'
          )
          if text.count(old) != 1:
              raise SystemExit("expected old landmark insertion block not found")
          text = text.replace(old, new)

          replacements = {
              "Math.Max(6, layers.Surface - 55)": "Math.Max(6, layers.Surface - 28)",
              "Math.Max(8, layers.Surface - 50)": "Math.Max(8, layers.Surface - 28)",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected surface probe not found: {old}")
              text = text.replace(old, new)
              print(f"replaced {count} occurrence(s): {old} -> {new}")

          old = (
              '        if (floorY < 0 || left < 3 || left + width >= context.Workspace.WidthTiles - 3 || floorY - height < 3)\n'
              '            return false;\n'
              '        int top = floorY - height;'
          )
          new = (
              '        if (floorY < 0 || left < 3 || left + width >= context.Workspace.WidthTiles - 3 || floorY - height < 3)\n'
              '            return false;\n'
              '        if (HasProtectedContentNearby(context.Workspace, island.Center, floorY - height / 2, width))\n'
              '            return false;\n'
              '        int top = floorY - height;'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one sky-house insertion point, found {text.count(old)}")
          text = text.replace(old, new)

          old = (
              '        int halfWidth = Math.Clamp(island.Width / 7, 4, 8);\n'
              '        int depth = Math.Clamp(island.Width / 16, 3, 5);\n'
              '        int waterCells = 0;'
          )
          new = (
              '        int halfWidth = Math.Clamp(island.Width / 7, 4, 8);\n'
              '        int depth = Math.Clamp(island.Width / 16, 3, 5);\n'
              '        if (HasProtectedContentNearby(workspace, centerX, floorY, halfWidth + 6))\n'
              '            return false;\n'
              '        int waterCells = 0;'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one floating-lake insertion point, found {text.count(old)}")
          text = text.replace(old, new)

          old = (
              '    private static void SetBlock(IWorldGenerationWorkspace workspace, int x, int y, ushort type, ushort wall = 0, byte wallColor = 0)\n'
              '    {\n'
              '        if ((uint)x >= (uint)workspace.WidthTiles || (uint)y >= (uint)workspace.HeightTiles)\n'
              '            return;\n'
              '        var tile = new WorldGenerationTile(type, wall, 0, 0, WorldGenerationTileFlags.Active, 0, 0, wallColor, 0, WorldGenerationLiquidKind.Water);'
          )
          new = (
              '    private static void SetBlock(IWorldGenerationWorkspace workspace, int x, int y, ushort type, ushort wall = 0, byte wallColor = 0)\n'
              '    {\n'
              '        if ((uint)x >= (uint)workspace.WidthTiles || (uint)y >= (uint)workspace.HeightTiles)\n'
              '            return;\n'
              '        if (workspace.TryGetTile(x, y, out WorldGenerationTile existing) && IsProgressionProtected(existing))\n'
              '            return;\n'
              '        var tile = new WorldGenerationTile(type, wall, 0, 0, WorldGenerationTileFlags.Active, 0, 0, wallColor, 0, WorldGenerationLiquidKind.Water);'
          )
          if text.count(old) != 1:
              raise SystemExit("SetBlock insertion point not found")
          text = text.replace(old, new)

          old = (
              '    private static void SetAir(IWorldGenerationWorkspace workspace, int x, int y, ushort wall = 0, byte wallColor = 0)\n'
              '    {\n'
              '        if ((uint)x >= (uint)workspace.WidthTiles || (uint)y >= (uint)workspace.HeightTiles)\n'
              '            return;\n'
              '        var tile = new WorldGenerationTile(0, wall, 0, 0, WorldGenerationTileFlags.None, 0, 0, wallColor, 0, WorldGenerationLiquidKind.Water);'
          )
          new = (
              '    private static void SetAir(IWorldGenerationWorkspace workspace, int x, int y, ushort wall = 0, byte wallColor = 0)\n'
              '    {\n'
              '        if ((uint)x >= (uint)workspace.WidthTiles || (uint)y >= (uint)workspace.HeightTiles)\n'
              '            return;\n'
              '        if (workspace.TryGetTile(x, y, out WorldGenerationTile existing) && IsProgressionProtected(existing))\n'
              '            return;\n'
              '        var tile = new WorldGenerationTile(0, wall, 0, 0, WorldGenerationTileFlags.None, 0, 0, wallColor, 0, WorldGenerationLiquidKind.Water);'
          )
          if text.count(old) != 1:
              raise SystemExit("SetAir insertion point not found")
          text = text.replace(old, new)

          old = (
              '    private static void SetLiquid(IWorldGenerationWorkspace workspace, int x, int y, WorldGenerationLiquidKind kind)\n'
              '    {\n'
              '        if ((uint)x >= (uint)workspace.WidthTiles || (uint)y >= (uint)workspace.HeightTiles)\n'
              '            return;\n'
              '        var tile = new WorldGenerationTile(0, 0, 0, 0, WorldGenerationTileFlags.None, byte.MaxValue, 0, 0, 0, kind);'
          )
          new = (
              '    private static void SetLiquid(IWorldGenerationWorkspace workspace, int x, int y, WorldGenerationLiquidKind kind)\n'
              '    {\n'
              '        if ((uint)x >= (uint)workspace.WidthTiles || (uint)y >= (uint)workspace.HeightTiles)\n'
              '            return;\n'
              '        if (workspace.TryGetTile(x, y, out WorldGenerationTile existing) && IsProgressionProtected(existing))\n'
              '            return;\n'
              '        var tile = new WorldGenerationTile(0, 0, 0, 0, WorldGenerationTileFlags.None, byte.MaxValue, 0, 0, 0, kind);'
          )
          if text.count(old) != 1:
              raise SystemExit("SetLiquid insertion point not found")
          text = text.replace(old, new)

          marker = '    private static bool HasProtectedContentNearby(IWorldGenerationWorkspace workspace, int centerX, int centerY, int radius)\n    {'
          helper = (
              '    private static bool IsProgressionProtected(in WorldGenerationTile tile)\n'
              '    {\n'
              '        if (tile.LiquidAmount > 0 && tile.LiquidKind is WorldGenerationLiquidKind.Honey or WorldGenerationLiquidKind.Shimmer)\n'
              '            return true;\n'
              '        if ((tile.Flags & WorldGenerationTileFlags.Active) == 0)\n'
              '            return false;\n'
              '        return tile.Type == VanillaTileIds.Hive.Value ||\n'
              '               tile.Type == VanillaTileIds.LihzahrdBrick.Value ||\n'
              '               tile.Type == VanillaTileIds.LihzahrdAltar.Value ||\n'
              '               tile.Type == VanillaTileIds.DemonAltar.Value ||\n'
              '               tile.Type == VanillaTileIds.Hellforge.Value ||\n'
              '               tile.Type == Containers ||\n'
              '               VanillaWorldFrameImportance326.IsFrameImportant(tile.Type);\n'
              '    }\n\n'
              '    private static bool HasProtectedContentNearby(IWorldGenerationWorkspace workspace, int centerX, int centerY, int radius)\n'
              '    {'
          )
          if text.count(marker) != 1:
              raise SystemExit("protected-content helper insertion point not found")
          text = text.replace(marker, helper)

          path.write_text(text, encoding="utf-8")

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run optimized worldgen regression class
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.OptimizedWorldGenerationProviderTests

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add src/TerraRuntime.World/Generation/Optimized/OptimizedLandmarkWorldGenerationProvider.cs .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml
          git commit -m "Fix optimized landmark phase ordering" -m "Run landmark generation after guaranteed Life Crystals and persistent treasure but before metadata and validation. Preserve progression-critical/frame-important content during landmark writes and ignore sky terrain when discovering ground-level candidates. Prove the focused optimized-worldgen regressions and full test suite before pushing."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main