name: One-shot optimized landmark surface probe fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Patch ground probes and sky landmark collision guards
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/TerraRuntime.World/Generation/Optimized/OptimizedLandmarkWorldGenerationProvider.cs")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "Math.Max(6, layers.Surface - 55)": "Math.Max(6, layers.Surface - 28)",
              "Math.Max(8, layers.Surface - 50)": "Math.Max(8, layers.Surface - 28)",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected surface probe not found: {old}")
              text = text.replace(old, new)
              print(f"replaced {count} occurrence(s): {old} -> {new}")

          old = """        if (floorY < 0 || left < 3 || left + width >= context.Workspace.WidthTiles - 3 || floorY - height < 3)\n            return false;\n        int top = floorY - height;"""
          new = """        if (floorY < 0 || left < 3 || left + width >= context.Workspace.WidthTiles - 3 || floorY - height < 3)\n            return false;\n        if (HasProtectedContentNearby(context.Workspace, island.Center, floorY - height / 2, width))\n            return false;\n        int top = floorY - height;"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one sky-house insertion point, found {text.count(old)}")
          text = text.replace(old, new)

          old = """        int halfWidth = Math.Clamp(island.Width / 7, 4, 8);\n        int depth = Math.Clamp(island.Width / 16, 3, 5);\n        int waterCells = 0;"""
          new = """        int halfWidth = Math.Clamp(island.Width / 7, 4, 8);\n        int depth = Math.Clamp(island.Width / 16, 3, 5);\n        if (HasProtectedContentNearby(workspace, centerX, floorY, halfWidth + 6))\n            return false;\n        int waterCells = 0;"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one floating-lake insertion point, found {text.count(old)}")
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run optimized worldgen regression class
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.OptimizedWorldGenerationProviderTests

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add src/TerraRuntime.World/Generation/Optimized/OptimizedLandmarkWorldGenerationProvider.cs .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml
          git commit -m "Fix optimized sky landmark collisions" -m "Ignore floating-island terrain while discovering ground-level desert/forest candidates and reject overlapping sky houses or Floating Lakes near protected chest/frame-important content. Prove the deterministic and Crimson optimized-world regression class before pushing."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
