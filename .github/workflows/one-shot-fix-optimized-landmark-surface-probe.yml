name: One-shot optimized landmark phase ordering fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Patch phase ordering and bounded landmark placement
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/TerraRuntime.World/Generation/Optimized/OptimizedLandmarkWorldGenerationProvider.cs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new)

          old = (
              '    private static readonly WorldGenerationPassId OrganicFeaturesId = new("terraruntime:optimized/organic-features");\n'
              '    private static readonly WorldGenerationPassId LifeCrystalsId = new("terraruntime:optimized/life-crystals");\n'
              '    private static readonly WorldGenerationPassId PlayabilityValidationId = new("terraruntime:optimized/playability-validation");'
          )
          new = (
              '    private static readonly WorldGenerationPassId TreasureId = new("terraruntime:optimized/treasure");\n'
              '    private static readonly WorldGenerationPassId MetadataId = new("terraruntime:optimized/metadata");\n'
              '    private static readonly WorldGenerationPassId PlayabilityValidationId = new("terraruntime:optimized/playability-validation");'
          )
          text = replace_once(old, new, "pass ids")

          old = (
              '            if (entry.Descriptor.Id == LifeCrystalsId)\n'
              '            {\n'
              '                Add(builder, LandmarksId, OrganicFeaturesId, new LandmarkPass(state));\n'
              '                builder.Add(CloneDescriptor(entry.Descriptor, [LandmarksId]), entry.Pass);\n'
              '                insertedLandmarks = true;\n'
              '                continue;\n'
              '            }\n\n'
              '            builder.Add(entry.Descriptor, entry.Pass);'
          )
          new = (
              '            if (entry.Descriptor.Id == MetadataId)\n'
              '            {\n'
              '                // Life Crystals and persistent treasure are committed first; landmarks then mutate the\n'
              '                // final candidate before metadata and all validators inspect it.\n'
              '                Add(builder, LandmarksId, TreasureId, new LandmarkPass(state));\n'
              '                builder.Add(CloneDescriptor(entry.Descriptor, [LandmarksId]), entry.Pass);\n'
              '                insertedLandmarks = true;\n'
              '                continue;\n'
              '            }\n\n'
              '            builder.Add(entry.Descriptor, entry.Pass);'
          )
          text = replace_once(old, new, "phase ordering")

          for old, new in {
              "Math.Max(6, layers.Surface - 55)": "Math.Max(6, layers.Surface - 28)",
              "Math.Max(8, layers.Surface - 50)": "Math.Max(8, layers.Surface - 28)",
          }.items():
              if old not in text:
                  raise SystemExit(f"surface probe missing: {old}")
              text = text.replace(old, new)

          old = (
              '        if (floorY < 0 || left < 3 || left + width >= context.Workspace.WidthTiles - 3 || floorY - height < 3)\n'
              '            return false;\n'
              '        int top = floorY - height;'
          )
          new = (
              '        if (floorY < 0 || left < 3 || left + width >= context.Workspace.WidthTiles - 3 || floorY - height < 3)\n'
              '            return false;\n'
              '        if (HasProtectedContentNearby(context.Workspace, island.Center, floorY - height / 2, width))\n'
              '            return false;\n'
              '        int top = floorY - height;'
          )
          text = replace_once(old, new, "sky house guard")

          old = (
              '        int halfWidth = Math.Clamp(island.Width / 7, 4, 8);\n'
              '        int depth = Math.Clamp(island.Width / 16, 3, 5);\n'
              '        int waterCells = 0;'
          )
          new = (
              '        int halfWidth = Math.Clamp(island.Width / 7, 4, 8);\n'
              '        int depth = Math.Clamp(island.Width / 16, 3, 5);\n'
              '        if (HasProtectedContentNearby(workspace, centerX, floorY, halfWidth + 6))\n'
              '            return false;\n'
              '        int waterCells = 0;'
          )
          text = replace_once(old, new, "floating lake guard")

          old = (
              '        foreach (HorizontalSpan span in spans)\n'
              '        {\n'
              '            if (state.PyramidsPlaced >= state.PyramidTarget)\n'
              '                break;\n'
              '            int surfaceY = FindFirstActiveY(context.Workspace, span.Center, Math.Max(8, layers.Surface - 48), Math.Min(context.Workspace.HeightTiles - 8, layers.RockLayer));\n'
              '            if (surfaceY >= 0 && TryBuildPyramid(context, chests, span, span.Center, surfaceY, state.PyramidsPlaced))\n'
              '                state.PyramidsPlaced++;\n'
              '        }'
          )
          new = (
              '        foreach (HorizontalSpan span in spans)\n'
              '        {\n'
              '            if (state.PyramidsPlaced >= state.PyramidTarget)\n'
              '                break;\n'
              '            int step = Math.Max(5, span.Width / 8);\n'
              '            int[] offsets = [0, -step, step, -2 * step, 2 * step];\n'
              '            foreach (int offset in offsets)\n'
              '            {\n'
              '                int centerX = Math.Clamp(span.Center + offset, span.Left + 4, span.Right - 4);\n'
              '                int surfaceY = FindFirstActiveY(context.Workspace, centerX, Math.Max(8, layers.Surface - 28), Math.Min(context.Workspace.HeightTiles - 8, layers.RockLayer));\n'
              '                if (surfaceY < 0 || !TryBuildPyramid(context, chests, span, centerX, surfaceY, state.PyramidsPlaced))\n'
              '                    continue;\n'
              '                state.PyramidsPlaced++;\n'
              '                break;\n'
              '            }\n'
              '        }'
          )
          text = replace_once(old, new, "pyramid placement search")

          old = (
              '        int topY = surfaceY - height + 4;\n'
              '        if (topY < 4)\n'
              '            return false;\n'
              '        for (int row = 0; row < height; row++)'
          )
          new = (
              '        int topY = surfaceY - height + 4;\n'
              '        if (topY < 4)\n'
              '            return false;\n'
              '        if (HasProtectedContentNearby(context.Workspace, centerX, surfaceY, Math.Min(24, halfBase)))\n'
              '            return false;\n'
              '        for (int row = 0; row < height; row++)'
          )
          text = replace_once(old, new, "pyramid guard")

          old = (
              '        int topY = surfaceY - trunkHeight;\n'
              '        if (topY < 5)\n'
              '            return false;\n'
              '        for (int y = topY; y <= surfaceY + 10; y++)'
          )
          new = (
              '        int topY = surfaceY - trunkHeight;\n'
              '        if (topY < 5)\n'
              '            return false;\n'
              '        if (HasProtectedContentNearby(context.Workspace, centerX, surfaceY, 20) ||\n'
              '            HasProtectedContentNearby(context.Workspace, centerX, topY + 8, 16))\n'
              '            return false;\n'
              '        for (int y = topY; y <= surfaceY + 10; y++)'
          )
          text = replace_once(old, new, "living tree guard")

          old = (
              '        int left = centerX - halfWidth;\n'
              '        int right = centerX + halfWidth;\n'
              '        int top = floorY - height;\n'
              '        for (int x = left - 1; x <= right + 1; x++)'
          )
          new = (
              '        int left = centerX - halfWidth;\n'
              '        int right = centerX + halfWidth;\n'
              '        int top = floorY - height;\n'
              '        if (HasProtectedContentNearby(context.Workspace, centerX, top + height / 2, halfWidth + 5))\n'
              '            return false;\n'
              '        for (int x = left - 1; x <= right + 1; x++)'
          )
          text = replace_once(old, new, "underworld house guard")

          path.write_text(text, encoding="utf-8")

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run optimized worldgen regression class
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.OptimizedWorldGenerationProviderTests

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add src/TerraRuntime.World/Generation/Optimized/OptimizedLandmarkWorldGenerationProvider.cs .github/workflows/one-shot-fix-optimized-landmark-surface-probe.yml
          git commit -m "Fix optimized landmark phase ordering" -m "Run landmarks after guaranteed Life Crystals and persistent treasure, use bounded alternate placement candidates when protected progression content occupies the preferred landmark location, and ignore sky terrain during ground discovery. Prove focused optimized-worldgen regressions and the full test suite before pushing."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main