name: One-shot pyramid candidate parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pyramid-candidate-parity.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply clean-room pyramid candidate parity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"{path}: start marker not found")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"{path}: end marker not found")
              if text.find(start, a + 1) >= 0:
                  raise SystemExit(f"{path}: start marker is not unique")
              p.write_text(text[:a] + replacement + text[b:])

          workspace = 'src/TerraRuntime.World/RuntimeWorldGenerationWorkspace.cs'
          replace_once(
              workspace,
              'namespace TerraRuntime.World;\n\n/// <summary>',
              'namespace TerraRuntime.World;\n\ninternal readonly record struct VanillaPyramidCandidate1458(int X, int Y);\n\n/// <summary>')
          replace_once(
              workspace,
              '    private VanillaTerrainGenerationState1458? vanillaTerrainState;\n',
              '    private VanillaTerrainGenerationState1458? vanillaTerrainState;\n    private readonly List<VanillaPyramidCandidate1458> vanillaPyramidCandidates = [];\n')
          replace_once(
              workspace,
              '    internal void SetVanillaTerrainState(VanillaTerrainGenerationState1458 value) =>\n        vanillaTerrainState = value;\n',
              '''    internal void SetVanillaTerrainState(VanillaTerrainGenerationState1458 value) =>
        vanillaTerrainState = value;

    internal void ResetVanillaPyramidCandidates() => vanillaPyramidCandidates.Clear();

    internal void AddVanillaPyramidCandidate(int x, int y)
    {
        if ((uint)x >= (uint)WidthTiles || (uint)y >= (uint)HeightTiles)
            throw new ArgumentOutOfRangeException(nameof(x), $"Vanilla pyramid candidate ({x}, {y}) is outside the generation workspace.");
        vanillaPyramidCandidates.Add(new VanillaPyramidCandidate1458(x, y));
    }

    internal VanillaPyramidCandidate1458[] CaptureVanillaPyramidCandidates() => vanillaPyramidCandidates.ToArray();
''')

          early = 'src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs'
          replace_once(
              early,
              '                ApplyDunes(context, grid, RequireVanilla(context));',
              '                ApplyDunes(context, workspace, grid, RequireVanilla(context));')
          replace_once(
              early,
              '                ApplyOceanSand(context, grid, RequireVanilla(context));',
              '                ApplyOceanSand(context, workspace, grid, RequireVanilla(context));')
          replace_once(
              early,
              '    private void ApplyDunes(IWorldGenerationContext context, RuntimeGrid grid, IRandom random)\n    {\n        VanillaWorldGenerationBootstrapState1458 b = RequireBootstrap();',
              '''    private void ApplyDunes(
        IWorldGenerationContext context,
        RuntimeWorldGenerationWorkspace workspace,
        RuntimeGrid grid,
        IRandom random)
    {
        VanillaWorldGenerationBootstrapState1458 b = RequireBootstrap();
        workspace.ResetVanillaPyramidCandidates();''')
          replace_once(
              early,
              '''            if (random.NextDouble() <= 0.8d)
            {
                int candidateX = random.Next(originX - 200, originX + 200);
                _ = grid.FindFirstActiveY(candidateX, 0, grid.Height);
            }''',
              '''            if (random.NextDouble() <= 0.8d)
            {
                int candidateX = random.Next(originX - 200, originX + 200);
                int candidateSurface = grid.FindFirstActiveY(candidateX, 0, grid.Height);
                if (candidateSurface < grid.Height)
                    workspace.AddVanillaPyramidCandidate(candidateX, candidateSurface + 20);
            }''')
          replace_once(
              early,
              '    private void ApplyOceanSand(IWorldGenerationContext context, RuntimeGrid grid, IRandom random)\n    {',
              '''    private void ApplyOceanSand(
        IWorldGenerationContext context,
        RuntimeWorldGenerationWorkspace workspace,
        RuntimeGrid grid,
        IRandom random)
    {''')
          replace_once(
              early,
              '                if (x == (left + right) / 2 && random.Next(6) == 0) { }',
              '''                if (x == (left + right) / 2 && random.Next(6) == 0)
                    workspace.AddVanillaPyramidCandidate(x, y);''')

          dungeon = 'src/TerraRuntime.World/VanillaDungeonWorldGenerationPipeline1458.cs'
          replace_once(
              dungeon,
              '                ApplyPyramids(context, grid, random);',
              '                ApplyPyramids(context, workspace, grid, random);')
          replacement = '''    private void ApplyPyramids(
        IWorldGenerationContext context,
        RuntimeWorldGenerationWorkspace workspace,
        RuntimeGrid grid,
        IRandom random)
    {
        VanillaPyramidCandidate1458[] candidates = workspace.CaptureVanillaPyramidCandidates();
        int placed = 0;
        int worldSurface = Math.Clamp((int)Math.Ceiling(state.WorldSurface), 1, grid.Height - 1);

        for (int i = 0; i < candidates.Length; i++)
        {
            context.CancellationToken.ThrowIfCancellationRequested();
            if (!IsOrdinaryPyramidCandidatePositionEligible(candidates, i, grid.Width, state.DungeonX))
                continue;

            VanillaPyramidCandidate1458 candidate = candidates[i];
            int surface = Math.Clamp(candidate.Y, 1, grid.Height - 2);
            while (surface < worldSurface && !grid.At(candidate.X, surface).IsActive)
                surface++;

            if (surface >= worldSurface || grid.At(candidate.X, surface).Type != Sand)
                continue;

            int halfWidth = random.Next(30, 47);
            int height = random.Next(24, 38);
            BuildPyramid(grid, candidate.X, surface - 1, halfWidth, height);
            placed++;
        }

        state.PyramidCount = placed;
        context.ReportProgress(1d, $"Generating desert pyramids from source candidates ({placed}/{candidates.Length})");
    }

    internal static bool IsOrdinaryPyramidCandidatePositionEligible(
        ReadOnlySpan<VanillaPyramidCandidate1458> candidates,
        int index,
        int worldWidth,
        int dungeonX)
    {
        if ((uint)index >= (uint)candidates.Length)
            throw new ArgumentOutOfRangeException(nameof(index));
        if (worldWidth <= 0 || (uint)dungeonX >= (uint)worldWidth)
            throw new ArgumentOutOfRangeException(nameof(worldWidth));

        int x = candidates[index].X;
        if (x <= 300 || x >= worldWidth - 300)
            return false;

        int dungeonPadding = (int)(worldWidth * 0.15d);
        bool dungeonOnLeft = dungeonX < worldWidth / 2;
        if (dungeonOnLeft)
        {
            if (x < dungeonX + dungeonPadding)
                return false;
        }
        else if (x > dungeonX - dungeonPadding)
        {
            return false;
        }

        int nearestEarlierCandidate = worldWidth;
        for (int i = 0; i < index; i++)
            nearestEarlierCandidate = Math.Min(nearestEarlierCandidate, Math.Abs(x - candidates[i].X));

        return nearestEarlierCandidate >= 220;
    }

'''
          replace_between(
              dungeon,
              '    private void ApplyPyramids(IWorldGenerationContext context, RuntimeGrid grid, IRandom random)\n',
              '    private static bool TryFindDesertBand',
              replacement)

          early_tests = 'tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationPipeline1458Tests.cs'
          replace_once(
              early_tests,
              '    private static CaptureEntry Find(CaptureBuilder builder, string id) =>',
              '''    [Fact]
    public void Pyramid_candidate_workspace_state_preserves_source_generation_order()
    {
        var workspace = new RuntimeWorldGenerationWorkspace(64, 64);
        workspace.ResetVanillaPyramidCandidates();
        workspace.AddVanillaPyramidCandidate(10, 20);
        workspace.AddVanillaPyramidCandidate(30, 40);

        VanillaPyramidCandidate1458[] candidates = workspace.CaptureVanillaPyramidCandidates();

        Assert.Equal(
            [new VanillaPyramidCandidate1458(10, 20), new VanillaPyramidCandidate1458(30, 40)],
            candidates);

        workspace.ResetVanillaPyramidCandidates();
        Assert.Empty(workspace.CaptureVanillaPyramidCandidates());
    }

    private static CaptureEntry Find(CaptureBuilder builder, string id) =>''')

          dungeon_tests = 'tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests.cs'
          replace_once(
              dungeon_tests,
              '    private static CaptureEntry Find(CaptureBuilder builder, string id) =>',
              '''    [Fact]
    public void Ordinary_pyramid_candidate_filter_uses_source_edges_dungeon_side_and_prior_candidate_spacing()
    {
        VanillaPyramidCandidate1458[] leftDungeonCandidates =
        [
            new(500, 200),
            new(1200, 200),
            new(1300, 200),
            new(2000, 200)
        ];

        Assert.False(VanillaDungeonWorldGenerationPass1458.IsOrdinaryPyramidCandidatePositionEligible(
            leftDungeonCandidates, 0, worldWidth: 4200, dungeonX: 400));
        Assert.True(VanillaDungeonWorldGenerationPass1458.IsOrdinaryPyramidCandidatePositionEligible(
            leftDungeonCandidates, 1, worldWidth: 4200, dungeonX: 400));
        Assert.False(VanillaDungeonWorldGenerationPass1458.IsOrdinaryPyramidCandidatePositionEligible(
            leftDungeonCandidates, 2, worldWidth: 4200, dungeonX: 400));
        Assert.True(VanillaDungeonWorldGenerationPass1458.IsOrdinaryPyramidCandidatePositionEligible(
            leftDungeonCandidates, 3, worldWidth: 4200, dungeonX: 400));

        VanillaPyramidCandidate1458[] rightDungeonCandidates = [new(3300, 200), new(3000, 200)];
        Assert.False(VanillaDungeonWorldGenerationPass1458.IsOrdinaryPyramidCandidatePositionEligible(
            rightDungeonCandidates, 0, worldWidth: 4200, dungeonX: 3800));
        Assert.True(VanillaDungeonWorldGenerationPass1458.IsOrdinaryPyramidCandidatePositionEligible(
            rightDungeonCandidates, 1, worldWidth: 4200, dungeonX: 3800));

        Assert.False(VanillaDungeonWorldGenerationPass1458.IsOrdinaryPyramidCandidatePositionEligible(
            [new VanillaPyramidCandidate1458(300, 200)], 0, worldWidth: 4200, dungeonX: 3800));
    }

    private static CaptureEntry Find(CaptureBuilder builder, string id) =>''')
          PY

      - name: Validate patch
        run: |
          git diff --check
          git diff -- src/TerraRuntime.World/RuntimeWorldGenerationWorkspace.cs \
            src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs \
            src/TerraRuntime.World/VanillaDungeonWorldGenerationPipeline1458.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationPipeline1458Tests.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests.cs

      - name: Build and run focused worldgen tests
        run: |
          dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build \
            --filter 'FullyQualifiedName~SourceBackedVanillaWorldGenerationPipeline1458Tests|FullyQualifiedName~SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests'

      - name: Smoke canonical small world
        run: |
          mkdir -p artifacts
          dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- \
            --worldgen-create-smoke artifacts/pyramid-parity-small.wld terraruntime:vanilla 4200 1200 1458
          dotnet run --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj -c Release -- \
            artifacts/pyramid-parity-small.wld

      - name: Commit patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git add \
            src/TerraRuntime.World/RuntimeWorldGenerationWorkspace.cs \
            src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs \
            src/TerraRuntime.World/VanillaDungeonWorldGenerationPipeline1458.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationPipeline1458Tests.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests.cs
          git commit -m 'Preserve vanilla pyramid candidates across passes'
          git pull --rebase origin main
          git push origin HEAD:main
