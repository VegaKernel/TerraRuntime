name: One-shot pyramid candidate parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pyramid-candidate-parity.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply clean-room pyramid candidate parity patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/pyramid-parity-patch.py
          python /tmp/pyramid-parity-patch.py
          git diff --check

      - name: Build and run worldgen tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build \
            --filter 'FullyQualifiedName~SourceBackedVanillaWorldGenerationPipeline1458Tests|FullyQualifiedName~SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests'

      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Smoke canonical small world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- \
            --worldgen-create-smoke artifacts/pyramid-parity-small.wld terraruntime:vanilla 4200 1200 1458
          dotnet run --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj -c Release -- \
            artifacts/pyramid-parity-small.wld

      - name: Commit patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git add \
            src/TerraRuntime.World/RuntimeWorldGenerationWorkspace.cs \
            src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs \
            src/TerraRuntime.World/VanillaDungeonWorldGenerationPipeline1458.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationPipeline1458Tests.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests.cs
          git commit -m 'Preserve vanilla pyramid candidates across passes'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch canonical-size acceptance on committed main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/vanilla-worldgen-canonical-sizes.yml/dispatches \
            -f ref=main
