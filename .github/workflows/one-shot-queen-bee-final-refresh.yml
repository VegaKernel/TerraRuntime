name: One-shot Queen Bee final refresh

on:
  push:
    branches: [work/queen-bee-boss-vertical-1458]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-runtime-queen-bee-final-refresh
  cancel-in-progress: false

jobs:
  refresh-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/queen-bee-boss-vertical-1458
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          echo "integration_main=$(git rev-parse origin/main)"
      - name: Release build
        run: dotnet build build/TerraRuntime.slnx -c Release --nologo
      - name: Queen Bee tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --filter FullyQualifiedName~QueenBee --nologo
      - name: Full tests
        run: dotnet test build/TerraRuntime.slnx -c Release --no-build --nologo
      - name: Commit refreshed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-queen-bee-final-refresh.yml
          git add -A
          git diff --cached --check
          git commit -m 'Refresh Queen Bee vertical onto latest main'
          git push origin HEAD:work/queen-bee-boss-vertical-1458
