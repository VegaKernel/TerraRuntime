name: Jesters Arrow Source Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jesters-arrow-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Extract pinned projectile source facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375

          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            candidate_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
            if [[ "$candidate_sha256" == "$expected_sha256" ]]; then
              assembly="$candidate"
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          assembly_dir="$(dirname "$assembly")"

          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Projectile "$assembly" > artifacts/source-contract/projectile.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.DelegateMethods "$assembly" > artifacts/source-contract/delegate-methods.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Player "$assembly" > artifacts/source-contract/player.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.WorldGen "$assembly" > artifacts/source-contract/worldgen.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Main "$assembly" > artifacts/source-contract/main.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.TileID "$assembly" > artifacts/source-contract/tile-id.cs

          python3 tools/ci/probe_projectile_tile_cut.py \
            --projectile artifacts/source-contract/projectile.cs \
            --delegate-methods artifacts/source-contract/delegate-methods.cs \
            --player artifacts/source-contract/player.cs \
            --worldgen artifacts/source-contract/worldgen.cs \
            --main artifacts/source-contract/main.cs \
            --tile-id artifacts/source-contract/tile-id.cs \
            > artifacts/source-contract/probe.txt

          grep -E '^projectile_(jesters_arrow_defaults|ai001_type5_contexts|kill_type5_contexts)=' artifacts/source-contract/probe.txt \
            > artifacts/source-contract/jesters-arrow.txt
          cat artifacts/source-contract/jesters-arrow.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jesters-arrow-source
          path: artifacts/source-contract/jesters-arrow.txt
          retention-days: 1
