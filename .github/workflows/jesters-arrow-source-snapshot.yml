name: Apply Jesters Arrow Runtime Slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jesters-arrow-source-snapshot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed Jester's Arrow slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          printf '%s' '' | base64 -d | gzip -dc > /tmp/jester.patch
          git apply --check /tmp/jester.patch
          git apply /tmp/jester.patch
          python3 -m py_compile tools/ci/probe_projectile_tile_cut.py
          git diff --check
          git rm .github/workflows/jesters-arrow-source-snapshot.yml

          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools tests .github/workflows
          git commit -m 'feat: simulate jesters arrow world flight'

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'main kept advancing; refusing to force-push' >&2
          exit 1
