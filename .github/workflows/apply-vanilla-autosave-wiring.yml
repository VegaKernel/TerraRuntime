name: Apply vanilla dedicated autosave wiring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-vanilla-autosave-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Wire source-backed autosave cadence into authoritative owner
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/TerraRuntime/TerrariaServerHost.cs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one host match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "        var worldSaveService = new RuntimeWorldTileChestSaveService(\n"
              "            options.WorldPath,\n"
              "            world.Envelope,\n"
              "            world.Header,\n"
              "            worldSaveTemplate,\n"
              "            world.Tiles,\n"
              "            chestStore,\n"
              "            worldClock: worldClock);\n",
              "        var worldSaveService = new RuntimeWorldTileChestSaveService(\n"
              "            options.WorldPath,\n"
              "            world.Envelope,\n"
              "            world.Header,\n"
              "            worldSaveTemplate,\n"
              "            world.Tiles,\n"
              "            chestStore,\n"
              "            worldClock: worldClock);\n"
              "        var worldAutosave = new VanillaWorldAutosaveScheduler();\n")

          replace_once(
              "                runtime.Tick();\n"
              "                sectionCacheRebuild.Tick();\n"
              "                worldSaveService.Tick();\n",
              "                runtime.Tick();\n"
              "                sectionCacheRebuild.Tick();\n"
              "                if (worldAutosave.Tick())\n"
              "                    worldSaveService.RequestSave();\n"
              "                worldSaveService.Tick();\n")

          path.write_text(text, encoding="utf-8")

      - name: Build and test autosave persistence path
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj
          --configuration Release
          --
          --filter-class TerraRuntime.Tests.VanillaWorldAutosaveSchedulerTests
          --filter-class TerraRuntime.Tests.RuntimeWorldTileChestSaveServiceTests

      - name: Commit autosave wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vanilla-autosave-wiring.yml
          git add src/TerraRuntime/TerrariaServerHost.cs
          git commit -m "feat: autosave world at vanilla server cadence"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; rebasing (attempt ${attempt})"
            git pull --rebase origin main
          done

          echo "Could not push autosave wiring after retries" >&2
          exit 1
