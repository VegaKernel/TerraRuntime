name: One Shot AI005 Motion Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-motion-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply AI_005 movement parity block
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          motion = r'''using TerraRuntime.Contracts.Gameplay;
          using TerraRuntime.Contracts.Runtime;

          namespace TerraRuntime.Core;

          public readonly record struct VanillaFlyerAiMotionInput(
              float PositionY,
              float NpcCenterX,
              float NpcCenterY,
              float VelocityX,
              float VelocityY,
              float TargetCenterX,
              float TargetCenterY,
              float TargetTopY,
              float OldVelocityX,
              float OldVelocityY,
              int DirectionX,
              NpcAiState Ai,
              float Scale,
              bool CollideX,
              bool CollideY,
              bool Wet,
              bool DayTime,
              bool ExpertMode,
              double WorldSurfacePixels,
              int TimeLeft);

          public readonly record struct VanillaFlyerAiMotionResult(
              float VelocityX,
              float VelocityY,
              NpcAiState Ai,
              int TimeLeft);

          /// <summary>
          /// Clean-room deterministic TerrariaServer 1.4.5.8 AI_005_EaterOfSouls movement/state slice.
          /// This owns source-ordered family jitter, close homing, Bee acceleration ramp, surface Hornet
          /// damping, collision bounce minima, wet rise and daylight/despawn motion. Projectile/NPC spawn
          /// side effects and presentation-only rotation/dust remain outside this pure state primitive.
          /// </summary>
          public static class VanillaFlyerAiMotion
          {
              private const float CoordinateQuantum = 8f;
              private const float JitterAcceleration = 0.023f;
              private const float CloseHomingScale = 0.007f;

              public static bool TryStep(
                  NpcTypeId type,
                  in VanillaFlyerAiMotionInput input,
                  in VanillaFlyerMotionProfile baseProfile,
                  out VanillaFlyerAiMotionResult result)
              {
                  if (!float.IsFinite(input.PositionY) ||
                      !float.IsFinite(input.NpcCenterX) ||
                      !float.IsFinite(input.NpcCenterY) ||
                      !float.IsFinite(input.VelocityX) ||
                      !float.IsFinite(input.VelocityY) ||
                      !float.IsFinite(input.TargetCenterX) ||
                      !float.IsFinite(input.TargetCenterY) ||
                      !float.IsFinite(input.TargetTopY) ||
                      !float.IsFinite(input.OldVelocityX) ||
                      !float.IsFinite(input.OldVelocityY) ||
                      !float.IsFinite(input.Scale) ||
                      input.Scale <= 0f ||
                      input.DirectionX is < -1 or > 1 ||
                      !input.Ai.IsFinite ||
                      input.TimeLeft < -1 ||
                      double.IsNaN(input.WorldSurfacePixels) ||
                      input.WorldSurfacePixels <= 0d ||
                      (double.IsInfinity(input.WorldSurfacePixels) && !double.IsPositiveInfinity(input.WorldSurfacePixels)) ||
                      !baseProfile.IsValid)
                  {
                      result = default;
                      return false;
                  }

                  float velocityX = input.VelocityX;
                  float velocityY = input.VelocityY;
                  float ai0 = input.Ai.Ai0;
                  float ai1 = input.Ai.Ai1;
                  float maximumSpeed = baseProfile.MaximumSpeed;
                  float acceleration = baseProfile.Acceleration;
                  int timeLeft = input.TimeLeft;

                  if (type == VanillaNpcIds.EaterOfSouls)
                      acceleration = input.ExpertMode ? 0.035f : 0.02f;

                  if (type == VanillaNpcIds.Bee || type == VanillaNpcIds.SmallBee)
                  {
                      ai1++;
                      float ramp = (ai1 - 60f) / 60f;
                      if (ramp > 1f)
                      {
                          ramp = 1f;
                      }
                      else
                      {
                          velocityX = Math.Clamp(velocityX, -6f, 6f);
                          velocityY = Math.Clamp(velocityY, -6f, 6f);
                      }

                      maximumSpeed = 5f;
                      acceleration = 0.1f * ramp;
                  }

                  if (IsSurfaceHornet(type) && input.PositionY < input.WorldSurfacePixels)
                  {
                      float targetVerticalOffset = input.TargetTopY - input.PositionY;
                      if (targetVerticalOffset > 300f && velocityY < 0f)
                          velocityY *= 0.97f;
                      if (targetVerticalOffset < 80f && velocityY > 0f)
                          velocityY *= 0.97f;
                  }

                  if (type == VanillaNpcIds.BloodSquid && input.DayTime)
                  {
                      velocityY -= 0.3f;
                      timeLeft = EncourageDespawn(timeLeft, 60);
                  }

                  float sourceX = Quantize(input.NpcCenterX);
                  float sourceY = Quantize(input.NpcCenterY);
                  float targetX = Quantize(input.TargetCenterX);
                  float targetY = Quantize(input.TargetCenterY);
                  float deltaX = targetX - sourceX;
                  float deltaY = targetY - sourceY;
                  float distance = MathF.Sqrt(deltaX * deltaX + deltaY * deltaY);

                  float desiredX;
                  float desiredY;
                  if (distance == 0f)
                  {
                      desiredX = velocityX;
                      desiredY = velocityY;
                  }
                  else
                  {
                      float seekScale = maximumSpeed / distance;
                      desiredX = deltaX * seekScale;
                      desiredY = deltaY * seekScale;
                  }

                  bool secondaryJitterFamily = IsSecondaryJitterFamily(type);
                  if ((IsPrimaryJitterFamily(type) || secondaryJitterFamily) &&
                      (distance > 100f || secondaryJitterFamily))
                  {
                      ai0++;
                      velocityY += ai0 > 0f ? JitterAcceleration : -JitterAcceleration;
                      velocityX += ai0 < -100f || ai0 > 100f
                          ? JitterAcceleration
                          : -JitterAcceleration;
                      if (ai0 > 200f)
                          ai0 = -200f;
                  }

                  if (distance < 150f && UsesCloseHoming(type))
                  {
                      velocityX += desiredX * CloseHomingScale;
                      velocityY += desiredY * CloseHomingScale;
                  }

                  if (type == VanillaNpcIds.BloodSquid &&
                      input.NpcCenterY > input.TargetCenterY - 200f)
                  {
                      velocityY -= 0.3f;
                  }

                  ApproachAxis(ref velocityX, desiredX, acceleration, baseProfile.TurnsHard);
                  ApproachAxis(ref velocityY, desiredY, acceleration, baseProfile.TurnsHard);

                  if (baseProfile.HasBounce)
                  {
                      if (input.CollideX)
                      {
                          velocityX = input.OldVelocityX * -baseProfile.BounceFactor;
                          if (input.DirectionX == -1 && velocityX > 0f && velocityX < 2f)
                              velocityX = 2f;
                          if (input.DirectionX == 1 && velocityX < 0f && velocityX > -2f)
                              velocityX = -2f;
                      }

                      if (input.CollideY)
                      {
                          velocityY = input.OldVelocityY * -baseProfile.BounceFactor;
                          if (velocityY > 0f && velocityY < 1.5f)
                              velocityY = 2f;
                          if (velocityY < 0f && velocityY > -1.5f)
                              velocityY = -2f;
                      }
                  }

                  if (input.Wet && baseProfile.RisesInWater)
                  {
                      if (velocityY > 0f)
                          velocityY *= 0.95f;
                      velocityY -= baseProfile.WaterRiseAcceleration;
                      if (velocityY < -baseProfile.WaterRiseSpeedCap)
                          velocityY = -baseProfile.WaterRiseSpeedCap;
                  }

                  if (input.DayTime && !IsDaylightExempt(type))
                  {
                      velocityY -= acceleration * 2f;
                      timeLeft = EncourageDespawn(timeLeft, 10);
                  }

                  result = new VanillaFlyerAiMotionResult(
                      velocityX,
                      velocityY,
                      new NpcAiState(ai0, ai1, input.Ai.Ai2, input.Ai.Ai3),
                      timeLeft);
                  return true;
              }

              private static float Quantize(float value) =>
                  (int)(value / CoordinateQuantum) * CoordinateQuantum;

              private static int EncourageDespawn(int timeLeft, int maximum) =>
                  timeLeft >= 0 && timeLeft > maximum ? maximum : timeLeft;

              private static void ApproachAxis(
                  ref float velocity,
                  float desired,
                  float acceleration,
                  bool turnsHard)
              {
                  if (velocity < desired)
                  {
                      velocity += acceleration;
                      if (turnsHard && velocity < 0f && desired > 0f)
                          velocity += acceleration;
                  }
                  else if (velocity > desired)
                  {
                      velocity -= acceleration;
                      if (turnsHard && velocity > 0f && desired < 0f)
                          velocity -= acceleration;
                  }
              }

              private static bool IsPrimaryJitterFamily(NpcTypeId type) =>
                  type == VanillaNpcIds.EaterOfSouls ||
                  type == VanillaNpcIds.Probe ||
                  type == VanillaNpcIds.Crimera ||
                  type == VanillaNpcIds.Moth;

              private static bool IsSecondaryJitterFamily(NpcTypeId type) =>
                  type == VanillaNpcIds.Hornet ||
                  type == VanillaNpcIds.Corruptor ||
                  type == VanillaNpcIds.BloodSquid ||
                  type == VanillaNpcIds.MossHornet ||
                  type == VanillaNpcIds.Bee ||
                  type == VanillaNpcIds.SmallBee ||
                  IsHornetVariant(type);

              private static bool UsesCloseHoming(NpcTypeId type) =>
                  type == VanillaNpcIds.EaterOfSouls ||
                  type == VanillaNpcIds.Corruptor ||
                  type == VanillaNpcIds.Crimera ||
                  type == VanillaNpcIds.BloodSquid;

              private static bool IsSurfaceHornet(NpcTypeId type) =>
                  type == VanillaNpcIds.Hornet || IsHornetVariant(type);

              private static bool IsHornetVariant(NpcTypeId type) =>
                  type == VanillaNpcIds.FattyHornet ||
                  type == VanillaNpcIds.HoneyHornet ||
                  type == VanillaNpcIds.LeafyHornet ||
                  type == VanillaNpcIds.SpikeyHornet ||
                  type == VanillaNpcIds.StingyHornet;

              private static bool IsDaylightExempt(NpcTypeId type) =>
                  type == VanillaNpcIds.Crimera ||
                  type == VanillaNpcIds.BloodSquid ||
                  type == VanillaNpcIds.EaterOfSouls ||
                  type == VanillaNpcIds.MeteorHead ||
                  type == VanillaNpcIds.Hornet ||
                  type == VanillaNpcIds.Corruptor ||
                  type == VanillaNpcIds.MossHornet ||
                  type == VanillaNpcIds.Moth ||
                  type == VanillaNpcIds.Bee ||
                  type == VanillaNpcIds.SmallBee ||
                  type == VanillaNpcIds.Parrot ||
                  IsHornetVariant(type);
          }
          '''
          Path('src/TerraRuntime.Core/Npcs/VanillaFlyerAiMotion.cs').write_text(motion, encoding='utf-8')

          strategy_path = Path('src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorStrategies.cs')
          text = strategy_path.read_text(encoding='utf-8')
          start = text.index('internal sealed class VanillaServantOfCthulhuNpcBehaviorStrategy')
          end = text.index('internal sealed class VanillaWormNpcBehaviorStrategy', start)
          replacement = r'''internal sealed class VanillaServantOfCthulhuNpcBehaviorStrategy : IVanillaNpcBehaviorStrategy
          {
              public bool TryStep(
                  in NpcSnapshot npc,
                  in VanillaNpcDefinition definition,
                  VanillaNpcBehaviorContext context,
                  INpcAiStateStepper inner,
                  out NpcStateUpdate next)
              {
                  if (definition.AiStyle != VanillaNpcAiStyles.Flyer ||
                      !VanillaFlyerNpcCatalog.TryGetMotionProfile(
                          definition.Type,
                          out VanillaFlyerMotionProfile profile) ||
                      !definition.TryResolveHitbox(npc.Simulation.Scale, out VanillaNpcHitboxSize hitbox))
                  {
                      next = default;
                      return false;
                  }

                  if (VanillaFlyerNpcCatalog.UsesScaleSpeedHandicap(definition.Type))
                  {
                      float speedFactor = 2f - npc.Simulation.Scale;
                      if (!float.IsFinite(speedFactor) || speedFactor <= 0f)
                      {
                          next = default;
                          return false;
                      }

                      profile = profile with
                      {
                          MaximumSpeed = profile.MaximumSpeed * speedFactor,
                          Acceleration = profile.Acceleration * speedFactor
                      };
                  }

                  if (!context.TrySelectClosestTarget(in npc, in definition, out VanillaBlueSlimeTargetRefresh closest) ||
                      !context.TryFindCandidate(checked((byte)closest.Target), out VanillaNpcTargetCandidate candidate))
                  {
                      NpcSimulationState idleSimulation = npc.Simulation with
                      {
                          NoGravity = true,
                          NoTileCollide = definition.NoTileCollideAtSpawn
                      };
                      next = new NpcStateUpdate(
                          definition.Type.Value,
                          npc.NetId,
                          npc.PositionX,
                          npc.PositionY,
                          npc.VelocityX,
                          npc.VelocityY,
                          npc.Target,
                          npc.Ai,
                          idleSimulation);
                      return true;
                  }

                  var input = new VanillaFlyerAiMotionInput(
                      PositionY: npc.PositionY,
                      NpcCenterX: npc.PositionX + hitbox.Width * 0.5f,
                      NpcCenterY: npc.PositionY + hitbox.Height * 0.5f,
                      VelocityX: npc.VelocityX,
                      VelocityY: npc.VelocityY,
                      TargetCenterX: candidate.CenterX,
                      TargetCenterY: candidate.CenterY,
                      TargetTopY: candidate.CenterY - VanillaNpcBehaviorContext.BasePlayerHeight * 0.5f,
                      OldVelocityX: npc.Simulation.OldVelocityX,
                      OldVelocityY: npc.Simulation.OldVelocityY,
                      DirectionX: closest.DirectionX,
                      Ai: npc.Ai,
                      Scale: npc.Simulation.Scale,
                      CollideX: npc.Simulation.CollideX,
                      CollideY: npc.Simulation.CollideY,
                      Wet: npc.Simulation.Wet,
                      DayTime: context.DayTime,
                      ExpertMode: context.ExpertMode,
                      WorldSurfacePixels: context.WorldSurfacePixels,
                      TimeLeft: npc.Simulation.TimeLeft);
                  if (!VanillaFlyerAiMotion.TryStep(
                          definition.Type,
                          in input,
                          in profile,
                          out VanillaFlyerAiMotionResult result))
                  {
                      next = default;
                      return false;
                  }

                  next = new NpcStateUpdate(
                      definition.Type.Value,
                      npc.NetId,
                      npc.PositionX,
                      npc.PositionY,
                      result.VelocityX,
                      result.VelocityY,
                      closest.Target,
                      result.Ai,
                      npc.Simulation with
                      {
                          DirectionX = closest.DirectionX,
                          DirectionY = closest.DirectionY,
                          NoGravity = true,
                          NoTileCollide = definition.NoTileCollideAtSpawn,
                          TimeLeft = result.TimeLeft
                      });
                  return true;
              }
          }

          '''
          strategy_path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          tests = r'''using TerraRuntime.Contracts.Gameplay;
          using TerraRuntime.Contracts.Runtime;
          using TerraRuntime.Core;

          namespace TerraRuntime.Tests;

          public sealed class VanillaFlyerAiMotionTests
          {
              [Fact]
              public void Eater_expert_acceleration_and_source_jitter_are_applied_in_order()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.EaterOfSouls);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.EaterOfSouls) with
                  {
                      TargetCenterX = 400f,
                      ExpertMode = true,
                      Ai = new NpcAiState(0f, 0f, 0f, 0f)
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.EaterOfSouls, in input, in profile, out var result));

                  Assert.Equal(1f, result.Ai.Ai0);
                  Assert.Equal(0.012f, result.VelocityX, 5);
                  Assert.Equal(-0.012f, result.VelocityY, 5);
              }

              [Fact]
              public void Eater_close_homing_adds_source_point_zero_zero_seven_seek_component()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.EaterOfSouls);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.EaterOfSouls) with
                  {
                      TargetCenterX = 96f
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.EaterOfSouls, in input, in profile, out var result));

                  Assert.Equal(0f, result.Ai.Ai0);
                  Assert.Equal(0.048f, result.VelocityX, 5);
              }

              [Fact]
              public void Bee_ramp_advances_ai1_and_reaches_verified_speed_and_acceleration_band()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.Bee);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.Bee) with
                  {
                      TargetCenterX = 400f,
                      Ai = new NpcAiState(0f, 119f, 0f, 0f)
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.Bee, in input, in profile, out var result));

                  Assert.Equal(120f, result.Ai.Ai1);
                  Assert.Equal(1f, result.Ai.Ai0);
                  Assert.Equal(0.077f, result.VelocityX, 5);
              }

              [Fact]
              public void Hornet_above_surface_damps_upward_escape_when_target_is_far_below()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.Hornet);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.Hornet) with
                  {
                      PositionY = 100f,
                      NpcCenterY = 116f,
                      TargetCenterY = 521f,
                      TargetTopY = 500f,
                      VelocityY = -2f,
                      WorldSurfacePixels = 1000d
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.Hornet, in input, in profile, out var result));

                  Assert.True(result.VelocityY > -2f);
                  Assert.Equal(1f, result.Ai.Ai0);
              }

              [Fact]
              public void Collision_bounce_preserves_source_minimum_horizontal_rebound()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.EaterOfSouls);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.EaterOfSouls) with
                  {
                      CollideX = true,
                      OldVelocityX = -1f,
                      DirectionX = -1,
                      TargetCenterX = 400f
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.EaterOfSouls, in input, in profile, out var result));

                  Assert.Equal(2f, result.VelocityX);
              }

              [Fact]
              public void Collision_bounce_preserves_source_minimum_vertical_rebound()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.Corruptor);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.Corruptor) with
                  {
                      CollideY = true,
                      OldVelocityY = -1f,
                      TargetCenterX = 400f
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.Corruptor, in input, in profile, out var result));

                  Assert.Equal(2f, result.VelocityY);
              }

              [Fact]
              public void Probe_daylight_flight_clamps_lifetime_to_ten_ticks()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.Probe);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.Probe) with
                  {
                      DayTime = true,
                      TimeLeft = 750,
                      TargetCenterX = 400f
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.Probe, in input, in profile, out var result));

                  Assert.Equal(10, result.TimeLeft);
                  Assert.True(result.VelocityY < 0f);
              }

              [Fact]
              public void Blood_squid_uses_its_dedicated_daylight_despawn_window()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.BloodSquid);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.BloodSquid) with
                  {
                      DayTime = true,
                      TimeLeft = 750,
                      TargetCenterX = 400f,
                      TargetCenterY = 0f
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.BloodSquid, in input, in profile, out var result));

                  Assert.Equal(60, result.TimeLeft);
                  Assert.True(result.VelocityY < -0.5f);
              }

              [Fact]
              public void Servant_uses_generic_daylight_escape_and_ten_tick_despawn()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.ServantOfCthulhu);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.ServantOfCthulhu) with
                  {
                      DayTime = true,
                      TimeLeft = 750,
                      TargetCenterX = 400f
                  };

                  Assert.True(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.ServantOfCthulhu, in input, in profile, out var result));

                  Assert.Equal(10, result.TimeLeft);
                  Assert.Equal(-0.06f, result.VelocityY, 5);
              }

              [Fact]
              public void Non_finite_input_fails_closed()
              {
                  VanillaFlyerMotionProfile profile = Profile(VanillaNpcIds.EaterOfSouls);
                  VanillaFlyerAiMotionInput input = Input(VanillaNpcIds.EaterOfSouls) with
                  {
                      NpcCenterX = float.NaN
                  };

                  Assert.False(VanillaFlyerAiMotion.TryStep(VanillaNpcIds.EaterOfSouls, in input, in profile, out _));
              }

              private static VanillaFlyerMotionProfile Profile(NpcTypeId type)
              {
                  Assert.True(VanillaFlyerNpcCatalog.TryGetMotionProfile(type, out VanillaFlyerMotionProfile profile));
                  return profile;
              }

              private static VanillaFlyerAiMotionInput Input(NpcTypeId type) => new(
                  PositionY: 0f,
                  NpcCenterX: 0f,
                  NpcCenterY: 0f,
                  VelocityX: 0f,
                  VelocityY: 0f,
                  TargetCenterX: 0f,
                  TargetCenterY: 0f,
                  TargetTopY: -21f,
                  OldVelocityX: 0f,
                  OldVelocityY: 0f,
                  DirectionX: 1,
                  Ai: default,
                  Scale: 1f,
                  CollideX: false,
                  CollideY: false,
                  Wet: false,
                  DayTime: false,
                  ExpertMode: false,
                  WorldSurfacePixels: double.PositiveInfinity,
                  TimeLeft: 750);
          }
          '''
          Path('tests/TerraRuntime.Tests/VanillaFlyerAiMotionTests.cs').write_text(tests, encoding='utf-8')

          roadmap = Path('docs/roadmap/npc-ai-parity.md')
          r = roadmap.read_text(encoding='utf-8')
          old = '- [ ] AI_005 jitter, close homing, daylight flight, surface hugging and stinger projectiles;'
          new = '- [x] AI_005 source-ordered jitter, close homing, Bee/SmallBee acceleration ramp, daylight flight/despawn, surface Hornet damping, bounce minima and wet-rise movement;\n- [ ] AI_005 projectile/NPC side effects: Hornet/Moss Hornet stingers, Probe laser, Blood Squid blood shot and Good World Eater spawn branch;'
          if old not in r:
              raise SystemExit('AI_005 roadmap marker changed')
          roadmap.write_text(r.replace(old, new), encoding='utf-8')
          PY

      - name: Validate docs
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Restore and build
        run: |
          dotnet restore TerraRuntime.slnx
          dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Run AI_005 parity tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.VanillaFlyerAiMotionTests

      - name: Commit large block to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/TerraRuntime.Core/Npcs/VanillaFlyerAiMotion.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorStrategies.cs \
            tests/TerraRuntime.Tests/VanillaFlyerAiMotionTests.cs \
            docs/roadmap/npc-ai-parity.md
          git diff --cached --check
          git commit -m "Complete source-backed AI_005 flyer movement parity"
          git pull --rebase origin main
          git push origin HEAD:main
