name: Temporary source export

on:
  push:
    branches:
      - worldgen-crash-recovery-20260901

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pack source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/terraruntime-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: terraruntime-source-${{ github.sha }}
          path: ${{ runner.temp }}/terraruntime-source.tar.gz
          retention-days: 1
          if-no-files-found: error
