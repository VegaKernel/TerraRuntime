name: One Shot AI005 Projectile Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-projectile-finalizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Repair section cache fixture against current world API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/TerraRuntime.Tests/SectionCacheRebuildPipelineTests.cs')
          text = path.read_text(encoding='utf-8')
          marker = '    private static WorldFileData LoadCompleteWorld() =>'
          if marker not in text:
              raise SystemExit('stale SectionCacheRebuildPipelineTests helper marker not found')
          start = text.index(marker)
          replacement = '''    private static WorldFileData LoadCompleteWorld()
    {
        byte[] source = (byte[])InvokeWorldLoaderTestHelper("CreateCompleteCurrentWorld")!;
        WorldFileLoadLimits limits = (WorldFileLoadLimits)InvokeWorldLoaderTestHelper("CreateLimits")!;
        Assert.True(WorldFileLoader.TryLoad(source, limits, out WorldFileData? loaded).IsLoaded);
        return Assert.IsType<WorldFileData>(loaded);
    }

    private static WorldFileData CreateMultiSectionWorld()
    {
        WorldFileData source = LoadCompleteWorld();
        WorldDimensions dimensions = new(420, 320);
        var tiles = new WorldTileStore(dimensions);
        WorldFileHeader header = source.Header with
        {
            RightWorld = source.Header.LeftWorld + dimensions.WidthTiles * 16,
            BottomWorld = source.Header.TopWorld + dimensions.HeightTiles * 16,
            Dimensions = dimensions
        };

        return source with
        {
            Header = header,
            Tiles = tiles
        };
    }

    private static object? InvokeWorldLoaderTestHelper(string name)
    {
        MethodInfo method = typeof(WorldFileLoaderTests).GetMethod(
            name,
            BindingFlags.NonPublic | BindingFlags.Static)
            ?? throw new InvalidOperationException($"World loader test helper '{name}' was not found.");
        return method.Invoke(null, null);
    }
}
'''
          path.write_text(text[:start] + replacement, encoding='utf-8')
          PY

      - name: Apply source-backed AI_005 projectile block
        run: python3 tools/ci/apply_ai005_projectile_side_effects.py

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Restore and build full solution
        run: |
          dotnet restore TerraRuntime.slnx
          dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Run section cache pipeline regressions
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.SectionCacheRebuildPipelineTests

      - name: Run AI_005 projectile behavior tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.VanillaFlyerProjectileAttackTests

      - name: Run projectile transaction tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.RuntimeNpcAiProjectileIntentTests

      - name: Run existing flyer motion tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.VanillaFlyerAiMotionTests

      - name: Run full test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit large block to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs \
            src/TerraRuntime.Core/Npcs/RuntimeNpcAiProjectileIntents.cs \
            src/TerraRuntime.Core/Npcs/RuntimeNpcAiStateExecutor.cs \
            src/TerraRuntime.Core/Npcs/VanillaFlyerProjectileAttack.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorStrategies.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcAiCoverageCatalog.cs \
            src/TerraRuntime/VanillaNpcProjectileWorldEnvironment.cs \
            src/TerraRuntime/ServerRuntimeState.cs \
            tests/TerraRuntime.Tests/SectionCacheRebuildPipelineTests.cs \
            tests/TerraRuntime.Tests/VanillaFlyerProjectileAttackTests.cs \
            tests/TerraRuntime.Tests/RuntimeNpcAiProjectileIntentTests.cs \
            docs/roadmap/npc-ai-parity.md \
            docs/en/npc-behavior-families.md \
            docs/ru/npc-behavior-families.md
          git diff --cached --check
          git commit -m "Add transactional AI_005 projectile side effects"
          git pull --rebase origin main
          git push origin HEAD:main

# trigger revision 3
