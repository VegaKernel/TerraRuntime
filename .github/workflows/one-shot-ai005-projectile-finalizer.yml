name: One Shot AI005 Projectile Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-projectile-finalizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed AI_005 projectile block
        run: python3 tools/ci/apply_ai005_projectile_side_effects.py

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Restore and build full solution
        run: |
          dotnet restore TerraRuntime.slnx
          dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Run AI_005 projectile behavior tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.VanillaFlyerProjectileAttackTests

      - name: Run projectile transaction tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.RuntimeNpcAiProjectileIntentTests

      - name: Run existing flyer motion tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.VanillaFlyerAiMotionTests

      - name: Run full test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit large block to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs \
            src/TerraRuntime.Core/Npcs/RuntimeNpcAiProjectileIntents.cs \
            src/TerraRuntime.Core/Npcs/RuntimeNpcAiStateExecutor.cs \
            src/TerraRuntime.Core/Npcs/VanillaFlyerProjectileAttack.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorStrategies.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs \
            src/TerraRuntime.Core/Npcs/VanillaNpcAiCoverageCatalog.cs \
            src/TerraRuntime/VanillaNpcProjectileWorldEnvironment.cs \
            src/TerraRuntime/ServerRuntimeState.cs \
            tests/TerraRuntime.Tests/VanillaFlyerProjectileAttackTests.cs \
            tests/TerraRuntime.Tests/RuntimeNpcAiProjectileIntentTests.cs \
            docs/roadmap/npc-ai-parity.md \
            docs/en/npc-behavior-families.md \
            docs/ru/npc-behavior-families.md
          git diff --cached --check
          git commit -m "Add transactional AI_005 projectile side effects"
          git pull --rebase origin main
          git push origin HEAD:main

