name: Live Join Budget Apply

on:
  push:
    paths:
      - .github/workflows/live-join-budget-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply budget to latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/ci/live_join_relay_probe.py")
          text = path.read_text()
          old = '''# Mirrors PlayerBootstrapFrameBudget.LiveProbeFrameBudget. Keep this below the\n# server connection queue depth so bootstrap growth fails CI before production backpressure.\nBOOTSTRAP_FRAME_BUDGET = 1536\n'''
          new = '''# Mirrors PlayerBootstrapFrameBudget.LiveProbeFrameBudget. The production pre-49 structural\n# maximum is 65 frames; keep a small emergency margin so accidental bootstrap growth fails fast.\nBOOTSTRAP_FRAME_BUDGET = 96\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy live join budget block")
          path.write_text(text.replace(old, new, 1))
          PY

            git rm .github/workflows/live-join-budget-apply.yml
            git add tools/ci/live_join_relay_probe.py
            git commit -m "ci: tighten live join frame budget"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "main kept moving during all retry attempts" >&2
          exit 1
