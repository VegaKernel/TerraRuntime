name: One-shot optimized progression content

on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/apply_optimized_progression_content.py'
      - '.github/workflows/one-shot-optimized-progression-content.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-optimized-progression-content
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile pinned TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Reconcile current documentation headings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ci/apply_optimized_progression_content.py')
          t = p.read_text(encoding='utf-8')
          old = "        marker = '## Progression validation\\n'\n"
          if old not in t:
              raise SystemExit('English documentation marker statement not found')
          t = t.replace(old, "        marker = '## Validation\\n'\n", 1)
          old = "        marker = '## Проверка progression\\n' if '## Проверка progression\\n' in text else '## Progression validation\\n'\n"
          if old not in t:
              raise SystemExit('Russian documentation marker statement not found')
          t = t.replace(old, "        marker = '## Validation\\n'\n", 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Apply optimized progression content
        run: python3 tools/ci/apply_optimized_progression_content.py

      - name: Expand bounded forge-pocket search
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/TerraRuntime.World/Generation/Optimized/OptimizedProgressionContentWorldGenerationProvider.cs')
          t = p.read_text(encoding='utf-8')
          start = t.index('        private static ForgePocketResult PlaceForgeResourcePocket(')
          end = t.index('        private static bool TryFindCompleteThreeByTwoObject(', start)
          replacement = r'''        private static ForgePocketResult PlaceForgeResourcePocket(IWorldGenerationContext context, int obsidianTarget)
          {
              if (!TryFindCompleteThreeByTwoObject(
                      context.Workspace,
                      checked((ushort)VanillaTileIds.Hellforge.Value),
                      out WorldGenerationPoint forge))
              {
                  return default;
              }

              ReadOnlySpan<int> verticalOffsets = [0, -12, 12, -24, 24, -36, 36];
              ReadOnlySpan<int> horizontalOffsets = [14, -14, 26, -26, 38, -38, 50, -50];
              foreach (int verticalOffset in verticalOffsets)
              {
                  foreach (int horizontalOffset in horizontalOffsets)
                  {
                      int centerX = forge.X + horizontalOffset;
                      int centerY = forge.Y + verticalOffset;
                      if (!CanBuildForgePocket(context.Workspace, centerX, centerY))
                          continue;

                      const int radiusX = 8;
                      const int radiusY = 5;
                      for (int dx = -radiusX; dx <= radiusX; dx++)
                      for (int dy = -radiusY; dy <= radiusY; dy++)
                      {
                          if (dx * dx / 64d + dy * dy / 25d <= 1d)
                              SetAir(context.Workspace, centerX + dx, centerY + dy);
                      }

                      int obsidian = 0;
                      int hellstone = 0;
                      for (int row = 0; row < 4 && (obsidian < obsidianTarget || hellstone < 8); row++)
                      {
                          int y = centerY + radiusY + row;
                          for (int x = centerX - radiusX + 1; x <= centerX + radiusX - 1; x++)
                          {
                              if (obsidian < obsidianTarget)
                              {
                                  SetBlock(context.Workspace, x, y, checked((ushort)VanillaTileIds.Obsidian.Value));
                                  obsidian++;
                              }
                              else if (hellstone < 8)
                              {
                                  SetBlock(context.Workspace, x, y, Hellstone);
                                  hellstone++;
                              }
                          }
                      }

                      return new ForgePocketResult(obsidian, hellstone);
                  }
              }

              return default;
          }

          private static bool CanBuildForgePocket(
              IWorldGenerationWorkspace workspace,
              int centerX,
              int centerY)
          {
              const int radiusX = 9;
              const int radiusY = 8;
              if (centerX - radiusX < 2 || centerX + radiusX >= workspace.WidthTiles - 2 ||
                  centerY - radiusY < 2 || centerY + radiusY >= workspace.HeightTiles - 2)
              {
                  return false;
              }

              for (int x = centerX - radiusX; x <= centerX + radiusX; x++)
              for (int y = centerY - radiusY; y <= centerY + radiusY; y++)
              {
                  if (!workspace.TryGetTile(x, y, out WorldGenerationTile tile))
                      return false;
                  if (tile.LiquidAmount > 0 &&
                      tile.LiquidKind is WorldGenerationLiquidKind.Honey or WorldGenerationLiquidKind.Shimmer)
                  {
                      return false;
                  }
                  if ((tile.Flags & WorldGenerationTileFlags.Active) == 0)
                      continue;
                  if (VanillaWorldFrameImportance326.IsFrameImportant(tile.Type))
                      return false;
              }

              return true;
          }

          '''
          t = t[:start] + replacement + t[end:]
          p.write_text(t, encoding='utf-8')

          v = Path('src/TerraRuntime.World/Generation/Optimized/OptimizedProgressionValidationWorldGenerationProvider.cs')
          s = v.read_text(encoding='utf-8')
          if s.count('radius: 28') != 2:
              raise SystemExit(f'expected two forge material access radii, found {s.count("radius: 28")}')
          s = s.replace('radius: 28', 'radius: 56')
          v.write_text(s, encoding='utf-8')
          PY

      - name: Reconcile optimized documentation summary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for lang in ('en', 'ru'):
              p = Path(f'docs/{lang}/optimized-world-generation.md')
              t = p.read_text(encoding='utf-8-sig')
              t = t.replace('- Shadow Orb / Crimson Heart anchors;\n', '')
              p.write_text(t, encoding='utf-8-sig')
          PY

      - name: Validate bilingual documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit progression content and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git rm tools/ci/apply_optimized_progression_content.py \
                 .github/workflows/one-shot-optimized-progression-content.yml \
                 .github/workflows/one-shot-optimized-progression-source-probe.yml
          git add src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs \
                  src/TerraRuntime.World/Generation/Optimized/OptimizedProgressionContentWorldGenerationProvider.cs \
                  src/TerraRuntime.World/Generation/Optimized/OptimizedProgressionValidationWorldGenerationProvider.cs \
                  src/TerraRuntime.World/Generation/Optimized/OptimizedSurfaceDecorationWorldGenerationProvider.cs \
                  tests/TerraRuntime.Tests/OptimizedWorldGenerationProviderTests.cs \
                  docs/roadmap/optimized-worldgen.md \
                  docs/en/optimized-world-generation.md \
                  docs/ru/optimized-world-generation.md
          git commit -m "Guarantee optimized pre-hardmode progression content"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Unable to rebase optimized progression content onto current main." >&2
          exit 1
