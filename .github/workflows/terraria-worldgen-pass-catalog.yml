name: Terraria Worldgen Pass Catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/probe_world_generation_init.py'
      - 'tools/ci/probe_worldgen_terrain_pass.py'
      - 'tools/ci/probe_worldgen_rng.py'
      - 'tools/ci/probe_worldgen_seed.py'
      - 'tools/ci/probe_worldgen_config.py'
      - 'tools/ci/verify_runtime_worldgen_catalog.py'
      - 'tools/ci/verify_runtime_worldgen_rng.py'
      - 'src/TerraRuntime.Core/VanillaUnifiedRandom1458.cs'
      - 'src/TerraRuntime.World/VanillaWorldGenerationPassCatalog1458.cs'
      - 'tests/TerraRuntime.Tests/VanillaUnifiedRandom1458Tests.cs'
      - 'tests/TerraRuntime.Tests/VanillaWorldGenerationPassCatalog1458Tests.cs'
      - '.github/workflows/terraria-worldgen-pass-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-worldgen-pass-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Extract pinned Terraria 1.4.5.8 pass registration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375

          expected="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"

          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.WorldGen "$assembly" > artifacts/source-contract/world-gen.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Main "$assembly" > artifacts/source-contract/main.cs
          .tools/ilspycmd --disable-updatecheck -l c "$assembly" > artifacts/source-contract/classes.txt

          find_type() {
            local simple="$1"
            local line
            line="$(grep -E "(^|[.])${simple}$" artifacts/source-contract/classes.txt | head -n 1 || true)"
            if [[ -z "$line" ]]; then
              echo "Could not locate pinned support type ${simple}." >&2
              return 1
            fi
            echo "${line#* }"
          }

          gen_pass_name_id="$(find_type GenPassNameID)"
          terrain_pass="$(find_type TerrainPass)"
          jungle_pass="$(find_type JunglePass)"
          dither_snake_pass="$(find_type DitherSnakePass)"
          unified_random="$(find_type UnifiedRandom)"
          gen_base="$(find_type GenBase)"
          world_generator="$(find_type WorldGenerator)"
          world_file_data="$(find_type WorldFileData)"
          crc32="$(find_type Crc32)"
          echo "GenPassNameID type: $gen_pass_name_id"
          echo "TerrainPass type: $terrain_pass"
          echo "JunglePass type: $jungle_pass"
          echo "DitherSnakePass type: $dither_snake_pass"
          echo "UnifiedRandom type: $unified_random"
          echo "GenBase type: $gen_base"
          echo "WorldGenerator type: $world_generator"
          echo "WorldFileData type: $world_file_data"
          echo "Crc32 type: $crc32"

          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$gen_pass_name_id" "$assembly" > artifacts/source-contract/gen-pass-name-id.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$terrain_pass" "$assembly" > artifacts/source-contract/terrain-pass.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$jungle_pass" "$assembly" > artifacts/source-contract/jungle-pass.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$dither_snake_pass" "$assembly" > artifacts/source-contract/dither-snake-pass.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$unified_random" "$assembly" > artifacts/source-contract/unified-random.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$gen_base" "$assembly" > artifacts/source-contract/gen-base.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$world_generator" "$assembly" > artifacts/source-contract/world-generator.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$world_file_data" "$assembly" > artifacts/source-contract/world-file-data.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$crc32" "$assembly" > artifacts/source-contract/crc32.cs

          resource_probe=.tools/resource-probe
          mkdir -p "$resource_probe"
          cat > "$resource_probe/resource-probe.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$resource_probe/Program.cs" <<'EOF'
          using System.Buffers.Binary;
          using System.Reflection.Metadata;
          using System.Reflection.PortableExecutable;

          if (args.Length != 3)
              return 2;

          using FileStream assemblyStream = File.OpenRead(Path.GetFullPath(args[0]));
          using var peReader = new PEReader(assemblyStream);
          if (!peReader.HasMetadata || peReader.PEHeaders.CorHeader is null)
          {
              Console.Error.WriteLine("Pinned server executable has no managed metadata/CLR header.");
              return 3;
          }

          MetadataReader metadata = peReader.GetMetadataReader();
          ManifestResource resource = default;
          bool found = false;
          foreach (ManifestResourceHandle handle in metadata.ManifestResources)
          {
              ManifestResource candidate = metadata.GetManifestResource(handle);
              if (!string.Equals(metadata.GetString(candidate.Name), args[1], StringComparison.Ordinal))
                  continue;
              if (!candidate.Implementation.IsNil)
              {
                  Console.Error.WriteLine($"Resource is linked rather than embedded: {args[1]}");
                  return 4;
              }
              resource = candidate;
              found = true;
              break;
          }

          if (!found)
          {
              Console.Error.WriteLine($"Embedded resource not found: {args[1]}");
              foreach (ManifestResourceHandle handle in metadata.ManifestResources)
                  Console.Error.WriteLine(metadata.GetString(metadata.GetManifestResource(handle).Name));
              return 5;
          }

          int resourcesRva = peReader.PEHeaders.CorHeader.ResourcesDirectory.RelativeVirtualAddress;
          int resourceRva = checked(resourcesRva + checked((int)resource.Offset));
          PEMemoryBlock block = peReader.GetSectionData(resourceRva);
          byte[] lengthBytes = block.GetContent(0, sizeof(int)).ToArray();
          int length = BinaryPrimitives.ReadInt32LittleEndian(lengthBytes);
          if (length < 0)
          {
              Console.Error.WriteLine($"Embedded resource has invalid length: {length}");
              return 6;
          }
          byte[] payload = block.GetContent(sizeof(int), length).ToArray();
          File.WriteAllBytes(args[2], payload);
          Console.WriteLine($"extracted_resource={args[1]}");
          Console.WriteLine($"extracted_bytes={payload.Length}");
          return 0;
          EOF
          dotnet run --project "$resource_probe/resource-probe.csproj" -c Release -- \
            "$assembly" \
            Terraria.GameContent.WorldBuilding.Configuration.json \
            "$GITHUB_WORKSPACE/artifacts/source-contract/worldgen-configuration.json"

          python3 tools/ci/probe_world_generation_init.py \
            --world-gen artifacts/source-contract/world-gen.cs \
            --main artifacts/source-contract/main.cs \
            --gen-pass-name-id artifacts/source-contract/gen-pass-name-id.cs \
            --terrain-pass artifacts/source-contract/terrain-pass.cs \
            --jungle-pass artifacts/source-contract/jungle-pass.cs \
            --dither-snake-pass artifacts/source-contract/dither-snake-pass.cs \
            --pass-catalog-output artifacts/source-contract/world-generation-pass-catalog.txt \
            --jungle-contract-output artifacts/source-contract/jungle-pass-contract.txt

          python3 tools/ci/probe_worldgen_terrain_pass.py \
            --terrain-pass artifacts/source-contract/terrain-pass.cs \
            --output artifacts/source-contract/terrain-pass-contract.txt

          python3 tools/ci/probe_worldgen_rng.py \
            --unified-random artifacts/source-contract/unified-random.cs \
            --gen-base artifacts/source-contract/gen-base.cs \
            --world-generator artifacts/source-contract/world-generator.cs \
            --world-gen artifacts/source-contract/world-gen.cs \
            --output artifacts/source-contract/worldgen-rng-contract.txt

          python3 tools/ci/probe_worldgen_seed.py \
            --world-file-data artifacts/source-contract/world-file-data.cs \
            --crc32 artifacts/source-contract/crc32.cs \
            --output artifacts/source-contract/worldgen-seed-contract.txt

          python3 tools/ci/probe_worldgen_config.py \
            --configuration artifacts/source-contract/worldgen-configuration.json \
            --output artifacts/source-contract/worldgen-config-contract.txt

      - name: Verify runtime catalog against pinned fingerprint
        run: >-
          python3 tools/ci/verify_runtime_worldgen_catalog.py
          --runtime-catalog src/TerraRuntime.World/VanillaWorldGenerationPassCatalog1458.cs
          --source-evidence artifacts/source-contract/world-generation-pass-catalog.txt

      - name: Verify runtime RNG against pinned fingerprints
        run: >-
          python3 tools/ci/verify_runtime_worldgen_rng.py
          --runtime-rng src/TerraRuntime.Core/VanillaUnifiedRandom1458.cs
          --source-evidence artifacts/source-contract/worldgen-rng-contract.txt

      - name: Build pinned RNG implementation
        run: dotnet build src/TerraRuntime.Core/TerraRuntime.Core.csproj -c Release

      - name: Upload pass registration evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraria-worldgen-pass-catalog-${{ github.sha }}
          path: |
            artifacts/source-contract/world-generation-pass-catalog.txt
            artifacts/source-contract/terrain-pass-contract.txt
            artifacts/source-contract/jungle-pass-contract.txt
            artifacts/source-contract/worldgen-rng-contract.txt
            artifacts/source-contract/worldgen-seed-contract.txt
            artifacts/source-contract/worldgen-config-contract.txt
          if-no-files-found: error
          retention-days: 7
