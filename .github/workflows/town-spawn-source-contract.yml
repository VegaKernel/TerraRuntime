name: Town Spawn Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Core/Npcs/VanillaTownNpcSpawnEligibility1458.cs'
      - 'src/TerraRuntime.World/WorldFileRuntimeMetadata.cs'
      - 'src/TerraRuntime.World/WorldFileRuntimeMetadataParser.cs'
      - 'src/TerraRuntime.World/RuntimeWorldPreparedStateCodec.cs'
      - 'tests/TerraRuntime.Tests/VanillaTownNpcSpawnEligibility1458Tests.cs'
      - 'tools/ci/check_town_spawn_source.py'
      - '.github/workflows/town-spawn-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-town-spawn-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Download pinned TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
      - name: Install pinned ILSpy command line
        run: dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
      - name: Verify town spawn source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          refs="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.Main "$assembly" > artifacts/source-contract/Main.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.NPC "$assembly" > artifacts/source-contract/NPC.cs
          python3 tools/ci/check_town_spawn_source.py \
            --main artifacts/source-contract/Main.cs \
            --npc artifacts/source-contract/NPC.cs
