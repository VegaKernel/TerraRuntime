name: Apply Eater of Worlds Death Loot

on:
  push:
    branches: [work/eater-of-worlds-death-loot-progression]
    paths:
      - .github/workflows/apply-eater-death-loot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: work/eater-of-worlds-death-loot-progression
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Fix staging test slot type
        run: sed -i 's/private static NpcStateUpdate Eater(ushort slot/private static NpcStateUpdate Eater(byte slot/' tools/ci/apply_eater_death_loot.py

      - name: Apply production block
        run: python3 tools/ci/apply_eater_death_loot.py

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Remove staging helpers
        run: git rm -f tools/ci/apply_eater_death_loot.py .github/workflows/apply-eater-death-loot.yml

      - name: Commit coherent block
        run: |
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add -A
          git commit -m "Complete Eater of Worlds death loot progression"
          git push origin HEAD:work/eater-of-worlds-death-loot-progression
