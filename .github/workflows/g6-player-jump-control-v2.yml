name: Validate G6 player jump control v2

on:
  push:
    branches:
      - gameplay/g6-player-jump-control-v2
    paths:
      - .github/workflows/g6-player-jump-control-v2.yml
      - tools/ci/apply_g6_player_jump_control.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: gameplay/g6-player-jump-control-v2

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply jump slice and validate against moving main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git merge --no-edit origin/main
          python3 tools/ci/apply_g6_player_jump_control.py
          git diff --check

          for attempt in 1 2 3 4; do
            baseline="$(git rev-parse origin/main)"
            echo "validation attempt ${attempt} against ${baseline}"

            set +e
            dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release
            test_status=$?
            set -e

            git fetch origin main
            latest="$(git rev-parse origin/main)"

            if [ "$test_status" -eq 0 ] && [ "$latest" = "$baseline" ]; then
              break
            fi

            if [ "$latest" != "$baseline" ]; then
              echo "main moved to ${latest}; merging and retrying"
              git merge --no-edit origin/main
              git diff --check
              continue
            fi

            exit "$test_status"
          done

          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi

          if [ "$(git rev-parse origin/main)" != "$baseline" ]; then
            echo "main kept moving through all validation attempts"
            exit 1
          fi

      - name: Finalize validated branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/g6-player-jump-control-v2.yml tools/ci/apply_g6_player_jump_control.py
          git add src tests docs
          git commit -m "gameplay: add runtime-owned player jump control"
          git push origin HEAD:gameplay/g6-player-jump-control-v2
