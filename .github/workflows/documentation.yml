name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: terra-runtime-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve documentation diff base
        id: docs-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bilingual documentation
        run: python3 tools/ci/check_documentation.py --changed-base "${{ steps.docs-base.outputs.sha }}"

  migrate-root-roadmap-style:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace exact legacy roadmap blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/roadmap.md')
          text = path.read_text()

          replacements = [
              (
                  '''```text
TCP clients
    |
    v
Connection read loops
    |
    v
Frame decoder / protocol validation
    |
    v
Typed inbound commands
    |
    v
Authoritative game loop (single writer)
    |
    +--> World / Players / NPCs / Projectiles / Items
    |       |
    |       +--> deterministic gameplay systems
    |
    +--> outbound state/events
            |
            v
      per-client sync planner
            |
            v
      encoded packet queues
            |
            v
        socket writers
```''',
                  '''```mermaid
flowchart TD
    TCP["TCP clients"] --> Read["Connection read loops"]
    Read --> Frame["Frame decoder / protocol validation"]
    Frame --> Commands["Typed inbound commands"]
    Commands --> Loop["Authoritative game loop<br/>single writer"]
    Loop --> State["World / Players / NPCs / Projectiles / Items"]
    State --> Gameplay["Deterministic gameplay systems"]
    Loop --> Events["Outbound state / events"]
    Events --> Sync["Per-client sync planner"]
    Sync --> Queues["Encoded packet queues"]
    Queues --> Writers["Socket writers"]
```'''
              ),
              (
                  '''```text
world.runtime.tmp
      -> complete write
      -> flush/checksums
      -> atomic replace
      -> world.runtime
```''',
                  '''```mermaid
flowchart LR
    Temp["world.runtime.tmp"] --> Write["Complete write"]
    Write --> Flush["Flush + integrity checks"]
    Flush --> Replace["Atomic replace"]
    Replace --> Cache["world.runtime-world"]
```'''
              ),
              (
                  '''```text
Game runtime
    |
immutable operations snapshots + safe commands
    |-------------------|-------------------|
Terminal.Gui          plain console       future web/API
```''',
                  '''```mermaid
flowchart TD
    Runtime["Game runtime"] --> Ops["Immutable operations snapshots + safe commands"]
    Ops --> TUI["Terminal.Gui"]
    Ops --> Console["Plain console"]
    Ops --> Future["Future web / API"]
```'''
              ),
              (
                  '''```text
Official Terraria client
        |
        v
TerraRuntime (.NET 11 NativeAOT)
        |
        +-- Multiplicity-backed typed handshake
        +-- player slot assignment
        +-- world metadata
        +-- section request/response
        +-- spawn
        +-- movement relay
        +-- clean disconnect
```''',
                  '''```mermaid
flowchart TD
    Client["Official Terraria client"] --> Runtime["TerraRuntime<br/>.NET 11 NativeAOT"]
    Runtime --> Handshake["Multiplicity-backed typed handshake"]
    Runtime --> Slot["Player slot assignment"]
    Runtime --> World["World metadata"]
    Runtime --> Sections["Section request / response"]
    Runtime --> Spawn["Spawn"]
    Runtime --> Movement["Movement relay"]
    Runtime --> Disconnect["Clean disconnect"]
```'''
              ),
              (
                  '- [ ] Expand dedicated bilingual subsystem guides for protocol/networking, world persistence/cache, gameplay, synchronization, operations/TUI, worldgen and security as those areas mature.\n- [ ] Add documentation-link validation to CI once the bilingual tree stabilizes.\n- [ ] Add a lightweight mirror/parity check for required RU/EN pages without requiring line-by-line translation equivalence.',
                  '- [x] Expand dedicated bilingual subsystem guides for protocol/networking, world persistence/cache, gameplay, synchronization, operations/TUI, worldgen and security.\n- [x] Validate repository-local documentation links in CI.\n- [x] Validate required RU/EN mirrored page sets in CI without requiring line-by-line translation equivalence.'
              ),
          ]

          changed = False
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
                  changed = True
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f'unexpected roadmap block count {count}: {old[:80]!r}')

          if changed:
              path.write_text(text)
          PY

      - name: Commit migration when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/roadmap.md; then
            echo 'root roadmap already migrated'
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap.md
          git commit -m 'docs: migrate root roadmap diagrams to Mermaid'

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done

          echo 'failed to fast-forward root roadmap migration' >&2
          exit 1
