name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: terra-runtime-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test documentation checker
        run: python3 tools/ci/test_check_documentation.py

      - name: Resolve documentation diff base
        id: docs-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bilingual documentation
        run: python3 tools/ci/check_documentation.py --changed-base "${{ steps.docs-base.outputs.sha }}"

  publish-deployment-documentation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply, validate and fast-forward deployment documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in $(seq 1 24); do
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f tools/ci/apply_deployment_documentation.py ]; then
              echo 'deployment documentation migration already finalized'
              exit 0
            fi

            python3 tools/ci/apply_deployment_documentation.py
            python3 tools/ci/test_check_documentation.py
            python3 tools/ci/check_documentation.py

            if git diff --quiet && git diff --cached --quiet; then
              echo 'deployment documentation already current'
              exit 0
            fi

            git add -A
            git commit -m 'docs: add bilingual deployment and configuration guide'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced during attempt ${attempt}; rebuilding on the newest head"
            sleep 1
          done

          echo 'failed to publish deployment documentation without force push' >&2
          exit 1
