name: One-shot grass seed validation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pyramid-candidate-parity-retry.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-shaped grass target guard
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs"); s=p.read_text(); old="""    private static void TryGrass(RuntimeGrid grid, int x, int y)\n    {\n        if (IsActiveType(grid.At(x - 1, y), Dirt) && IsActiveType(grid.At(x + 1, y), Dirt) &&\n            IsActiveType(grid.At(x, y - 1), Dirt) && IsActiveType(grid.At(x, y + 1), Dirt))\n            SetType(ref grid.At(x, y), Grass, true);\n    }\n"""; new="""    private static void TryGrass(RuntimeGrid grid, int x, int y)\n    {\n        ref WorldTile target = ref grid.At(x, y);\n        if (!IsActiveType(target, Dirt))\n            return;\n\n        bool exposed = false;\n        for (int tx = x - 1; tx <= x + 1 && !exposed; tx++)\n        for (int ty = y - 1; ty <= y + 1; ty++)\n        {\n            ref WorldTile neighbor = ref grid.At(tx, ty);\n            if (!neighbor.IsActive)\n            {\n                exposed = true;\n                break;\n            }\n        }\n\n        if (exposed)\n            SetType(ref target, Grass, true);\n    }\n"""; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          git diff --check

      - name: Build full test project
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Reproduce canonical small seed 42
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- \
            --worldgen-create-smoke artifacts/small-seed-42.wld terraruntime:vanilla 4200 1200 42
          dotnet run --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj -c Release -- \
            artifacts/small-seed-42.wld

      - name: Commit grass fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git add src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs
          git commit -m 'Require dirt targets for vanilla grass spread'
          git pull --rebase origin main
          git push origin HEAD:main
