name: One-shot pyramid candidate parity retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pyramid-candidate-parity-retry.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply clean-room pyramid candidate parity patch
        shell: bash
        run: |
          set -euo pipefail
          patch_b64="$(sed -n 's/^          PATCH_B64: //p' .github/workflows/one-shot-pyramid-candidate-parity.yml)"
          test -n "$patch_b64"
          printf '%s' "$patch_b64" | base64 -d > /tmp/pyramid-parity-patch.py
          python /tmp/pyramid-parity-patch.py
          git diff --check

      - name: Build full test project
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Smoke canonical small seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for seed in 42 1458; do
            world="artifacts/pyramid-parity-small-${seed}.wld"
            dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- \
              --worldgen-create-smoke "$world" terraruntime:vanilla 4200 1200 "$seed"
            dotnet run --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj -c Release -- "$world"
          done

      - name: Commit pyramid parity patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git add \
            src/TerraRuntime.World/RuntimeWorldGenerationWorkspace.cs \
            src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs \
            src/TerraRuntime.World/VanillaDungeonWorldGenerationPipeline1458.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationPipeline1458Tests.cs \
            tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests.cs
          git commit -m 'Preserve vanilla pyramid candidates across passes'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch canonical-size acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/vanilla-worldgen-canonical-sizes.yml/dispatches \
            -f ref=main
