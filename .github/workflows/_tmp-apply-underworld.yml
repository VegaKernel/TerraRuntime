name: Temporary apply optimized underworld settlements

on:
  push:
    branches:
      - worldgen-underworld-apply-20260901

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated Underworld patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/underworld.patch.gz.b64 | gzip -d > /tmp/underworld.patch
          git apply --check /tmp/underworld.patch
          git apply /tmp/underworld.patch
          rm -f .github/underworld.patch.gz.b64 .github/workflows/_tmp-apply-underworld.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete source-backed optimized Underworld settlements'
          git push origin HEAD:worldgen-underworld-apply-20260901
