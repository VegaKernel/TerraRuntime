name: Apply Startup Save Cleanup V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-startup-save-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Normalize startup cleanup block
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/TerraRuntime/TerrariaServerHost.cs')
          text = path.read_text(encoding='utf-8')
          ugly = '''        if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(options.WorldPath))
    Console.Error.WriteLine($"Failed to clean abandoned save transactions for canonical world: {options.WorldPath}.");

string checkpointBackupPath = RuntimeWorldCheckpointRecovery.GetBackupPath(options.WorldPath);
if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(checkpointBackupPath))
    Console.Error.WriteLine($"Failed to clean abandoned save transactions for checkpoint backup: {checkpointBackupPath}.");

'''
          clean = '''        if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(options.WorldPath))
            Console.Error.WriteLine($"Failed to clean abandoned save transactions for canonical world: {options.WorldPath}.");

        string checkpointBackupPath = RuntimeWorldCheckpointRecovery.GetBackupPath(options.WorldPath);
        if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(checkpointBackupPath))
            Console.Error.WriteLine($"Failed to clean abandoned save transactions for checkpoint backup: {checkpointBackupPath}.");

'''
          if ugly in text:
              text = text.replace(ugly, clean, 1)
              path.write_text(text, encoding='utf-8')
          elif clean not in text:
              raise SystemExit('startup cleanup block changed unexpectedly')
          PY

      - name: Build persistence tests
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Prove cleanup helper only
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.AtomicSaveFileWriterCleanupTests

      - name: Prove host startup cleanup only
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.TerrariaServerHostStartupCleanupTests

      - name: Commit normalized host
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/TerraRuntime/TerrariaServerHost.cs
          if git diff --cached --quiet; then
            echo 'startup cleanup block already normalized'
            exit 0
          fi
          git commit -m 'style: normalize startup save cleanup'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
