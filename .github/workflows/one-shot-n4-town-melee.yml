name: One-shot N4 Town NPC melee integration

on:
  push:
    branches: [work/n4-town-melee-1458]
    paths:
      - 'tools/ci/apply_n4_town_melee.py'
      - 'tests/TerraRuntime.Tests/RuntimeTownNpcMelee1458Tests.cs'
      - '.github/workflows/one-shot-n4-town-melee.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/n4-town-melee-1458
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply Town NPC melee block
        run: python3 tools/ci/apply_n4_town_melee.py
      - name: Decompile pinned TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Verify expanded Town combat source contract
        run: |
          python3 tools/ci/check_town_combat_source.py \
            --npc decompiled/1458/Terraria/NPC.cs \
            --npcid decompiled/1458/Terraria.ID/NPCID.cs \
            --difficulty decompiled/1458/Terraria.DataStructures/GameDifficultyData.cs
      - name: Build Release
        run: dotnet build TerraRuntime.slnx -c Release
      - name: Run complete tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build
      - name: Commit integrated block and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm tools/ci/apply_n4_town_melee.py
          rm .github/workflows/one-shot-n4-town-melee.yml
          rm -rf decompiled/1458
          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git add -A
          git commit -m "Complete source-backed Town NPC melee combat"
          git push origin HEAD:work/n4-town-melee-1458
