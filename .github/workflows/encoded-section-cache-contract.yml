name: Encoded Section Cache Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/PlayerBootstrapPacketSet.cs'
      - 'src/TerraRuntime/PlayerBootstrapPacketSet.SectionCache*.cs'
      - 'src/TerraRuntime/PlayerBootstrapPacketSet.SectionStreaming.cs'
      - 'src/TerraRuntime/PlayerSectionStreamingState.cs'
      - 'src/TerraRuntime/SectionCacheRebuildPipeline.cs'
      - 'src/TerraRuntime.World/WorldTileStore.cs'
      - 'tests/TerraRuntime.Tests/EncodedSectionCacheContractTests.cs'
      - 'tests/TerraRuntime.Tests/SectionCacheMemoryBudgetTests.cs'
      - 'tests/TerraRuntime.Tests/PlayerSectionStreamingStateTests.cs'
      - 'tests/TerraRuntime.Tests/SectionCachePriorityTelemetryTests.cs'
      - 'docs/en/encoded-section-cache.md'
      - 'docs/ru/encoded-section-cache.md'
      - '.github/workflows/encoded-section-cache-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj

      - name: Build
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-restore

      - name: Revision, dirty-tracking, delivery and telemetry contract
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.EncodedSectionCacheContractTests

      - name: Memory budget and deterministic LRU
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.SectionCacheMemoryBudgetTests

      - name: Per-player delivery state
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.PlayerSectionStreamingStateTests

      - name: Priority telemetry projection
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- -class TerraRuntime.Tests.SectionCachePriorityTelemetryTests
