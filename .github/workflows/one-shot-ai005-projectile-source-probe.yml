name: One Shot AI005 Projectile Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-projectile-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Extract Main.MaxWorldViewSize initialization
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find decompiled/1458 -path '*/Terraria/Main.cs' -print -quit)"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          for i,line in enumerate(text.splitlines(),1):
              if 'MaxWorldViewSize' in line:
                  print(f'{i:06d}: {line}')
          PY
