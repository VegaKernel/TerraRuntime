name: One Shot AI005 Projectile Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-projectile-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Extract exact AI_005 predicates and projectile damage
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find decompiled/1458 -path '*/Terraria/NPC.cs' -print -quit)"
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          start = text.find('void AI_005_')
          if start < 0:
              start = text.find('AI_005_')
          if start < 0:
              raise SystemExit('AI_005 method not found')
          end = text.find('\n\tprivate void AI_006_', start)
          block = text[start:end if end >= 0 else start + 70000]
          lines = block.splitlines()
          print('===== AI005 PREFIX =====')
          for i,line in enumerate(lines[:150], 1):
              print(f'{i:04d}: {line}')
          print('===== ATTACK DAMAGE METHOD =====')
          needle = 'GetAttackDamage_ForProjectiles'
          pos = text.find(needle)
          while pos >= 0:
              line_start = text.rfind('\n', 0, pos)
              context_start = max(0, text.rfind('\n', 0, max(0, line_start-600)))
              context_end = min(len(text), text.find('\n\t}', pos) + 4)
              chunk = text[context_start:context_end]
              if 'GetAttackDamage_ForProjectiles(' in chunk and ('public int' in chunk or 'private int' in chunk or 'float normalDamage' in chunk):
                  print(chunk)
              pos = text.find(needle, pos + len(needle))
          PY
