name: One Shot AI005 Projectile Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-projectile-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Extract AI_005 guards and exact side-effect branches
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find decompiled/1458 -path '*/Terraria/NPC.cs' -print -quit)"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          start=text.find('void AI_005_')
          end=text.find('\n\tprivate void AI_006_',start)
          lines=text[start:end].splitlines()
          print('===== AI005 FLAG/GUARD LINES =====')
          for i,line in enumerate(lines,1):
              stripped=line.strip()
              if ('flag' in stripped or 'targetData' in stripped or 'localAI[0]' in stripped) and not stripped.startswith('//'):
                  print(f'{i:04d}: {line}')
          print('===== PROBE =====')
          for center in [i for i,l in enumerate(lines) if 'type == 139' in l and i>300]:
              for j in range(max(0,center-10),min(len(lines),center+45)): print(f'{j+1:04d}: {lines[j]}')
          print('===== BLOOD SQUID =====')
          for center in [i for i,l in enumerate(lines) if 'type == 619 &&' in l]:
              for j in range(max(0,center-8),min(len(lines),center+45)): print(f'{j+1:04d}: {lines[j]}')
          PY
