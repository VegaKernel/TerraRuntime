name: Player Movement Authority

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/RuntimePlayerMovementAuthority.cs'
      - 'src/TerraRuntime/RuntimePlayerMovementIngress.cs'
      - 'src/TerraRuntime.Core/Players/PlayerMovementCommitRequest.cs'
      - 'src/TerraRuntime.Core/Players/VanillaPlayerMovementNormalizer.cs'
      - 'src/TerraRuntime.Contracts/Runtime/PlayerHandle.cs'
      - 'tests/TerraRuntime.Tests/RuntimePlayerMovementIngressTests.cs'
      - 'tests/TerraRuntime.Tests/RuntimePlayerMovementAuthorityTests.cs'
      - 'docs/en/server-authoritative-movement.md'
      - 'docs/ru/server-authoritative-movement.md'
      - '.github/workflows/player-movement-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-player-movement-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Build tests
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Run movement authority contract
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~RuntimePlayerMovementIngressTests|FullyQualifiedName~RuntimePlayerMovementAuthorityTests' \
            --logger 'console;verbosity=normal' | tee movement-authority.log
          grep -q 'Passed!' movement-authority.log
          grep -q 'Failed:     0' movement-authority.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-movement-authority
          path: movement-authority.log
          if-no-files-found: warn
