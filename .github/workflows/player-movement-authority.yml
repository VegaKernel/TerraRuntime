name: Player Movement Authority

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Application/RuntimePlayerMovementAuthority.cs'
      - 'src/TerraRuntime.Application/RuntimePlayerMovementIngress.cs'
      - 'src/TerraRuntime.Contracts/Runtime/PlayerCommitContracts.cs'
      - 'src/TerraRuntime.Gameplay/Players/VanillaPlayerMovementNormalizer.cs'
      - 'src/TerraRuntime.Contracts/Runtime/PlayerHandle.cs'
      - 'tests/TerraRuntime.Tests/RuntimePlayerMovementIngressTests.cs'
      - 'tests/TerraRuntime.Tests/RuntimePlayerMovementAuthorityTests.cs'
      - 'docs/en/server-authoritative-movement.md'
      - 'docs/ru/server-authoritative-movement.md'
      - '.github/workflows/player-movement-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-player-movement-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Build tests
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Run movement authority contract
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj \
            -c Release --no-build \
            -- -noLogo -method "*RuntimePlayerMovementIngressTests*" -method "*RuntimePlayerMovementAuthorityTests*" \
            | tee movement-authority.log
          grep -Eq 'Total: [1-9][0-9]*, Errors: 0, Failed: 0' movement-authority.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-movement-authority
          path: movement-authority.log
          if-no-files-found: warn
