name: Network Stop Reason Verify

on:
  push:
    paths:
      - .github/workflows/network-stop-reason-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Targeted network stop tests
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~ProductionHandshakeStopReasonTests|FullyQualifiedName~TerrariaConnectionPolicyRejectionTests|FullyQualifiedName~TerrariaFrameRejectionTelemetryTests|FullyQualifiedName~PlayerVitalsFrameSinkTests"
