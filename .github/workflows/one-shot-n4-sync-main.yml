name: One-shot N4 sync with main

on:
  push:
    branches: [work/n4-rescue-catchability-1458]
    paths:
      - '.github/workflows/one-shot-n4-sync-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-n4-sync-main
  cancel-in-progress: false

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'merge conflicts: %s\n' "${conflicts[*]}"
            if [[ ${#conflicts[@]} -eq 1 && "${conflicts[0]}" == "src/TerraRuntime.Contracts/Runtime/NpcSnapshot.cs" ]]; then
              # Feature side is the intentional union: current-main DamageOverride plus N4 SpawnedFromStatue.
              git checkout --ours -- src/TerraRuntime.Contracts/Runtime/NpcSnapshot.cs
              git add src/TerraRuntime.Contracts/Runtime/NpcSnapshot.cs
              test -z "$(git diff --name-only --diff-filter=U)"
            else
              echo 'MERGE_CONFLICTS_BEGIN'
              git status --short
              printf '%s\n' "${conflicts[@]}"
              echo 'MERGE_CONFLICTS_END'
              exit 1
            fi
          fi

      - name: Build Release
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit merged main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-n4-sync-main.yml
          git add -A
          git commit -m "Sync N4 rescue and catchability with current main"
          git push origin HEAD:work/n4-rescue-catchability-1458
