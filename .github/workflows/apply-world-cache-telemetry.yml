name: Apply World Cache Telemetry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-world-cache-telemetry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Patch cache telemetry surface
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def ensure(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one old form or existing new form: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          ensure(
              'src/TerraRuntime/TerrariaServerHost.cs',
              '''                            InitialCacheResult: cacheDiagnostic.Result.ToString(),\n                            CacheParallelReads: RuntimeWorldCacheReadOptions.Default.MaxParallelReads,''',
              '''                            InitialCacheResult: cacheDiagnostic.Result.ToString(),\n                            CacheParallelReads: RuntimeWorldCacheReadOptions.Default.MaxParallelReads,\n                            InitialCacheDetailCode: cacheDiagnostic.DetailCode,''')

          ensure(
              'src/TerraRuntime/TerminalUI/DashboardWorkspaceWindow.cs',
              '''        rows[6].Text = $"Cache       {(snapshot.RuntimeCacheHit ? "hit" : "miss")}  initial {snapshot.InitialCacheResult}  readers {snapshot.CacheParallelReads}";\n        rows[7].Text = $"Load        file {snapshot.FileReadMilliseconds:F2} ms  cache {snapshot.CacheLoadMilliseconds:F2} ms  canonical {snapshot.CanonicalWorldLoadMilliseconds:F2} ms";''',
              '''        rows[6].Text = $"Cache       {(snapshot.RuntimeCacheHit ? "hit" : "miss")}  reason {snapshot.InitialCacheResult}/{snapshot.InitialCacheDetailCode}  readers {snapshot.CacheParallelReads}";\n        rows[7].Text = $"Load        file {snapshot.FileReadMilliseconds:F2} ms  cache {snapshot.CacheLoadMilliseconds:F2} ms  canonical {snapshot.CanonicalWorldLoadMilliseconds:F2} ms  build {snapshot.CacheWriteMilliseconds:F2} ms";''')

          ensure(
              'docs/roadmap.md',
              '- [ ] World-cache hit/miss/invalidation reason and load/build times.',
              '- [x] World-cache hit/miss/invalidation reason and load/build times.')

          ensure(
              'docs/en/world-persistence.md',
              'Fallback reads and validates the canonical `.wld`, constructs authoritative runtime state, and only then may rebuild the derived snapshot. A partially reconstructed runtime snapshot is never published as the world.',
              'Fallback reads and validates the canonical `.wld`, constructs authoritative runtime state, and only then may rebuild the derived snapshot. A partially reconstructed runtime snapshot is never published as the world. The immutable world-operations/TUI snapshot retains the exact `RuntimeWorldSnapshotLoadResult` plus its `DetailCode`, cache hit/miss state, and separate file-read, cache-load, canonical-load and cache-build durations so a stale or invalid cache remains diagnosable after startup.')
          ensure(
              'docs/ru/world-persistence.md',
              'Fallback читает/валидирует canonical `.wld`, строит authoritative runtime state и только после этого может rebuild derived snapshot. Partially reconstructed snapshot никогда не публикуется как world.',
              'Fallback читает/валидирует canonical `.wld`, строит authoritative runtime state и только после этого может rebuild derived snapshot. Partially reconstructed snapshot никогда не публикуется как world. Immutable world-operations/TUI snapshot сохраняет точный `RuntimeWorldSnapshotLoadResult` вместе с `DetailCode`, cache hit/miss state и отдельными временами file read, cache load, canonical load и cache build, поэтому причина stale/invalid cache остаётся диагностируемой после startup.')
          PY
          git diff --check

      - name: Build test assembly
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Prove cache operations telemetry
        run: >-
          dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --
          -class "TerraRuntime.Tests.RuntimeWorldCacheOperationsTelemetryTests"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/TerraRuntime/TerrariaServerHost.cs src/TerraRuntime/TerminalUI/DashboardWorkspaceWindow.cs docs/roadmap.md docs/en/world-persistence.md docs/ru/world-persistence.md
          if git diff --cached --quiet; then
            echo 'world cache telemetry surface already synchronized'
            exit 0
          fi
          git commit -m 'observability: surface world cache diagnostics'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
