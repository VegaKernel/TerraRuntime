name: Authoritative World Save

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/RuntimeWorldTileChestSaveService.cs'
      - 'src/TerraRuntime/RuntimeWorldTileChestSaveSnapshotSource.cs'
      - 'src/TerraRuntime/RuntimeWorldCheckpointRecovery.cs'
      - 'src/TerraRuntime/TerrariaServerHost.cs'
      - 'src/TerraRuntime.World/RuntimeWorldSnapshotPreservedSections.cs'
      - 'src/TerraRuntime.World/WorldFilePreservedSections.cs'
      - 'src/TerraRuntime.World/WorldFileTileChestRewriter.cs'
      - 'src/TerraRuntime.World/WorldFileTileEncoder.cs'
      - 'src/TerraRuntime.World/WorldFileChestEncoder.cs'
      - 'src/TerraRuntime.World/WorldFileAtomicPublisher.cs'
      - 'src/TerraRuntime.Core/WorldSaveCoordinator.cs'
      - 'src/TerraRuntime.Core/AtomicSaveFileWriter.cs'
      - 'src/TerraRuntime.Core/AtomicSaveFileWriterOptions.cs'
      - 'tests/TerraRuntime.Tests/AtomicSaveFileWriterTests.cs'
      - 'tests/TerraRuntime.Tests/WorldFileAtomicPublisherTests.cs'
      - 'tests/TerraRuntime.Tests/RuntimeWorldSnapshotPreservedSectionsTests.cs'
      - 'tests/TerraRuntime.Tests/RuntimeWorldTileChestSaveServiceTests.cs'
      - 'tests/TerraRuntime.Tests/RuntimeWorldCheckpointRecoveryTests.cs'
      - 'tools/TerraRuntime.AtomicSaveCrashProbe/**'
      - '.github/workflows/authoritative-world-save.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-authoritative-world-save-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Build isolated atomic save probe
        run: dotnet build tools/TerraRuntime.AtomicSaveCrashProbe/TerraRuntime.AtomicSaveCrashProbe.csproj -c Release

      - name: Prove generated world atomic publication
        shell: bash
        run: |
          set -euo pipefail

          probe='tools/TerraRuntime.AtomicSaveCrashProbe/bin/Release/net11.0/TerraRuntime.AtomicSaveCrashProbe.dll'
          work="$RUNNER_TEMP/atomic-world-publish"
          rm -rf "$work"
          mkdir -p "$work"

          destination="$work/generated.wld"
          expected="$work/expected"
          printf 'generated-world' > "$expected"

          dotnet "$probe" publish "$destination" 'generated-world'
          cmp "$expected" "$destination"

          dotnet "$probe" publish-refuse "$destination" 'replacement-world'
          cmp "$expected" "$destination"

          if compgen -G "$work/.generated.wld.*.tmp" >/dev/null; then
            echo 'atomic publisher left a temporary file after completed operations' >&2
            exit 1
          fi

          echo 'atomic_world_publish_contract_ok first_publish=true overwrite_refused=true preserved=true'

      - name: Prove SIGKILL cannot expose a partial world
        shell: bash
        run: |
          set -euo pipefail

          probe='tools/TerraRuntime.AtomicSaveCrashProbe/bin/Release/net11.0/TerraRuntime.AtomicSaveCrashProbe.dll'
          work="$RUNNER_TEMP/atomic-save-crash"
          rm -rf "$work"
          mkdir -p "$work"

          old_expected="$work/old.expected"
          destination="$work/world.wld"
          ready="$work/existing.ready"
          log="$work/existing.log"
          printf 'old-world' > "$old_expected"
          cp "$old_expected" "$destination"

          dotnet "$probe" stall "$destination" 'partial-new-world' "$ready" >"$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 100); do
            if [[ -f "$ready" ]]; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              wait "$pid"
            fi
            sleep 0.1
          done
          if [[ ! -f "$ready" ]]; then
            cat "$log"
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo 'crash probe did not reach the pre-publication stall' >&2
            exit 1
          fi

          mapfile -t live_temps < <(compgen -G "$work/.world.wld.*.tmp" || true)
          mapfile -t live_leases < <(compgen -G "$work/.world.wld.*.tmp.lease" || true)
          if [[ ${#live_temps[@]} -ne 1 || ${#live_leases[@]} -ne 1 ]]; then
            printf 'expected one live temp+lease before SIGKILL; temps=%s leases=%s\n' \
              "${#live_temps[@]}" "${#live_leases[@]}" >&2
            exit 1
          fi
          orphan_temp="${live_temps[0]}"
          orphan_lease="${live_leases[0]}"
          if [[ "$orphan_lease" != "$orphan_temp.lease" ]]; then
            echo 'live save temp and lease identities do not match' >&2
            exit 1
          fi

          kill -KILL "$pid"
          set +e
          wait "$pid"
          status=$?
          set -e
          if [[ "$status" -ne 137 ]]; then
            cat "$log"
            echo "expected SIGKILL exit 137, got $status" >&2
            exit 1
          fi

          cmp "$old_expected" "$destination"
          test -f "$orphan_temp"
          test -f "$orphan_lease"

          dotnet "$probe" write "$destination" 'new-world'
          printf 'new-world' > "$work/new.expected"
          cmp "$work/new.expected" "$destination"
          if [[ -e "$orphan_temp" || -e "$orphan_lease" ]]; then
            echo 'next save did not reap the abandoned leased temporary' >&2
            exit 1
          fi
          if compgen -G "$work/.world.wld.*.tmp" >/dev/null || \
             compgen -G "$work/.world.wld.*.tmp.lease" >/dev/null; then
            echo 'completed recovery save left temporary or lease files behind' >&2
            exit 1
          fi

          fresh="$work/fresh.wld"
          fresh_ready="$work/fresh.ready"
          fresh_log="$work/fresh.log"
          dotnet "$probe" stall "$fresh" 'partial-first-world' "$fresh_ready" >"$fresh_log" 2>&1 &
          fresh_pid=$!
          for _ in $(seq 1 100); do
            if [[ -f "$fresh_ready" ]]; then
              break
            fi
            if ! kill -0 "$fresh_pid" 2>/dev/null; then
              cat "$fresh_log"
              wait "$fresh_pid"
            fi
            sleep 0.1
          done
          if [[ ! -f "$fresh_ready" ]]; then
            cat "$fresh_log"
            kill -KILL "$fresh_pid" 2>/dev/null || true
            wait "$fresh_pid" 2>/dev/null || true
            echo 'first-save crash probe did not reach the pre-publication stall' >&2
            exit 1
          fi

          mapfile -t fresh_temps < <(compgen -G "$work/.fresh.wld.*.tmp" || true)
          mapfile -t fresh_leases < <(compgen -G "$work/.fresh.wld.*.tmp.lease" || true)
          if [[ ${#fresh_temps[@]} -ne 1 || ${#fresh_leases[@]} -ne 1 ]]; then
            printf 'expected one first-save temp+lease before SIGKILL; temps=%s leases=%s\n' \
              "${#fresh_temps[@]}" "${#fresh_leases[@]}" >&2
            exit 1
          fi
          fresh_orphan_temp="${fresh_temps[0]}"
          fresh_orphan_lease="${fresh_leases[0]}"
          if [[ "$fresh_orphan_lease" != "$fresh_orphan_temp.lease" ]]; then
            echo 'first-save temp and lease identities do not match' >&2
            exit 1
          fi

          kill -KILL "$fresh_pid"
          set +e
          wait "$fresh_pid"
          fresh_status=$?
          set -e
          if [[ "$fresh_status" -ne 137 ]]; then
            cat "$fresh_log"
            echo "expected first-save SIGKILL exit 137, got $fresh_status" >&2
            exit 1
          fi
          if [[ -e "$fresh" ]]; then
            echo 'partial first save became visible after SIGKILL' >&2
            exit 1
          fi
          test -f "$fresh_orphan_temp"
          test -f "$fresh_orphan_lease"

          dotnet "$probe" write "$fresh" 'first-world'
          printf 'first-world' > "$work/fresh.expected"
          cmp "$work/fresh.expected" "$fresh"
          if [[ -e "$fresh_orphan_temp" || -e "$fresh_orphan_lease" ]]; then
            echo 'first successful save did not reap the abandoned first-save temporary' >&2
            exit 1
          fi
          if compgen -G "$work/.fresh.wld.*.tmp" >/dev/null || \
             compgen -G "$work/.fresh.wld.*.tmp.lease" >/dev/null; then
            echo 'completed first-save recovery left temporary or lease files behind' >&2
            exit 1
          fi

          echo 'atomic_save_sigkill_ok existing_preserved=true first_save_hidden=true subsequent_save=true orphan_cleanup=true live_lease=true'

  save-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Build persistence test assembly
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Prove embedded cache save template
        run: >-
          dotnet vstest tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll
          --TestCaseFilter:FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldSnapshotPreservedSectionsTests

      - name: Prove authoritative save service
        run: >-
          dotnet vstest tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll
          --TestCaseFilter:FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldTileChestSaveServiceTests

      - name: Prove validated checkpoint backup and recovery
        run: >-
          dotnet vstest tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll
          --TestCaseFilter:FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldCheckpointRecoveryTests
