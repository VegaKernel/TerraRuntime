name: Terraria Dungeon Graph Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonGraphGenerator1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/Dungeon*.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/GenerationObjectSupport1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/GenerationFurniturePlacement1458.cs'
      - 'src/TerraRuntime.World/VanillaWorldCanHit.cs'
      - 'src/TerraRuntime.World/VanillaWorldLiquidSimulator1458.cs'
      - 'src/TerraRuntime.Gameplay/Items/VanillaDungeonChestItemCatalog1458.cs'
      - 'tests/TerraRuntime.Tests/Dungeon*.cs'
      - 'tests/TerraRuntime.Tests/LoadingLiquidObjectDestruction1458Tests.cs'
      - 'tests/TerraRuntime.Tests/VanillaWorldCanHitTests.cs'
      - 'tools/ci/test_gameplay_acceptance_tools.py'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonSurfaceBuildings1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonPlatforms1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonDoors1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonFeatureCandidates1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonFeaturePipeline1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonSpikes1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonWallVariants1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonPillars1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonWindows1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonMosaicWindows1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonGenerationTiles1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/TreeGrower1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonLegacyRoom1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonLegacyHall1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonPipeline1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/EarlyPipeline1458.cs'
      - 'src/TerraRuntime.WorldGeneration/Generation/Vanilla/Validator1458.cs'
      - 'tests/TerraRuntime.Tests/SourceBackedDungeonPipeline1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonLayout1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonLegacyRoom1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonSurfaceBuildings1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonPlatforms1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonDoors1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonDoorFixture1458.cs'
      - 'tests/TerraRuntime.Tests/DungeonFeatureCandidates1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonSurfaceFeatures1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonSurfaceFeatureFixture1458.cs'
      - 'tests/TerraRuntime.Tests/DungeonStructurePlacement1458Tests.cs'
      - 'tests/TerraRuntime.Tests/TreeGrower1458Tests.cs'
      - 'tests/TerraRuntime.Tests/DungeonLegacyHall1458Tests.cs'
      - 'tests/TerraRuntime.Tests/VanillaWorldGenerationFullIntegrationTests.cs'
      - 'tests/TerraRuntime.Tests/Validator1458Tests.cs'
      - 'tools/ci/probe_worldgen_dungeon_graph.py'
      - '.github/workflows/terraria-worldgen-dungeon-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-dungeon-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile pinned TerrariaServer 1.4.5.8 Dungeon graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375

          expected="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"

          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.Generation.Dungeon.DungeonCrawler "$assembly" > artifacts/source-contract/crawler.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.Generation.Dungeon.LayoutProviders.LegacyDungeonLayoutProvider "$assembly" > artifacts/source-contract/layout.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.Generation.Dungeon.Rooms.LegacyDungeonRoom "$assembly" > artifacts/source-contract/room.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.Generation.Dungeon.Halls.LegacyDungeonHall "$assembly" > artifacts/source-contract/hall.cs
          python3 tools/ci/probe_worldgen_dungeon_graph.py \
            --crawler artifacts/source-contract/crawler.cs \
            --layout artifacts/source-contract/layout.cs \
            --room artifacts/source-contract/room.cs \
            --hall artifacts/source-contract/hall.cs \
            --runtime src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonGraphGenerator1458.cs \
            --runtime-room src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonLegacyRoom1458.cs \
            --runtime-hall src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonLegacyHall1458.cs \
            --runtime-features src/TerraRuntime.WorldGeneration/Generation/Vanilla/DungeonFeaturePipeline1458.cs \
            --output artifacts/source-contract/dungeon-graph-contract.txt

      - name: Focused Dungeon graph tests
        run: >-
          dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --
          -class '*Dungeon*'
          -class TerraRuntime.Tests.LoadingLiquidObjectDestruction1458Tests
          -class TerraRuntime.Tests.VanillaWorldCanHitTests
          -class TerraRuntime.Tests.VanillaWorldGenerationFullIntegrationTests
          -class TerraRuntime.Tests.Validator1458Tests

      - uses: actions/upload-artifact@v4
        with:
          name: terraria-dungeon-graph-${{ github.sha }}
          path: artifacts/source-contract/dungeon-graph-contract.txt
          if-no-files-found: error
          retention-days: 7
