name: Apply Bullet Runtime Slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bullet-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed Bullet slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs',
              '    public static readonly ProjectileTypeId JestersArrow = new(5);\n    public static readonly ProjectileTypeId ThrowingKnife = new(48);',
              '    public static readonly ProjectileTypeId JestersArrow = new(5);\n    public static readonly ProjectileTypeId Bullet = new(14);\n    public static readonly ProjectileTypeId ThrowingKnife = new(48);')

          replace_once(
              'src/TerraRuntime.Contracts/Gameplay/VanillaProjectileDefinitionCatalog.cs',
