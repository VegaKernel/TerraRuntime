              '''    [Fact]
    public void Terraria_1458_shuriken_definition_matches_source()''',
              '''    [Fact]
    public void Terraria_1458_bullet_definition_matches_source()
    {
        Assert.True(VanillaProjectileDefinitionCatalog.TryGet(
            VanillaProjectileIds.Bullet,
            out VanillaProjectileDefinition definition));

        Assert.Equal(4, definition.Width);
        Assert.Equal(4, definition.Height);
        Assert.Equal(VanillaProjectileAiStyles.Arrow, definition.AiStyle);
        Assert.True(definition.TileCollide);
        Assert.False(definition.IgnoreWater);
        Assert.True(definition.CanCutTiles);
        Assert.Equal(4, definition.CollisionWidth);
        Assert.Equal(4, definition.CollisionHeight);
        Assert.Equal(0f, definition.CollisionOffsetX);
        Assert.Equal(0f, definition.CollisionOffsetY);
    }

    [Fact]
    public void Terraria_1458_shuriken_definition_matches_source()''')

          replace_once(
              'tests/TerraRuntime.Tests/VanillaProjectileWorldStateStepperTests.cs',
              '''    [Fact]
    public void Jesters_arrow_free_flight_ignores_water_and_uses_ordinary_ai001_path()''',
              '''    [Fact]
    public void Bullet_water_contact_uses_basic_ai001_path_and_generic_liquid_scaling()
    {
        var tiles = new WorldTileStore(new WorldDimensions(100, 100));
        tiles.Set(6, 6, LiquidTile(WorldLiquidKind.Water));
        var stepper = new VanillaProjectileWorldStateStepper(tiles);
        ProjectileSnapshot bullet = CreateSnapshot(
            positionX: 100f,
            positionY: 100f,
            velocityX: 4f,
            velocityY: 2f) with
        {
            Type = VanillaProjectileIds.Bullet
        };
        ProjectileSimulationStepContext context = CreateContext(bullet, timeLeft: 600);

        Assert.True(stepper.TryStepState(in context, out ProjectileSimulationStepResult next));

        Assert.Equal(VanillaProjectileIds.Bullet, next.State.Type);
        Assert.Equal(1f, next.State.Ai.Ai0, 5);
        Assert.Equal(4f, next.State.VelocityX, 5);
        Assert.Equal(2f, next.State.VelocityY, 5);
        Assert.Equal(102f, next.State.PositionX, 5);
        Assert.Equal(101f, next.State.PositionY, 5);
        Assert.Equal(599, next.TimeLeft);
        Assert.True(next.Liquid.GetValueOrDefault().Wet);
    }

    [Fact]
    public void Bullet_tile_impact_uses_four_pixel_collision_box_and_generic_kill_path()
    {
        var tiles = new WorldTileStore(new WorldDimensions(100, 100));
        tiles.Set(7, 10, SolidTile(1));
        var stepper = new VanillaProjectileWorldStateStepper(tiles);
        ProjectileSnapshot bullet = CreateSnapshot(
            positionX: 100f,
            positionY: 160f,
            velocityX: 20f,
            velocityY: 0f) with
        {
            Type = VanillaProjectileIds.Bullet
        };
        ProjectileSimulationStepContext context = CreateContext(bullet, timeLeft: 600);

        Assert.True(stepper.TryStepState(in context, out ProjectileSimulationStepResult next));

        Assert.Equal(VanillaProjectileIds.Bullet, next.State.Type);
        Assert.Equal(0, next.TimeLeft);
    }

    [Fact]
    public void Jesters_arrow_free_flight_ignores_water_and_uses_ordinary_ai001_path()''')

          replace_once(
              'tests/TerraRuntime.Tests/ServerRuntimeVanillaProjectileSimulationTests.cs',
              '''    [Theory]
    [InlineData(1)]
    [InlineData(2)]
    [InlineData(4)]
    public async Task Server_owned_arrow_simulates_when_tile_cut_effect_is_empty(int type)''',
              '''    [Fact]
    public async Task Server_owned_bullet_runs_two_subupdates_when_tile_cut_effect_is_empty()
    {
        var tiles = new WorldTileStore(new WorldDimensions(100, 100));
        var projectiles = new RuntimeProjectileStore(capacity: 4);
        var state = new ServerRuntimeState(worldTiles: tiles, projectiles: projectiles);
        ProjectileStateUpdate projectile = CreateProjectile(14, VanillaProjectileOwnership.ServerOwner);
        var completion = new TaskCompletionSource<ProjectileSnapshot?>(TaskCreationOptions.RunContinuationsAsynchronously);
        state.Apply(new ProjectileSpawnRuntimeCommand(0, projectile, completion));
        ProjectileSnapshot spawned = Assert.IsType<ProjectileSnapshot>(await completion.Task);

        state.Tick();

        Assert.Equal(new ProjectileStateTickSummary(1, 1, 1, 0), state.LastProjectileTick);
        Assert.True(state.TryCaptureProjectileSnapshot(spawned.Handle, out ProjectileSnapshot updated));
        Assert.Equal(VanillaProjectileIds.Bullet, updated.Type);
        Assert.Equal(new ProjectileRevision(2), updated.Revision);
        Assert.Equal(108f, updated.PositionX, 5);
        Assert.Equal(100f, updated.PositionY, 5);
        Assert.Equal(2f, updated.Ai.Ai0, 5);
        Assert.True(projectiles.TryGetLifecycle(spawned.Handle, out ProjectileLifecycleState lifecycle));
        Assert.Equal(598, lifecycle.TimeLeft);
    }

    [Theory]
    [InlineData(1)]
    [InlineData(2)]
    [InlineData(4)]
    public async Task Server_owned_arrow_simulates_when_tile_cut_effect_is_empty(int type)''')

