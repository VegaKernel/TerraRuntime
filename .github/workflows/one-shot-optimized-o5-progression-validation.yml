name: One-shot optimized O5 progression validation integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-optimized-o5-progression-validation.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Wire final optimized progression validator
        shell: python
        run: |
          from pathlib import Path

          def patch(path_name, replacements):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              for old, new, label in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path_name}: {label}: expected 1 occurrence, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          patch(
              "src/TerraRuntime/BuiltInWorldGeneratorSource.cs",
              [
                  (
                      "private readonly OptimizedLandmarkWorldGenerationProvider optimized = new();",
                      "private readonly OptimizedProgressionValidationWorldGenerationProvider optimized = new();",
                      "optimized provider registration",
                  ),
                  (
                      "OptimizedLandmarkWorldGenerationProvider.GeneratorId,",
                      "OptimizedProgressionValidationWorldGenerationProvider.GeneratorId,",
                      "optimized generator id",
                  ),
              ],
          )

          test_path = Path("tests/TerraRuntime.Tests/OptimizedWorldGenerationProviderTests.cs")
          tests = test_path.read_text(encoding="utf-8")
          old = "Assert.IsType<OptimizedLandmarkWorldGenerationProvider>(provider);"
          new = "Assert.IsType<OptimizedProgressionValidationWorldGenerationProvider>(provider);"
          if tests.count(old) != 1:
              raise SystemExit(f"provider type assertion: expected 1 occurrence, found {tests.count(old)}")
          tests = tests.replace(old, new)

          old = """        RuntimeWorldGenerationWorkspace world = result.Candidate!;

        Assert.Equal(320, result.Metadata.Spawn.X);"""
          new = """        RuntimeWorldGenerationWorkspace world = result.Candidate!;
        OptimizedProgressionValidationReport progression = OptimizedProgressionWorldValidator.Validate(
            world,
            world,
            in request,
            TestContext.Current.CancellationToken);
        Assert.Equal(8, progression.ReachableTargetCount);
        Assert.True(progression.CopperTiles > 0);
        Assert.True(progression.IronTiles > 0);
        Assert.True(progression.SilverTiles > 0);
        Assert.True(progression.GoldTiles > 0);
        Assert.True(progression.HellstoneTiles > 0);
        Assert.True(progression.DungeonInteriorCells >= 24);
        Assert.True(progression.HiveInteriorCells >= 18);
        Assert.True(progression.TempleInteriorCells >= 24);

        Assert.Equal(320, result.Metadata.Spawn.X);"""
          if tests.count(old) != 1:
              raise SystemExit(f"progression report assertion insertion: expected 1 occurrence, found {tests.count(old)}")
          test_path.write_text(tests.replace(old, new), encoding="utf-8")

          patch(
              "docs/roadmap/optimized-worldgen.md",
              [
                  (
                      "split optimized generation into base, playability and landmark providers instead of growing one monolith;",
                      "split optimized generation into base, playability, landmark and final progression-validation providers instead of growing one monolith;",
                      "provider layering roadmap",
                  ),
                  (
                      "- [ ] validate path/reachability graph from spawn to surface biomes and major structure entrances;",
                      "- [x] validate an excavation-aware path/reachability graph from spawn to surface biomes and major structure entrances;",
                      "reachability checkbox",
                  ),
                  (
                      "- [ ] validate minimum ore/resource quantities instead of presence only;",
                      "- [x] validate area-scaled minimum Copper/Iron/Silver/Gold/Hellstone quantities instead of presence only;",
                      "resource checkbox",
                  ),
                  (
                      "- [ ] validate dungeon/temple/hive interior traversal;",
                      "- [x] validate connected dungeon/temple/hive interior components and explicit Temple/dungeon access openings;",
                      "interior checkbox",
                  ),
                  (
                      "- [ ] validate no required structure was overwritten by a later pass beyond the current material/object checks;",
                      "- [x] validate final post-landmark structure footprints, material minima and complete 3x2 progression objects;",
                      "final structure checkbox",
                  ),
              ],
          )

          en = Path("docs/en/optimized-world-generation.md")
          text = en.read_text(encoding="utf-8")
          text = text.replace(
              '    LVal["landmark validator"]\n    Commit["candidate finalization / commit"]\n\n    Base --> Play --> Land --> Meta --> PVal --> LVal --> Commit',
              '    LVal["landmark validator"]\n    Prog["OptimizedProgressionValidationWorldGenerationProvider<br/>resource / structure / reachability gate"]\n    Commit["candidate finalization / commit"]\n\n    Base --> Play --> Land --> Meta --> PVal --> LVal --> Prog --> Commit',
          )
          old = """This is deliberately stronger than checking for one representative tile. A half-generated landmark set is rejected.
"""
          new = """This is deliberately stronger than checking for one representative tile. A half-generated landmark set is rejected.

A final `OptimizedProgressionValidationWorldGenerationProvider` then scans the post-landmark candidate. It enforces
area-scaled minimum quantities for Copper, Iron, Silver, Gold and Hellstone; verifies complete 3x2 Demon/Crimson Altar,
Hellforge and Lihzahrd Altar footprints; requires non-trivial connected dungeon, hive and Jungle Temple interiors; and
builds a bounded excavation-aware reachability graph from spawn to snow, desert, jungle, world evil, the dungeon
entrance, hive interior, Jungle Temple entrance and Underworld Hellforge. Ordinary terrain contributes excavation cost,
while dense Lihzahrd barriers and deep Lava are treated as blocking. This is a structural topology gate, not a claim of
pixel-exact Terraria player movement or tool progression.
"""
          if text.count(old) != 1:
              raise SystemExit("EN validation insertion point missing")
          text = text.replace(old, new)
          text = text.replace(
              "The large landmark slice closes a substantial visual/content gap, but `terraruntime:optimized` is not yet\nproduction-complete.",
              "The landmark and final progression-validation slices close substantial visual/content and structural gaps, but\n`terraruntime:optimized` is not yet production-complete.",
          )
          for line in [
              "- stronger Jungle Temple/hive/dungeon traversal proofs;\n",
              "- a real reachability graph from spawn to critical entrances;\n",
              "- minimum quantity gates for ores and progression resources;\n",
          ]:
              if line not in text:
                  raise SystemExit(f"EN remaining-work line missing: {line.strip()}")
              text = text.replace(line, "")
          en.write_text(text, encoding="utf-8")

          ru = Path("docs/ru/optimized-world-generation.md")
          text = ru.read_text(encoding="utf-8")
          text = text.replace(
              '    LVal["landmark validator"]\n    Commit["candidate finalization / commit"]\n\n    Base --> Play --> Land --> Meta --> PVal --> LVal --> Commit',
              '    LVal["landmark validator"]\n    Prog["OptimizedProgressionValidationWorldGenerationProvider<br/>resource / structure / reachability gate"]\n    Commit["candidate finalization / commit"]\n\n    Base --> Play --> Land --> Meta --> PVal --> LVal --> Prog --> Commit',
          )
          old = """Это намеренно строже проверки одного representative tile. Наполовину созданный набор landmarks отклоняется.
"""
          new = """Это намеренно строже проверки одного representative tile. Наполовину созданный набор landmarks отклоняется.

После него финальный `OptimizedProgressionValidationWorldGenerationProvider` сканирует уже post-landmark candidate. Он
требует масштабируемые по площади минимумы Copper, Iron, Silver, Gold и Hellstone; проверяет полные 3x2 footprints
Demon/Crimson Altar, Hellforge и Lihzahrd Altar; требует нетривиальные связные interiors dungeon, hive и Jungle Temple;
а также строит ограниченный excavation-aware reachability graph от spawn до snow, desert, jungle, world evil, dungeon
entrance, hive interior, Jungle Temple entrance и Underworld Hellforge. Обычная порода учитывается как стоимость
прокапывания, а плотные Lihzahrd barriers и глубокая Lava считаются блокирующими. Это structural topology gate, а не
заявление о pixel-exact физике движения игрока или точной tool progression Terraria.
"""
          if text.count(old) != 1:
              raise SystemExit("RU validation insertion point missing")
          text = text.replace(old, new)
          text = text.replace(
              "Большой landmark slice закрывает заметный визуальный/content gap, но `terraruntime:optimized` ещё не production-complete.",
              "Landmark и final progression-validation slices закрывают заметные visual/content и structural gaps, но\n`terraruntime:optimized` ещё не production-complete.",
          )
          for line in [
              "- более строгие traversal proofs для Jungle Temple/hive/dungeon;\n",
              "- реальный reachability graph от spawn до critical entrances;\n",
              "- minimum quantity gates для ores и progression resources;\n",
          ]:
              if line not in text:
                  raise SystemExit(f"RU remaining-work line missing: {line.strip()}")
              text = text.replace(line, "")
          ru.write_text(text, encoding="utf-8")

      - name: Validate bilingual documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run optimized worldgen regressions
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.OptimizedWorldGenerationProviderTests

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit O5 block and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-optimized-o5-progression-validation.yml
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add src/TerraRuntime/BuiltInWorldGeneratorSource.cs tests/TerraRuntime.Tests/OptimizedWorldGenerationProviderTests.cs docs/roadmap/optimized-worldgen.md docs/en/optimized-world-generation.md docs/ru/optimized-world-generation.md .github/workflows/one-shot-optimized-o5-progression-validation.yml
          git commit -m "Close optimized O5 progression validation block" -m "Promote the final optimized progression validator into the built-in provider chain. Enforce area-scaled ore budgets, complete progression-object footprints, connected dungeon/hive/temple interiors and excavation-aware reachability to surface biomes and major structure access points on the final post-landmark candidate. Update executable regression evidence and mirrored RU/EN documentation, and close the corresponding O5 roadmap gates."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main