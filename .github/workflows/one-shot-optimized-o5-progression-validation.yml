name: One-shot optimized O5 progression validation integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-optimized-o5-progression-validation.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply O5 integration patch
        run: python3 tools/ci/apply_optimized_o5_progression_validation.py

      - name: Add canonical optimized crash regression
        run: python3 tools/ci/apply_optimized_crash_regression.py

      - name: Validate bilingual documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run optimized worldgen regressions
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.OptimizedWorldGenerationProviderTests

      - name: Create canonical Small optimized world through production persistence path
        run: |
          rm -f "$RUNNER_TEMP/optimized-canonical-small.wld"
          dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- \
            --worldgen-create-smoke "$RUNNER_TEMP/optimized-canonical-small.wld" \
            terraruntime:optimized 4200 1200 259081709
          test -s "$RUNNER_TEMP/optimized-canonical-small.wld"

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit O5 block and crash regression and remove one-shot helpers
        run: |
          rm .github/workflows/one-shot-optimized-o5-progression-validation.yml
          rm tools/ci/apply_optimized_o5_progression_validation.py
          rm tools/ci/apply_optimized_crash_regression.py
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add \
            src/TerraRuntime.World/Generation/Optimized/OptimizedProgressionValidationWorldGenerationProvider.cs \
            src/TerraRuntime/BuiltInWorldGeneratorSource.cs \
            tests/TerraRuntime.Tests/OptimizedWorldGenerationProviderTests.cs \
            docs/roadmap/optimized-worldgen.md \
            docs/en/optimized-world-generation.md \
            docs/ru/optimized-world-generation.md \
            .github/workflows/one-shot-optimized-o5-progression-validation.yml \
            tools/ci/apply_optimized_o5_progression_validation.py \
            tools/ci/apply_optimized_crash_regression.py
          git commit -m "Close optimized O5 and canonical generation crash gate" -m "Promote the final optimized progression validator into the built-in provider chain, fix request ref binding, enforce area-scaled ore budgets, complete progression-object footprints, connected dungeon/hive/temple interiors and excavation-aware reachability, and add a canonical 4200x1200 regression. Prove both the in-memory candidate path and production .wld persistence path before committing."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
