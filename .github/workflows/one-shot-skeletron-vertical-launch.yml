name: One-shot Skeletron vertical launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-skeletron-vertical-launch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-runtime-skeletron-vertical-launch
  cancel-in-progress: false

jobs:
  fresh-port-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Port Skeletron vertical onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git fetch origin --prune
          git switch -C work/skeletron-vertical-1458-main origin/main
          git diff 6f87a8a747c226f32035999b33ca432fd001274b ce9c7434c004e95c3edad8ac2a8ac0ba5edad2aa -- \
            src/TerraRuntime.Core/Npcs/VanillaSkeletronBehavior.cs \
            tests/TerraRuntime.Tests/VanillaSkeletronBehaviorTests.cs > /tmp/skeletron-clean.patch
          git apply --index /tmp/skeletron-clean.patch
          python3 tools/ci/fresh_port_skeletron_1458.py
          git add -A
      - name: Verify pinned TerrariaServer 1.4.5.8 contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/decompile-reference.sh 1458
          python3 - <<'PY'
          from pathlib import Path
          import re
          npc = Path('decompiled/1458/Terraria/NPC.cs').read_text(encoding='utf-8', errors='ignore')
          required = [
              'else if (type == 35)', 'width = 80;', 'height = 102;', 'aiStyle = 11;',
              'damage = 32;', 'defense = 10;', 'lifeMax = 4400;',
              'else if (type == 36)', 'width = 52;', 'height = 52;', 'aiStyle = 12;',
              'damage = 20;', 'defense = 14;', 'lifeMax = 600;',
              'if (aiStyle == 11)', 'ai[2] >= 800f', 'ai[2] >= 400f',
              'GetAttackDamage_ForProjectiles(17f, 17f)', 'timeLeft = 300;',
              'if (aiStyle == 12)', 'ai[3] >= 300f', 'ai[2] = 5f;'
          ]
          missing = [needle for needle in required if needle not in npc]
          if missing:
              raise SystemExit('Pinned Skeletron source contract changed: ' + ', '.join(missing))
          structural = {
              'expert live-hand defense': r'defense\s*\+=\s*[A-Za-z_][A-Za-z0-9_]*\s*\*\s*25\s*;',
              'expert skull projectile 270': r'GetAttackDamage_ForProjectiles\(17f,\s*17f\)[\s\S]{0,350}?=\s*270\s*;[\s\S]{0,450}?Projectile\.NewProjectile',
              'two-hand creation order': r'NewNPC\([^\n]+, 36, whoAmI\);[\s\S]{0,500}?ai\[0\] = -1f;[\s\S]{0,700}?NewNPC\([^\n]+, 36, whoAmI\);[\s\S]{0,500}?ai\[0\] = 1f;[\s\S]{0,300}?ai\[3\] = 150f;'
          }
          failed = [name for name, pattern in structural.items() if not re.search(pattern, npc)]
          if failed:
              raise SystemExit('Pinned Skeletron structural contract changed: ' + ', '.join(failed))
          print('skeletron_1458_source_contract=ok')
          PY
      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --nologo
      - name: Focused tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --filter FullyQualifiedName~VanillaSkeletronBehaviorTests --nologo
      - name: Full tests
        run: dotnet test TerraRuntime.slnx -c Release --no-build --nologo
      - name: Commit validated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Add source-backed Skeletron head and hand AI vertical' -m 'Fresh-port TerrariaServer 1.4.5.8 Skeletron head/hand defaults and AI onto current main. Preserve exact two-hand parent ownership, hover/spin and hand attack cycles, daytime enrage/flee and Expert live-hand defense, with focused regressions and full-suite validation.'
          git push --force origin HEAD:work/skeletron-vertical-1458-main
