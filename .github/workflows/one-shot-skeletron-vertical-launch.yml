name: One-shot Skeletron vertical launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-skeletron-vertical-launch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-runtime-skeletron-vertical-launch
  cancel-in-progress: false

jobs:
  fresh-port-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Port Skeletron vertical onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git fetch origin --prune
          git switch -C work/skeletron-vertical-1458-main origin/main

          git diff 6f87a8a747c226f32035999b33ca432fd001274b ce9c7434c004e95c3edad8ac2a8ac0ba5edad2aa -- \
            src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs \
            src/TerraRuntime.Core/Npcs/VanillaSkeletronBehavior.cs \
            tests/TerraRuntime.Tests/VanillaSkeletronBehaviorTests.cs > /tmp/skeletron-clean.patch
          git apply --index /tmp/skeletron-clean.patch

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor changed')
              return text.replace(old, new, 1)

          definitions_path = Path('src/TerraRuntime.Core/Npcs/VanillaNpcDefinitionCatalog.cs')
          definitions = definitions_path.read_text(encoding='utf-8')
          definitions = replace_once(
              definitions,
              '    Vulture = 10,\n    SpikeBall = 11,\n    BlazingWheel = 12\n}',
              '    Vulture = 10,\n    SpikeBall = 11,\n    BlazingWheel = 12,\n    SkeletronHead = 13,\n    SkeletronHand = 14\n}',
              'behavior-family')

          skeletron_definitions = '''        if (type == VanillaNpcIds.SkeletronHead)
          {
              definition = new VanillaNpcDefinition(
                  Type: VanillaNpcIds.SkeletronHead,
                  AiStyle: VanillaNpcAiStyles.SkeletronHead,
                  BehaviorFamily: VanillaNpcBehaviorFamily.SkeletronHead,
                  PhysicsFamily: VanillaNpcPhysicsFamily.NoClipFlight,
                  Role: NpcArchetypeRole.Boss,
                  BaseWidth: 80,
                  BaseHeight: 102,
                  Damage: 32,
                  Defense: 10,
                  LifeMax: 4400,
                  KnockBackResist: 0f,
                  Scale: 1f,
                  NoGravityAtSpawn: true,
                  NoTileCollideAtSpawn: true,
                  SyncAnchor: VanillaNpcSyncAnchor.TopLeft);
              return true;
          }

          if (type == VanillaNpcIds.SkeletronHand)
          {
              definition = new VanillaNpcDefinition(
                  Type: VanillaNpcIds.SkeletronHand,
                  AiStyle: VanillaNpcAiStyles.SkeletronHand,
                  BehaviorFamily: VanillaNpcBehaviorFamily.SkeletronHand,
                  PhysicsFamily: VanillaNpcPhysicsFamily.NoClipFlight,
                  Role: NpcArchetypeRole.Ordinary,
                  BaseWidth: 52,
                  BaseHeight: 52,
                  Damage: 20,
                  Defense: 14,
                  LifeMax: 600,
                  KnockBackResist: 0f,
                  Scale: 1f,
                  NoGravityAtSpawn: true,
                  NoTileCollideAtSpawn: true,
                  SyncAnchor: VanillaNpcSyncAnchor.TopLeft);
              return true;
          }

'''
          definitions = replace_once(
              definitions,
              '        if (type == VanillaNpcIds.Skeleton)\n',
              skeletron_definitions + '        if (type == VanillaNpcIds.Skeleton)\n',
              'skeletron-definitions')
          definitions_path.write_text(definitions, encoding='utf-8')

          stepper_path = Path('src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs')
          stepper = stepper_path.read_text(encoding='utf-8')
          stepper = replace_once(
              stepper,
              '    private readonly IVanillaNpcBehaviorStrategy _blazingWheel = new VanillaBlazingWheelNpcBehaviorStrategy();\n    private readonly IVanillaNpcRandom _random;',
              '    private readonly IVanillaNpcBehaviorStrategy _blazingWheel = new VanillaBlazingWheelNpcBehaviorStrategy();\n    private readonly VanillaSkeletronHeadNpcBehaviorStrategy _skeletronHead = new();\n    private readonly VanillaSkeletronHandNpcBehaviorStrategy _skeletronHand = new();\n    private readonly IVanillaNpcRandom _random;',
              'skeletron-fields')
          stepper = replace_once(
              stepper,
              '            VanillaNpcBehaviorFamily.BlazingWheel => _blazingWheel,\n            _ => null',
              '            VanillaNpcBehaviorFamily.BlazingWheel => _blazingWheel,\n            VanillaNpcBehaviorFamily.SkeletronHead => _skeletronHead,\n            VanillaNpcBehaviorFamily.SkeletronHand => _skeletronHand,\n            _ => null',
              'skeletron-dispatch')
          stepper = replace_once(
              stepper,
              '        if (NpcTypeId.TryCreate(source.Type, out NpcTypeId sourceType) &&\n            VanillaWormNpcCatalog.TryGet(sourceType, out _))',
              '''        if (source.Type == VanillaNpcIds.SkeletronHead.Value &&
              proposed.Type == VanillaNpcIds.SkeletronHead.Value)
          {
              return PlanSkeletronHands(in source, in proposed, destination);
          }

          if (NpcTypeId.TryCreate(source.Type, out NpcTypeId sourceType) &&
              VanillaWormNpcCatalog.TryGet(sourceType, out _))''',
              'skeletron-spawn-dispatch')

          skeletron_planner = '''    private int PlanSkeletronHands(
              in NpcSnapshot source,
              in NpcStateUpdate proposed,
              Span<NpcAiSpawnIntent> destination)
          {
              if (destination.Length < 2 ||
                  source.Ai.Ai0 != 0f ||
                  proposed.Ai.Ai0 != 1f ||
                  proposed.Type != source.Type ||
                  !VanillaNpcDefinitionCatalog.TryGet(VanillaNpcIds.SkeletronHead, out VanillaNpcDefinition definition) ||
                  !definition.TryResolveHitbox(source.Simulation.Scale, out VanillaNpcHitboxSize hitbox))
              {
                  return 0;
              }

              int spawnX = (int)(source.PositionX + hitbox.Width * 0.5f);
              int spawnY = (int)(source.PositionY + hitbox.Height * 0.5f);
              destination[0] = new NpcAiSpawnIntent(
                  VanillaNpcIds.SkeletronHand,
                  spawnX,
                  spawnY,
                  0f,
                  0f,
                  proposed.Target)
              {
                  InitialAi = new NpcAiState(-1f, source.Handle.Slot, 0f, 0f)
              };
              destination[1] = new NpcAiSpawnIntent(
                  VanillaNpcIds.SkeletronHand,
                  spawnX,
                  spawnY,
                  0f,
                  0f,
                  proposed.Target)
              {
                  InitialAi = new NpcAiState(1f, source.Handle.Slot, 0f, 150f)
              };
              return 2;
          }

'''
          stepper = replace_once(
              stepper,
              '    private int PlanWormFollower(\n',
              skeletron_planner + '    private int PlanWormFollower(\n',
              'skeletron-planner')
          stepper_path.write_text(stepper, encoding='utf-8')

          behavior_path = Path('src/TerraRuntime.Core/Npcs/VanillaSkeletronBehavior.cs')
          behavior = behavior_path.read_text(encoding='utf-8')
          behavior = replace_once(
              behavior,
              '            refresh.HasTarget &&\n            context.TryFindCandidate(refresh.Target, out target) &&',
              '            refresh.HasTarget &&\n            refresh.Target < byte.MaxValue &&\n            context.TryFindCandidate((byte)refresh.Target, out target) &&',
              'target-slot-narrowing')
          behavior_path.write_text(behavior, encoding='utf-8')
          PY
          git add -A

      - name: Verify pinned TerrariaServer 1.4.5.8 contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/decompile-reference.sh 1458
          python3 - <<'PY'
          from pathlib import Path
          import re
          npc = Path('decompiled/1458/Terraria/NPC.cs').read_text(encoding='utf-8', errors='ignore')
          required = [
              'else if (type == 35)', 'width = 80;', 'height = 102;', 'aiStyle = 11;',
              'damage = 32;', 'defense = 10;', 'lifeMax = 4400;',
              'else if (type == 36)', 'width = 52;', 'height = 52;', 'aiStyle = 12;',
              'damage = 20;', 'defense = 14;', 'lifeMax = 600;',
              'if (aiStyle == 11)', 'ai[2] >= 800f', 'ai[2] >= 400f',
              'defense += num173 * 25;', 'int num180 = 270;',
              'if (aiStyle == 12)', 'ai[3] >= 300f', 'ai[2] = 5f;'
          ]
          missing = [needle for needle in required if needle not in npc]
          if missing:
              raise SystemExit('Pinned Skeletron source contract changed: ' + ', '.join(missing))
          if not re.search(r'NewNPC\([^\n]+, 36, whoAmI\);[\s\S]{0,500}?ai\[0\] = -1f;[\s\S]{0,700}?NewNPC\([^\n]+, 36, whoAmI\);[\s\S]{0,500}?ai\[0\] = 1f;[\s\S]{0,300}?ai\[3\] = 150f;', npc):
              raise SystemExit('Pinned two-hand creation order changed.')
          print('skeletron_1458_source_contract=ok')
          PY
      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --nologo
      - name: Focused tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --filter FullyQualifiedName~VanillaSkeletronBehaviorTests --nologo
      - name: Full tests
        run: dotnet test TerraRuntime.slnx -c Release --no-build --nologo
      - name: Commit validated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Add source-backed Skeletron head and hand AI vertical' -m 'Fresh-port TerrariaServer 1.4.5.8 Skeletron head/hand defaults and AI onto current main. Preserve exact two-hand parent ownership, hover/spin and hand attack cycles, daytime enrage/flee and Expert live-hand defense, with focused regressions and full-suite validation.'
          git push --force origin HEAD:work/skeletron-vertical-1458-main
