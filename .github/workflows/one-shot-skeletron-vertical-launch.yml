name: One-shot Skeletron vertical launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-skeletron-vertical-launch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-runtime-skeletron-vertical-launch
  cancel-in-progress: false

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/skeletron-vertical-1458
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply Skeletron patch
        run: python3 tools/ci/apply_skeletron_vertical_1458.py
      - name: Verify pinned TerrariaServer 1.4.5.8 contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/decompile-reference.sh 1458
          python3 - <<'PY'
          from pathlib import Path
          import re
          npc = Path('decompiled/1458/Terraria/NPC.cs').read_text(encoding='utf-8', errors='ignore')
          required = [
              'else if (type == 35)', 'width = 80;', 'height = 102;', 'aiStyle = 11;',
              'damage = 32;', 'defense = 10;', 'lifeMax = 4400;',
              'else if (type == 36)', 'width = 52;', 'height = 52;', 'aiStyle = 12;',
              'damage = 20;', 'defense = 14;', 'lifeMax = 600;',
              'if (aiStyle == 11)', 'ai[2] >= 800f', 'ai[2] >= 400f',
              'defense += num173 * 25;', 'int num180 = 270;',
              'if (aiStyle == 12)', 'ai[3] >= 300f', 'ai[2] = 5f;'
          ]
          missing = [needle for needle in required if needle not in npc]
          if missing:
              raise SystemExit('Pinned Skeletron source contract changed: ' + ', '.join(missing))
          if not re.search(r'NewNPC\([^\n]+, 36, whoAmI\);[\s\S]{0,500}?ai\[0\] = -1f;[\s\S]{0,700}?NewNPC\([^\n]+, 36, whoAmI\);[\s\S]{0,500}?ai\[0\] = 1f;[\s\S]{0,300}?ai\[3\] = 150f;', npc):
              raise SystemExit('Pinned two-hand creation order changed.')
          print('skeletron_1458_source_contract=ok')
          PY
      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --nologo
      - name: Focused tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --filter FullyQualifiedName~VanillaSkeletronBehaviorTests --nologo
      - name: Full tests
        run: dotnet test TerraRuntime.slnx -c Release --no-build --nologo
      - name: Commit validated feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/ci/apply_skeletron_vertical_1458.py .github/workflows/apply-skeletron-vertical-1458.yml
          git config user.name 'Xekep'
          git config user.email 'Xekep@users.noreply.github.com'
          git add -A
          git commit -m 'Add source-backed Skeletron head and hand AI vertical' -m 'Import TerrariaServer 1.4.5.8 head/hand defaults, exact two-hand parent ownership, hover/spin and hand attack cycles, daytime enrage/flee, Expert live-hand defense and LOS-gated skull projectile intents. Pin source evidence, focused regressions, and the N3 roadmap slice.'
          git push origin HEAD:work/skeletron-vertical-1458
