name: Sync verified protocol roadmap once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-verified-protocol-roadmap-once.yml

permissions:
  contents: write

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        run: git pull --rebase origin main

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tests
        run: dotnet restore tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj

      - name: Verify protocol and DoS roadmap evidence
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj
          -c Release
          --no-restore
          --filter "FullyQualifiedName~TerrariaFrameEncoderTests|FullyQualifiedName~TerrariaFrameDecoderFuzzTests|FullyQualifiedName~TypedProtocolDecoderFuzzTests|FullyQualifiedName~ProtocolMalformedFrameCorpusTests|FullyQualifiedName~TerrariaConnectionPolicyRateLimitTests|FullyQualifiedName~TerrariaFrameRejectionTelemetryTests"
          --logger "console;verbosity=minimal"

      - name: Apply verified roadmap state
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/roadmap.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- [ ] `IBufferWriter<byte>` for encoding.":
                  "- [x] `IBufferWriter<byte>` for encoding.",
              "- [ ] Protocol fuzz tests and a permanent malformed-packet corpus.":
                  "- [x] Protocol fuzz tests and a permanent malformed-packet corpus.",
              "- [ ] Independent rate limits for tile edits, liquids, chat, item operations and other expensive packet classes.":
                  "- [x] Independent rate limits for tile edits, liquids, chat, item operations and other expensive packet classes.",
              "- [ ] Distinguish malformed protocol, rate limit, invalid state and gameplay rejection in structured telemetry.":
                  "- [x] Distinguish malformed protocol, rate limit, invalid state and gameplay rejection in structured telemetry.",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one roadmap match for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow
        run: rm .github/workflows/sync-verified-protocol-roadmap-once.yml

      - name: Validate documentation
        run: python3 tools/ci/check_documentation.py

      - name: Commit verified roadmap state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md .github/workflows/sync-verified-protocol-roadmap-once.yml
          git commit -m "docs: record verified protocol hardening"
          git pull --rebase origin main
          git push origin main
