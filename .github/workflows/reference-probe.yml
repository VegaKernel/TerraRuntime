name: Vanilla Reference Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reference-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worldfile-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Collect world references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reference-1458/tile-entities

          find_ref() {
            local filename="$1"
            local class_pattern="$2"
            local src
            src="$(find decompiled/1458 -type f -name "$filename" -print -quit)"
            if [[ -z "$src" ]]; then
              src="$(grep -RIl --include='*.cs' "$class_pattern" decompiled/1458 | head -n 1 || true)"
            fi
            test -n "$src"
            echo "$src"
          }

          world_file="$(find_ref '*WorldFile*.cs' 'class WorldFile')"
          tile_id="$(find_ref 'TileID.cs' 'class TileID')"
          wall_id="$(find_ref 'WallID.cs' 'class WallID')"
          tile="$(find_ref 'Tile.cs' 'class Tile')"
          tile_entity="$(find_ref 'TileEntity.cs' 'class TileEntity')"
          tile_entities_manager="$(find_ref 'TileEntitiesManager.cs' 'class TileEntitiesManager')"

          cp "$world_file" artifacts/reference-1458/WorldFile.cs
          cp "$tile_id" artifacts/reference-1458/TileID.cs
          cp "$wall_id" artifacts/reference-1458/WallID.cs
          cp "$tile" artifacts/reference-1458/Tile.cs
          cp "$tile_entity" artifacts/reference-1458/tile-entities/TileEntity.cs
          cp "$tile_entities_manager" artifacts/reference-1458/tile-entities/TileEntitiesManager.cs

          {
            grep -RIl --include='*.cs' ': TileEntity' decompiled/1458 || true
            grep -RIl --include='*.cs' ': TELeashedEntityAnchor' decompiled/1458 || true
          } | sort -u | while IFS= read -r subtype; do
            base="$(basename "$subtype")"
            echo "TileEntity subtype reference: $subtype"
            cp "$subtype" "artifacts/reference-1458/tile-entities/$base"
          done

          cp decompiled/1458/REFERENCE_SOURCE.txt artifacts/reference-1458/REFERENCE_SOURCE.txt

      - name: Upload local-only reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraria-1458-worldfile-reference
          path: artifacts/reference-1458
          retention-days: 1
