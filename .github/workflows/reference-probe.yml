name: Vanilla Reference Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reference-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worldfile-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Probe NPC load slot semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path("decompiled/1458")

          def extract_braced(text, opening):
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[opening:i + 1]
              return None

          method_pattern = re.compile(
              r"(?:public|private|internal|protected)\s+(?:static\s+)?[A-Za-z0-9_<>,.?\[\]\s]+\s+"
              r"(?P<name>[A-Za-z_][A-Za-z0-9_]*)\s*\([^;{}]*\)\s*\{"
          )

          candidates = []
          marker_files = []
          for path in root.rglob("*.cs"):
              text = path.read_text(errors="ignore")
              file_marker_score = sum(text.count(marker) for marker in (
                  "Main.npc[", ".townNPC", "SavesAndLoads", ".SetDefaults("))
              if file_marker_score:
                  marker_files.append((file_marker_score, path.name))

              for match in method_pattern.finditer(text):
                  body = extract_braced(text, match.end() - 1)
                  if body is None:
                      continue
                  score = (
                      body.count("Main.npc[") * 8
                      + body.count(".SetDefaults(") * 6
                      + body.count(".townNPC") * 4
                      + body.count("SavesAndLoads") * 4
                      + (10 if "LoadNPC" in match.group("name") else 0)
                  )
                  if score:
                      candidates.append((score, path.name, match.group("name"), body))

          if not candidates:
              raise SystemExit("no NPC load semantic candidates found")

          candidates.sort(key=lambda item: item[0], reverse=True)
          score, file_name, method_name, body = candidates[0]

          index_vars = sorted(set(re.findall(r"Main\.npc\[([A-Za-z_][A-Za-z0-9_]*)\]", body)))
          setdefaults_vars = sorted(set(re.findall(r"Main\.npc\[([A-Za-z_][A-Za-z0-9_]*)\]\.SetDefaults", body)))
          zero_initialized = sorted(set(re.findall(r"int\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*0\s*;", body)))
          increment_counts = {name: len(re.findall(rf"\b{re.escape(name)}\s*\+\+", body)) for name in index_vars}
          assignment_counts = {name: len(re.findall(rf"\b{re.escape(name)}\s*=", body)) for name in index_vars}

          town_positions = [m.start() for m in re.finditer(r"\.townNPC", body)]
          persistent_positions = [m.start() for m in re.finditer(r"SavesAndLoads|persistent|Persistent", body)]
          setdefaults_positions = [m.start() for m in re.finditer(r"\.SetDefaults\s*\(", body)]
          increment_positions = {
              name: [m.start() for m in re.finditer(rf"\b{re.escape(name)}\s*\+\+", body)]
              for name in index_vars
          }

          first_town = min(town_positions) if town_positions else -1
          first_persistent = min(persistent_positions) if persistent_positions else -1

          summary = {
              "selectedFile": file_name,
              "selectedMethod": method_name,
              "candidateScore": score,
              "mainNpcIndexVariables": index_vars,
              "setDefaultsIndexVariables": setdefaults_vars,
              "zeroInitializedCounters": zero_initialized,
              "counterIncrementCounts": increment_counts,
              "counterAssignmentCounts": assignment_counts,
              "setDefaultsCallCount": len(setdefaults_positions),
              "townNpcMarkerCount": len(town_positions),
              "persistentMarkerCount": len(persistent_positions),
              "singleMainNpcCounter": len(index_vars) == 1,
              "counterUsedBySetDefaults": len(index_vars) == 1 and index_vars == setdefaults_vars,
              "counterIncrementsBeforeAndAfterPersistentMarker": (
                  len(index_vars) == 1
                  and first_persistent >= 0
                  and any(p < first_persistent for p in increment_positions[index_vars[0]])
                  and any(p > first_persistent for p in increment_positions[index_vars[0]])
              ),
              "townPhasePrecedesPersistentMarker": first_town >= 0 and first_persistent > first_town,
              "setDefaultsBeforeAndAfterPersistentMarker": (
                  first_persistent >= 0
                  and any(p < first_persistent for p in setdefaults_positions)
                  and any(p > first_persistent for p in setdefaults_positions)
              ),
              "topCandidateMethods": [
                  {"file": f, "method": m, "score": s}
                  for s, f, m, _ in candidates[:5]
              ],
              "topMarkerFiles": [
                  {"file": name, "score": s}
                  for s, name in sorted(marker_files, reverse=True)[:5]
              ],
          }
          print("NPC_LOAD_SEMANTICS=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Collect world references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reference-1458/tile-entities
          mkdir -p artifacts/reference-1458/persistence
          mkdir -p artifacts/reference-1458/network

          find_ref() {
            local filename="$1"
            local class_pattern="$2"
            local src
            src="$(find decompiled/1458 -type f -name "$filename" -print -quit)"
            if [[ -z "$src" ]]; then
              src="$(grep -RIl --include='*.cs' "$class_pattern" decompiled/1458 | head -n 1 || true)"
            fi
            test -n "$src"
            echo "$src"
          }

          world_file="$(find_ref '*WorldFile*.cs' 'class WorldFile')"
          tile_id="$(find_ref 'TileID.cs' 'class TileID')"
          wall_id="$(find_ref 'WallID.cs' 'class WallID')"
          npc_id="$(find_ref 'NPCID.cs' 'class NPCID')"
          tile="$(find_ref 'Tile.cs' 'class Tile')"
          tile_entity="$(find_ref 'TileEntity.cs' 'class TileEntity')"
          tile_entities_manager="$(find_ref 'TileEntitiesManager.cs' 'class TileEntitiesManager')"
          town_manager="$(find_ref '*TownRoomManager*.cs' 'class TownRoomManager')"
          bestiary_tracker="$(find_ref '*BestiaryUnlocksTracker*.cs' 'class BestiaryUnlocksTracker')"
          npc_kills_tracker="$(find_ref 'NPCKillsTracker.cs' 'class NPCKillsTracker')"
          npc_sights_tracker="$(find_ref 'NPCWasNearPlayerTracker.cs' 'class NPCWasNearPlayerTracker')"
          npc_chats_tracker="$(find_ref 'NPCWasChatWithTracker.cs' 'class NPCWasChatWithTracker')"
          creative_power_manager="$(find_ref 'CreativePowerManager.cs' 'class CreativePowerManager')"
          creative_powers="$(find_ref 'CreativePowers.cs' 'class CreativePowers')"
          net_message="$(find_ref 'NetMessage.cs' 'class NetMessage')"
          message_buffer="$(find_ref 'MessageBuffer.cs' 'class MessageBuffer')"
          netplay="$(find_ref 'Netplay.cs' 'class Netplay')"
          banner_system="$(find_ref 'BannerSystem.cs' 'class BannerSystem')"
          tree_tops="$(find_ref 'TreeTopsInfo.cs' 'class TreeTopsInfo')"
          extra_spawn_points="$(find_ref 'ExtraSpawnPointManager.cs' 'class ExtraSpawnPointManager')"
          dd2_event="$(find_ref 'DD2Event.cs' 'class DD2Event')"

          cp "$world_file" artifacts/reference-1458/WorldFile.cs
          cp "$tile_id" artifacts/reference-1458/TileID.cs
          cp "$wall_id" artifacts/reference-1458/WallID.cs
          cp "$npc_id" artifacts/reference-1458/NPCID.cs
          cp "$tile" artifacts/reference-1458/Tile.cs
          cp "$tile_entity" artifacts/reference-1458/tile-entities/TileEntity.cs
          cp "$tile_entities_manager" artifacts/reference-1458/tile-entities/TileEntitiesManager.cs
          cp "$town_manager" artifacts/reference-1458/persistence/TownRoomManager.cs
          cp "$bestiary_tracker" artifacts/reference-1458/persistence/BestiaryUnlocksTracker.cs
          cp "$npc_kills_tracker" artifacts/reference-1458/persistence/NPCKillsTracker.cs
          cp "$npc_sights_tracker" artifacts/reference-1458/persistence/NPCWasNearPlayerTracker.cs
          cp "$npc_chats_tracker" artifacts/reference-1458/persistence/NPCWasChatWithTracker.cs
          cp "$creative_power_manager" artifacts/reference-1458/persistence/CreativePowerManager.cs
          cp "$creative_powers" artifacts/reference-1458/persistence/CreativePowers.cs
          cp "$net_message" artifacts/reference-1458/network/NetMessage.cs
          cp "$message_buffer" artifacts/reference-1458/network/MessageBuffer.cs
          cp "$netplay" artifacts/reference-1458/network/Netplay.cs
          cp "$banner_system" artifacts/reference-1458/network/BannerSystem.cs
          cp "$tree_tops" artifacts/reference-1458/network/TreeTopsInfo.cs
          cp "$extra_spawn_points" artifacts/reference-1458/network/ExtraSpawnPointManager.cs
          cp "$dd2_event" artifacts/reference-1458/network/DD2Event.cs

          {
            grep -RIl --include='*.cs' ': TileEntity' decompiled/1458 || true
            grep -RIl --include='*.cs' ': TELeashedEntityAnchor' decompiled/1458 || true
          } | sort -u | while IFS= read -r subtype; do
            base="$(basename "$subtype")"
            echo "TileEntity subtype reference: $subtype"
            cp "$subtype" "artifacts/reference-1458/tile-entities/$base"
          done

          cp decompiled/1458/REFERENCE_SOURCE.txt artifacts/reference-1458/REFERENCE_SOURCE.txt

      - name: Upload local-only reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraria-1458-worldfile-reference
          path: artifacts/reference-1458
          retention-days: 1
