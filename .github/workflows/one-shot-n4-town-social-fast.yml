name: One-shot N4 Town NPC social fast gate

on:
  push:
    branches: [work/n4-town-social-emotes-1458]
    paths:
      - 'tools/ci/apply_n4_town_social_emotes.py'
      - 'tools/ci/apply_n4_town_social_contract_fix.py'
      - '.github/workflows/one-shot-n4-town-social-fast.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/n4-town-social-emotes-1458
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply social block
        run: |
          python3 tools/ci/apply_n4_town_social_emotes.py
          python3 tools/ci/apply_n4_town_social_contract_fix.py
      - name: Build Release
        run: dotnet build TerraRuntime.slnx -c Release
      - name: Run complete tests
        run: dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build
