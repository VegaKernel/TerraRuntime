name: One-shot rebase Muse NPC AI

on:
  push:
    branches: [integrate-muse-npc-ai-final]
    paths:
      - '.github/workflows/one-shot-rebase-muse-npc-ai.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-rebase-muse-npc-ai-final
  cancel-in-progress: false

jobs:
  rebase-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Cherry-pick audited Muse integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git fetch origin integrate-muse-npc-ai
          if ! git cherry-pick 33d979a94e450bdd7055b09bd6c4a4b09fc2757a; then
            echo '--- cherry-pick conflicts ---'
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: Decompile pinned TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Verify source contract
        run: python3 tools/ci/check_npc_ai_017_020_021_source.py
      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py
      - name: Build Release
        run: dotnet build TerraRuntime.slnx -c Release
      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build
      - name: Push fresh-main integration
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:integrate-muse-npc-ai-final
