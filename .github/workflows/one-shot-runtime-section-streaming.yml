name: One-shot movement-driven world section streaming

on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/apply_runtime_section_streaming_fix.py'
      - '.github/workflows/one-shot-runtime-section-streaming.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-runtime-section-streaming
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply runtime section streaming fix
        run: python3 tools/ci/apply_runtime_section_streaming_fix.py

      - name: Validate documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run section streaming regressions
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.PlayerSectionStreamingStateTests

      - name: Run bootstrap planner regressions
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.InitialSectionBootstrapPlannerTests

      - name: Run player bootstrap regressions
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.PlayerBootstrapFrameSinkTests

      - name: Run complete test suite
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit section streaming block and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git rm tools/ci/apply_runtime_section_streaming_fix.py .github/workflows/one-shot-runtime-section-streaming.yml
          git add src/TerraRuntime/PlayerBootstrapFrameSink.cs \
                  src/TerraRuntime/PlayerBootstrapPacketSet.SectionStreaming.cs \
                  src/TerraRuntime/PlayerSectionStreamingState.cs \
                  tests/TerraRuntime.Tests/PlayerSectionStreamingStateTests.cs \
                  docs/roadmap.md
          git commit -m "Stream world sections as players move"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Unable to fast-forward/rebase section streaming block onto current main." >&2
          exit 1
