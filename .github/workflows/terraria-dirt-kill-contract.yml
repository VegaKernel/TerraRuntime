name: Terraria Dirt Kill Contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/probe_dirt_kill.py'
      - 'tools/ci/probe_dirt_item_drop.py'
      - '.github/workflows/terraria-dirt-kill-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-dirt-kill-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dirt-kill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Inspect pinned Terraria 1.4.5.8 KillTile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
          expected="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected" ]]; then assembly="$candidate"; fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          [[ -n "$assembly" ]]
          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.WorldGen "$assembly" > artifacts/source-contract/world-gen.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.TileID "$assembly" > artifacts/source-contract/tile-id.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Item "$assembly" > artifacts/source-contract/item.cs
          python3 tools/ci/probe_dirt_kill.py --world-gen artifacts/source-contract/world-gen.cs --tile-id artifacts/source-contract/tile-id.cs
          python3 tools/ci/probe_dirt_item_drop.py --world-gen artifacts/source-contract/world-gen.cs --item artifacts/source-contract/item.cs
