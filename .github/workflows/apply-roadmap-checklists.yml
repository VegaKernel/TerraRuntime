name: Apply verified roadmap checklists

on:
  push:
    branches:
      - docs/verified-roadmap-checklists-20260829
    paths:
      - .github/workflows/apply-roadmap-checklists.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply checklist status
        run: python3 .github/scripts/apply_roadmap_checklists.py

      - name: Commit generated documentation
        run: |
          rm .github/workflows/apply-roadmap-checklists.yml
          rm .github/scripts/apply_roadmap_checklists.py
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add verified roadmap checklists"
          git push
