name: Apply verified roadmap checklists

on:
  push:
    branches: [docs/verified-roadmap-checklists-20260829]
    paths:
      - .github/workflows/apply-roadmap-checklists.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage verified roadmap checklist update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply checklist status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          policy_note = '> Checkbox policy: `[x]` means the item is verified on `main` by implementation plus tests/CI or an equivalent executable proof. Partial/foundation-only work remains `[ ]`.'

          def clean_text(text: str) -> str:
              return re.sub(r'^\[[ xX]\]\s+', '', text.strip())

          def is_checked(text: str, patterns) -> bool:
              text = clean_text(text)
              return any(pattern in text for pattern in patterns)

          def checkbox_sections(path, section_match, checked_patterns, include_numbered=False):
              p = repo / path
              lines = p.read_text(encoding='utf-8').splitlines()
              out = []
              current_h2 = None
              in_fence = False
              note_added = False
              for line in lines:
                  if line.startswith('```'):
                      in_fence = not in_fence
                      out.append(line)
                      continue
                  if not in_fence and line.startswith('## '):
                      current_h2 = line[3:].strip()
                  active = (not in_fence) and current_h2 is not None and section_match(current_h2)
                  if active:
                      m = re.match(r'^(\s*-\s+)(?:\[[ xX]\]\s+)?(.*)$', line)
                      if m:
                          text = m.group(2)
                          mark = 'x' if is_checked(text, checked_patterns) else ' '
                          line = f'{m.group(1)}[{mark}] {clean_text(text)}'
                      elif include_numbered:
                          m = re.match(r'^(\s*\d+\.\s+)(?:\[[ xX]\]\s+)?(.*)$', line)
                          if m:
                              text = m.group(2)
                              mark = 'x' if is_checked(text, checked_patterns) else ' '
                              line = f'{m.group(1)}[{mark}] {clean_text(text)}'
                  out.append(line)
              text = '\n'.join(out) + '\n'
              if policy_note not in text:
                  first_h2 = text.find('\n## ')
                  if first_h2 >= 0:
                      text = text[:first_h2] + '\n\n' + policy_note + '\n' + text[first_h2:]
              p.write_text(text, encoding='utf-8')

          root_checked = [
              'Keep production code under root `src/`',
              'Keep tests under root `tests/`',
              'Keep locally decompiled official server output under ignored `decompiled/` only',
              'Pin the .NET 11 SDK through `global.json`',
              'Record the exact Terraria dedicated-server version and binary SHA-256',
              'Maintain reproducible local tooling to download and decompile the official server',
              'Add .NET 11 CI for restore, build, test and formatting/analyzers',
              'Keep Linux and Windows NativeAOT publish + native smoke jobs green',
              'Enable nullable, warnings as errors and deterministic builds',
              'Baseline package: `Multiplicity` **2.7.2**, protocol **326 / Terraria 1.4.5.8**',
              'Keep Multiplicity behind the runtime protocol boundary',
              'Incremental parser for `[u16 length][u8 message id][payload]`',
              'Correctly handle fragmented and coalesced TCP reads',
              'Reject impossible lengths, oversized frames and truncated payloads deterministically',
              'Never allocate directly from an untrusted client-declared length without a hard ceiling',
              'Centralize message IDs in one named catalog',
              'Use explicit bounded `TryDecode`/`Decode` contracts',
              '`ReadOnlySpan<byte>` / `Span<byte>` codecs',
              '`SequenceReader<byte>` where segmented input is useful',
              '`PipeReader` / `PipeWriter` compatible framing',
              'Separate byte decoding from gameplay/state validation',
              'Per-message size ceilings',
              'Per-connection rate accounting',
              'Parsing failure returns a bounded error and never crashes the server process',
              'Use `System.IO.Pipelines` or an equivalent measured low-allocation .NET 11 socket pipeline',
              'One read loop and one write path per connection',
              'Bounded outbound queues with an explicit slow-client policy',
              'Use `TCP_NODELAY` unless measurement demonstrates a better policy',
              'Gate maximum concurrent connections before allocating expensive player state',
              'One dedicated game-loop thread owns mutable world, players, NPCs, projectiles, items and progression state',
              'Connections submit typed commands/events through bounded channels',
              'Preserve packet order per connection',
              'The command loop keeps a hard global operation cap, per-source fairness quota',
              'Fixed 60 Hz simulation schedule with an explicit missed-tick policy',
              'Measure both wall time and CPU time',
              'Record timing per simulation phase and report the worst phase',
              'Networking remains asynchronous and independent per connection',
              'CPU-heavy background work uses bounded dedicated workers',
              'Workers receive immutable snapshots or isolated buffers and return results through explicit completion channels',
              'Atomically replace the save only after successful completion',
              'Permit only one save serialization at a time; coalesce redundant autosave requests',
              'Cache corruption/staleness is never canonical world corruption',
              'Any validation/load failure falls back automatically to `.wld`',
              'Ignore client-claimed player slot where server ownership is already known',
              'Validate packet legality against the connection state machine',
              'Reject impossible pre-handshake and pre-spawn operations',
              'Bounds-check coordinates before indexing',
              'Server owns entity identity and lifecycle',
              'Internally use generation/revision handles',
              'External hosts receive only the narrow world-scoped `IInterestManagementControl` toggle',
              'The standalone host accepts `--interest-management`',
              'Spatial policy, cell/section layout, radii, hysteresis, full-resync rules and entity-specific routing remain internal TerraRuntime details',
              'Disabling interest management is fail-open',
              'Current foundation tracks authoritative player positions in a section-based compact bitset index',
              'Invalid/non-finite/out-of-world positions are removed from spatial membership',
              '.NET 11 NativeAOT',
              '`linux-x64` and `win-x64` are exercised production targets',
              'native executable startup plus exercised loop/protocol/network/world smoke paths are required in CI',
              'Operations read models are immutable/bounded projections',
              'TUI must never traverse mutable world/player/NPC collections',
              'TUI has its own event loop/thread',
              'Administrative mutations are marshalled back through the same game-loop command boundary',
              'TUI failure is not a server-readiness failure',
              'Use Terminal.Gui v2 as the first UI implementation',
              'Dashboard: lifecycle, world, TPS/tick phase, players, queues, packet rates, memory/GC, save/cache state, warnings and recent structured logs',
              'Logs viewer uses bounded retention, filters and follow/pause',
              'Tick CPU/wall duration and worst phase',
              'Command processed/deferred counts, budget exhaustion count and oldest pending command age',
              'Queue depth and slow-client drops',
              'Active players/NPCs/projectiles/items',
              'Spatial-index membership/section changes/invalid-position counters',
              'Pin critical packet layouts to known-good bytes',
              'First load existing vanilla worlds correctly',
          ]
          checkbox_sections(
              'docs/roadmap.md',
              lambda h: h.startswith('Phase '),
              root_checked,
              include_numbered=True,
          )

          decomposition_checked = [
              'add typed vanilla IDs',
              'add version-pinned catalogs',
              'central range validation',
              'selected independent verification tests',
              'typed inventory layout',
              'prefix/stack normalization',
              'projectile definitions',
              'typed lifecycle/provenance',
              'align with custom projectile extension pipeline',
              'NPC definitions',
              'align with custom NPC extension pipeline',
              'entity type identity is impossible to casually confuse with entity slot/generation identity',
              'projectile/NPC behavior is decomposed enough to support the extension contracts without packet hacks',
              'TShock/Terraria assemblies are not runtime dependencies',
              'all generated/catalog code remains clean under Linux and Windows NativeAOT publication',
          ]
          checkbox_sections(
              'docs/roadmap/gameplay-decomposition-and-catalogs.md',
              lambda h: h in {'23. Migration order', '24. Definition of done'},
              decomposition_checked,
          )

          worldgen_checked = [
              'stable behavior/archetype IDs',
              'explicit AOT-safe registration API',
              'immutable registry snapshots and tick-boundary swap',
              'extension diagnostics identity',
              'extension RNG service',
              'extension-state lifecycle primitive',
              'vanilla/default dispatch',
              'decorators',
              'exclusive replacement',
              'spawn/tick/despawn hooks',
              'dedicated projectile pipeline',
              'collision/hit/kill semantics',
              'server-defined NPC/projectile archetype descriptors',
              'vanilla presentation mapping',
              'snapshot/diagnostic identity',
              'explicit persistence semantics',
              'provider/pass contracts',
              'stable pass IDs/dependencies',
              'deterministic planner',
              'isolated workspace',
              'progress/cancellation',
              'isolated deterministic RNG mode',
              'a host can explicitly register an NPC decorator and replacement without reflection or runtime assembly scanning',
              'a host can explicitly register a projectile decorator and replacement through a dedicated projectile contract',
              'custom server-side NPC/projectile archetypes can use vanilla client presentations safely',
              'a custom world-generation provider can add/replace passes in a deterministic validated plan',
              'failed/cancelled generation cannot partially commit a world',
              'Linux and Windows NativeAOT smoke paths remain green with the extension contracts present',
          ]
          checkbox_sections(
              'docs/roadmap/gameplay-worldgen-extensibility.md',
              lambda h: h in {'15. Delivery order', 'Definition of done'},
              worldgen_checked,
          )

          actors_checked = [
              'stable actor/controller IDs',
              'generation-safe NPC control bindings',
              '`Stop`, `MoveTo`, `FollowPlayer` command state',
              'player snapshot query adapter',
              'NPC control stepper integrated with existing behavior/world-motion path',
              'target disconnect/generation change handling',
              'focused tests proving movement goes through authoritative NPC physics rather than position teleport',
              'stable `ShopId` and registration lease',
              'immutable shop catalog snapshot',
              'vanilla item/price validation',
              'atomic inventory + coin transaction path',
              'server-owned player identity/slot allocation separate from connection ownership',
              'the NPC continues to replicate through the ordinary authoritative NPC path',
              'player disconnect/slot reuse cannot redirect the NPC to a different generation by accident',
              'a purchase is validated and committed atomically by TerraRuntime, not by direct plugin inventory mutation',
              'a fake player can exist without a client connection and is allocated without colliding with real-player slots',
              'real clients cannot seize control of a fake player\'s slot',
          ]
          checkbox_sections(
              'docs/roadmap/runtime-controlled-actors-and-commerce.md',
              lambda h: h in {'Delivery order', 'Definition of done'},
              actors_checked,
          )

          host_checked = [
              'TerraRuntime core remains buildable and smoke-tested under NativeAOT on Linux x64 and Windows x64',
              'CoreCLR production defaults include Server GC, Tiered Compilation, Dynamic PGO and ReadyToRun',
          ]
          checkbox_sections(
              'docs/roadmap/runtime-host-plugin-architecture.md',
              lambda h: h == 'Acceptance criteria',
              host_checked,
              include_numbered=True,
          )

          checkbox_sections(
              'docs/roadmap/runtime-logging-pipeline.md',
              lambda h: h in {'16. Delivery order', 'Definition of done'},
              [],
          )

          ownership_checked = [
              '**Connection/session identity + generation**',
              '**Entity lifecycle foundation**',
              '**Immutable snapshots + generation/revision mutation model**',
              '**Native authoritative scheduler primitives**',
              '**Replication layer separated from connection registry**',
              '**Runtime/network/security telemetry**',
              '**Save/runtime-world snapshot improvements**',
              'connection/player identity enforcement is runtime-owned',
              'Multiplicity remains the shared protocol codec/model implementation',
              'snapshots are immutable and runtime-owned',
              'revision-guarded mutations reject stale state deterministically',
              'connection registry is not the owner of gameplay/spatial recipient policy',
              'replication has an explicit planner/recipient boundary',
              'hard visibility and spatial interest are modeled separately',
              'AOI internals remain TerraRuntime-owned and Vega can only use documented controls',
              'runtime metrics originate in TerraRuntime and are consumable by Vega/TUI/API',
              'world/save cache formats do not depend on Vega application internals',
          ]
          checkbox_sections(
              'docs/roadmap/vega-runtime-ownership-migration.md',
              lambda h: h in {'24. Migration order', '26. Acceptance criteria'},
              ownership_checked,
              include_numbered=True,
          )

          def insert_status(path, before_heading, body):
              p = repo / path
              text = p.read_text(encoding='utf-8')
              marker = '## Verified implementation checklist'
              if marker in text:
                  return
              idx = text.find(before_heading)
              if idx < 0:
                  raise RuntimeError(f'Cannot find insertion heading {before_heading!r} in {path}')
              block = '## Verified implementation checklist\n\n' + policy_note + '\n\n' + body.strip() + '\n\n'
              text = text[:idx] + block + text[idx:]
              p.write_text(text, encoding='utf-8')

          insert_status(
              'docs/roadmap/performance-tick-stability.md',
              '## 1. Global per-tick work budgets',
              '''- [x] Dedicated authoritative loop with wall/CPU timing.
          - [x] Bounded worker pool with explicit completion handoff.
          - [x] Bounded per-connection outbound queues with slow-client signaling.
          - [x] Server-authoritative player identity/movement relay with a real two-client TCP movement smoke.
          - [x] Runtime-owned interest-management control/routing boundary.
          - [x] Single-active-save coalescing scheduler.
          - [x] Atomic save-file writer.
          - [ ] End-to-end staged/fair join work budget under mass join.
          - [ ] Encoded section cache with section-local invalidation and bounded memory.
          - [ ] Full dirty-section-driven sync/save architecture.
          - [ ] Actual AOI packet suppression with enter/leave hysteresis and forced resync.
          - [ ] Complete 24/64/128/255-connection stress acceptance matrix.''',
          )

          insert_status(
              'docs/roadmap/runtime-world-cache.md',
              '## Current runtime snapshot format',
              '''- [x] Self-contained warm startup from `.runtime-world` without reading the source `.wld` contents.
          - [x] Integrity-checked embedded canonical checkpoint, tile shards and liquid runtime queues.
          - [x] Missing/stale/corrupt runtime snapshot falls back safely to canonical `.wld`.
          - [x] Snapshot rebuild writes a temporary file, flushes it and atomically replaces the old snapshot.
          - [x] `--save-wld` atomically exports the embedded canonical checkpoint and refreshes the runtime snapshot source stamp.
          - [x] Machine-readable startup profiling plus official cold/warm startup workflow coverage.
          - [ ] Complete vanilla `WorldFileWriter` capable of serializing fresh live runtime state into a new `.wld`.
          - [ ] `--save-wld` exports all runtime-only live mutations rather than only the canonical checkpoint represented by the snapshot.''',
          )

          insert_status(
              'docs/roadmap/terminal-ui-reuse.md',
              '## Current implementation',
              '''- [x] Local Terminal.Gui v2 operations UI exists and is exercised.
          - [x] Views consume immutable/bounded operations snapshots instead of mutable runtime stores.
          - [x] Administrative interest-management mutation crosses the authoritative command boundary.
          - [x] TUI runs independently from the authoritative loop and TUI failure/exit does not stop the server.
          - [x] Dashboard, Players, NPCs, Projectiles, Network, World and Logs views are implemented.
          - [x] CoreCLR and Linux/Windows NativeAOT CI exercise the TUI smoke path.
          - [ ] Remote administration protocol/adapter.
          - [ ] Separate reusable remote administration client.
          - [ ] Dynamic external/plugin UI windows for a future CoreCLR administration client.''',
          )

          # Remove the temporary updater from the final branch tree.
          Path('.github/workflows/apply-roadmap-checklists.yml').unlink()
          PY

      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add docs/roadmap.md docs/roadmap .github/workflows/apply-roadmap-checklists.yml
          git diff --cached --check
          git commit -m "docs: add verified roadmap checklists"
          git push
