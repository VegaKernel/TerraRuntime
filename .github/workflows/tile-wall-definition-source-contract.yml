name: Tile Wall Definition Source Contract

on:
  pull_request:
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs'
      - 'src/TerraRuntime.World/VanillaTileWallDefinitionCatalogs.cs'
      - 'src/TerraRuntime.World/VanillaWorldCollision.cs'
      - 'src/TerraRuntime.World/VanillaWorldFrameImportance326.cs'
      - 'tests/TerraRuntime.Tests/VanillaTileWallDefinitionCatalogTests.cs'
      - 'tools/ci/probe_tile_wall_definitions.py'
      - 'docs/en/tile-wall-definitions.md'
      - 'docs/ru/tile-wall-definitions.md'
      - 'docs/roadmap/gameplay-decomposition-and-catalogs.md'
      - '.github/workflows/tile-wall-definition-source-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs'
      - 'src/TerraRuntime.World/VanillaTileWallDefinitionCatalogs.cs'
      - 'src/TerraRuntime.World/VanillaWorldCollision.cs'
      - 'src/TerraRuntime.World/VanillaWorldFrameImportance326.cs'
      - 'tests/TerraRuntime.Tests/VanillaTileWallDefinitionCatalogTests.cs'
      - 'tools/ci/probe_tile_wall_definitions.py'
      - 'docs/en/tile-wall-definitions.md'
      - 'docs/ru/tile-wall-definitions.md'
      - 'docs/roadmap/gameplay-decomposition-and-catalogs.md'
      - '.github/workflows/tile-wall-definition-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-tile-wall-definition-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tile-wall-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: >-
          dotnet tool install ilspycmd
          --tool-path .tools
          --version 11.0.0.9375

      - name: Probe tile and wall definitions
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="4b87890ac53d40f61db5f928693a379acf4ccbd8ed3b47eb32fb096f145df034"
          assembly=""

          while IFS= read -r -d '' candidate; do
            candidate_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
            if [[ "$candidate_sha256" == "$expected_sha256" ]]; then assembly="$candidate"; fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)

          if [[ -z "$assembly" ]]; then
            echo "Pinned TerrariaServer 1.4.5.8 source assembly was not found." >&2
            exit 1
          fi

          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Main "$assembly" > artifacts/source-contract/main.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.TileID "$assembly" > artifacts/source-contract/tile-id.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.WallID "$assembly" > artifacts/source-contract/wall-id.cs

          python3 tools/ci/probe_tile_wall_definitions.py \
            --main artifacts/source-contract/main.cs \
            --tile-id artifacts/source-contract/tile-id.cs \
            --wall-id artifacts/source-contract/wall-id.cs
