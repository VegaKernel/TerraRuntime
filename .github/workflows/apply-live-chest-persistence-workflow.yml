name: Apply live chest restart persistence proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-live-chest-persistence-workflow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add graceful shutdown persistence step to Vanilla World Load
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/vanilla-world-load.yml")
          text = path.read_text(encoding="utf-8")

          old_filter = "      - 'tools/ci/live_chest_observer_probe.py'\n"
          new_filter = (
              "      - 'tools/ci/live_chest_observer_probe.py'\n"
              "      - 'tools/ci/live_chest_persistence_probe.py'\n"
          )
          if text.count(old_filter) != 1:
              raise SystemExit("expected one live_chest_observer_probe path filter")
          text = text.replace(old_filter, new_filter, 1)

          marker = "      - name: Prove warm world and bootstrap snapshot startup without reading source world\n"
          if text.count(marker) != 1:
              raise SystemExit("expected one warm-cache step marker")

          persistence_step = r'''      - name: Prove live chest mutation survives graceful shutdown and restart
        shell: bash
        run: |
          set -euo pipefail
          world="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld"
          host_log="$GITHUB_WORKSPACE/artifacts/terraruntime-persistence-server.log"
          restart_log="$GITHUB_WORKSPACE/artifacts/terraruntime-persistence-restart.log"
          mutation_log="$GITHUB_WORKSPACE/artifacts/terraruntime-persistence-client.log"
          restart_client_log="$GITHUB_WORKSPACE/artifacts/terraruntime-persistence-restart-client.log"
          assert_log="$GITHUB_WORKSPACE/artifacts/terraruntime-persistence-wld-assert.log"
          server_dll="$GITHUB_WORKSPACE/src/TerraRuntime/bin/Release/net11.0/TerraRuntime.Server.dll"
          cache="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.runtime-world"
          bootstrap_cache="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.runtime-bootstrap"

          chest_info="$(dotnet run \
            --project tools/TerraRuntime.ChestLocate/TerraRuntime.ChestLocate.csproj \
            -c Release \
            -- "$world" | tail -1)"
          echo "selected_persistence_chest $chest_info" | tee "$GITHUB_WORKSPACE/artifacts/terraruntime-persistence-selection.txt"

          chest_id="" x="" y="" slots="" item_slot="" item_stack="" item_prefix="" item_net_id=""
          for field in $chest_info; do
            case "$field" in
              slot=*) chest_id="${field#slot=}" ;;
              x=*) x="${field#x=}" ;;
              y=*) y="${field#y=}" ;;
              slots=*) slots="${field#slots=}" ;;
              itemSlot=*) item_slot="${field#itemSlot=}" ;;
              itemStack=*) item_stack="${field#itemStack=}" ;;
              itemPrefix=*) item_prefix="${field#itemPrefix=}" ;;
              itemNetId=*) item_net_id="${field#itemNetId=}" ;;
            esac
          done
          test -n "$chest_id" -a -n "$x" -a -n "$y" -a -n "$slots"
          test -n "$item_slot" -a -n "$item_stack" -a -n "$item_prefix" -a -n "$item_net_id"

          if (( item_stack < 32767 )); then
            committed_stack=$((item_stack + 1))
          else
            committed_stack=$((item_stack - 1))
          fi
          test "$committed_stack" -gt 0
          test "$committed_stack" -ne "$item_stack"

          rm -f "$cache" "$bootstrap_cache"
          dotnet "$server_dll" \
            --world "$world" \
            --port 17784 \
            --max-players 2 \
            > "$host_log" 2>&1 &
          host_pid=$!

          cleanup_persistence() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup_persistence EXIT

          for _ in $(seq 1 120); do
            if ! kill -0 "$host_pid" 2>/dev/null; then
              cat "$host_log" >&2
              echo "Persistence TerraRuntime host exited before opening the listener." >&2
              exit 1
            fi
            if grep -q "TerraRuntime listening on 0.0.0.0:17784" "$host_log"; then
              break
            fi
            sleep 0.5
          done
          grep -q "startup_profile source=canonical-wld" "$host_log"
          grep -q "TerraRuntime listening on 0.0.0.0:17784" "$host_log"

          python3 tools/ci/live_chest_persistence_probe.py \
            --port 17784 \
            --chest-id "$chest_id" \
            --x "$x" \
            --y "$y" \
            --slots "$slots" \
            --item-slot "$item_slot" \
            --item-stack "$item_stack" \
            --item-prefix "$item_prefix" \
            --item-net-id "$item_net_id" \
            2>&1 | tee "$mutation_log"
          grep -q "committedStack=$committed_stack" "$mutation_log"

          # SIGINT follows the host's Console.CancelKeyPress path and therefore exercises the real
          # command drain -> owner stop -> final detached snapshot -> atomic .wld replacement lifecycle.
          kill -INT "$host_pid"
          for _ in $(seq 1 120); do
            if ! kill -0 "$host_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if kill -0 "$host_pid" 2>/dev/null; then
            cat "$host_log" >&2
            echo "TerraRuntime did not exit after graceful SIGINT." >&2
            exit 1
          fi
          set +e
          wait "$host_pid"
          host_status=$?
          set -e
          test "$host_status" -eq 0
          trap - EXIT

          grep -q "Canonical tile/chest/clock world checkpoint committed:" "$host_log"
          test ! -e "$cache"
          test ! -e "$bootstrap_cache"

          dotnet run \
            --project tools/TerraRuntime.ChestLocate/TerraRuntime.ChestLocate.csproj \
            -c Release \
            -- "$world" --assert "$chest_id" "$item_slot" "$committed_stack" "$item_prefix" "$item_net_id" \
            2>&1 | tee "$assert_log"
          grep -q "persisted_chest_item_ok" "$assert_log"

          # Restart from the rewritten canonical .wld and verify the live protocol exposes the same item.
          dotnet "$server_dll" \
            --world "$world" \
            --port 17785 \
            --max-players 2 \
            > "$restart_log" 2>&1 &
          restart_pid=$!

          cleanup_restart() {
            kill "$restart_pid" 2>/dev/null || true
            wait "$restart_pid" 2>/dev/null || true
          }
          trap cleanup_restart EXIT

          for _ in $(seq 1 120); do
            if ! kill -0 "$restart_pid" 2>/dev/null; then
              cat "$restart_log" >&2
              echo "Persistence restart host exited before opening the listener." >&2
              exit 1
            fi
            if grep -q "TerraRuntime listening on 0.0.0.0:17785" "$restart_log"; then
              break
            fi
            sleep 0.5
          done
          grep -q "startup_profile source=canonical-wld" "$restart_log"

          python3 tools/ci/live_chest_open_probe.py \
            --port 17785 \
            --chest-id "$chest_id" \
            --x "$x" \
            --y "$y" \
            --slots "$slots" \
            --item-slot "$item_slot" \
            --item-stack "$committed_stack" \
            --item-prefix "$item_prefix" \
            --item-net-id "$item_net_id" \
            2>&1 | tee "$restart_client_log"

          # Do not gracefully save the verifier's transient mutate/restore cycle. Abrupt cleanup leaves
          # the canonical checkpoint proven above untouched while preserving freshly rebuilt warm caches
          # for the next workflow step.
          kill "$restart_pid" 2>/dev/null || true
          wait "$restart_pid" 2>/dev/null || true
          trap - EXIT
          test -s "$cache"
          test -s "$bootstrap_cache"
          cat "$host_log"
          cat "$restart_log"

'''

          text = text.replace(marker, persistence_step + marker, 1)

          failure_marker = "            artifacts/terraruntime-chest-selection.txt\n"
          failure_extra = (
              "            artifacts/terraruntime-chest-selection.txt\n"
              "            artifacts/terraruntime-persistence-server.log\n"
              "            artifacts/terraruntime-persistence-restart.log\n"
              "            artifacts/terraruntime-persistence-client.log\n"
              "            artifacts/terraruntime-persistence-restart-client.log\n"
              "            artifacts/terraruntime-persistence-wld-assert.log\n"
              "            artifacts/terraruntime-persistence-selection.txt\n"
          )
          if text.count(failure_marker) != 1:
              raise SystemExit("expected one failure artifact insertion marker")
          text = text.replace(failure_marker, failure_extra, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate workflow YAML shape
        shell: python
        run: |
          from pathlib import Path
          text = Path('.github/workflows/vanilla-world-load.yml').read_text(encoding='utf-8')
          assert text.count('Prove live chest mutation survives graceful shutdown and restart') == 1
          assert text.count("'tools/ci/live_chest_persistence_probe.py'") == 1
          assert 'kill -INT "$host_pid"' in text
          assert 'persisted_chest_item_ok' in text

      - name: Commit live persistence proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-live-chest-persistence-workflow.yml
          git add .github/workflows/vanilla-world-load.yml
          git commit -m "ci: prove chest persistence across restart"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
