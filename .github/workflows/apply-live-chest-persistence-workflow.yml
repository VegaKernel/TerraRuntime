name: Apply live chest restart persistence proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-live-chest-persistence-workflow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch Vanilla World Load
        run: python3 tools/ci/apply_live_chest_persistence_workflow.py

      - name: Commit live persistence proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-live-chest-persistence-workflow.yml
          git add .github/workflows/vanilla-world-load.yml
          git commit -m "ci: prove chest persistence across restart"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
