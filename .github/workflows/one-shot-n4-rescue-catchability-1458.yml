name: One-shot N4 Rescue Catchability 1458

on:
  push:
    branches: [work/n4-rescue-catchability-1458]
    paths:
      - 'tools/ci/apply_n4_rescue_catchability_1458.py'
      - '.github/workflows/one-shot-n4-rescue-catchability-1458.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n4-rescue-catchability-1458
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: work/n4-rescue-catchability-1458
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply N4 rescue catchability block
        run: python3 tools/ci/apply_n4_rescue_catchability_1458.py
      - name: Validate bilingual documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py
      - name: Restore
        run: dotnet restore TerraRuntime.slnx
      - name: Build
        shell: bash
        run: |
          set +e
          dotnet build TerraRuntime.slnx -c Release --no-restore 2>&1 | tee /tmp/n4-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            tail -n 350 /tmp/n4-build.log > n4-rescue-catchability-diagnostics.txt
            git config user.name Xekep
            git config user.email Xekep@users.noreply.github.com
            git add n4-rescue-catchability-diagnostics.txt
            git commit -m 'Capture N4 rescue catchability build diagnostics'
            git push origin HEAD:work/n4-rescue-catchability-1458
            exit "$status"
          fi
      - name: Full test suite
        shell: bash
        run: |
          set +e
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --logger 'console;verbosity=normal' 2>&1 | tee /tmp/n4-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            grep -n -C 20 -E 'Failed |Error Message:|Stack Trace:|Test Run Failed|Failed:' /tmp/n4-tests.log > n4-rescue-catchability-diagnostics.txt || tail -n 350 /tmp/n4-tests.log > n4-rescue-catchability-diagnostics.txt
            git config user.name Xekep
            git config user.email Xekep@users.noreply.github.com
            git add n4-rescue-catchability-diagnostics.txt
            git commit -m 'Capture N4 rescue catchability test diagnostics'
            git push origin HEAD:work/n4-rescue-catchability-1458
            exit "$status"
          fi
      - name: Commit integrated N4 block
        shell: bash
        run: |
          rm -f n4-rescue-catchability-diagnostics.txt
          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Integrate source-backed NPC rescue and catchability'
          git push origin HEAD:work/n4-rescue-catchability-1458
