name: NPC AI 017 020 021 Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaNpcAi17_20_21Catalog1458.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaVultureMotion1458.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaSpikeBallMotion1458.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaBlazingWheelMotion1458.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaNpcAi17_20_21BehaviorStrategies.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaNpcDefinitionCatalog.cs'
      - 'src/TerraRuntime.Core/Npcs/RuntimeNpcStateOwnershipPolicy.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaNpcAiCoverageCatalog.cs'
      - 'src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs'
      - 'tests/TerraRuntime.Tests/VanillaNpcAi17_20_21Tests.cs'
      - 'tests/TerraRuntime.Tests/VanillaNpcAiCoverageCatalogTests.cs'
      - 'tools/ci/check_npc_ai_017_020_021_source.py'
      - '.github/workflows/npc-ai-017-020-021-source-contract.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile pinned TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Verify source contract
        run: python3 tools/ci/check_npc_ai_017_020_021_source.py
      - name: Build Release
        run: dotnet build TerraRuntime.slnx -c Release
      - name: Focused regression tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~VanillaNpcAi17_20_21Tests|FullyQualifiedName~VanillaNpcAiCoverageCatalogTests'
