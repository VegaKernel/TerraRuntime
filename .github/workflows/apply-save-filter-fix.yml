name: Apply Save Filter Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-save-filter-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch save workflow filters
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/authoritative-world-save.yml')
          text = path.read_text()
          replacements = [
              (
                  'dotnet vstest tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll\n          --TestCaseFilter:FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldSnapshotPreservedSectionsTests',
                  'dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build\n          --filter "FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldSnapshotPreservedSectionsTests"'
              ),
              (
                  'dotnet vstest tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll\n          --TestCaseFilter:FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldTileChestSaveServiceTests',
                  'dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build\n          --filter "FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldTileChestSaveServiceTests"'
              ),
              (
                  'dotnet vstest tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll\n          --TestCaseFilter:FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldCheckpointRecoveryTests',
                  'dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build\n          --filter "FullyQualifiedName~TerraRuntime.Tests.RuntimeWorldCheckpointRecoveryTests"'
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one filter replacement, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit filter fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/authoritative-world-save.yml
          git commit -m 'ci: isolate authoritative save test suites'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
