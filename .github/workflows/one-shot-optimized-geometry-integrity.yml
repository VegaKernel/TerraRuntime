name: One-shot optimized geometry integrity

# Re-run from the current main after the section-cache fixture/API moved forward.
on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/apply_optimized_geometry_integrity.py'
      - '.github/workflows/one-shot-optimized-geometry-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-optimized-geometry-integrity
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply geometry integrity block
        run: python3 tools/ci/apply_optimized_geometry_integrity.py

      - name: Validate bilingual documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run complete test suite including optimized worldgen regressions
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit geometry block and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git rm tools/ci/apply_optimized_geometry_integrity.py \
                 .github/workflows/one-shot-optimized-geometry-integrity.yml
          git add src/TerraRuntime.World/Generation/Common/WorldGenerationGeometry.cs \
                  src/TerraRuntime.World/Generation/Optimized/OptimizedWorldGenerationProvider.cs \
                  src/TerraRuntime.World/Generation/Optimized/OptimizedLandmarkWorldGenerationProvider.cs \
                  src/TerraRuntime.World/Generation/Optimized/OptimizedSurfaceDecorationWorldGenerationProvider.cs \
                  tests/TerraRuntime.Tests/OptimizedWorldGenerationProviderTests.cs \
                  docs/roadmap/optimized-worldgen.md \
                  docs/roadmap/vanilla-worldgen-visual-parity-audit-2026-08-31.md \
                  docs/en/optimized-world-generation.md \
                  docs/ru/optimized-world-generation.md
          git commit -m "Harden optimized world geometry"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Unable to rebase optimized geometry block onto current main." >&2
          exit 1
