name: One-shot town schedule integration

on:
  push:
    branches: [agent/town-schedule-merge-20260831]
    paths:
      - 'tools/ci/apply_town_schedule_integration.py'
      - '.github/workflows/one-shot-town-schedule-integration.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-town-schedule-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply integration patch
        run: python3 tools/ci/apply_town_schedule_integration.py
      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release
      - name: Town move-in and schedule tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build -- --filter-class TerraRuntime.Tests.RuntimeTownNpcMoveInSchedule1458Tests
      - name: Commit integrated staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git rm tools/ci/apply_town_schedule_integration.py .github/workflows/one-shot-town-schedule-integration.yml
          git add src/TerraRuntime/ServerRuntimeState.cs src/TerraRuntime/TerrariaServerHost.cs src/TerraRuntime/VanillaHousingValidator1458.cs
          git commit -m "Stage authoritative town move-in and home schedule integration"
          git push origin HEAD:agent/town-schedule-merge-20260831
