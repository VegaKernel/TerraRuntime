name: Apply Bone Arrow 474 Runtime Slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectile-ai1-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply source-backed BoneArrowFromMerchant slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 -m py_compile .github/scripts/apply_bone_arrow_474.py
          python3 .github/scripts/apply_bone_arrow_474.py
          python3 -m py_compile tools/ci/probe_projectile_tile_cut.py
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj --configuration Release

          git config user.name OpenAI
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply_bone_arrow_474.py
          git add src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs \
                  src/TerraRuntime.Contracts/Gameplay/VanillaProjectileDefinitionCatalog.cs \
                  src/TerraRuntime/VanillaProjectileWorldStateStepper.cs \
                  tests/TerraRuntime.Tests/VanillaProjectileDefinitionCatalogTests.cs \
                  tests/TerraRuntime.Tests/VanillaProjectileWorldStateStepperTests.cs \
                  tests/TerraRuntime.Tests/ServerRuntimeVanillaProjectileSimulationTests.cs \
                  tools/ci/probe_projectile_tile_cut.py
          git commit -m 'feat: simulate bone arrow merchant world flight'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
