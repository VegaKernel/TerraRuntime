name: Apply Seed Bone Shard Runtime Slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectile-ai1-candidates-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed Seed and Bone Shard slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          # Workflow files are committed afterward through the normal connector, because the Actions token
          # cannot update workflow definitions. Keep the production/probe patch here and cut off workflow/docs tails.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_seed_bone_shard.py')
          text = path.read_text(encoding='utf-8')
          marker = '# Source workflow now supplies ProjectileID so table-backed wind behavior stays pinned forever.'
          if text.count(marker) != 1:
              raise SystemExit('expected one source-workflow tail marker')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY

          python3 .github/scripts/apply_seed_bone_shard.py
          python3 -m py_compile tools/ci/probe_projectile_tile_cut.py
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj --configuration Release

          git rm -f .github/scripts/apply_seed_bone_shard.py
          git config user.name OpenAI
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs \
                  src/TerraRuntime.Contracts/Gameplay/VanillaProjectileDefinitionCatalog.cs \
                  src/TerraRuntime/VanillaProjectileWorldStateStepper.cs \
                  tests/TerraRuntime.Tests/VanillaProjectileDefinitionCatalogTests.cs \
                  tests/TerraRuntime.Tests/VanillaProjectileWorldStateStepperTests.cs \
                  tests/TerraRuntime.Tests/ServerRuntimeVanillaProjectileSimulationTests.cs \
                  tools/ci/probe_projectile_tile_cut.py
          git commit -m 'feat: simulate seed and bone shard world flight'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
