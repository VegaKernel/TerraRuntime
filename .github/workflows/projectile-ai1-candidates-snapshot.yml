name: Projectile AI1 Candidates Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectile-ai1-candidates-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Inspect pinned aiStyle1 set-backed facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/ai1 .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then assembly="$candidate"; fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          assembly_dir="$(dirname "$assembly")"

          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Projectile "$assembly" > artifacts/ai1/projectile.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.ProjectileID "$assembly" > artifacts/ai1/projectile-id.cs
          .tools/ilspycmd --disable-updatecheck -l c "$assembly" > artifacts/ai1/classes.txt

          nested="$(grep -E 'Terraria\.ID\.ProjectileID.*Sets' artifacts/ai1/classes.txt | head -n 1 | sed -E 's/^[^ ]+ //')"
          if [[ -n "$nested" ]]; then
            .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t "$nested" "$assembly" > artifacts/ai1/projectile-id-sets.cs || true
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          projectile = Path('artifacts/ai1/projectile.cs').read_text(encoding='utf-8')
          projectile_id = Path('artifacts/ai1/projectile-id.cs').read_text(encoding='utf-8')
          sets_path = Path('artifacts/ai1/projectile-id-sets.cs')
          sets = sets_path.read_text(encoding='utf-8') if sets_path.exists() else ''
          classes = Path('artifacts/ai1/classes.txt').read_text(encoding='utf-8')
          candidates = (51, 1124)

          def compact(text):
              return ' '.join(text.split())

          def method(src, name):
              m = re.search(rf'(?m)^[ \t]*(?:public|private|protected|internal)\b[^\n;{{]*\b{re.escape(name)}\s*\([^\n)]*\)[^\n;{{]*$', src)
              if not m:
                  return '<method-not-found>'
              opening = src.find('{', m.end())
              depth = 0
              in_string = in_char = escaped = False
              for i in range(opening, len(src)):
                  c = src[i]
                  if escaped:
                      escaped = False
                      continue
                  if c == '\\' and (in_string or in_char):
                      escaped = True
                      continue
                  if c == '"' and not in_char:
                      in_string = not in_string
                      continue
                  if c == "'" and not in_string:
                      in_char = not in_char
                      continue
                  if in_string or in_char:
                      continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return src[m.start():i+1]
              return '<unterminated>'

          def around(text, needle, radius=1800):
              s = compact(text)
              p = s.find(needle)
              if p < 0:
                  return '<none>'
              return s[max(0, p-radius):min(len(s), p+len(needle)+radius)]

          def all_number_contexts(text, number, radius=450, limit=20):
              s = compact(text)
              out=[]
              for m in re.finditer(rf'(?<!\d){number}(?!\d)', s):
                  out.append(s[max(0,m.start()-radius):min(len(s),m.end()+radius)])
                  if len(out) >= limit: break
              return ' | '.join(out) if out else '<none>'

          combined_sets = projectile_id + '\n' + sets
          wind_method = method(projectile, 'ShouldUseWindPhysics')
          can_cut_method = method(projectile, 'CanCutTiles')
          set_defaults = method(projectile, 'SetDefaults')

          lines = [
              'projectile_should_use_wind=' + compact(wind_method),
              'projectile_can_cut_tiles=' + compact(can_cut_method),
              'wind_set_context=' + around(combined_sets, 'WindPhysicsImmunity', 3500),
              'tile_cut_set_context=' + around(combined_sets, 'CanCutTiles', 2600),
              'sets_type_listing=' + ' | '.join(line.strip() for line in classes.splitlines() if 'ProjectileID' in line and 'Sets' in line),
          ]
          for t in candidates:
              lines.extend([
                  f'type{t}_projectile_id_context=' + all_number_contexts(projectile_id, t, 260, 8),
                  f'type{t}_sets_context=' + all_number_contexts(combined_sets, t, 520, 30),
                  f'type{t}_defaults_context=' + all_number_contexts(set_defaults, t, 900, 4),
              ])

          Path('artifacts/ai1/seed-bone-shard-sets.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: projectile-seed-bone-shard-sets
          path: artifacts/ai1/seed-bone-shard-sets.txt
          retention-days: 1
