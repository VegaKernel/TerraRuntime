name: Projectile AI1 Candidates Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectile-ai1-candidates-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Extract targeted pinned aiStyle1 facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/ai1 .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then assembly="$candidate"; fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Projectile "$assembly" > artifacts/ai1/projectile.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.ProjectileID "$assembly" > artifacts/ai1/projectile-id.cs
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path('artifacts/ai1/projectile.cs').read_text(encoding='utf-8')
          ids = Path('artifacts/ai1/projectile-id.cs').read_text(encoding='utf-8')
          candidates = [51, 88, 981, 1006, 1124]

          def compact(text):
              return ' '.join(text.split())

          def method(src, name):
              m = re.search(rf'(?m)^[ \t]*(?:public|private|protected|internal)\b[^\n;{{]*\b{re.escape(name)}\s*\([^\n)]*\)[^\n;{{]*$', src)
              if not m:
                  raise SystemExit(f'method not found: {name}')
              opening = src.find('{', m.end())
              depth = 0
              in_string = in_char = escaped = False
              for i in range(opening, len(src)):
                  c = src[i]
                  if escaped:
                      escaped = False
                      continue
                  if c == '\\' and (in_string or in_char):
                      escaped = True
                      continue
                  if c == '"' and not in_char:
                      in_string = not in_string
                      continue
                  if c == "'" and not in_string:
                      in_char = not in_char
                      continue
                  if in_string or in_char:
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return src[m.start():i + 1]
              raise SystemExit(f'unterminated: {name}')

          def exact_context(src, t, radius=1800, limit=20):
              s = compact(src)
              pattern = re.compile(rf'(?<!\d)type\s*(?:==|!=)\s*{t}(?!\d)|(?<!\d){t}\s*(?:==|!=)\s*type(?!\d)')
              out = []
              for m in pattern.finditer(s):
                  if len(out) >= limit:
                      break
                  out.append(s[max(0, m.start()-radius):min(len(s), m.end()+radius)])
              return ' | '.join(out) if out else '<none>'

          def exact_if_blocks(src, t):
              s = compact(src)
              blocks = []
              pattern = re.compile(r'(?:else if|if) \(([^)]*type[^)]*)\) \{')
              for m in pattern.finditer(s):
                  condition = m.group(1)
                  if not re.search(rf'(?<!\d)type\s*(?:==|!=)\s*{t}(?!\d)|(?<!\d){t}\s*(?:==|!=)\s*type(?!\d)', condition):
                      continue
                  opening = s.find('{', m.start())
                  depth = 0
                  for i in range(opening, len(s)):
                      if s[i] == '{':
                          depth += 1
                      elif s[i] == '}':
                          depth -= 1
                          if depth == 0:
                              blocks.append(s[m.start():i+1])
                              break
              return ' | '.join(blocks) if blocks else '<none>'

          def defaults_block(src, t):
              s = compact(src)
              m = re.search(rf'(?:else if|if) \(type == {t}\) \{{', s)
              if not m:
                  return '<none>'
              opening = s.find('{', m.start())
              depth = 0
              for i in range(opening, len(s)):
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return s[m.start():i+1]
              return '<unterminated>'

          set_defaults = method(source, 'SetDefaults')
          ai001 = method(source, 'AI_001')
          update = method(source, 'Update')
          collision = method(source, 'GetCollisionParams')
          movement = method(source, 'HandleMovement')
          kill = method(source, 'Kill')
          wind = method(source, 'ShouldUseWindPhysics')
          can_cut = method(source, 'CanCutTiles')

          names = {int(v): n for n, v in re.findall(r'public const short\s+([A-Za-z0-9_]+)\s*=\s*(\d+)\s*;', ids)}
          lines = []
          for t in candidates:
              kill_block = exact_if_blocks(kill, t)
              authoritative = [token for token in (
                  'NewProjectile', 'KillTile', 'PlaceTile', 'NewItem', 'NewNPC',
                  'SendData', 'netUpdate', 'WorldGen.', 'Explosion', 'Damage()')
                  if token in kill_block]
              lines.extend([
                  f'type={t} name={names.get(t,"<unnamed>")}',
                  'defaults=' + defaults_block(set_defaults, t),
                  'ai001=' + exact_context(ai001, t, 2600),
                  'update=' + exact_context(update, t, 2200),
                  'collision=' + exact_context(collision, t, 1800),
                  'movement=' + exact_context(movement, t, 2200),
                  'kill=' + kill_block,
                  'kill_authoritative_tokens=' + (','.join(authoritative) if authoritative else '<none>'),
                  'wind=' + exact_context(wind, t, 1800),
                  'can_cut=' + exact_context(can_cut, t, 1800),
                  '---'
              ])

          Path('artifacts/ai1/targeted-ai1-facts.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: projectile-targeted-ai1-facts
          path: artifacts/ai1/targeted-ai1-facts.txt
          retention-days: 1
