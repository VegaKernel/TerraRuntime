name: Apply Bone Runtime Slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/type21-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed Bone slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs',
              '    public static readonly ProjectileTypeId GreenLaser = new(20);\n    public static readonly ProjectileTypeId ThrowingKnife = new(48);',
              '    public static readonly ProjectileTypeId GreenLaser = new(20);\n    public static readonly ProjectileTypeId Bone = new(21);\n    public static readonly ProjectileTypeId ThrowingKnife = new(48);')

          replace_once(
              'src/TerraRuntime.Contracts/Gameplay/VanillaProjectileDefinitionCatalog.cs',
              '''    private static readonly VanillaProjectileDefinition ShurikenDefinition = new(
        Width: 22,''',
              '''    private static readonly VanillaProjectileDefinition BoneDefinition = new(
        Width: 16,
        Height: 16,
        AiStyle: VanillaProjectileAiStyles.Thrown,
        TileCollide: true,
        IgnoreWater: false,
        CanCutTiles: true,
        CollisionWidth: 16,
        CollisionHeight: 16);

    private static readonly VanillaProjectileDefinition ShurikenDefinition = new(
        Width: 22,''')

          replace_once(
              'src/TerraRuntime.Contracts/Gameplay/VanillaProjectileDefinitionCatalog.cs',
              '''        if (type == VanillaProjectileIds.Shuriken)
        {
            definition = ShurikenDefinition;
            return true;
        }''',
              '''        if (type == VanillaProjectileIds.Bone)
        {
            definition = BoneDefinition;
            return true;
        }

        if (type == VanillaProjectileIds.Shuriken)
        {
            definition = ShurikenDefinition;
            return true;
        }''')

          replace_once(
              'src/TerraRuntime/VanillaProjectileWorldStateStepper.cs',
              "/// Poisoned Knife, and Bone Dagger (aiStyle 2).",
              "/// Poisoned Knife, Bone, and Bone Dagger (aiStyle 2).")

          replace_once(
              'tests/TerraRuntime.Tests/VanillaProjectileDefinitionCatalogTests.cs',
              '''    [Theory]
    [InlineData(48, 12, 12, 12, 12, 0f, 0f)]''',
              '''    [Theory]
    [InlineData(21, 16, 16, 16, 16, 0f, 0f)]
    [InlineData(48, 12, 12, 12, 12, 0f, 0f)]''')

          replace_once(
              'tests/TerraRuntime.Tests/VanillaProjectileWorldStateStepperTests.cs',
              '''    [Theory]
    [InlineData(48)]
    [InlineData(54)]
    [InlineData(599)]
    public void Player_owned_thrown_family_uses_the_source_backed_ai_style_two_path''',
              '''    [Theory]
    [InlineData(21)]
    [InlineData(48)]
    [InlineData(54)]
    [InlineData(599)]
    public void Player_owned_thrown_family_uses_the_source_backed_ai_style_two_path''')

          integration = Path('tests/TerraRuntime.Tests/ServerRuntimeVanillaProjectileSimulationTests.cs')
          text = integration.read_text(encoding='utf-8')
          marker = '''    [InlineData(3)]
    [InlineData(48)]
    [InlineData(54)]
    [InlineData(599)]'''
          count = text.count(marker)
          if count != 3:
              raise SystemExit(f'{integration}: expected three thrown-family theory blocks, found {count}')
          integration.write_text(text.replace(
              marker,
              '''    [InlineData(3)]
    [InlineData(21)]
    [InlineData(48)]
    [InlineData(54)]
    [InlineData(599)]'''), encoding='utf-8')

          replace_once(
              'tools/ci/probe_projectile_tile_cut.py',
              '''    green_laser_defaults = around_optional(set_defaults, "type == 20", radius=1800)
    arrow_ai = extract_method(projectile_source, "AI_001")''',
              '''    green_laser_defaults = around_optional(set_defaults, "type == 20", radius=1800)
    bone_defaults = around_optional(set_defaults, "type == 21", radius=1800)
    arrow_ai = extract_method(projectile_source, "AI_001")''')

          replace_once(
              'tools/ci/probe_projectile_tile_cut.py',
              '''    print("projectile_green_laser_defaults=" + green_laser_defaults)
    print("projectile_ai001_ai0_increment="''',
              '''    print("projectile_green_laser_defaults=" + green_laser_defaults)
    print("projectile_bone_defaults=" + bone_defaults)
    print("projectile_ai_type21_contexts=" + all_type_comparison_contexts(extract_method(projectile_source, "AI"), 21, radius=2600, limit=20))
    print("projectile_collision_params_type21_contexts=" + all_type_comparison_contexts(extract_method(projectile_source, "GetCollisionParams"), 21, radius=1800, limit=20))
    print("projectile_handle_movement_type21_contexts=" + all_type_comparison_contexts(handle_movement, 21, radius=2200, limit=20))
    print("projectile_kill_type21_contexts=" + all_type_comparison_contexts(projectile_kill, 21, radius=2600, limit=20))
    print("projectile_ai001_ai0_increment="''')
          PY

          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj --configuration Release

          git rm .github/workflows/type21-source-snapshot.yml
          git config user.name OpenAI
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs \
                  src/TerraRuntime.Contracts/Gameplay/VanillaProjectileDefinitionCatalog.cs \
                  src/TerraRuntime/VanillaProjectileWorldStateStepper.cs \
                  tests/TerraRuntime.Tests/VanillaProjectileDefinitionCatalogTests.cs \
                  tests/TerraRuntime.Tests/VanillaProjectileWorldStateStepperTests.cs \
                  tests/TerraRuntime.Tests/ServerRuntimeVanillaProjectileSimulationTests.cs \
                  tools/ci/probe_projectile_tile_cut.py
          git commit -m 'feat: simulate vanilla bone world flight'

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
