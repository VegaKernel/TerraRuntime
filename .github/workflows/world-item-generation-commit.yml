name: World Item Generation Commit

on:
  push:
    paths:
      - .github/workflows/world-item-generation-commit.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply staged world-item patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/world-item-slot-generation-hardening.yml')
          lines = workflow.read_text().splitlines()
          marker = '      - name: Patch generation-safe explicit world-item commands'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name:'))
          code = textwrap.dedent('\n'.join(lines[run_index + 1:end]))
          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})

      - name: Restore and build solution
        run: |
          dotnet restore TerraRuntime.slnx
          dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Create isolated generation verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verify-world-item
          cat > .verify-world-item/WorldItemGenerationVerify.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net11.0</TargetFramework>
              <AssemblyName>TerraRuntime.Tests</AssemblyName>
              <RootNamespace>TerraRuntime.Tests</RootNamespace>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../src/TerraRuntime/TerraRuntime.csproj" />
              <ProjectReference Include="../src/TerraRuntime.Core/TerraRuntime.Core.csproj" />
              <ProjectReference Include="../src/TerraRuntime.Contracts/TerraRuntime.Contracts.csproj" />
            </ItemGroup>
          </Project>
          EOF

          cat > .verify-world-item/Program.cs <<'EOF'
          using TerraRuntime;
          using TerraRuntime.Contracts.Runtime;
          using TerraRuntime.Core;

          static void Require(bool condition, string message)
          {
              if (!condition)
                  throw new InvalidOperationException(message);
          }

          static WorldItemDropStateUpdate Drop(float x, short stack) =>
              new(
                  PositionX: x,
                  PositionY: 200f,
                  VelocityX: 1.5f,
                  VelocityY: -2f,
                  Stack: stack,
                  Prefix: 4,
                  Ownership: WorldItemOwnershipMode.None,
                  ItemNetId: 100,
                  Shimmered: false,
                  ShimmerTime: 0f,
                  EnemyGrabDelayTime: 0);

          var store = new RuntimeWorldItemStore();
          var runtime = new ServerRuntimeState(worldItems: store);
          var slots = new PlayerSlotPool(1);
          Require(slots.TryAcquire(out PlayerSlotPool.PlayerSlotLease? lease) && lease is not null,
              "Could not acquire player slot.");
          using var session = new PlayerJoinSession(lease!);
          Require(session.ObserveWorldRequest() == PlayerJoinTransition.WorldRequestAccepted,
              "World request transition failed.");
          Require(session.ObserveSectionRequest() == PlayerJoinTransition.SectionRequestAccepted,
              "Section request transition failed.");

          var connection = new ConnectionHandle(GameCommandSourceId.FromConnection(704), session.Handle);
          var spawn = new PlayerSpawnCommitRequest(session.Slot, 100, 200, 0, 0, 0, 0, 0);
          runtime.Apply(new PlayerSpawnRuntimeCommand(connection, session, spawn));
          Require(runtime.LastSpawnCommitResult == PlayerSpawnCommitResult.Committed,
              "Player spawn did not commit.");

          Require(store.TryAllocateDrop(Drop(100f, 2), out WorldItemSnapshot first),
              "Could not allocate first item generation.");

          var captured = new CapturingIngress();
          var ingress = new RuntimeWorldItemIngress(captured, store);
          var delayedOwnerState = new WorldItemOwnerStateUpdate(
              connection.Player.Slot.Value, 300, connection.Player.Slot.Value, 30, 999f, 999f);
          Require(ingress.TryPostOwner(connection, first.Handle.Slot, delayedOwnerState),
              "Could not queue delayed owner command.");
          Require(ingress.TryPostDrop(connection, first.Handle.Slot, Drop(999f, 9)),
              "Could not queue delayed drop command.");
          Require(ingress.TryPostRemove(connection, first.Handle.Slot),
              "Could not queue delayed remove command.");
          Require(captured.Commands.Count == 3, "Expected exactly three captured commands.");

          var delayedOwner = (WorldItemOwnerRuntimeCommand)captured.Commands[0];
          var delayedDrop = (WorldItemDropRuntimeCommand)captured.Commands[1];
          var delayedRemove = (WorldItemRemoveRuntimeCommand)captured.Commands[2];
          Require(delayedOwner.Target == first.Handle &&
                  delayedDrop.Target == first.Handle &&
                  delayedRemove.Target == first.Handle,
              "Ingress did not bind explicit commands to the active item generation.");

          runtime.Apply(new WorldItemRemoveRuntimeCommand(connection, first.Handle));
          Require(store.TryAllocateDrop(Drop(200f, 4), out WorldItemSnapshot second),
              "Could not allocate replacement item generation.");
          Require(second.Handle.Slot == first.Handle.Slot,
              "Verifier did not reproduce numeric slot reuse.");
          Require(second.Handle.Generation != first.Handle.Generation,
              "Verifier did not advance item generation.");

          runtime.Apply(delayedOwner);
          runtime.Apply(delayedDrop);
          runtime.Apply(delayedRemove);

          Require(runtime.RejectedWorldItemOwners == 1,
              "Stale owner command was not rejected.");
          Require(runtime.RejectedWorldItemDrops == 1,
              "Stale drop command was not rejected.");
          Require(runtime.RejectedWorldItemRemovals == 1,
              "Stale remove command was not rejected.");
          Require(store.TryGetActive(second.Handle.Slot, out WorldItemSnapshot current),
              "Replacement item was removed by stale work.");
          Require(current.Handle == second.Handle && current.PositionX == 200f && current.Stack == 4,
              "Replacement item was mutated by stale work.");

          Console.WriteLine($"generation-safe: slot={second.Handle.Slot}, old={first.Handle.Generation.Value}, new={second.Handle.Generation.Value}");

          internal sealed class CapturingIngress : IGameCommandIngress<RuntimeCommand>
          {
              public List<RuntimeCommand> Commands { get; } = [];

              public bool TryPost(GameCommandSourceId source, RuntimeCommand command)
              {
                  Commands.Add(command);
                  return true;
              }
          }
          EOF

      - name: Run isolated ABA verifier
        run: dotnet run --project .verify-world-item/WorldItemGenerationVerify.csproj -c Release

      - name: Commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TerraRuntime/RuntimeWorldItemCommands.cs \
                  src/TerraRuntime/RuntimeWorldItemIngress.cs \
                  src/TerraRuntime/ServerRuntimeState.cs \
                  src/TerraRuntime/TerrariaServerHost.cs \
                  tests/TerraRuntime.Tests/ProductionHandshakeStopReasonTests.cs \
                  tests/TerraRuntime.Tests/ServerRuntimeWorldItemCommandTests.cs
          git commit -m "security: bind queued world item commands to item generation"

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Concurrent changes conflict with world-item hardening; refusing force push."
              exit 1
            fi

            dotnet restore TerraRuntime.slnx
            dotnet build TerraRuntime.slnx -c Release --no-restore
            dotnet run --project .verify-world-item/WorldItemGenerationVerify.csproj -c Release

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "main kept moving; refusing force push after four verified attempts."
          exit 1
