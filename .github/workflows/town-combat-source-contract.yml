name: Town NPC Combat Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/RuntimeTownNpcCombat1458.cs'
      - 'src/TerraRuntime/ServerRuntimeState.cs'
      - 'src/TerraRuntime/TerrariaServerHost.cs'
      - 'tools/ci/check_town_combat_source.py'
      - '.github/workflows/town-combat-source-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/TerraRuntime/RuntimeTownNpcCombat1458.cs'
      - 'src/TerraRuntime/ServerRuntimeState.cs'
      - 'src/TerraRuntime/TerrariaServerHost.cs'
      - 'tools/ci/check_town_combat_source.py'
      - '.github/workflows/town-combat-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Download pinned TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/town-combat-source .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
      - name: Install pinned ILSpy
        run: dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
      - name: Verify Town NPC combat source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256='d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e'
          assembly=''
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          refs="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.NPC "$assembly" > artifacts/town-combat-source/NPC.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.ID.NPCID "$assembly" > artifacts/town-combat-source/NPCID.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.DataStructures.GameDifficultyData "$assembly" > artifacts/town-combat-source/GameDifficultyData.cs
          python3 tools/ci/check_town_combat_source.py \
            --npc artifacts/town-combat-source/NPC.cs \
            --npcid artifacts/town-combat-source/NPCID.cs \
            --difficulty artifacts/town-combat-source/GameDifficultyData.cs
