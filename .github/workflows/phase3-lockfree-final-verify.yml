name: Phase3 Lock Free Final Verify

on:
  push:
    paths:
      - .github/workflows/phase3-lockfree-final-verify.yml

permissions:
  contents: read

# Fresh run includes CAS-staged actor controls, concurrency stress tests, fixed persistence tests and production TUI layout smoke.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Restore
        run: dotnet restore TerraRuntime.slnx
      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build
      - name: Authoritative loop smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --loop-smoke
      - name: Network smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --network-smoke
      - name: Terminal UI smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --tui-smoke
