name: One-shot Skeletron skull death loot

on:
  push:
    branches: [work/skeletron-skull-death-loot-1458]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-runtime-skeletron-skull-death-loot
  cancel-in-progress: false

jobs:
  integrate-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/skeletron-skull-death-loot-1458
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply cohesive integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/ci/apply_skeletron_skull_death_loot_1458.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '        "            9 +\\n",\n        "            11 +\\n",\n        "coverage-test-count",',
                  '        "        int expected = 9 +\\n",\n        "        int expected = 11 +\\n",\n        "coverage-test-count",',
                  'coverage test anchor'
              ),
              (
                  '    private void MarkSkeletronInteraction(PlayerSlotId player)',
                  '    private void MarkSkeletronInteraction(PlayerHandle player)',
                  'generation-safe Skeletron interaction type'
              ),
              (
                  '            RedHatAdjustmentsEnabled: npc.Ai.Ai3 == 1f);',
                  '            RedHatAdjustmentsEnabled: false);',
                  'do not infer RedHat world condition from NPC ai3'
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label} changed')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/ci/apply_skeletron_skull_death_loot_1458.py
          git diff --check
      - name: Diagnose TerrariaServer 1.4.5.8 source contract
        shell: bash
        run: |
          set -euo pipefail
          bash tools/decompile-reference.sh 1458
          python3 - <<'PY'
          from pathlib import Path
          import re
          npc = Path('decompiled/1458/Terraria/NPC.cs').read_text(encoding='utf-8', errors='ignore')
          projectile = Path('decompiled/1458/Terraria/Projectile.cs').read_text(encoding='utf-8', errors='ignore')
          drops = Path('decompiled/1458/Terraria.GameContent.ItemDropRules/ItemDropDatabase.cs').read_text(encoding='utf-8', errors='ignore')
          items = Path('decompiled/1458/Terraria/Item.cs').read_text(encoding='utf-8', errors='ignore')

          checks = {
              'head_defaults': all(s in npc for s in ('else if (type == 35)', 'aiStyle = 11;')),
              'hand_defaults': all(s in npc for s in ('else if (type == 36)', 'aiStyle = 12;')),
              'skull_damage': 'GetAttackDamage_ForProjectiles(17f, 17f)' in npc,
              'downedBoss3': bool(re.search(r'SetEventFlagCleared\(ref (?:NPC\.)?downedBoss3, 15\)', npc)),
              'shared_interaction': bool(re.search(r'if \(type == 35 \|\| type == 36\)[\s\S]{0,1000}?Main\.npc\[[A-Za-z0-9_]+\]\.ApplyInteraction_Inner\(player, localOnly\)', npc)),
              'skull_spawn': bool(re.search(r'int [A-Za-z0-9_]+ = 270;[\s\S]{0,700}?Projectile\.NewProjectile[\s\S]{0,400}?-1f\)[\s\S]{0,250}?timeLeft = 300', npc)),
              'items': all(f'case {i}:' in items for i in (1273, 1281, 1313, 1363, 3323, 4801, 4927, 4993, 5624, 5625, 5626, 5628, 5737)),
          }
          for name, ok in checks.items():
              print(f'source_check:{name}={ok}')

          for needle in ('case 270:', 'type == 270', 'ai[1] += 1f;', 'ai[1] < 110f', 'ai[1] > 30f'):
              at = projectile.find(needle)
              if at >= 0:
                  print(f'--- PROJECTILE SOURCE AROUND {needle} ---')
                  print(projectile[max(0, at - 2200):at + 5200])

          for needle in ('RegisterBoss_Skeletron', 'BossBag(3323)', 'RegisterToNPC(35', '4993', '4927', '4801'):
              at = drops.find(needle)
              if at >= 0:
                  print(f'--- LOOT SOURCE AROUND {needle} ---')
                  print(drops[max(0, at - 2200):at + 6200])

          if not all(checks.values()):
              missing = ', '.join(name for name, ok in checks.items() if not ok)
              raise SystemExit('Skeletron source baseline changed: ' + missing)
          print('skeletron_1458_source_contract=baseline-ok')
          PY
      - name: Release build
        run: dotnet build build/TerraRuntime.slnx -c Release --nologo
      - name: Focused Skeletron tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --filter FullyQualifiedName~Skeletron --nologo
      - name: Full tests
        run: dotnet test build/TerraRuntime.slnx -c Release --no-build --nologo
      - name: Preserve validated diff as artifact patch
        if: always()
        shell: bash
        run: |
          git diff --binary > /tmp/skeletron-validated.patch || true
          echo "validated_diff_lines=$(wc -l < /tmp/skeletron-validated.patch)"
      - name: Commit validated feature branch
        if: ${{ false }}
        shell: bash
        run: echo 'Enable after source, focused, and full suite are green.'
