name: One-shot N4 Town NPC social emotes integration

on:
  push:
    branches: [work/n4-town-social-emotes-1458]
    paths:
      - 'tools/ci/apply_n4_town_social_emotes.py'
      - 'tools/ci/apply_n4_town_social_contract_fix.py'
      - 'tools/ci/apply_n4_town_social_compile_fix.py'
      - '.github/workflows/one-shot-n4-town-social-emotes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/n4-town-social-emotes-1458
          fetch-depth: 0
      - name: Materialize already-validated Town social block
        run: |
          python3 tools/ci/apply_n4_town_social_emotes.py
          python3 tools/ci/apply_n4_town_social_contract_fix.py
          python3 tools/ci/apply_n4_town_social_compile_fix.py
      - name: Commit functional block without workflow-file mutation
        shell: bash
        run: |
          set -euo pipefail
          rm tools/ci/apply_n4_town_social_emotes.py
          rm tools/ci/apply_n4_town_social_contract_fix.py
          rm tools/ci/apply_n4_town_social_compile_fix.py
          rm -f .github/workflows/town-social-emotes-source-contract.yml
          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git add -A
          git commit -m "Complete source-backed Town NPC social emotes"
          git push origin HEAD:work/n4-town-social-emotes-1458
