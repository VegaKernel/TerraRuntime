name: Apply Player-Owned Green Laser Slice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/type20-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply source-backed player-owned Green Laser slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          printf '%s' '' | base64 -d | gzip -dc > /tmp/apply_type20.py
          python3 /tmp/apply_type20.py
          python3 -m py_compile tools/ci/probe_projectile_tile_cut.py
          git diff --check
          git rm .github/workflows/type20-source-snapshot.yml
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools tests .github/workflows
          git commit -m 'feat: simulate player-owned green laser world flight'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'main kept advancing; refusing to force-push' >&2
          exit 1
