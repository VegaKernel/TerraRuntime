name: Traveling Merchant Shop Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Core/Npcs/VanillaTravelingMerchantShop1458.cs'
      - 'src/TerraRuntime.Protocol/TerrariaMessageId.cs'
      - 'src/TerraRuntime.Protocol.Multiplicity/TerrariaTravelShopCodec.cs'
      - 'tests/TerraRuntime.Tests/VanillaTravelingMerchantShop1458Tests.cs'
      - 'tests/TerraRuntime.Tests/TerrariaTravelShopCodecTests.cs'
      - 'tools/ci/check_traveling_merchant_shop_source.py'
      - '.github/workflows/traveling-merchant-shop-source-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Core/Npcs/VanillaTravelingMerchantShop1458.cs'
      - 'src/TerraRuntime.Protocol/TerrariaMessageId.cs'
      - 'src/TerraRuntime.Protocol.Multiplicity/TerrariaTravelShopCodec.cs'
      - 'tests/TerraRuntime.Tests/VanillaTravelingMerchantShop1458Tests.cs'
      - 'tests/TerraRuntime.Tests/TerrariaTravelShopCodecTests.cs'
      - 'tools/ci/check_traveling_merchant_shop_source.py'
      - '.github/workflows/traveling-merchant-shop-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download pinned TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/travel-shop-source .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375

      - name: Verify Traveling Merchant source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256='d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e'
          assembly=''
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          refs="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.Chest "$assembly" > artifacts/travel-shop-source/Chest.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.NetMessage "$assembly" > artifacts/travel-shop-source/NetMessage.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.MessageBuffer "$assembly" > artifacts/travel-shop-source/MessageBuffer.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.Player "$assembly" > artifacts/travel-shop-source/Player.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.GameContent.Luck "$assembly" > artifacts/travel-shop-source/Luck.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.WorldGen "$assembly" > artifacts/travel-shop-source/WorldGen.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.Main "$assembly" > artifacts/travel-shop-source/Main.cs
          python3 tools/ci/check_traveling_merchant_shop_source.py \
            --chest artifacts/travel-shop-source/Chest.cs \
            --net-message artifacts/travel-shop-source/NetMessage.cs \
            --message-buffer artifacts/travel-shop-source/MessageBuffer.cs \
            --player artifacts/travel-shop-source/Player.cs \
            --luck artifacts/travel-shop-source/Luck.cs \
            --worldgen artifacts/travel-shop-source/WorldGen.cs \
            --main artifacts/travel-shop-source/Main.cs \
            --implementation src/TerraRuntime.Core/Npcs/VanillaTravelingMerchantShop1458.cs
