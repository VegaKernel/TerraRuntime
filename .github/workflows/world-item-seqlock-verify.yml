name: World Item Seqlock Verify

on:
  push:
    paths:
      - .github/workflows/world-item-seqlock-verify.yml

permissions:
  contents: read

# Fresh run after making the concurrency stress cancellation-aware.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore TerraRuntime.slnx

      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Network smoke
        run: dotnet run --project src/TerraRuntime/TerraRuntime.csproj -c Release --no-build -- --network-smoke
