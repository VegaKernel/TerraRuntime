name: Multi Tile Object Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.World/VanillaTileObjectAnchorCatalog.cs'
      - 'src/TerraRuntime.World/WorldSectionObjectMetadataEncoder.cs'
      - 'tests/TerraRuntime.Tests/VanillaTileObjectAnchorCatalogTests.cs'
      - 'tools/ci/probe_multi_tile_object_definitions.py'
      - 'docs/en/tile-object-anchors.md'
      - 'docs/ru/tile-object-anchors.md'
      - 'docs/roadmap/gameplay-decomposition-and-catalogs.md'
      - '.github/workflows/multi-tile-object-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-multi-tile-object-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  multi-tile-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: >-
          dotnet tool install ilspycmd
          --tool-path .tools
          --version 11.0.0.9375

      - name: Probe multi-tile object definitions
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then assembly="$candidate"; fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          [[ -n "$assembly" ]]

          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ObjectData.TileObjectData "$assembly" > artifacts/source-contract/tile-object-data.cs
          python3 tools/ci/probe_multi_tile_object_definitions.py \
            --tile-object-data artifacts/source-contract/tile-object-data.cs
