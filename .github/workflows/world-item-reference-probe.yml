name: World Item Reference Probe

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Probe network packet 21 and 22 semantics
        shell: python
        run: |
          import json
          import pathlib
          import re

          root = pathlib.Path('decompiled/1458')
          path = root / 'Terraria' / 'MessageBuffer.cs'
          if not path.is_file():
              matches = list(root.rglob('MessageBuffer.cs'))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one MessageBuffer.cs, found {len(matches)}')
              path = matches[0]
          text = path.read_text(errors='strict')

          case_pattern = re.compile(r'^(?P<indent>[ \t]*)case\s+(?P<number>\d+)\s*:', re.M)
          all_cases = list(case_pattern.finditer(text))

          def case_body(number):
              matches = [m for m in all_cases if int(m.group('number')) == number]
              if not matches:
                  raise SystemExit(f'No case {number} in {path}')
              min_indent = min(len(m.group('indent').expandtabs(4)) for m in matches)
              outer = [m for m in matches if len(m.group('indent').expandtabs(4)) == min_indent]
              diagnostics = [
                  {
                      'line': text.count('\n', 0, m.start()) + 1,
                      'indent': len(m.group('indent').expandtabs(4)),
                  }
                  for m in matches
              ]
              print(f'CASE_{number}_CANDIDATES=' + json.dumps(diagnostics, sort_keys=True))
              if len(outer) != 1:
                  raise SystemExit(f'Expected one least-indented case {number}, found {len(outer)}')

              first = outer[0]
              cursor = first
              indent = first.group('indent')
              while True:
                  next_case = re.search(
                      rf'^{re.escape(indent)}case\s+\d+\s*:',
                      text[cursor.end():],
                      re.M)
                  if next_case is None:
                      end = min(len(text), first.start() + 30000)
                      break
                  next_start = cursor.end() + next_case.start()
                  next_end = cursor.end() + next_case.end()
                  between = text[cursor.end():next_start]
                  if between.strip() == '':
                      grouped_label = case_pattern.match(text, next_start)
                      if grouped_label is None:
                          raise SystemExit('Grouped case label parse failed')
                      cursor = grouped_label
                      continue
                  end = next_start
                  break
              return text[first.start():end]

          c21 = case_body(21)
          c22 = case_body(22)

          def facts(body):
              return {
                  'length': len(body),
                  'hasItemNewItem': 'Item.NewItem' in body,
                  'hasSentinel400': bool(re.search(r'\b400\b', body)),
                  'hasActiveFalse': bool(re.search(r'\.active\s*=\s*false', body)),
                  'hasActiveTrue': bool(re.search(r'\.active\s*=\s*true', body)),
                  'hasWhoAmI': 'whoAmI' in body,
                  'hasReservedPlayer': 'playerIndexTheItemIsReservedFor' in body,
                  'hasKeepTime': 'keepTime' in body or 'timeToKeepReservation' in body,
                  'hasOwnIgnore': 'ownIgnore' in body,
                  'hasOwnTime': 'ownTime' in body,
                  'hasServerBranch': bool(re.search(r'Main\.netMode\s*==\s*2', body)),
                  'hasNotServerBranch': bool(re.search(r'Main\.netMode\s*!=\s*2', body)),
                  'sendData21': len(re.findall(r'SendData\s*\(\s*21\b', body)),
                  'sendData22': len(re.findall(r'SendData\s*\(\s*22\b', body)),
                  'newItemCalls': body.count('Item.NewItem'),
                  'reservedAssignments': len(re.findall(r'playerIndexTheItemIsReservedFor\s*=', body)),
                  'stackZeroChecks': len(re.findall(r'(?:stack|Stack)\s*==\s*0', body)),
              }

          summary = {
              'selectedFile': str(path.relative_to(root)),
              'packet21': facts(c21),
              'packet22': facts(c22),
          }

          patterns = [
              r'.{0,120}Item\.NewItem.{0,220}',
              r'.{0,120}playerIndexTheItemIsReservedFor.{0,220}',
              r'.{0,120}(?:ownIgnore|ownTime).{0,220}',
              r'.{0,120}SendData\s*\(\s*(?:21|22)\b.{0,220}',
              r'.{0,120}\.active\s*=\s*(?:true|false).{0,220}',
              r'.{0,120}\b400\b.{0,220}',
              r'.{0,120}\bwhoAmI\b.{0,220}',
              r'.{0,120}Main\.netMode\s*(?:==|!=)\s*2.{0,220}',
          ]
          evidence = {}
          for number, body in ((21, c21), (22, c22)):
              lines = []
              compact = body.replace('\r', '')
              for pattern in patterns:
                  for m in re.finditer(pattern, compact, re.S):
                      line = ' '.join(m.group(0).split())
                      if line not in lines:
                          lines.append(line[:380])
              evidence[str(number)] = lines[:30]

          print('WORLD_ITEM_PACKET_FACTS=' + json.dumps(summary, sort_keys=True))
          print('WORLD_ITEM_PACKET_EVIDENCE=' + json.dumps(evidence, sort_keys=True))
