name: World Item Reference Probe

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Probe network packet 21 and 22 semantics
        shell: python
        run: |
          import json
          import pathlib
          import re

          root = pathlib.Path('decompiled/1458')
          path = root / 'Terraria' / 'MessageBuffer.cs'
          if not path.is_file():
              matches = list(root.rglob('MessageBuffer.cs'))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one MessageBuffer.cs, found {len(matches)}')
              path = matches[0]
          text = path.read_text(errors='strict')

          def case_body(number):
              matches = list(re.finditer(rf'^\s*case\s+{number}\s*:', text, re.M))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one top-level case {number} in {path}, found {len(matches)}')
              match = matches[0]
              start = match.start()
              next_case = re.search(r'^\s*case\s+\d+\s*:', text[match.end():], re.M)
              end = match.end() + next_case.start() if next_case else min(len(text), start + 30000)
              return text[start:end]

          c21 = case_body(21)
          c22 = case_body(22)

          def facts(body):
              return {
                  'length': len(body),
                  'hasItemNewItem': 'Item.NewItem' in body,
                  'hasSentinel400': bool(re.search(r'\b400\b', body)),
                  'hasActiveFalse': bool(re.search(r'\.active\s*=\s*false', body)),
                  'hasActiveTrue': bool(re.search(r'\.active\s*=\s*true', body)),
                  'hasWhoAmI': 'whoAmI' in body,
                  'hasReservedPlayer': 'playerIndexTheItemIsReservedFor' in body,
                  'hasKeepTime': 'keepTime' in body or 'timeToKeepReservedFor' in body,
                  'hasOwnIgnore': 'ownIgnore' in body,
                  'hasOwnTime': 'ownTime' in body,
                  'sendData21': len(re.findall(r'SendData\s*\(\s*21\b', body)),
                  'sendData22': len(re.findall(r'SendData\s*\(\s*22\b', body)),
                  'newItemCalls': body.count('Item.NewItem'),
                  'reservedAssignments': len(re.findall(r'playerIndexTheItemIsReservedFor\s*=', body)),
                  'stackZeroChecks': len(re.findall(r'(?:stack|Stack)\s*==\s*0', body)),
              }

          summary = {
              'selectedFile': str(path.relative_to(root)),
              'packet21': facts(c21),
              'packet22': facts(c22),
          }

          patterns = [
              r'.{0,120}Item\.NewItem.{0,220}',
              r'.{0,120}playerIndexTheItemIsReservedFor.{0,220}',
              r'.{0,120}(?:ownIgnore|ownTime).{0,220}',
              r'.{0,120}SendData\s*\(\s*(?:21|22)\b.{0,220}',
              r'.{0,120}\.active\s*=\s*(?:true|false).{0,220}',
              r'.{0,120}\b400\b.{0,220}',
              r'.{0,120}\bwhoAmI\b.{0,220}',
          ]
          evidence = {}
          for number, body in ((21, c21), (22, c22)):
              lines = []
              compact = body.replace('\r', '')
              for pattern in patterns:
                  for m in re.finditer(pattern, compact, re.S):
                      line = ' '.join(m.group(0).split())
                      if line not in lines:
                          lines.append(line[:380])
              evidence[str(number)] = lines[:30]

          print('WORLD_ITEM_PACKET_FACTS=' + json.dumps(summary, sort_keys=True))
          print('WORLD_ITEM_PACKET_EVIDENCE=' + json.dumps(evidence, sort_keys=True))
