name: Projectile AI2 Candidates Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectile-ai2-candidates-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Extract pinned simple aiStyle2 candidate details
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/ai2 .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then assembly="$candidate"; fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Projectile "$assembly" > artifacts/ai2/projectile.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.ProjectileID "$assembly" > artifacts/ai2/projectile-id.cs
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('artifacts/ai2/projectile.cs').read_text(encoding='utf-8')
          ids=Path('artifacts/ai2/projectile-id.cs').read_text(encoding='utf-8')
          candidates=[318,330,583,589,996,1012,1111]
          def compact(x): return ' '.join(x.split())
          def method(src,name):
              m=re.search(rf'(?m)^[ \t]*(?:public|private|protected|internal)\b[^\n;{{]*\b{re.escape(name)}\s*\([^\n)]*\)[^\n;{{]*$',src)
              if not m: raise SystemExit(f'method not found: {name}')
              o=src.find('{',m.end()); d=0; ins=inc=esc=False
              for i in range(o,len(src)):
                  c=src[i]
                  if esc:esc=False;continue
                  if c=='\\' and (ins or inc):esc=True;continue
                  if c=='"' and not inc:ins=not ins;continue
                  if c=="'" and not ins:inc=not inc;continue
                  if ins or inc:continue
                  if c=='{':d+=1
                  elif c=='}':
                      d-=1
                      if d==0:return src[m.start():i+1]
              raise SystemExit(f'unterminated: {name}')
          def exact_context(src,t,radius=2600):
              s=compact(src)
              pat=re.compile(rf'(?<!\d)type\s*(?:==|!=)\s*{t}(?!\d)|(?<!\d){t}\s*(?:==|!=)\s*type(?!\d)')
              out=[]
              for m in pat.finditer(s):out.append(s[max(0,m.start()-radius):min(len(s),m.end()+radius)])
              return ' | '.join(out) if out else '<none>'
          names={int(v):n for n,v in re.findall(r'public const short\s+([A-Za-z0-9_]+)\s*=\s*(\d+)\s*;',ids)}
          defaults=method(source,'SetDefaults'); ai=method(source,'AI'); update=method(source,'Update')
          collision=method(source,'GetCollisionParams'); movement=method(source,'HandleMovement'); kill=method(source,'Kill'); cancut=method(source,'CanCutTiles')
          lines=[]
          for t in candidates:
              kill_ctx=exact_context(kill,t,3200)
              authoritative=[]
              for needle in ['NewProjectile','KillTile','PlaceTile','NewItem','NewNPC','SendData','netUpdate','Transform','Explosion','TileRunner']:
                  if needle in kill_ctx: authoritative.append(needle)
              lines.extend([
                  f'type={t} name={names.get(t,"<unnamed>")}',
                  'defaults='+exact_context(defaults,t,1800),
                  'ai='+exact_context(ai,t,2200),
                  'update='+exact_context(update,t,1800),
                  'collision='+exact_context(collision,t,1800),
                  'movement='+exact_context(movement,t,1800),
                  'kill='+kill_ctx,
                  'kill_authoritative_tokens='+(','.join(authoritative) if authoritative else '<none>'),
                  'can_cut='+exact_context(cancut,t,1000),
                  '---'
              ])
          Path('artifacts/ai2/simple-ai2-details.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: projectile-simple-ai2-details
          path: artifacts/ai2/simple-ai2-details.txt
          retention-days: 1
