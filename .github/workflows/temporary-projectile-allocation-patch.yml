name: Temporary Projectile Allocation Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-projectile-allocation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch authoritative projectile allocation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/TerraRuntime/ServerRuntimeState.cs")
          text = path.read_text()
          already = "TrySpawnVanilla(in update, out _)" in text

          if not already:
              start_marker = "        if (!TryFindFreeVanillaProjectileSlot(out ushort slot))"
              tail_marker = "        RejectedProjectileSpawns++;\n        RejectedClientProjectileUpdates++;\n    }\n\n    private void ApplyClientProjectileDestroy"
              start = text.find(start_marker)
              tail = text.find(tail_marker, start + 1) if start >= 0 else -1
              if start < 0 or tail < 0:
                  raise SystemExit("expected client projectile allocation markers not found")
              replacement = (
                  "        using (clientCommits.Enter(command.Connection.Source, in key))\n"
                  "        {\n"
                  "            if (_projectiles.TrySpawnVanilla(in update, out _))\n"
                  "            {\n"
                  "                AppliedProjectileSpawns++;\n"
                  "                return;\n"
                  "            }\n"
                  "        }\n\n"
              )
              text = text[:start] + replacement + text[tail:]

          helper_marker = "    private bool TryFindFreeVanillaProjectileSlot(out ushort slot)"
          convert_marker = "    private static bool TryConvertClientProjectileUpdate("
          helper_start = text.find(helper_marker)
          if helper_start >= 0:
              helper_end = text.find(convert_marker, helper_start)
              if helper_end < 0:
                  raise SystemExit("allocation helper end marker not found")
              text = text[:helper_start] + text[helper_end:]
          elif "TryFindFreeVanillaProjectileSlot" in text:
              raise SystemExit("allocation helper changed unexpectedly")

          path.write_text(text)
          PY

          git add src/TerraRuntime/ServerRuntimeState.cs
          if git diff --cached --quiet; then
            echo "No source patch required."
            exit 0
          fi
          git commit -m "feat: use vanilla projectile pool allocation"
          git push origin HEAD:main
