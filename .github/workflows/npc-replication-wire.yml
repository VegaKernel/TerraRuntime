name: Wire NPC replication host path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npc-replication-wire.yml
      - tools/ci/wire_npc_replication.py

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/ci/wire_npc_replication.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/TerraRuntime/TerrariaServerHost.cs
          git diff --cached --check
          git commit -m "network: wire NPC packet 23 replication into host"
          git push origin HEAD:main
