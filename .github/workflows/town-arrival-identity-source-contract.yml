name: Town Arrival Identity Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Core/Npcs/VanillaTownNpcIdentity1458.cs'
      - 'src/TerraRuntime.Protocol.Multiplicity/TerrariaTownNpcArrivalCodec1458.cs'
      - 'src/TerraRuntime/RuntimeTownNpcStateStore.cs'
      - 'src/TerraRuntime/RuntimeTownNpcMoveInCoordinator1458.cs'
      - 'src/TerraRuntime/RuntimeNpcReplicationRegistry.cs'
      - 'tests/TerraRuntime.Tests/RuntimeTownNpcArrivalIdentity1458Tests.cs'
      - 'tools/ci/check_town_arrival_identity_source.py'
      - '.github/workflows/town-arrival-identity-source-contract.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile pinned TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Verify Town arrival identity source contract
        run: >-
          python3 tools/ci/check_town_arrival_identity_source.py
          --npc decompiled/1458/Terraria/NPC.cs
          --profiles decompiled/1458/Terraria.GameContent/Profiles.cs
          --town-profiles decompiled/1458/Terraria.GameContent/TownNPCProfiles.cs
          --worldgen decompiled/1458/Terraria/WorldGen.cs
          --chat-helper decompiled/1458/Terraria.Chat/ChatHelper.cs
          --town-json decompiled/1458/Terraria.Localization.Content.en-US.Town.json
          --runtime-identity src/TerraRuntime.Core/Npcs/VanillaTownNpcIdentity1458.cs
      - name: Build Release
        run: dotnet build build/TerraRuntime.slnx -c Release
      - name: Focused regressions
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build
          --filter 'FullyQualifiedName~RuntimeTownNpcArrivalIdentity1458Tests|FullyQualifiedName~RuntimeTownNpcPhysicalSpawn1458Tests|FullyQualifiedName~RuntimeTownNpcRoomAwareSelection1458Tests'
