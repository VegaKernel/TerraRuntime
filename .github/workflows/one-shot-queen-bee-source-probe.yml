name: One-shot Queen Bee source probe

on:
  push:
    branches: [work/queen-bee-boss-vertical-1458]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/queen-bee-boss-vertical-1458
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile and extract Queen Bee contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tools/decompile-reference.sh 1458
          python3 - <<'PY'
          from pathlib import Path

          npc = Path('decompiled/1458/Terraria/NPC.cs').read_text(encoding='utf-8', errors='ignore')
          drops = Path('decompiled/1458/Terraria.GameContent.ItemDropRules/ItemDropDatabase.cs').read_text(encoding='utf-8', errors='ignore')
          projectile = Path('decompiled/1458/Terraria/Projectile.cs').read_text(encoding='utf-8', errors='ignore')

          def extract_method(text: str, signature: str, limit: int = 50000) -> str:
              start = text.find(signature)
              if start < 0:
                  return f'<missing {signature}>'
              brace = text.find('{', start)
              if brace < 0:
                  return text[start:start+limit]
              depth = 0
              for i in range(brace, min(len(text), start + limit)):
                  c = text[i]
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
              return text[start:start+limit]

          def around(text: str, needle: str, before: int = 2500, after: int = 9000) -> str:
              at = text.find(needle)
              if at < 0:
                  return f'<missing {needle}>'
              return text[max(0, at-before):at+after]

          print('=== QUEEN BEE SETDEFAULTS ===')
          print(around(npc, 'type == 222'))
          print('=== QUEEN BEE AI_043 ===')
          print(extract_method(npc, 'private void AI_043()'))
          print('=== QUEEN BEE LOOT ===')
          print(extract_method(drops, 'private void RegisterBoss_QueenBee()'))
          print('=== QUEEN BEE DEATH FLAG ===')
          print(around(npc, 'downedQueenBee', 4000, 8000))

          ai = extract_method(npc, 'private void AI_043()')
          import re
          npc_ids = sorted({int(x) for x in re.findall(r'NewNPC\([^;]{0,700}?,\s*(\d+)', ai, re.S)})
          projectile_ids = sorted({int(x) for x in re.findall(r'NewProjectile\([^;]{0,900}?,\s*(\d+)\s*,', ai, re.S)})
          print('QUEEN_BEE_CHILD_IDS=', npc_ids)
          print('QUEEN_BEE_PROJECTILE_IDS=', projectile_ids)
          for raw in npc_ids:
              print(f'=== CHILD DEFAULTS {raw} ===')
              print(around(npc, f'type == {raw}', 1200, 4500))
          for raw in projectile_ids:
              print(f'=== PROJECTILE DEFAULTS/AI {raw} ===')
              print(around(projectile, f'type == {raw}', 1600, 5000))
              print(around(projectile, f'case {raw}:', 1600, 5000))
          PY
