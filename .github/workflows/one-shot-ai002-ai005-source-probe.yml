name: One Shot AI002 AI005 Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai002-ai005-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Extract source-backed AI branches
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          test -n "$npc_file"
          python3 - "$npc_file" <<'PY'
          import pathlib, re, sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(errors='ignore')
          lines = text.splitlines()

          def extract_method(name):
              pattern = re.compile(rf'\b(?:private|public|internal)?\s*(?:static\s+)?(?:void|bool)\s+{re.escape(name)}\s*\([^)]*\)')
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f'method not found: {name}')
              opening = text.find('{', m.end())
              depth = 0
              end = None
              for i in range(opening, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'truncated method: {name}')
              prefix = text[:m.start()].count('\n') + 1
              body = text[m.start():end].splitlines()
              return prefix, body

          def dump_context(name, keywords, radius=4):
              base, body = extract_method(name)
              print(f'=== {name} ===')
              selected = set()
              for idx, line in enumerate(body):
                  if any(k in line for k in keywords):
                      for j in range(max(0, idx-radius), min(len(body), idx+radius+1)):
                          selected.add(j)
              last = -2
              for idx in sorted(selected):
                  if idx > last + 1:
                      print('---')
                  print(f'{base+idx}: {body[idx]}')
                  last = idx

          dump_context('AI_002_FloatingEye', [
              'dayTime', 'EncourageDespawn', 'noTileCollide', 'CanHit', 'Collision.',
              'ai[0]', 'type ==', 'type !=', 'TargetClosest', 'wet', 'collideX', 'collideY'
          ])
          dump_context('AI_005_EaterOfSouls', [
              'Projectile.NewProjectile', 'NewProjectile', 'NPC.NewNPC', 'NewNPC', 'getGoodWorld',
              'stealth', 'itemAnimation', 'ai[1]', 'AI_GlobalFiringDistanceCheck', 'Collision.CanHit',
              'type == 42', 'type == 176', 'type == 139', 'type == 619', 'type == 6'
          ], radius=6)
          dump_context('AI_GlobalFiringDistanceCheck', ['return', 'MaxWorldViewSize', 'Inflate'], radius=3)
          PY
