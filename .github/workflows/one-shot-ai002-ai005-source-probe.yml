name: One Shot AI002 AI005 Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai002-ai005-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Extract exact remaining branches
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          test -n "$npc_file"
          python3 - "$npc_file" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='ignore')

          def extract(name, return_type='(?:void|bool)'):
              pat = re.compile(rf'\b(?:private|public|internal)?\s*(?:static\s+)?{return_type}\s+{re.escape(name)}\s*\([^)]*\)')
              m = pat.search(text)
              if not m: raise SystemExit(f'not found: {name}')
              opening = text.find('{', m.end()); depth = 0
              for i in range(opening, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          base = text[:m.start()].count('\n') + 1
                          return base, text[m.start():i+1].splitlines()
              raise SystemExit(f'truncated: {name}')

          base, body = extract('DespawnEncouragement_AIStyle2_FloatingEye_IsDiscouraged')
          print('=== AI002_DESPAWN_HELPER ===')
          for i, line in enumerate(body): print(f'{base+i}: {line}')

          base, body = extract('AI_005_EaterOfSouls')
          print('=== PROBE_139_CONTEXT ===')
          for i, line in enumerate(body):
              if 60280 <= base+i <= 60322:
                  print(f'{base+i}: {line}')
          PY
