name: Apply Startup Save Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-startup-save-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Normalize production startup cleanup wiring
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/TerraRuntime/TerrariaServerHost.cs')
          text = path.read_text(encoding='utf-8')
          ugly = '''        if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(options.WorldPath))
              Console.Error.WriteLine($"Failed to clean abandoned save transactions for canonical world: {options.WorldPath}.");

          string checkpointBackupPath = RuntimeWorldCheckpointRecovery.GetBackupPath(options.WorldPath);
          if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(checkpointBackupPath))
              Console.Error.WriteLine($"Failed to clean abandoned save transactions for checkpoint backup: {checkpointBackupPath}.");

          '''
          clean = '''        if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(options.WorldPath))
              Console.Error.WriteLine($"Failed to clean abandoned save transactions for canonical world: {options.WorldPath}.");

          string checkpointBackupPath = RuntimeWorldCheckpointRecovery.GetBackupPath(options.WorldPath);
          if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(checkpointBackupPath))
              Console.Error.WriteLine($"Failed to clean abandoned save transactions for checkpoint backup: {checkpointBackupPath}.");

          '''
          # Triple-quoted YAML/Python indentation is stripped by the shell block. Normalize explicitly
          # to the host's eight-space method indentation rather than relying on source formatting magic.
          clean = clean.replace('\n      Console.', '\n            Console.')
          clean = clean.replace('\n  string checkpoint', '\n        string checkpoint')
          clean = clean.replace('\n  if (!Atomic', '\n        if (!Atomic')
          clean = clean.replace('\n          Console.', '\n            Console.')
          clean = clean.rstrip() + '\n\n'

          current = '''        if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(options.WorldPath))
    Console.Error.WriteLine($"Failed to clean abandoned save transactions for canonical world: {options.WorldPath}.");

string checkpointBackupPath = RuntimeWorldCheckpointRecovery.GetBackupPath(options.WorldPath);
if (!AtomicSaveFileWriter.TryCleanupAbandonedWrites(checkpointBackupPath))
    Console.Error.WriteLine($"Failed to clean abandoned save transactions for checkpoint backup: {checkpointBackupPath}.");

'''
          if current in text:
              text = text.replace(current, clean, 1)
              path.write_text(text, encoding='utf-8')
          elif clean not in text:
              raise SystemExit('startup cleanup block changed unexpectedly')

      - name: Build persistence tests
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Prove startup cleanup helper
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~TerraRuntime.Tests.AtomicSaveFileWriterCleanupTests"

      - name: Prove host startup cleanup ordering
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~TerraRuntime.Tests.TerrariaServerHostStartupCleanupTests"

      - name: Commit production host formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/TerraRuntime/TerrariaServerHost.cs
          if git diff --cached --quiet; then
            echo 'host cleanup wiring already normalized'
            exit 0
          fi
          git commit -m 'style: normalize startup save cleanup'
          git pull --rebase origin main
          git push origin HEAD:main
