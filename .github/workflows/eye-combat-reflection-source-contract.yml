name: Eye Combat Reflection Source Contract

on:
  pull_request:
    paths:
      - .github/workflows/eye-combat-reflection-source-contract.yml
      - src/TerraRuntime.Contracts/Runtime/NpcSnapshot.cs
      - src/TerraRuntime.Core/Npcs/VanillaEyeOfCthulhuExpertRapidDashNpcBehaviorStrategy.cs
      - src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorContext.cs
      - src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs
      - src/TerraRuntime.Core/Projectiles/RuntimeProjectileStore.cs
      - src/TerraRuntime.Core/Projectiles/VanillaProjectileReflection1458.cs
      - src/TerraRuntime/RuntimeNpcProjectileReflectionPass.cs
      - src/TerraRuntime/ServerRuntimeState.cs
  push:
    branches: [main]
    paths:
      - .github/workflows/eye-combat-reflection-source-contract.yml
      - src/TerraRuntime.Contracts/Runtime/NpcSnapshot.cs
      - src/TerraRuntime.Core/Npcs/VanillaEyeOfCthulhuExpertRapidDashNpcBehaviorStrategy.cs
      - src/TerraRuntime.Core/Npcs/VanillaNpcBehaviorContext.cs
      - src/TerraRuntime.Core/Npcs/VanillaNpcTargetingAiStepper.cs
      - src/TerraRuntime.Core/Projectiles/RuntimeProjectileStore.cs
      - src/TerraRuntime.Core/Projectiles/VanillaProjectileReflection1458.cs
      - src/TerraRuntime/RuntimeNpcProjectileReflectionPass.cs
      - src/TerraRuntime/ServerRuntimeState.cs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile official TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Verify Eye combat and reflection contracts
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          projectile_file="$(find decompiled/1458 -type f -name 'Projectile.cs' -print -quit)"
          test -n "$npc_file"
          test -n "$projectile_file"
          python3 - "$npc_file" "$projectile_file" <<'PY'
          import pathlib
          import re
          import sys

          npc = pathlib.Path(sys.argv[1]).read_text(errors='ignore')
          projectile = pathlib.Path(sys.argv[2]).read_text(errors='ignore')

          def require(text, snippet, label):
              if snippet not in text:
                  raise SystemExit(f'source contract changed: {label}')

          def method(text, pattern):
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f'method not found: {pattern}')
              opening = text.find('{', match.end())
              depth = 0
              for index in range(opening, len(text)):
                  if text[index] == '{':
                      depth += 1
                  elif text[index] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[opening:index + 1]
              raise SystemExit(f'truncated method: {pattern}')

          combat = (
              ('defense = 0;', 'phase-two base defense'),
              ('int num37 = 23;', 'Classic damage endpoint'),
              ('int num38 = 18;', 'Expert damage endpoint'),
              ('defense = -15;', 'low-life defense'),
              ('num38 = 20;', 'critical-life damage endpoint'),
              ('defense = -30;', 'critical-life defense'),
              ('damage = GetAttackDamage_LerpBetweenFinalValues(num37, num38);', 'difficulty damage interpolation'),
              ('damage = GetAttackDamage_CappedAtMaster(damage);', 'Master damage scaling'),
          )
          for snippet, label in combat:
              require(npc, snippet, label)

          reflected = method(npc, r'\bpublic void ReflectProjectile\(Projectile proj\)')
          for snippet, label in (
              ('proj.reflected = true;', 'reflected flag'),
              ('proj.hostile = true;', 'hostile flip'),
              ('proj.friendly = false;', 'friendly flip'),
              ('Vector2 vector = Main.player[proj.owner].Center - proj.Center;', 'owner-directed vector'),
              ('vector *= proj.oldVelocity.Length();', 'oldVelocity speed'),
              ('proj.velocity = new Vector2(Main.rand.Next(-100, 101), Main.rand.Next(-100, 101));', 'reflection RNG'),
              ('proj.velocity += vector * 20f;', 'owner bias'),
              ('proj.penetrate = 1;', 'penetration clamp'),
          ):
              require(reflected, snippet, label)
          if reflected.count('proj.damage /= 2;') != 2:
              raise SystemExit('source contract changed: reflected damage is no longer quartered by two integer halves')

          reflectability = method(projectile, r'\bpublic bool CanBeReflected\(\)')
          for snippet, label in (
              ('active && friendly && !hostile && damage > 0', 'base reflectability gate'),
              ('type == 728 || type == 955', 'special reflectable identities'),
              ('aiStyle == 1 || aiStyle == 2 || aiStyle == 8 || aiStyle == 21 || aiStyle == 24 || aiStyle == 28 || aiStyle == 29 || aiStyle == 131', 'reflectable aiStyle set'),
          ):
              require(reflectability, snippet, label)

          update_anchor = npc.find('int num37 = 23;')
          if update_anchor < 0:
              raise SystemExit('Eye combat anchor missing')
          if abs(npc.find('damage = GetAttackDamage_CappedAtMaster(damage);') - update_anchor) > 1000:
              raise SystemExit('Eye combat statements are no longer in one local phase-two block')

          print('EYE_COMBAT_REFLECTION_SOURCE_CONTRACT=verified')
          PY
