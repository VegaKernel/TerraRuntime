name: Integrate Sound Gun 1099 Source Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/projectile-ai1-1099-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch permanent projectile source contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 -m py_compile .github/scripts/integrate_sound_gun_1099_source_proof.py
          python3 .github/scripts/integrate_sound_gun_1099_source_proof.py
          python3 -m py_compile tools/ci/probe_projectile_tile_cut.py

          git config user.name OpenAI
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/integrate_sound_gun_1099_source_proof.py
          git add tools/ci/probe_projectile_tile_cut.py
          git commit -m 'ci: pin sound gun projectile source contract'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
