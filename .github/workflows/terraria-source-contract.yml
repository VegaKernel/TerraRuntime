name: Terraria Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaProjectile*.cs'
      - 'src/TerraRuntime/VanillaProjectile*.cs'
      - 'tools/ci/probe_projectile_tile_cut.py'
      - 'tools/ci/probe_projectile_ai3.py'
      - '.github/workflows/terraria-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

# The tile-cut probe also pins the full nullable WindPhysicsImmunity override table and exact
# source contracts for supported simple aiStyle-1 types, including ConfettiGun 178, ConfettiMelee 289,
# BoneArrowFromMerchant 474, and SoundGun 1099.
concurrency:
  # Source-contract runs are evidence for an exact commit. Do not let a later projectile push cancel the
  # decompile/probe that proves an earlier source-backed slice while main is moving quickly.
  group: terra-runtime-source-contract-${{ github.sha }}
  cancel-in-progress: true

jobs:
  projectile-ai3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: >-
          dotnet tool install ilspycmd
          --tool-path .tools
          --version 11.0.0.9375

      - name: Probe projectile aiStyle 3 source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""

          while IFS= read -r -d '' candidate; do
            candidate_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
            printf 'source_candidate_sha256=%s path=%s\n' "$candidate_sha256" "$candidate"
            if [[ "$candidate_sha256" == "$expected_sha256" ]]; then
              assembly="$candidate"
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)

          if [[ -z "$assembly" ]]; then
            echo "Pinned TerrariaServer 1.4.5.8 source assembly was not found." >&2
            exit 1
          fi

          assembly_dir="$(dirname "$assembly")"
          printf 'source_assembly_sha256=%s path=%s\n' "$expected_sha256" "$assembly"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Projectile "$assembly" \
            > artifacts/source-contract/projectile.cs
          python3 tools/ci/probe_projectile_ai3.py \
            --projectile artifacts/source-contract/projectile.cs

  projectile-tile-cut:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: >-
          dotnet tool install ilspycmd
          --tool-path .tools
          --version 11.0.0.9375

      - name: Probe projectile tile-cut source contracts
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""

          while IFS= read -r -d '' candidate; do
            candidate_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
            printf 'source_candidate_sha256=%s path=%s\n' "$candidate_sha256" "$candidate"
            if [[ "$candidate_sha256" == "$expected_sha256" ]]; then
              assembly="$candidate"
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)

          if [[ -z "$assembly" ]]; then
            echo "Pinned TerrariaServer 1.4.5.8 source assembly was not found." >&2
            exit 1
          fi

          assembly_dir="$(dirname "$assembly")"
          printf 'source_assembly_sha256=%s path=%s\n' "$expected_sha256" "$assembly"

          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Projectile "$assembly" \
            > artifacts/source-contract/projectile.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.DelegateMethods "$assembly" \
            > artifacts/source-contract/delegate-methods.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Player "$assembly" \
            > artifacts/source-contract/player.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.WorldGen "$assembly" \
            > artifacts/source-contract/worldgen.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Main "$assembly" \
            > artifacts/source-contract/main.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.TileID "$assembly" \
            > artifacts/source-contract/tile-id.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.ProjectileID "$assembly" \
            > artifacts/source-contract/projectile-id.cs

          python3 tools/ci/probe_projectile_tile_cut.py \
            --projectile artifacts/source-contract/projectile.cs \
            --delegate-methods artifacts/source-contract/delegate-methods.cs \
            --player artifacts/source-contract/player.cs \
            --worldgen artifacts/source-contract/worldgen.cs \
            --main artifacts/source-contract/main.cs \
            --tile-id artifacts/source-contract/tile-id.cs \
            --projectile-id artifacts/source-contract/projectile-id.cs
