name: Vanilla Generated World Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/WorldGenerationContracts.cs'
      - 'src/TerraRuntime.Contracts/Gameplay/WorldGenerationPassContracts.cs'
      - 'src/TerraRuntime.Core/RuntimeWorldGenerationExecutor.cs'
      - 'src/TerraRuntime.World/VanillaWorldGenerationBootstrap1458.cs'
      - 'src/TerraRuntime.World/SourceBackedVanillaWorldGenerationProvider1458.cs'
      - 'src/TerraRuntime.World/VanillaEarlyWorldGenerationPipeline1458.cs'
      - 'src/TerraRuntime.World/VanillaMidWorldGenerationPipeline1458.cs'
      - 'src/TerraRuntime.World/VanillaDungeonWorldGenerationPipeline1458.cs'
      - 'src/TerraRuntime/BuiltInWorldGeneratorSource.cs'
      - 'src/TerraRuntime/WorldGenerationCreateSmoke.cs'
      - 'tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj'
      - 'tests/TerraRuntime.Tests/RuntimeWorldGenerationExecutorTests.cs'
      - 'tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationProvider1458Tests.cs'
      - 'tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationPipeline1458Tests.cs'
      - 'tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationMidPipeline1458Tests.cs'
      - 'tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests.cs'
      - 'tests/TerraRuntime.Tests/NpcAiProductionCompositionTests.cs'
      - '.github/workflows/terraria-vanilla-generated-world-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-vanilla-generated-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-load:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Build TerraRuntime
        run: dotnet build src/TerraRuntime/TerraRuntime.csproj -c Release

      - name: Run vanilla worldgen unit contracts
        run: >-
          dotnet run
          --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj
          -c Release
          --
          -class TerraRuntime.Tests.RuntimeWorldGenerationExecutorTests
          -class TerraRuntime.Tests.SourceBackedVanillaWorldGenerationProvider1458Tests
          -class TerraRuntime.Tests.SourceBackedVanillaWorldGenerationPipeline1458Tests
          -class TerraRuntime.Tests.SourceBackedVanillaWorldGenerationMidPipeline1458Tests
          -class TerraRuntime.Tests.SourceBackedVanillaWorldGenerationDungeonPipeline1458Tests

      - name: Generate TerraRuntime vanilla world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet run \
            --project src/TerraRuntime/TerraRuntime.csproj \
            -c Release \
            --no-build \
            -- --worldgen-create-smoke "$GITHUB_WORKSPACE/artifacts/terraruntime-generated-vanilla.wld" terraruntime:vanilla
          test -s artifacts/terraruntime-generated-vanilla.wld

      - name: Verify generated world with TerraRuntime loader
        run: >-
          dotnet run
          --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj
          -c Release
          -- artifacts/terraruntime-generated-vanilla.wld

      - name: Download pinned TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

          expected="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          echo "Pinned TerrariaServer.exe SHA-256 verified."

      - name: Load TerraRuntime vanilla world in official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          server="$(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.bin.x86_64' -print -quit)"
          test -n "$server"
          chmod +x "$server"
          server="$(realpath "$server")"
          server_dir="$(dirname "$server")"
          server_name="$(basename "$server")"
          world="$GITHUB_WORKSPACE/artifacts/terraruntime-generated-vanilla.wld"
          config="$GITHUB_WORKSPACE/artifacts/vanilla-generated-world-serverconfig.txt"
          host_log="$GITHUB_WORKSPACE/artifacts/vanilla-generated-world-server.log"
          fifo="$GITHUB_WORKSPACE/artifacts/vanilla-generated-world-server.stdin"

          cat > "$config" <<EOF
          world=$world
          autocreate=0
          maxplayers=1
          port=17790
          password=
          motd=TerraRuntime vanilla generated world acceptance
          secure=0
          upnp=0
          npcstream=0
          priority=0
          EOF

          rm -f "$fifo"
          mkfifo "$fifo"
          exec 9<> "$fifo"
          (
            cd "$server_dir"
            "./$server_name" -config "$config" < "$fifo"
          ) > "$host_log" 2>&1 &
          official_pid=$!

          cleanup() {
            printf 'exit\n' >&9 2>/dev/null || true
            sleep 1
            kill "$official_pid" 2>/dev/null || true
            wait "$official_pid" 2>/dev/null || true
            exec 9>&- || true
          }
          trap cleanup EXIT

          listener=false
          for _ in $(seq 1 180); do
            if ! kill -0 "$official_pid" 2>/dev/null; then
              cat "$host_log" >&2
              echo "Official TerrariaServer exited while loading the TerraRuntime vanilla world." >&2
              exit 1
            fi
            if ss -ltn | grep -q ':17790 '; then
              listener=true
              break
            fi
            sleep 0.5
          done

          cat "$host_log"
          if [[ "$listener" != true ]]; then
            echo "Official TerrariaServer did not open port 17790 for the TerraRuntime vanilla world." >&2
            exit 1
          fi
          echo "Official TerrariaServer accepted the TerraRuntime vanilla world."

      - name: Upload vanilla world acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-generated-world-acceptance-${{ github.sha }}
          path: |
            artifacts/terraruntime-generated-vanilla.wld
            artifacts/vanilla-generated-world-server.log
            artifacts/vanilla-generated-world-serverconfig.txt
          if-no-files-found: warn
          retention-days: 7
