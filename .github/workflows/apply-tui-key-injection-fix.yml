name: Apply Terminal.Gui smoke key fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tui-key-injection-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Update smoke key injection API
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/TerraRuntime/TerminalUI/TerminalUiSmoke.cs")
          text = path.read_text(encoding="utf-8")
          old = "app.InjectKey("
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly two InjectKey smoke calls, found {count}")
          text = text.replace(old, "app.Keyboard.RaiseKeyDownEvent(")
          path.write_text(text, encoding="utf-8")

      - name: Build TerraRuntime
        run: dotnet build src/TerraRuntime/TerraRuntime.csproj --configuration Release

      - name: Commit Terminal.Gui fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-tui-key-injection-fix.yml
          git add src/TerraRuntime/TerminalUI/TerminalUiSmoke.cs
          git commit -m "fix: update Terminal.Gui smoke key injection"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; rebasing (attempt ${attempt})"
            git pull --rebase origin main
          done

          echo "Could not push Terminal.Gui fix after retries" >&2
          exit 1
