name: NPC Loot Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaContentIds.cs'
      - 'src/TerraRuntime.Core/VanillaNpcLoot*.cs'
      - 'tests/TerraRuntime.Tests/*NpcLoot*.cs'
      - 'tools/ci/probe_npc_loot.py'
      - 'tools/ci/probe_npc_loot_spawn.py'
      - '.github/workflows/npc-loot-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-npc-loot-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  blue-slime-loot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: >-
          dotnet tool install ilspycmd
          --tool-path .tools
          --version 11.0.0.9375

      - name: Probe Blue Slime loot source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""

          while IFS= read -r -d '' candidate; do
            candidate_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
            printf 'source_candidate_sha256=%s path=%s\n' "$candidate_sha256" "$candidate"
            if [[ "$candidate_sha256" == "$expected_sha256" ]]; then
              assembly="$candidate"
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)

          if [[ -z "$assembly" ]]; then
            echo "Pinned TerrariaServer 1.4.5.8 source assembly was not found." >&2
            exit 1
          fi

          assembly_dir="$(dirname "$assembly")"
          printf 'source_assembly_sha256=%s path=%s\n' "$expected_sha256" "$assembly"

          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.ItemDropRules.ItemDropDatabase "$assembly" > artifacts/source-contract/item-drop-database.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.ItemDropRules.ItemDropRule "$assembly" > artifacts/source-contract/item-drop-rule.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.ItemDropRules.CommonDrop "$assembly" > artifacts/source-contract/common-drop.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.ItemDropRules.DropBasedOnExtraGel "$assembly" > artifacts/source-contract/extra-gel.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.ItemDropRules.DropBasedOnExpertMode "$assembly" > artifacts/source-contract/expert-mode.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.ItemDropRules.Conditions "$assembly" > artifacts/source-contract/conditions.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.GameContent.ItemDropRules.CommonCode "$assembly" > artifacts/source-contract/common-code.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Item "$assembly" > artifacts/source-contract/item.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.NPCID "$assembly" > artifacts/source-contract/npc-id.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.ItemID "$assembly" > artifacts/source-contract/item-id.cs

          python3 tools/ci/probe_npc_loot.py \
            --drop-database artifacts/source-contract/item-drop-database.cs \
            --drop-rule artifacts/source-contract/item-drop-rule.cs \
            --common-drop artifacts/source-contract/common-drop.cs \
            --extra-gel artifacts/source-contract/extra-gel.cs \
            --expert-mode artifacts/source-contract/expert-mode.cs \
            --conditions artifacts/source-contract/conditions.cs \
            --npc-id artifacts/source-contract/npc-id.cs \
            --item-id artifacts/source-contract/item-id.cs

          python3 tools/ci/probe_npc_loot_spawn.py \
            --common-code artifacts/source-contract/common-code.cs \
            --common-drop artifacts/source-contract/common-drop.cs \
            --item artifacts/source-contract/item.cs
