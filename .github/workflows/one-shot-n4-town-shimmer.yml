name: One-shot N4 town shimmer integration

on:
  push:
    branches: [work/n4-town-shimmer-1458]
    paths:
      - '.github/workflows/one-shot-n4-town-shimmer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-n4-town-shimmer
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Apply production integration
        run: python3 tools/ci/apply_n4_town_shimmer.py

      - name: Build Release
        run: dotnet build TerraRuntime.slnx -c Release

      - name: Run complete tests
        run: dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build

      - name: Commit integrated block and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git rm tools/ci/apply_n4_town_shimmer.py .github/workflows/one-shot-n4-town-shimmer.yml
          git add -A
          git commit -m "Complete source-backed Town NPC shimmer lifecycle"
          git push origin HEAD:work/n4-town-shimmer-1458
