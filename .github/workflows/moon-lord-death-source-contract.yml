name: Moon Lord Death Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.World/**'
      - 'tests/TerraRuntime.Tests/WorldLunarEventMetadataTests.cs'
      - 'tests/TerraRuntime.Tests/WorldLateBossProgressionPersistenceTests.cs'
      - 'tests/TerraRuntime.Tests/Fixtures/*headers-1458.bin.gz'
      - 'src/TerraRuntime.Core/Npcs/**'
      - 'src/TerraRuntime.Application/NpcAuthority.cs'
      - 'src/TerraRuntime.Application/VanillaNpcWorldMotionAiStepper.cs'
      - 'src/TerraRuntime.Application/RuntimeNpcReplicationRegistry.cs'
      - 'src/TerraRuntime.Application/RuntimeNpcNetworkCombatPipeline*.cs'
      - 'tests/TerraRuntime.Tests/MoonLordDeathSequenceTests*.cs'
      - 'tests/TerraRuntime.Tests/MoonLordIntroductionTests.cs'
      - 'tests/TerraRuntime.Tests/MoonLordTeleportTests.cs'
      - 'tests/TerraRuntime.Tests/MoonLordHandTests.cs'
      - 'tests/TerraRuntime.Tests/Fixtures/moon-lord-hands-1458.json.gz'
      - 'src/TerraRuntime.Contracts/Runtime/NpcSnapshot.cs'
      - 'src/TerraRuntime.Gameplay/Npcs/Simulation/IVanillaNpcRandom.cs'
      - 'tests/TerraRuntime.Tests/Fixtures/moon-lord-teleport-1458.json.gz'
      - 'tests/TerraRuntime.Tests/Fixtures/moon-lord-intro-1458.json.gz'
      - 'tests/TerraRuntime.Tests/MoonLordCoreMotionTests.cs'
      - 'tests/TerraRuntime.Tests/LateHardmodeBossParityTests.cs'
      - 'tools/ci/check_moon_lord*source.py'
      - 'src/TerraRuntime.Gameplay/Npcs/Loot/VanillaMoonLordLoot.cs'
      - 'src/TerraRuntime.Gameplay/Items/**'
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaMoonLordItemIds.cs'
      - 'src/TerraRuntime.Application/RuntimeMoonLordLootDeliverySink.cs'
      - 'tests/TerraRuntime.Tests/*MoonLordLoot*Tests.cs'
      - '.github/workflows/moon-lord-death-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Build
        run: dotnet build build/TerraRuntime.slnx -c Release -warnaserror
      - name: Exercise death lifecycle and late boss transitions
        run: >-
          dotnet tests/TerraRuntime.Tests/bin/Release/net11.0/TerraRuntime.Tests.dll
          -class TerraRuntime.Tests.WorldLunarEventMetadataTests
          -class TerraRuntime.Tests.WorldLateBossProgressionPersistenceTests
          -class TerraRuntime.Tests.RuntimeWorldSnapshotCacheValidityTests
          -class TerraRuntime.Tests.MoonLordLootPipelineTests
          -class TerraRuntime.Tests.VanillaMoonLordLootTests
          -class TerraRuntime.Tests.MoonLordDeathSequenceTests
          -class TerraRuntime.Tests.MoonLordIntroductionTests
          -class TerraRuntime.Tests.MoonLordTeleportTests
          -class TerraRuntime.Tests.MoonLordHandTests
          -class TerraRuntime.Tests.MoonLordCoreMotionTests
          -class TerraRuntime.Tests.LateHardmodeBossParityTests
      - name: Download reference and install pinned decompiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          assembly=.cache/terraria-1458/extracted/1458/Windows/TerrariaServer.exe
          echo "d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e  $assembly" | sha256sum --check
          .tools/ilspycmd --disable-updatecheck -r "$(dirname "$assembly")" -t Terraria.NPC "$assembly" > .cache/terraria-1458/NPC.cs
          python3 tools/ci/check_moon_lord_death_source.py --assembly "$assembly" --npc .cache/terraria-1458/NPC.cs
          .tools/ilspycmd --disable-updatecheck -r "$(dirname "$assembly")" -t Terraria.GameContent.ItemDropRules.ItemDropDatabase "$assembly" > .cache/terraria-1458/ItemDropDatabase.cs
          .tools/ilspycmd --disable-updatecheck -r "$(dirname "$assembly")" -t Terraria.GameContent.ItemDropRules.FromOptionsWithoutRepeatsDropRule "$assembly" > .cache/terraria-1458/FromOptionsWithoutRepeatsDropRule.cs
          python3 tools/ci/check_moon_lord_loot_source.py --assembly "$assembly" --npc .cache/terraria-1458/NPC.cs --database .cache/terraria-1458/ItemDropDatabase.cs --selection .cache/terraria-1458/FromOptionsWithoutRepeatsDropRule.cs
          .tools/ilspycmd --disable-updatecheck -r "$(dirname "$assembly")" -t Terraria.IO.WorldFile "$assembly" > .cache/terraria-1458/WorldFile.cs
          python3 tools/ci/check_moon_lord_world_source.py --assembly "$assembly" --world .cache/terraria-1458/WorldFile.cs
