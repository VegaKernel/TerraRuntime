name: Vanilla World Load

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/**'
      - 'src/TerraRuntime.Network/**'
      - 'src/TerraRuntime.Protocol/**'
      - 'src/TerraRuntime.Protocol.Multiplicity/**'
      - 'src/TerraRuntime.World/**'
      - 'tools/TerraRuntime.WorldVerify/**'
      - '.github/workflows/vanilla-world-load.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-vanilla-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-official-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Generate official small world
        shell: bash
        run: |
          set -euo pipefail
          server="$(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.bin.x86_64' -print -quit)"
          test -n "$server"
          chmod +x "$server"
          server_dir="$(dirname "$server")"
          server_name="$(basename "$server")"
          world="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld"
          config="$GITHUB_WORKSPACE/artifacts/vanilla-serverconfig.txt"

          cat > "$config" <<EOF
          world=$world
          autocreate=1
          worldname=TerraRuntimeVanillaSmoke
          difficulty=0
          maxplayers=1
          port=17779
          password=
          motd=TerraRuntime world format verification
          secure=1
          upnp=0
          EOF

          set +e
          (
            cd "$server_dir"
            printf 'exit\n' | timeout 180 "./$server_name" -config "$config"
          ) > "$GITHUB_WORKSPACE/artifacts/vanilla-server.log" 2>&1
          status=$?
          set -e

          cat "$GITHUB_WORKSPACE/artifacts/vanilla-server.log"
          test -s "$world"
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Official server exited with status $status" >&2
            exit "$status"
          fi

      - name: Verify real vanilla world with TerraRuntime
        run: >-
          dotnet run
          --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj
          -c Release
          -- artifacts/vanilla-smoke.wld

      - name: Build TerraRuntime host
        run: dotnet build src/TerraRuntime/TerraRuntime.csproj -c Release

      - name: Probe live TerraRuntime join and movement relay
        shell: bash
        run: |
          set -euo pipefail
          host_log="$GITHUB_WORKSPACE/artifacts/terraruntime-server.log"
          client_log="$GITHUB_WORKSPACE/artifacts/terraruntime-client.log"
          server_dll="$GITHUB_WORKSPACE/src/TerraRuntime/bin/Release/net11.0/TerraRuntime.Server.dll"

          dotnet "$server_dll" \
            --world "$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld" \
            --port 17780 \
            --max-players 2 \
            > "$host_log" 2>&1 &
          host_pid=$!

          cleanup() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 120); do
            if ! kill -0 "$host_pid" 2>/dev/null; then
              cat "$host_log" >&2
              echo "TerraRuntime host exited before opening the listener." >&2
              exit 1
            fi
            if grep -q "TerraRuntime listening on 0.0.0.0:17780" "$host_log"; then
              break
            fi
            sleep 0.5
          done

          grep -q "TerraRuntime listening on 0.0.0.0:17780" "$host_log"

          python3 - <<'PY' 2>&1 | tee "$client_log"
          import socket
          import struct
          import time

          def recv_exact(sock, count):
              chunks = []
              remaining = count
              while remaining:
                  chunk = sock.recv(remaining)
                  if not chunk:
                      raise ConnectionError(
                          f"connection closed with {remaining} bytes still expected"
                      )
                  chunks.append(chunk)
                  remaining -= len(chunk)
              return b"".join(chunks)

          def recv_frame(sock):
              header = recv_exact(sock, 3)
              length, message_id = struct.unpack("<HB", header)
              if length < 3:
                  raise RuntimeError(f"invalid frame length {length} for packet {message_id}")
              return message_id, recv_exact(sock, length - 3)

          def recv_until_packet(sock, expected_id, timeout, max_frames=2048):
              deadline = time.monotonic() + timeout
              skipped = []
              for _ in range(max_frames):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      break
                  sock.settimeout(remaining)
                  try:
                      message_id, payload = recv_frame(sock)
                  except socket.timeout:
                      break
                  if message_id == expected_id:
                      return payload, skipped
                  skipped.append(message_id)
              raise SystemExit(
                  f"expected packet {expected_id} before timeout/frame limit; skipped={skipped[:64]}"
              )

          hello = bytes([
              15, 0,
              1,
              11,
              *b"Terraria326",
          ])

          def join_client(expected_slot):
              client = socket.create_connection(("127.0.0.1", 17780), timeout=5)
              client.settimeout(15)

              client.sendall(hello)
              message_id, payload = recv_frame(client)
              expected_continue = bytes([expected_slot, 0])
              if message_id != 3 or payload != expected_continue:
                  client.close()
                  raise SystemExit(
                      f"expected packet 3 slot {expected_slot}/flag false, got id={message_id}, payload={payload!r}"
                  )

              client.sendall(struct.pack("<HB", 3, 6))
              message_id, world_info = recv_frame(client)
              if message_id != 7 or not world_info:
                  client.close()
                  raise SystemExit(
                      f"expected non-empty packet 7 after packet 6, got id={message_id}, bytes={len(world_info)}"
                  )

              client.sendall(struct.pack("<HBiiB", 12, 8, -1, -1, 0))

              message_id, repeated_world_info = recv_frame(client)
              if message_id != 7 or repeated_world_info != world_info:
                  client.close()
                  raise SystemExit(
                      "packet 8 did not begin with the cached packet 7 WorldInfo frame"
                  )

              message_id, status_payload = recv_frame(client)
              if message_id != 9 or len(status_payload) < 4:
                  client.close()
                  raise SystemExit(
                      f"expected packet 9 after repeated packet 7, got id={message_id}"
                  )
              expected_sections = struct.unpack_from("<i", status_payload, 0)[0]
              if expected_sections <= 0:
                  client.close()
                  raise SystemExit(f"invalid packet 9 section count {expected_sections}")

              section_count = 0
              chest_size_count = 0
              chest_item_count = 0
              frame_count = 0
              while True:
                  message_id, payload = recv_frame(client)
                  frame_count += 1
                  if message_id == 10:
                      section_count += 1
                  elif message_id == 155:
                      chest_size_count += 1
                  elif message_id == 32:
                      chest_item_count += 1
                  elif message_id == 49:
                      break

                  if frame_count > 20000:
                      client.close()
                      raise SystemExit("bootstrap exceeded 20000 frames before packet 49")

              if section_count != expected_sections:
                  client.close()
                  raise SystemExit(
                      f"packet 9 announced {expected_sections} sections but received {section_count} packet-10 frames"
                  )

              spawn = struct.pack(
                  "<HBBhhihhBB",
                  18,
                  12,
                  expected_slot,
                  100 + expected_slot,
                  200,
                  0,
                  0,
                  0,
                  0,
                  0,
              )
              client.sendall(spawn)
              return client, section_count, chest_size_count, chest_item_count, frame_count

          client1 = None
          client2 = None
          replacement = None
          try:
              client1, sections1, chest_sizes1, chest_items1, frames1 = join_client(0)
              client2, sections2, chest_sizes2, chest_items2, frames2 = join_client(1)

              # Packet 12 enters the authoritative loop asynchronously. A few ticks are enough for
              # both endpoints to become Playing before exercising the relay path.
              time.sleep(0.25)

              movement_x = 123.5
              movement_y = 456.25
              movement = struct.pack(
                  "<HBBBBBBBff",
                  17,
                  13,
                  99,      # deliberately forged client player id; server slot 0 must win
                  0x03,
                  0,
                  0,
                  0,
                  4,
                  movement_x,
                  movement_y,
              )
              client1.sendall(movement)

              # SyncOnePlayer lifecycle/baseline frames such as PlayerActive (14), PlayerInfo (4)
              # and PlayerSlot (5) may already be queued after the second spawn. Wait for the
              # semantic movement result instead of assuming packet 13 is physically next.
              payload, skipped_to_movement = recv_until_packet(client2, 13, 5)
              if len(payload) != 14:
                  raise SystemExit(
                      f"expected relayed minimum packet 13 payload, got payloadBytes={len(payload)}, "
                      f"skipped={skipped_to_movement[:64]}"
                  )
              if payload[0] != 0:
                  raise SystemExit(
                      f"movement relay trusted forged player id 99 instead of authoritative slot 0: relayed={payload[0]}"
                  )
              relayed_x, relayed_y = struct.unpack_from("<ff", payload, 6)
              if relayed_x != movement_x or relayed_y != movement_y:
                  raise SystemExit(
                      f"movement relay changed coordinates: expected=({movement_x},{movement_y}), got=({relayed_x},{relayed_y})"
                  )

              # The sender may legitimately receive lifecycle/baseline frames for the peer. What
              # must never happen is an echo of its own authoritative movement packet.
              echo_deadline = time.monotonic() + 0.5
              echoed_movement = None
              while time.monotonic() < echo_deadline:
                  client1.settimeout(max(0.001, echo_deadline - time.monotonic()))
                  try:
                      echoed_id, echoed_payload = recv_frame(client1)
                  except socket.timeout:
                      break
                  if echoed_id != 13 or len(echoed_payload) != 14:
                      continue
                  echoed_x, echoed_y = struct.unpack_from("<ff", echoed_payload, 6)
                  if echoed_payload[0] == 0 and echoed_x == movement_x and echoed_y == movement_y:
                      echoed_movement = echoed_payload
                      break
              if echoed_movement is not None:
                  raise SystemExit("movement sender unexpectedly received its own authoritative packet-13 relay echo")

              client1.close()
              client1 = None

              # Closing a playing client must release its slot. Keep client 2 connected and prove
              # that a fresh connection can reuse authoritative slot 0.
              deadline = time.time() + 5
              while time.time() < deadline and replacement is None:
                  candidate = None
                  try:
                      candidate = socket.create_connection(("127.0.0.1", 17780), timeout=1)
                      candidate.settimeout(0.5)
                      candidate.sendall(hello)
                      message_id, replacement_payload = recv_frame(candidate)
                      if message_id == 3 and replacement_payload == b"\x00\x00":
                          replacement = candidate
                          candidate = None
                          break
                  except (OSError, ConnectionError, RuntimeError):
                      pass
                  finally:
                      if candidate is not None:
                          candidate.close()
                  time.sleep(0.1)

              if replacement is None:
                  raise SystemExit("slot 0 was not reusable after clean disconnect")

              print(
                  "Live TerraRuntime two-client relay passed: "
                  f"client1Sections={sections1}, client2Sections={sections2}, "
                  f"client1ChestSizes={chest_sizes1}, client2ChestSizes={chest_sizes2}, "
                  f"client1ChestItems={chest_items1}, client2ChestItems={chest_items2}, "
                  f"framesBefore49=({frames1},{frames2}), relaySlot={payload[0]}, "
                  f"lifecycleFramesBeforeRelay={len(skipped_to_movement)}."
              )
          finally:
              for client in (client1, client2, replacement):
                  if client is not None:
                      try:
                          client.close()
                      except OSError:
                          pass
          PY

          cat "$host_log"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-world-load-failure
          path: |
            artifacts/vanilla-server.log
            artifacts/vanilla-serverconfig.txt
            artifacts/terraruntime-server.log
            artifacts/terraruntime-client.log
          retention-days: 3
