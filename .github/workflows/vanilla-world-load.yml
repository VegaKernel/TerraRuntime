name: Vanilla World Load

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/**'
      - 'src/TerraRuntime.Network/**'
      - 'src/TerraRuntime.Protocol/**'
      - 'src/TerraRuntime.Protocol.Multiplicity/**'
      - 'src/TerraRuntime.World/**'
      - 'tools/TerraRuntime.WorldVerify/**'
      - 'tools/TerraRuntime.ChestLocate/**'
      - 'tools/ci/live_join_relay_probe.py'
      - 'tools/ci/live_chest_open_probe.py'
      - 'tools/ci/live_chest_observer_probe.py'
      - 'tools/ci/official_chest_item_reference_probe.py'
      - '.github/workflows/vanilla-world-load.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-vanilla-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-official-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Generate official small world
        shell: bash
        run: |
          set -euo pipefail
          server="$(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.bin.x86_64' -print -quit)"
          test -n "$server"
          chmod +x "$server"
          server_dir="$(dirname "$server")"
          server_name="$(basename "$server")"
          world="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld"
          config="$GITHUB_WORKSPACE/artifacts/vanilla-serverconfig.txt"

          cat > "$config" <<EOF
          world=$world
          autocreate=1
          worldname=TerraRuntimeVanillaSmoke
          difficulty=0
          maxplayers=1
          port=17779
          password=
          motd=TerraRuntime world format verification
          secure=1
          upnp=0
          EOF

          set +e
          (
            cd "$server_dir"
            printf 'exit\n' | timeout 180 "./$server_name" -config "$config"
          ) > "$GITHUB_WORKSPACE/artifacts/vanilla-server.log" 2>&1
          status=$?
          set -e

          cat "$GITHUB_WORKSPACE/artifacts/vanilla-server.log"
          test -s "$world"
          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Official server exited with status $status" >&2
            exit "$status"
          fi

      - name: Probe official 1.4.5.8 chest item routing reference
        shell: bash
        run: |
          set -euo pipefail
          server="$(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.bin.x86_64' -print -quit)"
          test -n "$server"
          chmod +x "$server"
          server_dir="$(dirname "$server")"
          server_name="$(basename "$server")"
          reference_world="$GITHUB_WORKSPACE/artifacts/official-chest-reference.wld"
          config="$GITHUB_WORKSPACE/artifacts/official-chest-reference-serverconfig.txt"
          host_log="$GITHUB_WORKSPACE/artifacts/official-chest-reference-server.log"
          client_log="$GITHUB_WORKSPACE/artifacts/official-chest-item-reference.log"
          selection="$GITHUB_WORKSPACE/artifacts/official-chest-reference-selection.txt"
          fifo="$GITHUB_WORKSPACE/artifacts/official-chest-reference.stdin"

          cp "$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld" "$reference_world"
          chest_info="$(dotnet run \
            --project tools/TerraRuntime.ChestLocate/TerraRuntime.ChestLocate.csproj \
            -c Release \
            -- "$reference_world" | tail -1)"
          echo "selected_chest $chest_info" | tee "$selection"

          chest_id="" x="" y="" item_slot="" item_stack="" item_prefix="" item_net_id=""
          for field in $chest_info; do
            case "$field" in
              slot=*) chest_id="${field#slot=}" ;;
              x=*) x="${field#x=}" ;;
              y=*) y="${field#y=}" ;;
              itemSlot=*) item_slot="${field#itemSlot=}" ;;
              itemStack=*) item_stack="${field#itemStack=}" ;;
              itemPrefix=*) item_prefix="${field#itemPrefix=}" ;;
              itemNetId=*) item_net_id="${field#itemNetId=}" ;;
            esac
          done
          test -n "$chest_id" -a -n "$x" -a -n "$y"
          test -n "$item_slot" -a -n "$item_stack" -a -n "$item_prefix" -a -n "$item_net_id"

          cat > "$config" <<EOF
          world=$reference_world
          autocreate=0
          maxplayers=2
          port=17783
          password=
          motd=TerraRuntime official packet32 routing reference
          secure=1
          upnp=0
          EOF

          rm -f "$fifo"
          mkfifo "$fifo"
          exec 9<> "$fifo"
          (
            cd "$server_dir"
            "./$server_name" -config "$config" < "$fifo"
          ) > "$host_log" 2>&1 &
          official_pid=$!

          cleanup_reference() {
            printf 'exit\n' >&9 2>/dev/null || true
            sleep 1
            kill "$official_pid" 2>/dev/null || true
            wait "$official_pid" 2>/dev/null || true
            exec 9>&- || true
          }
          trap cleanup_reference EXIT

          for _ in $(seq 1 120); do
            if ! kill -0 "$official_pid" 2>/dev/null; then
              cat "$host_log" >&2
              echo "Official chest-reference server exited before opening the listener." >&2
              exit 1
            fi
            if ss -ltn | grep -q ':17783 '; then
              break
            fi
            sleep 0.5
          done
          ss -ltn | grep -q ':17783 '

          python3 tools/ci/official_chest_item_reference_probe.py \
            --port 17783 \
            --chest-id "$chest_id" \
            --x "$x" \
            --y "$y" \
            --item-slot "$item_slot" \
            --item-stack "$item_stack" \
            --item-prefix "$item_prefix" \
            --item-net-id "$item_net_id" \
            2>&1 | tee "$client_log"
          cat "$host_log"

      - name: Verify real vanilla world with TerraRuntime
        run: >-
          dotnet run
          --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj
          -c Release
          -- artifacts/vanilla-smoke.wld

      - name: Build TerraRuntime host
        run: dotnet build src/TerraRuntime/TerraRuntime.csproj -c Release

      - name: Probe live TerraRuntime join and movement relay
        shell: bash
        run: |
          set -euo pipefail
          host_log="$GITHUB_WORKSPACE/artifacts/terraruntime-server.log"
          client_log="$GITHUB_WORKSPACE/artifacts/terraruntime-client.log"
          server_dll="$GITHUB_WORKSPACE/src/TerraRuntime/bin/Release/net11.0/TerraRuntime.Server.dll"

          dotnet "$server_dll" \
            --world "$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld" \
            --port 17780 \
            --max-players 2 \
            > "$host_log" 2>&1 &
          host_pid=$!

          cleanup() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 120); do
            if ! kill -0 "$host_pid" 2>/dev/null; then
              cat "$host_log" >&2
              echo "TerraRuntime host exited before opening the listener." >&2
              exit 1
            fi
            if grep -q "TerraRuntime listening on 0.0.0.0:17780" "$host_log"; then
              break
            fi
            sleep 0.5
          done

          grep -q "startup_profile source=canonical-wld" "$host_log"
          grep -q "Runtime bootstrap cache rebuilt:" "$host_log"
          grep -q "bootstrap_cache_hit=false" "$host_log"
          grep -q "TerraRuntime listening on 0.0.0.0:17780" "$host_log"
          python3 tools/ci/live_join_relay_probe.py --port 17780 2>&1 | tee "$client_log"
          cat "$host_log"

      - name: Probe live chest open and contents
        shell: bash
        run: |
          set -euo pipefail
          world="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld"
          host_log="$GITHUB_WORKSPACE/artifacts/terraruntime-chest-server.log"
          client_log="$GITHUB_WORKSPACE/artifacts/terraruntime-chest-client.log"
          observer_log="$GITHUB_WORKSPACE/artifacts/terraruntime-chest-observer.log"
          server_dll="$GITHUB_WORKSPACE/src/TerraRuntime/bin/Release/net11.0/TerraRuntime.Server.dll"

          chest_info="$(dotnet run \
            --project tools/TerraRuntime.ChestLocate/TerraRuntime.ChestLocate.csproj \
            -c Release \
            -- "$world" | tail -1)"
          echo "selected_chest $chest_info" | tee "$GITHUB_WORKSPACE/artifacts/terraruntime-chest-selection.txt"

          chest_id="" x="" y="" slots="" item_slot="" item_stack="" item_prefix="" item_net_id=""
          for field in $chest_info; do
            case "$field" in
              slot=*) chest_id="${field#slot=}" ;;
              x=*) x="${field#x=}" ;;
              y=*) y="${field#y=}" ;;
              slots=*) slots="${field#slots=}" ;;
              itemSlot=*) item_slot="${field#itemSlot=}" ;;
              itemStack=*) item_stack="${field#itemStack=}" ;;
              itemPrefix=*) item_prefix="${field#itemPrefix=}" ;;
              itemNetId=*) item_net_id="${field#itemNetId=}" ;;
            esac
          done
          test -n "$chest_id" -a -n "$x" -a -n "$y" -a -n "$slots"
          test -n "$item_slot" -a -n "$item_stack" -a -n "$item_prefix" -a -n "$item_net_id"

          # Force this probe back through the canonical official .wld instead of relying on
          # the cache produced by the preceding join probe.
          rm -f "$GITHUB_WORKSPACE/artifacts/vanilla-smoke.runtime-world"
          rm -f "$GITHUB_WORKSPACE/artifacts/vanilla-smoke.runtime-bootstrap"

          dotnet "$server_dll" \
            --world "$world" \
            --port 17782 \
            --max-players 2 \
            > "$host_log" 2>&1 &
          host_pid=$!

          cleanup_chest() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup_chest EXIT

          for _ in $(seq 1 120); do
            if ! kill -0 "$host_pid" 2>/dev/null; then
              cat "$host_log" >&2
              echo "Chest-probe TerraRuntime host exited before opening the listener." >&2
              exit 1
            fi
            if grep -q "TerraRuntime listening on 0.0.0.0:17782" "$host_log"; then
              break
            fi
            sleep 0.5
          done

          grep -q "startup_profile source=canonical-wld" "$host_log"
          python3 tools/ci/live_chest_open_probe.py \
            --port 17782 \
            --chest-id "$chest_id" \
            --x "$x" \
            --y "$y" \
            --slots "$slots" \
            --item-slot "$item_slot" \
            --item-stack "$item_stack" \
            --item-prefix "$item_prefix" \
            --item-net-id "$item_net_id" \
            2>&1 | tee "$client_log"

          python3 tools/ci/live_chest_observer_probe.py \
            --port 17782 \
            --chest-id "$chest_id" \
            --x "$x" \
            --y "$y" \
            --slots "$slots" \
            --item-slot "$item_slot" \
            --item-stack "$item_stack" \
            --item-prefix "$item_prefix" \
            --item-net-id "$item_net_id" \
            2>&1 | tee "$observer_log"
          cat "$host_log"

      - name: Prove warm world and bootstrap snapshot startup without reading source world
        shell: bash
        run: |
          set -euo pipefail
          world="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld"
          cache="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.runtime-world"
          bootstrap_cache="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.runtime-bootstrap"
          warm_log="$GITHUB_WORKSPACE/artifacts/terraruntime-warm-cache.log"
          server_dll="$GITHUB_WORKSPACE/src/TerraRuntime/bin/Release/net11.0/TerraRuntime.Server.dll"

          test -s "$cache"
          test -s "$bootstrap_cache"
          original_mode="$(stat -c '%a' "$world")"
          chmod 000 "$world"

          dotnet "$server_dll" \
            --world "$world" \
            --port 17781 \
            --max-players 2 \
            > "$warm_log" 2>&1 &
          warm_pid=$!

          cleanup_warm() {
            kill "$warm_pid" 2>/dev/null || true
            wait "$warm_pid" 2>/dev/null || true
            chmod "$original_mode" "$world" 2>/dev/null || true
          }
          trap cleanup_warm EXIT

          for _ in $(seq 1 120); do
            if ! kill -0 "$warm_pid" 2>/dev/null; then
              cat "$warm_log" >&2
              echo "Warm-cache TerraRuntime host exited before opening the listener." >&2
              exit 1
            fi
            if grep -q "TerraRuntime listening on 0.0.0.0:17781" "$warm_log"; then
              break
            fi
            sleep 0.5
          done

          grep -q "Runtime world cache hit:" "$warm_log"
          grep -q "Runtime bootstrap cache hit:" "$warm_log"
          grep -q "startup_profile source=runtime-cache" "$warm_log"
          grep -q "bootstrap_cache_hit=true" "$warm_log"
          grep -q "bootstrap_cache_result=Loaded" "$warm_log"
          grep -q "file_read_ms=0.000" "$warm_log"
          grep -q "TerraRuntime listening on 0.0.0.0:17781" "$warm_log"
          cat "$warm_log"

      - name: Benchmark runtime cache parallel reads
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj \
            -c Release \
            -- --cache-bench artifacts/vanilla-smoke.wld \
            | tee artifacts/runtime-cache-parallel.txt
          cat artifacts/runtime-cache-parallel.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Restore canonical wld checkpoint from snapshot
        shell: bash
        run: |
          set -euo pipefail
          world="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.wld"
          original="$GITHUB_WORKSPACE/artifacts/vanilla-smoke.original.wld"
          server_dll="$GITHUB_WORKSPACE/src/TerraRuntime/bin/Release/net11.0/TerraRuntime.Server.dll"

          cp "$world" "$original"
          rm "$world"
          dotnet "$server_dll" --save-wld "$world"
          test -s "$world"
          cmp -s "$world" "$original"
          dotnet run \
            --project tools/TerraRuntime.WorldVerify/TerraRuntime.WorldVerify.csproj \
            -c Release \
            -- "$world"

      - name: Report cold versus warm startup timings
        shell: bash
        run: |
          set -euo pipefail
          cold="$(grep 'startup_profile source=canonical-wld' artifacts/terraruntime-server.log | tail -1)"
          warm="$(grep 'startup_profile source=runtime-cache' artifacts/terraruntime-warm-cache.log | tail -1)"
          test -n "$cold"
          test -n "$warm"

          COLD="$cold" WARM="$warm" python3 - <<'PY' | tee artifacts/runtime-cache-timing.txt
          import os
          import re

          cold = os.environ["COLD"]
          warm = os.environ["WARM"]

          def value(line, key):
              match = re.search(rf"(?:^| ){re.escape(key)}=([0-9.]+)", line)
              if match is None:
                  raise SystemExit(f"missing {key}: {line}")
              return float(match.group(1))

          print("cold_profile=" + cold)
          print("warm_profile=" + warm)
          for metric in (
              "world_ready_ms",
              "bootstrap_ms",
              "bootstrap_cache_load_ms",
              "bootstrap_cache_write_ms",
              "network_ready_ms",
              "file_read_ms",
              "cache_load_ms",
              "allocated_mib",
          ):
              cold_value = value(cold, metric)
              warm_value = value(warm, metric)
              print(f"{metric}: cold={cold_value:.3f} warm={warm_value:.3f} delta={warm_value-cold_value:+.3f}")

          cold_bootstrap = value(cold, "bootstrap_ms")
          warm_bootstrap = value(warm, "bootstrap_ms")
          if warm_bootstrap > 0:
              print(f"bootstrap_speedup={cold_bootstrap / warm_bootstrap:.3f}x")
          if cold_bootstrap > 0:
              print(f"bootstrap_reduction_pct={(1.0 - warm_bootstrap / cold_bootstrap) * 100.0:.2f}")

          cold_ready = value(cold, "world_ready_ms")
          warm_ready = value(warm, "world_ready_ms")
          if warm_ready > 0:
              print(f"world_ready_speedup={cold_ready / warm_ready:.3f}x")
          if cold_ready > 0:
              print(f"world_ready_reduction_pct={(1.0 - warm_ready / cold_ready) * 100.0:.2f}")
          PY

          cat artifacts/runtime-cache-timing.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime cache timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cache-timing
          path: |
            artifacts/runtime-cache-timing.txt
            artifacts/runtime-cache-parallel.txt
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-world-load-failure
          path: |
            artifacts/vanilla-server.log
            artifacts/vanilla-serverconfig.txt
            artifacts/official-chest-reference-server.log
            artifacts/official-chest-item-reference.log
            artifacts/official-chest-reference-serverconfig.txt
            artifacts/official-chest-reference-selection.txt
            artifacts/terraruntime-server.log
            artifacts/terraruntime-client.log
            artifacts/terraruntime-chest-server.log
            artifacts/terraruntime-chest-client.log
            artifacts/terraruntime-chest-observer.log
            artifacts/terraruntime-chest-selection.txt
            artifacts/terraruntime-warm-cache.log
            artifacts/runtime-cache-parallel.txt
          retention-days: 3
