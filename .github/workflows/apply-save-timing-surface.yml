name: Apply Save Timing Surface

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-save-timing-surface.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Patch timing surface and roadmap
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/TerraRuntime/TerminalUI/DashboardWorkspaceWindow.cs',
              '''            rows[16].Text =\n                $"Save        shadow {shadow} dirty {persistence.PendingDirtyTileSections:N0} request {request} write {write} " +\n                $"done {persistence.CompletedWrites:N0}/{persistence.StartedWrites:N0} accepted {persistence.AcceptedSnapshots:N0} " +\n                $"coalesced {persistence.CoalescedSnapshots:N0} failed {persistence.FailedWrites:N0}";''',
              '''            rows[16].Text =\n                $"Save        shadow {shadow} dirty {persistence.PendingDirtyTileSections:N0} request {request} write {write} " +\n                $"done {persistence.CompletedWrites:N0}/{persistence.StartedWrites:N0} accepted {persistence.AcceptedSnapshots:N0} " +\n                $"coalesced {persistence.CoalescedSnapshots:N0} failed {persistence.FailedWrites:N0}  " +\n                $"last-ms snap/ser/write {persistence.LastSnapshotCaptureMilliseconds:F2}/" +\n                $"{persistence.LastSerializationMilliseconds:F2}/{persistence.LastWriteMilliseconds:F2}";''')

          replace_once(
              'docs/roadmap.md',
              '- [ ] Add automatic known-good backup rotation plus validated rollback; atomic publication alone does not recover from a logically bad but complete checkpoint.',
              '- [x] Add automatic known-good backup rotation plus validated rollback; atomic publication alone does not recover from a logically bad but complete checkpoint.')
          replace_once(
              'docs/roadmap.md',
              '- [ ] Save snapshot duration, serialization duration and write duration separately.',
              '- [x] Save snapshot duration, serialization duration and write duration separately.')

          replace_once(
              'docs/en/world-persistence.md',
              'Operations/TUI telemetry exposes accepted, started, completed, coalesced and failed writes plus active/pending state, shadow bootstrap progress and dirty-section counts without exposing mutable world collections.',
              'Operations/TUI telemetry exposes accepted, started, completed, coalesced and failed writes plus active/pending state, shadow bootstrap progress and dirty-section counts without exposing mutable world collections. It also exposes the latest snapshot-capture, serializer-callback and full atomic-write durations; their nested semantics are documented in [Save pipeline timing telemetry](save-pipeline-telemetry.md).')
          replace_once(
              'docs/ru/world-persistence.md',
              'Operations/TUI telemetry публикует accepted/started/completed/coalesced/failed writes, active/pending state, shadow bootstrap progress и dirty-section counts без mutable world collections.',
              'Operations/TUI telemetry публикует accepted/started/completed/coalesced/failed writes, active/pending state, shadow bootstrap progress и dirty-section counts без mutable world collections. Также публикуются последние времена snapshot capture, serializer callback и полной atomic-write транзакции; вложенная семантика этих величин описана в [телеметрии времени save pipeline](save-pipeline-telemetry.md).')

          replace_once(
              'docs/en/save-pipeline-telemetry.md',
              'TerraRuntime exposes persistence timing through immutable world-operations snapshots.',
              'TerraRuntime exposes persistence timing through immutable world-operations snapshots, and the built-in World TUI screen renders the latest three timings in milliseconds.')
          replace_once(
              'docs/ru/save-pipeline-telemetry.md',
              'TerraRuntime публикует время работы persistence через неизменяемые snapshots operations API.',
              'TerraRuntime публикует время работы persistence через неизменяемые snapshots operations API, а встроенный World screen TUI показывает три последних времени в миллисекундах.')
          PY
          git diff --check

      - name: Build tests and TUI surface
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Prove save timing telemetry
        run: >-
          dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --
          -class "TerraRuntime.Tests.WorldSaveTimingTelemetryTests"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/TerraRuntime/TerminalUI/DashboardWorkspaceWindow.cs docs/roadmap.md docs/en/world-persistence.md docs/ru/world-persistence.md docs/en/save-pipeline-telemetry.md docs/ru/save-pipeline-telemetry.md
          git commit -m 'observability: surface save timing telemetry'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
