name: Apply projectile runtime wiring

on:
  push:
    paths:
      - .github/workflows/apply-projectile-stepper-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch ServerRuntimeState
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/TerraRuntime/ServerRuntimeState.cs')
          text = path.read_text()
          old = '        _projectileStepper = projectileStepper;\n'
          new = '        _projectileStepper = projectileStepper ??\n            (worldTiles is null ? null : new VanillaProjectileWorldStateStepper(worldTiles));\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git add src/TerraRuntime/ServerRuntimeState.cs
          git commit -m 'feat: enable vanilla projectile world simulation'
          git push origin HEAD:main
