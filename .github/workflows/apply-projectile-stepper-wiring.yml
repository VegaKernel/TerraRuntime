name: Apply projectile simulation wiring

on:
  push:
    paths:
      - .github/workflows/apply-projectile-stepper-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: wire projectile simulation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply focused runtime wiring patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/TerraRuntime/ServerRuntimeState.cs')
          text = path.read_text()
          old = '        _projectileStepper = projectileStepper;\n'
          new = (
              '        _projectileStepper = projectileStepper ??\n'
              '            (worldTiles is null ? null : new VanillaProjectileWorldStateStepper(worldTiles));\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one projectile stepper assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          Path('.github/workflows/apply-projectile-stepper-wiring.yml').unlink()
          PY

          git config user.name Xekep
          git config user.email Xekep@users.noreply.github.com
          git add -A
          git commit -m 'feat: enable vanilla projectile world simulation'
          git pull --rebase origin main
          git push origin HEAD:main
