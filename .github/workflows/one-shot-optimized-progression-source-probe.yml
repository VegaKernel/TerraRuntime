name: One-shot optimized progression source probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-optimized-progression-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Decompile pinned TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458
      - name: Print exact progression contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('decompiled/1458')
          for rel, needles in {
              'Terraria.ID/TileID.cs': ['ShadowOrbs =', 'Obsidian =', 'Larva ='],
              'Terraria.ID/ItemID.cs': ['Stinger =', 'JungleSpores =', 'Obsidian ='],
          }.items():
              p = root / rel
              lines = p.read_text(encoding='utf-8', errors='ignore').splitlines()
              for needle in needles:
                  print(f'===== {rel} :: {needle} =====')
                  for i,line in enumerate(lines):
                      if needle in line:
                          for row in lines[max(0,i-3):min(len(lines),i+4)]: print(row)
                          break
          print('===== Terraria/WorldGen.cs raw tile 31 contexts =====')
          p = root / 'Terraria/WorldGen.cs'
          lines = p.read_text(encoding='utf-8', errors='ignore').splitlines()
          shown=0
          for i,line in enumerate(lines):
              if ('type == 31' in line or 'type != 31' in line or '.type = 31' in line or 'type=31' in line.replace(' ','')):
                  print(f'--- {i+1} ---')
                  for row in lines[max(0,i-14):min(len(lines),i+24)]: print(row)
                  shown += 1
                  if shown >= 20: break
          print(f'contexts={shown}')
          PY
