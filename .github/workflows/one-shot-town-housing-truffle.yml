name: One-shot Town Housing Truffle

on:
  push:
    branches: [main]
    paths:
      - 'tools/ci/apply_town_housing_truffle.py'
      - '.github/workflows/one-shot-town-housing-truffle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-town-housing-truffle
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Apply Truffle housing parity block
        run: python3 tools/ci/apply_town_housing_truffle.py
      - name: Keep threshold fixture inside source-tested room bounds
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/TerraRuntime.Tests/VanillaTruffleHousing1458Tests.cs')
          text = p.read_text()
          old = '''        for (int x = 40; x < 60 && written < mushroomTiles; x++)
          for (int y = Math.Max(6, top - 10); y < Math.Min(114, top + 30) && written < mushroomTiles; y++)'''
          new = '''        for (int x = 10; x < 20 && written < mushroomTiles; x++)
          for (int y = top; y < top + 10 && written < mushroomTiles; y++)'''
          if old not in text:
              raise SystemExit('Truffle fixture anchor drifted')
          p.write_text(text.replace(old, new))
      - name: Validate generated source probe syntax
        run: python3 -m py_compile tools/ci/check_truffle_housing_source.py
      - name: Validate bilingual documentation
        run: |
          python3 tools/ci/test_check_documentation.py
          python3 tools/ci/check_documentation.py
      - name: Build
        run: dotnet build TerraRuntime.slnx -c Release
      - name: Test
        shell: bash
        run: |
          set +e
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=normal" 2>&1 | tee /tmp/full-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            git config user.name "Xekep"
            git config user.email "Xekep@users.noreply.github.com"
            git switch -C diag/truffle-housing
            grep -n -C 25 -E 'Failed |\[FAIL\]|Error Message:|Stack Trace:|Test Run Failed|Failed:' /tmp/full-tests.log > truffle-test-diagnostics.txt || true
            git add truffle-test-diagnostics.txt
            git commit -m "Capture Truffle housing test diagnostics"
            git push --force origin HEAD:diag/truffle-housing
            exit "$status"
          fi
      - name: Commit integrated Truffle housing parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git rm tools/ci/apply_town_housing_truffle.py .github/workflows/one-shot-town-housing-truffle.yml
          git add src/TerraRuntime.Core/Npcs/VanillaTownNpcSpawnEligibility1458.cs \
                  src/TerraRuntime/RuntimeTownNpcWorldFactsProjection1458.cs \
                  src/TerraRuntime/VanillaHousingValidator1458.cs \
                  src/TerraRuntime/RuntimeTownHouseCandidateIndex1458.cs \
                  src/TerraRuntime/RuntimeTownNpcMoveInCoordinator1458.cs \
                  tests/TerraRuntime.Tests/VanillaTruffleHousing1458Tests.cs \
                  tools/ci/check_truffle_housing_source.py \
                  .github/workflows/truffle-housing-source-contract.yml \
                  docs/en/town-npc-housing-shops.md \
                  docs/ru/town-npc-housing-shops.md
          git commit -m "Complete source-backed Truffle housing gate"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              git push origin --delete diag/truffle-housing || true
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Unable to rebase Truffle housing block onto current main." >&2
          exit 1
