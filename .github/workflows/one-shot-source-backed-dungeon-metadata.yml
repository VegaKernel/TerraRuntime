name: One-shot source-backed dungeon metadata parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-source-backed-dungeon-metadata.yml'

permissions:
  contents: write

concurrency:
  group: terra-runtime-one-shot-source-backed-dungeon-metadata
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Apply source-backed dungeon metadata fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              target.write_text(text.replace(old, new, 1))

          provider_old = textwrap.dedent("""
              public void Execute(IWorldGenerationContext context)
              {
                  fallback.Execute(context);

                  if (state.Bootstrap is VanillaWorldGenerationBootstrapState1458 bootstrap &&
                      context.Workspace is RuntimeWorldGenerationWorkspace runtimeWorkspace)
                  {
                      runtimeWorkspace.SetVanillaBootstrapState(bootstrap);
                  }

                  if (state.TerrainLayers is not WorldGenerationLayers layers)
                      return;

                  IWorldGenerationMetadataWorkspace metadata = context.Metadata ??
                      throw new InvalidOperationException("Vanilla metadata pass requires world metadata storage.");
                  if (!metadata.TrySetLayers(layers.WorldSurface, layers.RockLayer))
                      throw new InvalidOperationException("Could not preserve source-backed Terraria terrain layers.");
              }
          """).strip()
          provider_new = textwrap.dedent("""
              public void Execute(IWorldGenerationContext context)
              {
                  IWorldGenerationMetadataWorkspace metadata = context.Metadata ??
                      throw new InvalidOperationException("Vanilla metadata pass requires world metadata storage.");

                  WorldGenerationPoint? sourceBackedDungeon = null;
                  if (state.Bootstrap is not null && metadata.TryGetDungeon(out WorldGenerationPoint dungeon))
                      sourceBackedDungeon = dungeon;

                  fallback.Execute(context);

                  if (state.Bootstrap is VanillaWorldGenerationBootstrapState1458 bootstrap &&
                      context.Workspace is RuntimeWorldGenerationWorkspace runtimeWorkspace)
                  {
                      runtimeWorkspace.SetVanillaBootstrapState(bootstrap);
                  }

                  if (sourceBackedDungeon is WorldGenerationPoint preservedDungeon &&
                      !metadata.TrySetDungeon(preservedDungeon.X, preservedDungeon.Y))
                  {
                      throw new InvalidOperationException("Could not preserve source-backed Terraria dungeon anchor.");
                  }

                  if (state.TerrainLayers is not WorldGenerationLayers layers)
                      return;

                  if (!metadata.TrySetLayers(layers.WorldSurface, layers.RockLayer))
                      throw new InvalidOperationException("Could not preserve source-backed Terraria terrain layers.");
              }
          """).strip()
          replace_once(
              'src/TerraRuntime.World/Generation/Vanilla/SourceBackedVanillaWorldGenerationProvider1458.cs',
              provider_old,
              provider_new)

          test_old = textwrap.dedent("""
                  var pass = new VanillaMetadataParityPass1458(fallback, state);
                  var context = new GenerationContext(workspace);

                  pass.Execute(context);
                  FillMinimalValidWorld(workspace, bootstrap);
          """).strip()
          test_new = textwrap.dedent("""
                  var pass = new VanillaMetadataParityPass1458(fallback, state);
                  var context = new GenerationContext(workspace);
                  Assert.True(workspace.TrySetDungeon(bootstrap.DungeonLocation, 333));

                  pass.Execute(context);

                  Assert.True(workspace.TryGetDungeon(out WorldGenerationPoint preservedDungeon));
                  Assert.Equal(new WorldGenerationPoint(bootstrap.DungeonLocation, 333), preservedDungeon);
                  FillMinimalValidWorld(workspace, bootstrap);
          """).strip()
          replace_once(
              'tests/TerraRuntime.Tests/VanillaWorldGenerationBootstrapPersistenceTests.cs',
              test_old,
              test_new)

          parser_old = textwrap.dedent("""
              string referencePath = Path.GetFullPath(args[0]);
              string candidatePath = Path.GetFullPath(args[1]);
              string? jsonPath = null;
              bool enforce = false;
              for (int i = 2; i < args.Length; i++)
              {
                  if (args[i] == "--enforce")
                  {
                      enforce = true;
                      continue;
                  }

                  if (args[i] == "--json" && i + 1 < args.Length)
                  {
                      jsonPath = Path.GetFullPath(args[++i]);
                      continue;
                  }

                  Console.Error.WriteLine($"Unknown or incomplete argument '{args[i]}'.");
                  return 2;
              }
          """).strip()
          parser_new = textwrap.dedent("""
              string referencePath = Path.GetFullPath(args[0]);
              string candidatePath = Path.GetFullPath(args[1]);
              string? jsonPath = null;
              bool enforce = false;
              for (int i = 2; i < args.Length; i++)
              {
                  if (args[i] == "--enforce")
                  {
                      if (enforce)
                      {
                          Console.Error.WriteLine("Duplicate --enforce option.");
                          return 2;
                      }

                      enforce = true;
                      continue;
                  }

                  if (args[i] == "--json")
                  {
                      if (jsonPath is not null)
                      {
                          Console.Error.WriteLine("Duplicate --json option.");
                          return 2;
                      }

                      if (i + 1 >= args.Length || args[i + 1].StartsWith("--", StringComparison.Ordinal))
                      {
                          Console.Error.WriteLine("Option --json requires a report path.");
                          return 2;
                      }

                      jsonPath = Path.GetFullPath(args[++i]);
                      continue;
                  }

                  Console.Error.WriteLine($"Unknown or incomplete argument '{args[i]}'.");
                  return 2;
              }
          """).strip()
          replace_once('tools/TerraRuntime.WorldCompare/Program.cs', parser_old, parser_new)

          workflow = Path('.github/workflows/vanilla-worldgen-reference-differential.yml')
          text = workflow.read_text()
          compare_old = textwrap.dedent("""
                    - name: Capture structural fingerprint report
                      shell: bash
                      run: |
                        set -euo pipefail
                        dotnet run \\
                          --project tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj \\
                          -c Release \\
                          --no-build \\
                          -- \\
                          "artifacts/reference-differential/official-${SEED}.wld" \\
                          "artifacts/reference-differential/terraruntime-${SEED}.wld" \\
                          --json "artifacts/reference-differential/comparison-${SEED}.json"
                        cat "artifacts/reference-differential/comparison-${SEED}.json"

                    - name: Enforce structural budgets
                      shell: bash
                      run: |
                        set -euo pipefail
                        dotnet run \\
                          --project tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj \\
                          -c Release \\
                          --no-build \\
                          -- \\
                          "artifacts/reference-differential/official-${SEED}.wld" \\
                          "artifacts/reference-differential/terraruntime-${SEED}.wld" \\
                          --enforce
          """).strip()
          compare_new = textwrap.dedent("""
                    - name: Compare structural fingerprints and enforce budgets
                      shell: bash
                      run: |
                        set -euo pipefail
                        dotnet run \\
                          --project tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj \\
                          -c Release \\
                          --no-build \\
                          -- \\
                          "artifacts/reference-differential/official-${SEED}.wld" \\
                          "artifacts/reference-differential/terraruntime-${SEED}.wld" \\
                          --json "artifacts/reference-differential/comparison-${SEED}.json" \\
                          --enforce
                        cat "artifacts/reference-differential/comparison-${SEED}.json"
          """).strip()
          if text.count(compare_old) != 1:
              raise SystemExit(f"reference workflow compare-step anchor count={text.count(compare_old)}")
          text = text.replace(compare_old, compare_new, 1)

          upload_marker = '      - name: Upload differential evidence\n'
          upload = text.index(upload_marker)
          prefix = text[:upload]
          suffix = text[upload:]
          expression = '$' + '{{ env.SEED }}'
          suffix = suffix.replace('${SEED}', expression)
          workflow.write_text(prefix + suffix)
          PY

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Build and verify WorldCompare option parser
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj -c Release
          set +e
          dotnet run \
            --project tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj \
            -c Release \
            --no-build \
            -- missing-reference.wld missing-candidate.wld --json ignored.json --enforce \
            > parser-smoke.log 2>&1
          code=$?
          set -e
          cat parser-smoke.log
          test "$code" -eq 3
          grep -q "World file not found" parser-smoke.log

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-source-backed-dungeon-metadata.yml
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add \
            src/TerraRuntime.World/Generation/Vanilla/SourceBackedVanillaWorldGenerationProvider1458.cs \
            tests/TerraRuntime.Tests/VanillaWorldGenerationBootstrapPersistenceTests.cs \
            tools/TerraRuntime.WorldCompare/Program.cs \
            .github/workflows/vanilla-worldgen-reference-differential.yml
          git commit -m "Preserve source-backed dungeon metadata"
          git pull --rebase origin main
          git push origin HEAD:main
