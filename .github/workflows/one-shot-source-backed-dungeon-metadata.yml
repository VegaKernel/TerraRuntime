name: One-shot source-backed dungeon metadata parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-source-backed-dungeon-metadata.yml'

permissions:
  contents: write

concurrency:
  group: terra-runtime-one-shot-source-backed-dungeon-metadata
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Apply production, regression and differential fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          def replace_b64(path: str, old_b64: str, new_b64: str) -> None:
              p = Path(path)
              text = p.read_text()
              old = base64.b64decode(old_b64).decode()
              new = base64.b64decode(new_b64).decode()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_b64(
              'src/TerraRuntime.World/Generation/Vanilla/SourceBackedVanillaWorldGenerationProvider1458.cs',
              '',
              '')

          replace_b64(
              'tests/TerraRuntime.Tests/VanillaWorldGenerationBootstrapPersistenceTests.cs',
              'ICAgICAgICB2YXIgcGFzcyA9IG5ldyBWYW5pbGxhTWV0YWRhdGFQYXJpdHlQYXNzMTQ1OChmYWxsYmFjaywgc3RhdGUpOwogICAgICAgIHZhciBjb250ZXh0ID0gbmV3IEdlbmVyYXRpb25Db250ZXh0KHdvcmtzcGFjZSk7CgogICAgICAgIHBhc3MuRXhlY3V0ZShjb250ZXh0KTsKICAgICAgICBGaWxsTWluaW1hbFZhbGlkV29ybGQod29ya3NwYWNlLCBib290c3RyYXApOw==',
              '')

          replace_b64(
              'tools/TerraRuntime.WorldCompare/Program.cs',
              '',
              '')

          workflow = Path('.github/workflows/vanilla-worldgen-reference-differential.yml')
          text = workflow.read_text()
          start_marker = '      - name: Capture structural fingerprint report\n'
          end_marker = '      - name: Upload differential evidence\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('reference workflow compare-step anchors changed')
          start = text.index(start_marker)
          end = text.index(end_marker)
          combined = '''      - name: Compare structural fingerprints and enforce budgets
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \\
            --project tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj \\
            -c Release \\
            --no-build \\
            -- \\
            "artifacts/reference-differential/official-${SEED}.wld" \\
            "artifacts/reference-differential/terraruntime-${SEED}.wld" \\
            --json "artifacts/reference-differential/comparison-${SEED}.json" \\
            --enforce
          cat "artifacts/reference-differential/comparison-${SEED}.json"

'''
          text = text[:start] + combined + text[end:]
          upload = text.index(end_marker, start)
          prefix = text[:upload]
          suffix = text[upload:]
          expression = '$' + '{{ env.SEED }}'
          suffix = suffix.replace('${SEED}', expression)
          workflow.write_text(prefix + suffix)
          PY

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Build and verify WorldCompare option parser
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj -c Release
          set +e
          dotnet run \
            --project tools/TerraRuntime.WorldCompare/TerraRuntime.WorldCompare.csproj \
            -c Release \
            --no-build \
            -- missing-reference.wld missing-candidate.wld --json ignored.json --enforce \
            > parser-smoke.log 2>&1
          code=$?
          set -e
          cat parser-smoke.log
          test "$code" -eq 3
          grep -q "World file not found" parser-smoke.log

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-source-backed-dungeon-metadata.yml
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add \
            src/TerraRuntime.World/Generation/Vanilla/SourceBackedVanillaWorldGenerationProvider1458.cs \
            tests/TerraRuntime.Tests/VanillaWorldGenerationBootstrapPersistenceTests.cs \
            tools/TerraRuntime.WorldCompare/Program.cs \
            .github/workflows/vanilla-worldgen-reference-differential.yml
          git commit -m "Preserve source-backed dungeon metadata"
          git pull --rebase origin main
          git push origin HEAD:main
