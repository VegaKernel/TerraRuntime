name: Apply Graceful SIGTERM Shutdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sigterm-shutdown.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Patch host SIGTERM lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/TerraRuntime/TerrariaServerHost.cs')
          text = path.read_text()

          using_anchor = 'using System.Net.Sockets;\n'
          using_replacement = 'using System.Net.Sockets;\nusing System.Runtime.InteropServices;\n'
          if 'using System.Runtime.InteropServices;' not in text:
              if using_anchor not in text:
                  raise SystemExit('using anchor not found')
              text = text.replace(using_anchor, using_replacement, 1)

          anchor = '''        Console.CancelKeyPress += cancelHandler;\n\n        using var listener = new Socket(AddressFamily.InterNetwork, SocketType.Stream, ProtocolType.Tcp);'''
          replacement = '''        Console.CancelKeyPress += cancelHandler;\n        using PosixSignalRegistration? terminateSignalRegistration = OperatingSystem.IsWindows()\n            ? null\n            : PosixSignalRegistration.Create(\n                PosixSignal.SIGTERM,\n                context =>\n                {\n                    context.Cancel = true;\n                    shutdown.Cancel();\n                });\n\n        using var listener = new Socket(AddressFamily.InterNetwork, SocketType.Stream, ProtocolType.Tcp);'''
          if 'PosixSignal.SIGTERM' not in text:
              if anchor not in text:
                  raise SystemExit('shutdown anchor not found')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY

      - name: Build host
        run: dotnet build src/TerraRuntime/TerraRuntime.csproj -c Release

      - name: Commit host change to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/TerraRuntime/TerrariaServerHost.cs; then
            echo 'Host already contains SIGTERM support.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/TerraRuntime/TerrariaServerHost.cs
          git commit -m 'feat: gracefully handle SIGTERM shutdown'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
