name: Apply Packet Observability Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-packet-observability-proof.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Build network observability tests
        run: dotnet build tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release

      - name: Prove per-message traffic accounting
        run: >-
          dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --
          -class "TerraRuntime.Tests.TerrariaMessageTrafficTelemetryTests"

      - name: Prove rejection classification counters
        run: >-
          dotnet run --project tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj -c Release --no-build --
          -class "TerraRuntime.Tests.TerrariaFrameRejectionTelemetryTests"

      - name: Synchronize roadmap and documentation indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def ensure(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one old form or existing new form: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          ensure(
              'docs/roadmap.md',
              '- [ ] Packet counts/bytes by message ID and direction.',
              '- [x] Packet counts/bytes by message ID and direction.')
          ensure(
              'docs/roadmap.md',
              '- [ ] Invalid/malformed/rejected packet counters.',
              '- [x] Invalid/malformed/rejected packet counters.')

          ensure(
              'docs/en/README.md',
              '- [Networking and protocol](networking-protocol.md) — framing, connection policy, Multiplicity boundary, queues, rate accounting, stop reasons and join traffic.',
              '- [Networking and protocol](networking-protocol.md) — framing, connection policy, Multiplicity boundary, queues, rate accounting, stop reasons and join traffic.\n- [Per-message packet telemetry](packet-telemetry.md) — bounded per-ID/direction frame and byte counts, rolling top traffic, malformed/unknown traffic and normalized rejection counters.')
          ensure(
              'docs/ru/README.md',
              '- [Сеть и протокол](networking-protocol.md) — framing, connection policy, граница Multiplicity, queues, rate accounting, stop reasons и join traffic.',
              '- [Сеть и протокол](networking-protocol.md) — framing, connection policy, граница Multiplicity, queues, rate accounting, stop reasons и join traffic.\n- [Телеметрия пакетов по message ID](packet-telemetry.md) — bounded frame/byte counters по ID и direction, rolling top traffic, malformed/unknown traffic и нормализованные rejection counters.')
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/roadmap.md docs/en/README.md docs/ru/README.md
          if git diff --cached --quiet; then
            echo 'packet observability roadmap already synchronized'
            exit 0
          fi
          git commit -m 'docs: close packet observability roadmap'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
