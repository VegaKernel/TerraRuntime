name: Vanilla World Autosave Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-autosave-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanilla-world-autosave-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download pinned TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/autosave-source .tools
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: >-
          dotnet tool install ilspycmd
          --tool-path .tools
          --version 11.0.0.9375

      - name: Decompile autosave owners
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""

          while IFS= read -r -d '' candidate; do
            candidate_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
            printf 'source_candidate_sha256=%s path=%s\n' "$candidate_sha256" "$candidate"
            if [[ "$candidate_sha256" == "$expected_sha256" ]]; then
              assembly="$candidate"
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)

          if [[ -z "$assembly" ]]; then
            echo "Pinned TerrariaServer 1.4.5.8 source assembly was not found." >&2
            exit 1
          fi

          assembly_dir="$(dirname "$assembly")"
          printf 'source_assembly_sha256=%s path=%s\n' "$expected_sha256" "$assembly"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.Main "$assembly" \
            > artifacts/autosave-source/main.cs
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.IO.WorldFile "$assembly" \
            > artifacts/autosave-source/world-file.cs

      - name: Print exact autosave source neighborhoods
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path("artifacts/autosave-source/main.cs"),
              Path("artifacts/autosave-source/world-file.cs"),
          ]
          patterns = re.compile(
              r"autosave|autoSave|saveWorld|SaveWorld|saveTime|SaveTime|worldSave|WorldSave",
              re.IGNORECASE,
          )
          matches = 0
          for path in files:
              lines = path.read_text(encoding="utf-8").splitlines()
              hit_lines = [i for i, line in enumerate(lines) if patterns.search(line)]
              print(f"=== {path} matches={len(hit_lines)} ===")
              emitted = set()
              for hit in hit_lines:
                  start = max(0, hit - 12)
                  end = min(len(lines), hit + 13)
                  key = (start, end)
                  if key in emitted:
                      continue
                  emitted.add(key)
                  matches += 1
                  print(f"--- lines {start + 1}-{end} hit={hit + 1} ---")
                  for index in range(start, end):
                      print(f"{index + 1:06d}: {lines[index]}")
          if matches == 0:
              raise SystemExit("No autosave-related source neighborhoods found in pinned TerrariaServer 1.4.5.8")

      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-world-autosave-source-${{ github.sha }}
          path: artifacts/autosave-source
          if-no-files-found: error
