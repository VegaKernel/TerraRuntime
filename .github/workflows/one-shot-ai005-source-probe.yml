name: One Shot AI005 Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Discover and print AI_005 source
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          npc_id="$(find decompiled/1458 -type f -name 'NPCID.cs' -print -quit)"
          test -n "$npc_file"
          test -n "$npc_id"
          grep -n 'AI_005' "$npc_file" | head -n 30 || true
          python3 - "$npc_file" "$npc_id" <<'PY'
          import pathlib, re, sys
          npc = pathlib.Path(sys.argv[1]).read_text(errors='ignore')
          ids = pathlib.Path(sys.argv[2]).read_text(errors='ignore')

          names = sorted(set(re.findall(r'\b(AI_005\w*)\s*\(', npc)))
          print('AI005_SYMBOLS=' + ','.join(names))
          if not names:
              raise SystemExit('No AI_005 symbol found')
          name = names[0]
          m = re.search(rf'\b(?:private|public|internal)?\s*(?:unsafe\s+)?(?:void|bool|int|float)\s+{re.escape(name)}\s*\([^)]*\)', npc)
          if not m:
              m = re.search(rf'\b{re.escape(name)}\s*\([^)]*\)', npc)
          if not m:
              raise SystemExit(f'{name} declaration not found')
          opening = npc.find('{', m.end())
          depth = 0
          closing = None
          for i in range(opening, len(npc)):
              if npc[i] == '{': depth += 1
              elif npc[i] == '}':
                  depth -= 1
                  if depth == 0:
                      closing = i + 1
                      break
          if closing is None:
              raise SystemExit(f'{name} truncated')
          body = npc[m.start():closing]
          print('AI005_BEGIN')
          for no, line in enumerate(body.splitlines(), 1):
              print(f'{no:04d}: {line}')
          print('AI005_END')

          wanted = ['EaterOfSouls','MeteorHead','Hornet','Corruptor','Probe','Crimera','MossHornet','Moth','Bee','SmallBee','FattyHornet','HoneyHornet','LeafyHornet','SpikeyHornet','StingyHornet','Parrot','BloodSquid']
          print('AI005_IDS_BEGIN')
          for wanted_name in wanted:
              mm = re.search(rf'\b(?:public|internal)\s+const\s+(?:short|int)\s+{re.escape(wanted_name)}\s*=\s*(-?\d+)\s*;', ids)
              print(f'{wanted_name}={mm.group(1) if mm else "?"}')
          print('AI005_IDS_END')
          PY
