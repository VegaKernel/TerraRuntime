name: One Shot AI005 Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai005-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile TerrariaServer 1.4.5.8
        run: bash tools/decompile-reference.sh 1458

      - name: Discover AI_005 firing distance source
        shell: bash
        run: |
          set -euo pipefail
          npc_file="$(find decompiled/1458 -type f -name 'NPC.cs' -print -quit)"
          test -n "$npc_file"
          grep -n 'AI_GlobalFiringDistanceCheck' "$npc_file" | head -n 20
          python3 - "$npc_file" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='ignore')
          name = 'AI_GlobalFiringDistanceCheck'
          m = re.search(rf'\b(?:private|public|internal)?\s*(?:static\s+)?bool\s+{name}\s*\([^)]*\)', text)
          if not m:
              raise SystemExit('firing-distance method not found')
          opening = text.find('{', m.end())
          depth = 0
          for i in range(opening, len(text)):
              if text[i] == '{': depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      body = text[m.start():i+1]
                      break
          else:
              raise SystemExit('firing-distance method truncated')
          print('FIRING_DISTANCE_BEGIN')
          print(body)
          print('FIRING_DISTANCE_END')
          PY
