name: Vanilla Coin Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaCoinFacts.cs'
      - 'tools/ci/probe_vanilla_coins.py'
      - '.github/workflows/vanilla-coin-source-contract.yml'
  pull_request:
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/VanillaCoinFacts.cs'
      - 'tools/ci/probe_vanilla_coins.py'
      - '.github/workflows/vanilla-coin-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-coin-contract-${{ github.sha }}
  cancel-in-progress: true

jobs:
  vanilla-coins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download official TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/source-contract .tools
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: >-
          dotnet tool install ilspycmd
          --tool-path .tools
          --version 11.0.0.9375

      - name: Verify vanilla coin item ids
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""

          while IFS= read -r -d '' candidate; do
            candidate_sha256="$(sha256sum "$candidate" | awk '{print $1}')"
            if [[ "$candidate_sha256" == "$expected_sha256" ]]; then
              assembly="$candidate"
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)

          test -n "$assembly"
          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.ID.ItemID "$assembly" \
            > artifacts/source-contract/item-id.cs
          python3 tools/ci/probe_vanilla_coins.py \
            --item-id artifacts/source-contract/item-id.cs
