name: Town Commerce Housing Source Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime/RuntimeTownCommerce1458.cs'
      - 'src/TerraRuntime/ServerRuntimeState.cs'
      - 'src/TerraRuntime/VanillaHousingValidator1458.cs'
      - 'src/TerraRuntime/RuntimeTownNpcMoveInCoordinator1458.cs'
      - 'src/TerraRuntime.World/RuntimeWorldProgressionMutations.cs'
      - 'src/TerraRuntime.World/WorldFileProgressionHeaderPatcher.cs'
      - 'tools/ci/check_town_commerce_housing_source.py'
      - '.github/workflows/town-commerce-housing-source-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/TerraRuntime/RuntimeTownCommerce1458.cs'
      - 'src/TerraRuntime/ServerRuntimeState.cs'
      - 'src/TerraRuntime/VanillaHousingValidator1458.cs'
      - 'src/TerraRuntime/RuntimeTownNpcMoveInCoordinator1458.cs'
      - 'src/TerraRuntime.World/RuntimeWorldProgressionMutations.cs'
      - 'src/TerraRuntime.World/WorldFileProgressionHeaderPatcher.cs'
      - 'tools/ci/check_town_commerce_housing_source.py'
      - '.github/workflows/town-commerce-housing-source-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Download pinned TerrariaServer 1.4.5.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458 artifacts/town-source .tools
          curl -fL https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted

      - name: Install pinned ILSpy command line
        run: dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375

      - name: Verify town commerce and housing source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256='d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e'
          assembly=''
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          refs="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.Player "$assembly" > artifacts/town-source/Player.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.MessageBuffer "$assembly" > artifacts/town-source/MessageBuffer.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.GameContent.ShopHelper "$assembly" > artifacts/town-source/ShopHelper.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.SceneMetrics "$assembly" > artifacts/town-source/SceneMetrics.cs
          .tools/ilspycmd --disable-updatecheck -r "$refs" -t Terraria.WorldGen "$assembly" > artifacts/town-source/WorldGen.cs
          python3 tools/ci/check_town_commerce_housing_source.py \
            --player artifacts/town-source/Player.cs \
            --message-buffer artifacts/town-source/MessageBuffer.cs \
            --shop-helper artifacts/town-source/ShopHelper.cs \
            --scene-metrics artifacts/town-source/SceneMetrics.cs \
            --worldgen artifacts/town-source/WorldGen.cs
