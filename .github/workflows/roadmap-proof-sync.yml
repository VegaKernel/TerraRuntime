name: Roadmap Proof Sync

on:
  push:
    paths:
      - .github/workflows/roadmap-proof-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mark executable proof complete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- [ ] Handshake deadline plus normal idle timeout.":
                  "- [x] Handshake deadline plus normal idle timeout.",
              "- [ ] Distinguish malformed protocol, rate limit, invalid state and gameplay rejection in structured telemetry.":
                  "- [x] Distinguish malformed protocol, rate limit, invalid state and gameplay rejection in structured telemetry.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one roadmap item, got {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/roadmap-proof-sync.yml
          git add docs/roadmap.md
          git commit -m "docs: mark verified network hardening roadmap items"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
