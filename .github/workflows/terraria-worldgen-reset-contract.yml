name: Terraria Worldgen Reset Contract

on:
  push:
    branches: [main]
    paths:
      - 'src/TerraRuntime.Contracts/Gameplay/WorldGenerationPassContracts.cs'
      - 'src/TerraRuntime.World/VanillaWorldGenerationBootstrap1458.cs'
      - 'src/TerraRuntime.World/SourceBackedVanillaWorldGenerationProvider1458.cs'
      - 'tests/TerraRuntime.Tests/SourceBackedVanillaWorldGenerationProvider1458Tests.cs'
      - 'tools/ci/probe_worldgen_reset.py'
      - '.github/workflows/terraria-worldgen-reset-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-runtime-worldgen-reset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Decompile pinned TerrariaServer 1.4.5.8 WorldGen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/terraria-1458/extracted .tools artifacts/source-contract
          curl -fL \
            https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip \
            -o .cache/terraria-1458/server.zip
          unzip -q -o .cache/terraria-1458/server.zip -d .cache/terraria-1458/extracted
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375

          expected="d87e3faf08637f6be8882c63e7f11fb7e792b0230006309618473ece0f863e1e"
          assembly=""
          while IFS= read -r -d '' candidate; do
            if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected" ]]; then
              assembly="$candidate"
              break
            fi
          done < <(find .cache/terraria-1458/extracted -type f -name 'TerrariaServer.exe' -print0)
          test -n "$assembly"
          assembly_dir="$(dirname "$assembly")"
          .tools/ilspycmd --disable-updatecheck -r "$assembly_dir" -t Terraria.WorldGen "$assembly" \
            > artifacts/source-contract/world-gen.cs

      - name: Verify ordinary Reset bootstrap source contract
        run: >-
          python3 tools/ci/probe_worldgen_reset.py
          --world-gen artifacts/source-contract/world-gen.cs
          --runtime-bootstrap src/TerraRuntime.World/VanillaWorldGenerationBootstrap1458.cs
          --output artifacts/source-contract/worldgen-reset-contract.txt

      - name: Build worldgen implementation
        run: dotnet build src/TerraRuntime/TerraRuntime.csproj -c Release

      - name: Run Reset and Terrain parity tests
        run: >-
          dotnet test tests/TerraRuntime.Tests/TerraRuntime.Tests.csproj
          -c Release
          --no-restore
          --filter FullyQualifiedName~SourceBackedVanillaWorldGenerationProvider1458Tests

      - name: Upload Reset source evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraria-worldgen-reset-${{ github.sha }}
          path: artifacts/source-contract/worldgen-reset-contract.txt
          if-no-files-found: error
          retention-days: 7
